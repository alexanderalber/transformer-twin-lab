    /* ── Shared controls ──────────────────────────────────────────────────
       Carried over from the thermal page unchanged: there is no shared module
       in this project, every page is self-contained, so these are copies and
       not imports. Seg is a segmented control for choosing a SETTING, Tabs is
       the underlined strip for choosing a VIEW, and the distinction is
       deliberate: as a segmented control the tab switch would look exactly
       like the settings under it. */

    /* Icons come from assets/js/icons.js, the shared set. A local script tag
       is not an external request: the file sits next to the page and the demo
       still runs from a stick over file://, which is the rule that matters.
       The glyphs are stroked in currentColor, so they are the button's text
       colour in every skin and in the disabled state without one extra rule.
       This page uses play/pause for the transport and reset for the treatment
       trigger: reset is the set's symbol for running a process over something
       that already exists, and deliberately not a droplet, because the icon
       marks the ACTION and the page is already full of water. */
    const Icon = ({ name }) => ToolIcons.el(name);

    function Seg({ items, value, onChange, className }) {
      return html`
        <div className=${className || 'th-segs'}>
          ${items.map((it) => html`
            <button key=${it.id} type="button"
              className=${'lang-seg th-seg' + (it.id === value ? ' active' : '')}
              onClick=${() => onChange(it.id)}>${it.label}</button>
          `)}
        </div>
      `;
    }

    function Tabs({ items, value, onChange }) {
      return html`
        <div className="tabstrip" role="tablist">
          ${items.map((it) => html`
            <button key=${it.id} type="button" role="tab"
              aria-selected=${it.id === value ? 'true' : 'false'}
              className=${it.id === value ? 'active' : ''}
              onClick=${() => onChange(it.id)}>${it.label}</button>
          `)}
        </div>
      `;
    }

    /* One slider in the live control row. */
    function Ctl({ id, label, min, max, step, value, format, onChange }) {
      return html`
        <div className="th-ctl">
          <label htmlFor=${id}>${label}</label>
          <input id=${id} type="range" min=${min} max=${max} step=${step} value=${value}
            onChange=${(e) => onChange(parseFloat(e.target.value))} />
          <span className="th-ctlval">${format(value)}</span>
        </div>
      `;
    }
    /* ── Info button and popover ──────────────────────────────────────────
       A small round "i" next to a label, opening a box that floats above the
       page instead of expanding inline, so opening one never pushes the rows
       below it out of view. Closes on Escape, on its own close button and on a
       click anywhere outside. Only one is open at a time, which the caller
       enforces by holding a single key. */
    function InfoBtn({ open, toggle, label }) {
      return html`
        <button type="button" className="th-info" onClick=${toggle} aria-expanded=${open}
          aria-label=${T.noteAria(open, label)}>i</button>
      `;
    }

    function Popover({ children, close }) {
      const ref = useRef(null);
      const [dx, setDx] = useState(0);

      useEffect(() => {
        const el = ref.current;
        if (el && el.getBoundingClientRect) {
          const r = el.getBoundingClientRect(), pad = 12;
          let d = 0;
          if (r.left < pad) d = pad - r.left;
          else if (r.right > window.innerWidth - pad) d = window.innerWidth - pad - r.right;
          if (d) setDx(Math.round(d));
        }
        const onKey = (e) => { if (e.key === 'Escape') close(); };
        const onDown = (e) => {
          const el2 = ref.current;
          if (!el2 || (el2.contains && el2.contains(e.target))) return;
          const anchor = el2.parentElement;
          if (anchor && anchor.contains(e.target) && e.target.closest &&
            e.target.closest('.th-info')) return;
          close();
        };
        document.addEventListener('keydown', onKey);
        document.addEventListener('mousedown', onDown);
        return () => {
          document.removeEventListener('keydown', onKey);
          document.removeEventListener('mousedown', onDown);
        };
      }, []);

      /* The multiplication sign is written as the character: htm does not
         decode HTML entities, it would render the literal string. */
      return html`
        <div className="th-pop" ref=${ref} role="tooltip"
          style=${{ transform: 'translateX(calc(-50% + ' + dx + 'px))', '--arrow': 'calc(50% - ' + dx + 'px)' }}>
          <button type="button" className="th-popclose" onClick=${close}
            aria-label=${T.noteClose}>×</button>
          ${children}
        </div>
      `;
    }

    /* A row is a div and not a label: a label would hand every click on the
       info button straight to the number input next to it. */
    function NumRow({ spec, value, onChange, open, setOpen }) {
      const id = 'th-f-' + spec.k;
      /* The stored value and the edited one are the same number unless the
         spec says otherwise, which only the axial-spread fraction does. */
      const sc = spec.scale || 1;
      return html`
        <div className="th-row">
          <span className="th-anchor">
            <label htmlFor=${id}>${T.f[spec.k][0]}</label>
            <${InfoBtn} open=${open} label=${T.f[spec.k][0]}
              toggle=${() => setOpen(open ? null : spec.k)} />
            ${open ? html`<${Popover} close=${() => setOpen(null)}>${T.f[spec.k][1]}<//>` : null}
          </span>
          <span>
            <input id=${id} type="number" min=${spec.min} max=${spec.max} step=${spec.step}
              value=${sc === 1 ? value : +(value * sc).toFixed(4)}
              onChange=${(e) => {
                const v = parseFloat(e.target.value);
                if (isFinite(v)) {
                  onChange(spec.k, Math.max(spec.min, Math.min(spec.max, v)) / sc);
                }
              }} />
            <span className="th-unit">${spec.unit}</span>
          </span>
        </div>
      `;
    }

    /* One framed block with its title on the frame. title takes a node, not
       just a string: the sigma block carries markup in its heading. The
       optional className is how a block gets placed in the grid; blocks
       inside a stack do not need one. */
    function Group({ title, className, children }) {
      return html`
        <section className=${'th-group' + (className ? ' ' + className : '')}>
          <h2 className="th-h2">${title}</h2>
          ${children}
        </section>
      `;
    }
    /* ── Canvas plumbing ──────────────────────────────────────────────────
       Same pattern as the other pages in this set: fixed CSS height, backing
       store at device resolution, redrawn on every render and on theme or size
       change. There is deliberately NO dependency array on the draw effect, so
       a language switch repaints every label for free. */
    function useCanvas(height, draw) {
      const cvRef = useRef(null);
      const [, bump] = useState(0);
      useEffect(() => {
        const on = () => bump((n) => n + 1);
        window.addEventListener('resize', on);
        window.addEventListener('themechange', on);
        return () => {
          window.removeEventListener('resize', on);
          window.removeEventListener('themechange', on);
        };
      }, []);
      useEffect(() => {
        const cv = cvRef.current;
        if (!cv) return;
        readPalette();
        const rect = cv.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const w = Math.max(1, Math.round(rect.width)), h = height;
        const bw = Math.round(w * dpr), bh = Math.round(h * dpr);
        /* Only assign the backing store size when it actually changed.
           Assigning width or height ALWAYS reallocates and clears the bitmap,
           even when the value is identical, so doing it unconditionally threw
           away a buffer per canvas per frame at 60 renders per second. The
           clearRect below is what the redraw relies on, and it runs either
           way. */
        if (cv.width !== bw || cv.height !== bh) {
          cv.width = bw;
          cv.height = bh;
        }
        const ctx = cv.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);
        draw(ctx, w, h);
      });
      return cvRef;
    }

    function niceStep(span, target) {
      const raw = Math.abs(span) / Math.max(1, target);
      if (!(raw > 0)) return 1;
      const p = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
      const m = raw / p;
      return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p;
    }

    /* Type sizes. The page is shown on projectors, so these are floors, not
       preferences: anything below about 13 px stops being readable from the
       back of a room. */
    const FS = { tick: 13, label: 14, cell: 13, head: 15 };
    const MONO = '12.5px ui-monospace, SFMono-Regular, Menlo, monospace';

    /* Diffusion time per unit of displayed time. ONE by construction: this
       page runs on a single clock. Kept as a named constant, and pinned by the
       self-test, because the failure it guards against is silent. An earlier
       version set it to 18.25 while leaving the diurnal drivers on the real
       clock, so a displayed day was one sunrise and eighteen days of diffusion
       at once, and no reading of the picture was consistent. */
    const COMP_FACTOR = C.YEAR_MIN / C.COMP_MIN;

    function fmt1(v) { return v.toFixed(1); }
    function fmt2(v) { return v.toFixed(2); }

    /* ── The map ──────────────────────────────────────────────────────────
       One component for both maps. The moisture tab and the temperature tab
       differ only in the field they read, the domain they stretch over and the
       ramp they use, so they are one drawing routine with a parameter rather
       than two that have to be kept in step.

       The domain is FIXED, never fitted to the frame. A rescaling heatmap is
       the classic way to make a picture lie: the colour of a cell has to mean
       the same thing before and after a treatment, or the map says the
       opposite of what happened. What varies instead is the printed span under
       the map, which is the honest way to show that the range in frame is
       sometimes small.
       Cells are drawn with a gap in the panel colour. Without it a heatmap
       reads as one continuous smear and the grid stops being legible as a
       grid. */
    const MAP_H = 400;
    /* The right margin used to carry a number per row. That column is gone
       (it invited reading the map as a table of twelve numbers, which is not
       what a heat map is for), so the cells get the width back. The top pad
       once had to fit the colour bar and the numbers under its ends, which is
       why it was 52. The bar now lives in the side column as DOM, so the pad
       carries the title alone and 30 is enough. The right margin is small
       because the side column, not the canvas, holds the whitespace. */
    const MAP_PAD = { l: 96, r: 16, t: 30, b: 62 };
    const CELL_GAP = 2;

    function HeatmapPanel({ field, values, domain, ramp, flip, title, unit,
      format, markIdx, markLabel, height }) {
      const h = height || MAP_H;
      const cvRef = useCanvas(h, (ctx, w) => {
        const nx = C.N_R_SHOW, ny = C.N_A;
        const x0 = MAP_PAD.l, x1 = Math.max(x0 + 60, w - MAP_PAD.r);
        const y0 = MAP_PAD.t, y1 = h - MAP_PAD.b;
        const cw = (x1 - x0) / nx, ch = (y1 - y0) / ny;
        const lo = domain[0], hi = domain[1];

        /* Cells. Axial index 0 is the bottom of the winding, so it is drawn at
           the BOTTOM of the map: the picture keeps the orientation of the tank
           it describes. */
        for (let j = 0; j < ny; j++) {
          for (let i = 0; i < nx; i++) {
            const v = values[j * nx + i];
            const u = (v - lo) / (hi - lo);
            ctx.fillStyle = rampAt(ramp, u, flip);
            const px = x0 + i * cw, py = y1 - (j + 1) * ch;
            ctx.fillRect(px + CELL_GAP / 2, py + CELL_GAP / 2,
              cw - CELL_GAP, ch - CELL_GAP);
          }
        }

        /* The marked cell, ringed rather than recoloured so the ring does not
           compete with the value it points at. --tool-emph is near-white on
           the dark skins and near-black on the light one, so the ring keeps a
           hard edge on all three. */
        if (markIdx != null && markIdx >= 0) {
          const mj = Math.floor(markIdx / nx), mi = markIdx % nx;
          const px = x0 + mi * cw, py = y1 - (mj + 1) * ch;
          ctx.strokeStyle = COL.emph;
          ctx.lineWidth = 2;
          ctx.strokeRect(px + CELL_GAP / 2 + 1, py + CELL_GAP / 2 + 1,
            cw - CELL_GAP - 2, ch - CELL_GAP - 2);
          if (markLabel) {
            ctx.font = FS.cell + 'px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillStyle = COL.emph;
            ctx.fillText(markLabel, px + cw / 2, py - 3);
          }
        }

        /* Axes. Only the ends are named: a mm scale on every column and a
           temperature on every level would be more numbers than the picture
           can carry. */
        ctx.font = FS.tick + 'px system-ui, sans-serif';
        ctx.fillStyle = COL.note;
        ctx.textBaseline = 'top';
        ctx.textAlign = 'left';
        ctx.fillText(T.axCopper, x0, y1 + 8);
        ctx.textAlign = 'right';
        ctx.fillText(T.axOil, x1, y1 + 8);
        ctx.textAlign = 'center';
        ctx.fillStyle = COL.faint;
        ctx.fillText(T.radialAxis + ', 0 to ' +
          (C.L_PAPER * 1000).toFixed(1) + ' mm', (x0 + x1) / 2, y1 + 26);

        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = COL.note;
        ctx.fillText(T.axTop, x0 - 10, y0 + ch / 2);
        ctx.fillText(T.axBottom, x0 - 10, y1 - ch / 2);

        /* The title. The legend it needs sits beside the map, not on it. */
        ctx.font = FS.head + 'px system-ui, sans-serif';
        ctx.fillStyle = COL.emph;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(title, x0, y0 - 14);

        /* The colour bar is NOT drawn here. It is a DOM element in the side
           column: as canvas it cost a 52px top pad on a drawing that needed
           30, and it was re-rasterised on every animation frame for a picture
           that only changes when the ramp does. */
      });
      return html`<canvas ref=${cvRef} style=${{ height: h + 'px' }}></canvas>`;
    }

    /* The colour bar as DOM, next to the map instead of inside it.
       A linear-gradient with a stop per ramp segment, which is what the ramp
       is: rampAt interpolates linearly between the same stops, so the bar and
       the cells cannot drift apart. The fixed domain is printed under the
       ends, and it is the domain, not the range in frame: the bar states what
       a colour means, the span readout below states how much of it is in use.
       A trimmed ramp is passed through rampAt exactly as the cells are, hence
       the same flip flag. */
    function RampBar({ ramp, flip, domain, unit, format }) {
      const stops = [];
      const nStop = (RAMPS[ramp] || RAMPS.magma).length * 2;
      for (let p = 0; p <= nStop; p++) {
        stops.push(rampAt(ramp, p / nStop, flip) + ' ' + (p / nStop * 100).toFixed(2) + '%');
      }
      return html`
        <div className="ms-ramp">
          <div className="ms-rampbar"
            style=${{ backgroundImage: 'linear-gradient(to right, ' + stops.join(', ') + ')' }}></div>
          <div className="ms-rampends">
            <span>${format(domain[0])}</span>
            <span>${format(domain[1]) + unit}</span>
          </div>
        </div>
      `;
    }

    /* One label-over-value pair in the side column. Its own component only so
       the two tabs cannot drift in how they mark up the same thing. */
    function SideFact({ label, value }) {
      return html`<div className="ms-sidefact"><span>${label}</span><b>${value}</b></div>`;
    }

    /* The ramp picker that sits above a map. A plain select, not a segmented
       control: eighteen ramps is a list to scroll, not a row of buttons, and
       this is a comparison tool rather than a setting anyone operates during a
       talk. The empty option is the theme default and is listed first, so the
       way back from an experiment is always one item up. */
    function RampPick({ value, onChange, id }) {
      return html`
        <span className="ms-rampsel">
          <label htmlFor=${id}>${T.rampLabel}</label>
          <select id=${id} value=${value} onChange=${(e) => onChange(e.target.value)}>
            <option value="">${T.rampAuto}</option>
            ${RAMP_LIST.map((r) => html`
              <option key=${r[0]} value=${r[0]}>${r[1]}</option>
            `)}
          </select>
        </span>
      `;
    }

    /* The strip chart. Oil water content and mean paper moisture on one time
       axis, with the treatment windows marked. This is where the point about
       drying the oil lands: two traces whose whole story is that one moves a
       lot and the other barely at all.

       A real ring buffer over a FIXED window of simulated time, not a growing
       array. Two things go wrong with a growing one: the x axis has to rescale
       as it fills, so the traces slide, and at a wrap old and new samples land
       on the same pixels, which draws loops instead of a line. A fixed window
       means one pixel is always the same amount of time, and the chart
       scrolls.

       The scales carry a MINIMUM span, which is the most important decision in
       this panel. Fitting each trace to its own range would zoom into the paper
       until a few hundredths of a percentage point filled the height, showing a
       mountain range where the physics says a nearly flat line. Two traces on
       auto-fitted axes also come out looking identical even when one swings
       twenty times as hard as the other, which is the precise opposite of the
       point being made. */
    const STRIP_H = 230;
    /* Top pad carries the panel title, which sits ABOVE the frame now that
       there is one, so it needs its own line rather than the six pixels that
       were enough when it floated over an open plot area. */
    const STRIP_PAD = { l: 96, r: 190, t: 30, b: 34 };
    /* Window length in simulated display minutes. FIXED, not scaled with the
       speed control, and that is a deliberate trade. A window that shrank at
       low speed would make the trace sweep at a constant visual pace, but it
       would also mean the span on screen changed as the speed changed, and at
       the fast settings a treatment would fall below a pixel and the thing the
       chart exists to show would vanish. A fixed span keeps a treatment and
       its recovery legible at every speed.
       FIVE days, and they are ordinary days: the page runs on one clock, so
       this axis is elapsed time and nothing else. Five is chosen against the
       radial time constant of the paper, which is a couple of days at
       operating temperature: a window of about two time constants shows the
       paper responding rather than either sitting still or having already
       finished. It also holds five diurnal cycles, which is what makes the
       oil trace legible as a daily rhythm rather than as noise.
       At speed 1 the window crosses in about two minutes. That is why the
       treatment durations are 12/24/48 h: a 48 h run is 40% of the window and
       a 12 h run still 10%, so all three draw as bands rather than hairlines. */
    const STRIP_DAYS_SHOWN = 5;
    const STRIP_SPAN = STRIP_DAYS_SHOWN * C.DAY_MIN;
    /* One slot per integration step rather than per fixed interval of
       simulated time. A fixed interval is what sets how often the trace GAINS
       A POINT, so it makes the apparent smoothness of the curve depend on the
       speed control: at a quarter speed a thirty-minute interval yields one
       new point every two seconds and the line creeps along in steps while
       everything else on the page is fluid. Sampling every step instead means
       the trace advances on every frame at every speed, and the draw decimates
       to pixel columns anyway, so the extra resolution costs only memory.
       Sized for the slowest step (0.25 min) over the window, which is the
       worst case for how many samples the span can hold. */
    const STRIP_N = Math.ceil(STRIP_SPAN / 0.25) + 2;

    /* Every channel the three views need, recorded once. The alternative is to
       record raw state and derive on draw, but the corners and the saturations
       are grid reductions: deriving them at draw time would mean keeping a
       grid per sample, which is three orders of magnitude more memory than
       keeping the four numbers they collapse to. */
    const HIST_KEYS = ['ppm', 'wp', 'wOil', 'wPaper', 'rsOil', 'rsPaper',
      'cBotIn', 'cBotOut', 'cTopIn', 'cTopOut',
      'thA', 'thBot', 'thTop', 'thHot', 'thPaper'];

    /* The profile channels: one trace per grid element in each direction, the
       other direction averaged away. Sixteen radial cells and six axial
       levels, so 22 further Float64Arrays per history, which at STRIP_N slots
       is a few megabytes and the reason these are means rather than the full
       96-cell grid per sample.
       They live in the same ring as everything else rather than in a second,
       coarser buffer: sharing the timestamps is what lets the profile modes
       reuse the whole strip drawing path, including the decimation and the
       treatment bands. */
    const RAD_KEYS = [];
    for (let i = 0; i < C.N_R; i++) RAD_KEYS.push('rp' + i);
    const AX_KEYS = [];
    for (let j = 0; j < C.N_A; j++) AX_KEYS.push('ax' + j);
    for (const k of RAD_KEYS) HIST_KEYS.push(k);
    for (const k of AX_KEYS) HIST_KEYS.push(k);

    function makeHist() {
      const h = { t: new Float64Array(STRIP_N), tr: new Uint8Array(STRIP_N),
        head: 0, count: 0, tHead: 0 };
      for (const k of HIST_KEYS) h[k] = new Float64Array(STRIP_N);
      return h;
    }

    /* One sample per call, and the caller calls once per integration step.
       Each slot carries its own timestamp because the step size changes with
       the speed control, so the samples are NOT on a uniform grid and the draw
       cannot infer a time from an index. */
    function pushHist(hist, tMin, sample, treating) {
      hist.head = hist.count === 0 ? 0 : (hist.head + 1) % STRIP_N;
      const k = hist.head;
      hist.t[k] = tMin;
      for (const key of HIST_KEYS) hist[key][k] = sample[key];
      hist.tr[k] = treating ? 1 : 0;
      hist.tHead = tMin;
      if (hist.count < STRIP_N) hist.count++;
    }

    /* Scratch for the two profile reductions. One pair of arrays for the whole
       page: histSample is called once per step and the values are copied into
       the ring immediately, so there is nothing to keep between calls. */
    const RAD_TMP = new Float64Array(C.N_R);
    const AX_TMP = new Float64Array(C.N_A);

    /* The reduction from simulation state to one strip sample, in one place so
       the seed and the loop cannot disagree about what a sample contains. */
    function histSample(ms, th, gradK, thetaA) {
      const c = C.paperCorners(ms);
      const thetaO = th.thetaO;
      C.radialMean(ms, RAD_TMP);
      C.axialProfile(ms, AX_TMP);
      const out = {
        ppm: ms.ppm,
        wp: C.paperMean(ms),
        wOil: C.waterInOil(ms),
        wPaper: C.waterInPaper(ms),
        rsOil: ms.ppm / C.oilSat(thetaO),
        rsPaper: C.paperRelSat(ms),
        cBotIn: c.bottomInner, cBotOut: c.bottomOuter,
        cTopIn: c.topInner, cTopOut: c.topOuter,
        /* The thermal channels the temperature tab plots. Bottom oil is not a
           state of the thermal model, it is the top oil less the axial spread,
           which is the same construction the map draws; recording it here
           rather than deriving it on draw keeps the chart and the map reading
           one number.
           `thPaper` is the temperature the paper actually sits at, level by
           level, weighted by nothing: it is the mean of the level isotherms,
           which for a linear ramp is the mid-height oil temperature. It is on
           the chart so the paper trace has a driver next to it rather than
           being the one curve with no visible cause. */
        thA: thetaA,
        thTop: thetaO,
        thBot: thetaO - gradK,
        thHot: th.thetaH,
        thPaper: thetaO - gradK / 2
      };
      for (let i = 0; i < C.N_R; i++) out[RAD_KEYS[i]] = RAD_TMP[i];
      for (let j = 0; j < C.N_A; j++) out[AX_KEYS[j]] = AX_TMP[j];
      return out;
    }

    /* Oldest-to-newest walk over the ring: i = 0 is the oldest valid sample. */
    function histAt(hist, i) {
      const start = (hist.head - hist.count + 1 + STRIP_N * 2) % STRIP_N;
      return (start + i) % STRIP_N;
    }

    /* The three views of the strip, as data rather than as three code paths.
       Each mode names its series, the buffer channel each reads, the axis it
       hangs on and the minimum span that axis must keep.

       MASS is the default and the argument of the page: both phases in kg of
       water, the same unit on both sides, so the reader can see that the oil
       carries well under a kilogram against tens of kilograms in the paper.
       The two still need separate axes because the ratio is about eighty, and
       forcing them onto one shared axis would flatten the oil trace onto the
       baseline and destroy the very swing a treatment is meant to show. The
       unit being identical is what makes the comparison honest; the axes being
       separate is what keeps it legible, and the ratio is printed under the
       chart so the split hides nothing.

       SAT is the thermodynamically comparable pair: relative saturation of the
       oil against relative saturation of the paper. These two genuinely belong
       on ONE axis, because they are equal at equilibrium and their difference
       is what drives the flux. That is the one mode where a shared scale is
       not a distortion, so it gets one.

       CORNERS drops the oil and shows the four extreme cells of the grid. All
       four are the same quantity in the same unit, so again one shared axis,
       and the spread between them IS the content: the bottom pair sits above
       the top pair by the axial spread, and each pair splits by the radial
       one, which is the smaller by an order of magnitude. */
    const STRIP_MODES = {
      mass: {
        shared: false, zero: true,
        series: [
          { key: 'wOil', axis: 'l', col: 'accent', min: 0.25, fmt: (v) => v.toFixed(2) },
          { key: 'wPaper', axis: 'r', col: 'emph', min: 1.5, fmt: (v) => v.toFixed(1) }
        ]
      },
      sat: {
        shared: true, zero: true,
        series: [
          { key: 'rsOil', axis: 'l', col: 'accent', min: 0.04, fmt: (v) => (v * 100).toFixed(1) },
          { key: 'rsPaper', axis: 'l', col: 'emph', min: 0.04, fmt: (v) => (v * 100).toFixed(1) }
        ]
      },
      corners: {
        shared: true, zero: true,
        series: [
          { key: 'cBotOut', axis: 'l', col: 'accent', min: 0.4, fmt: (v) => v.toFixed(2) },
          { key: 'cBotIn', axis: 'l', col: 'cat1', min: 0.4, fmt: (v) => v.toFixed(2) },
          { key: 'cTopOut', axis: 'l', col: 'emph', min: 0.4, fmt: (v) => v.toFixed(2) },
          { key: 'cTopIn', axis: 'l', col: 'cat2', min: 0.4, fmt: (v) => v.toFixed(2) }
        ]
      },
      /* The temperature tab's strip. Five traces on one axis, because they are
         all the same quantity in the same unit and the whole content is how
         far apart they run: the hot spot above the top oil by the winding
         gradient, the top oil above the bottom by the axial spread, and the
         ambient below all of it, carrying the daily cycle that drives them.
         NOT zero-based, and it is the one chart here that must not be. These
         five live inside a band perhaps 60 K wide that sits 20 to 90 K off the
         origin; anchored at zero the band would occupy the top third of the
         panel and the separations the chart exists to show would close up. */
      heat: {
        shared: true,
        series: [
          { key: 'thHot', axis: 'l', col: 'cat1', min: 20, fmt: (v) => v.toFixed(0) },
          { key: 'thTop', axis: 'l', col: 'emph', min: 20, fmt: (v) => v.toFixed(0) },
          { key: 'thPaper', axis: 'l', col: 'cat2', min: 20, fmt: (v) => v.toFixed(0) },
          { key: 'thBot', axis: 'l', col: 'accent', min: 20, fmt: (v) => v.toFixed(0) },
          { key: 'thA', axis: 'l', col: 'note', min: 20, fmt: (v) => v.toFixed(0) }
        ]
      }
    };

    /* The two profile modes, built rather than written out: one series per
       grid element, in grid order, which is what makes a ramp readable as a
       direction. Both are shared-axis, so the spread between the traces is read
       off one scale and means what it says.

       `ramp: true` marks a mode whose colours come from a colormap indexed by
       position instead of from the categorical palette. Eleven or sixteen
       traces have no categorical answer: the palette holds four distinguishable
       line colours, and the eye cannot hold sixteen of them anyway. What it can
       read is an ORDER, which is exactly what a sequential ramp encodes, so the
       colour says where in the insulation (or how high in the tank) a trace
       sits and the legend shrinks to its two ends.

       Both directions are FITTED, not zero-anchored, which is where these two
       modes part company with every other chart on the page. The reason is
       what they are for: these are the two views whose entire content is the
       separation BETWEEN the traces, and a zero axis spends the panel on the
       distance down to an origin that carries no information here. Radially
       the spread is a few tenths of a pp on a value near 1.5%, so on a zero
       axis all sixteen traces land within a couple of pixels and the chart is
       one thick line. Axially the spread is about 0.4 pp on the same value:
       legible on a zero axis, but confined to the upper quarter of it, so the
       bottom-to-top separation the plot exists to teach reads as a detail
       rather than as the subject.
       The absolute level is not lost by fitting, it moves: the axis end
       labels carry it, and the mean paper moisture is printed under the chart
       either way. What IS given up is the at-a-glance sense of how large the
       spread is against the content, and that is the deliberate trade. Anyone
       wanting it back reads the two axis numbers.

       The floor span is what keeps the fit honest, and it differs per
       direction because the states that collapse differ. Radially a settled
       grid is flat to well under 0.02 pp, so 0.05 pp holds the window open
       and the traces converge visibly instead of filling the panel with
       numerical noise. Axially the spread never collapses during normal
       operation (0.39 to 0.41 pp across settled, diurnal, treated and
       recovered states), but it goes to exactly zero when the configuration
       leaves no axial temperature ramp, which is a real setting and not an
       edge case. 0.1 pp covers that without ever binding in normal use. */
    function profileMode(keys, labelKey, zero, minSpan, dp) {
      return {
        shared: true, zero: zero, ramp: true, label: labelKey,
        series: keys.map((k, i) => ({
          key: k, axis: 'l', u: keys.length < 2 ? 0 : i / (keys.length - 1),
          min: minSpan, fmt: (v) => v.toFixed(dp)
        }))
      };
    }
    /* Three decimals on both fitted axes: the end labels of a window a few
       hundredths of a pp wide differ only in the third one, and a coarser
       format would print the same number at the top and the bottom. */
    STRIP_MODES.radial = profileMode(RAD_KEYS, 'radial', false, 0.05, 3);
    STRIP_MODES.axial = profileMode(AX_KEYS, 'axial', false, 0.1, 3);

    /* The ramp the profile traces are drawn from, per skin. Chosen by the
       author against all three skins; not derived from RAMP_FOR, which is
       about filled map cells on a panel and answers a different question than
       thin lines do. Full range, no trimming, same rule as the maps.

       Dark is drawn reversed. Blues runs light to dark in its natural
       direction, and its dark end is very nearly the panel colour of the dark
       skin, so the last few traces would be drawn in ink the reader cannot
       find. Flipping puts the bright end where the dark ground is and keeps
       all sixteen lines on the panel. This is a direction, not a trim: the
       ramp is still used end to end. */
    const PROFILE_RAMP = {
      dark: { ramp: 'blues', flip: true },
      light: { ramp: 'ylgnbu', flip: false },
      grey: { ramp: 'bone', flip: false }
    };

    /* Which modes the plot selector offers. Named here rather than read off
       STRIP_MODES, because not every entry in that table is a choice: `heat` is
       the fixed chart of the temperature tab, placed by the tab itself. Deriving
       the buttons from the table put a fourth, empty segment on the moisture tab
       the day `heat` was added, since the loop found a key that T.stripModes has
       no label for. A mode is selectable because it is listed here, not because
       it exists. */
    const STRIP_PICKABLE = ['mass', 'sat', 'corners', 'radial', 'axial'];

    function StripPanel({ hist, mode, height }) {
      const h = height || STRIP_H;
      const cvRef = useCanvas(h, (ctx, w) => {
        const spec = STRIP_MODES[mode] || STRIP_MODES.mass;
        const x0 = STRIP_PAD.l, x1 = Math.max(x0 + 60, w - STRIP_PAD.r);
        const y0 = STRIP_PAD.t, y1 = h - STRIP_PAD.b;
        const n = hist.count;

        ctx.font = FS.head - 1 + 'px system-ui, sans-serif';
        ctx.fillStyle = COL.emph;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(T.stripTitle[mode], x0, y0 - 6);
        if (n < 2) return;

        /* The window always spans STRIP_SPAN and ends at the newest sample, so
           a partly filled buffer draws a short trace on the right instead of a
           stretched one across the full width.
           Time comes from the stored timestamp of each sample, never from its
           index: the step size follows the speed control, so the samples are
           not evenly spaced and an index-derived time would stretch and
           squeeze the trace whenever the speed changed. */
        const tEnd = hist.tHead, tStart = tEnd - STRIP_SPAN;
        const xOfT = (t) => x0 + (x1 - x0) * (t - tStart) / STRIP_SPAN;
        const tOf = (i) => hist.t[histAt(hist, i)];

        /* First sample still inside the window. The buffer holds more than the
           window when the steps are small, so the old tail is skipped rather
           than drawn off the left edge. */
        let i0 = 0;
        while (i0 < n - 1 && tOf(i0) < tStart) i0++;
        const m0 = n - i0;
        if (m0 < 2) return;

        /* Ranges, one pass per series. The minimum span is the most important
           decision in this panel: fitting a trace to its own range zooms into a
           nearly flat line until a few hundredths fill the height, showing a
           mountain range where the physics says nothing happened, and two
           auto-fitted traces come out looking identical even when one swings
           twenty times as hard as the other. */
        const ranges = spec.series.map((ser) => {
          const buf = hist[ser.key];
          let lo = Infinity, hi = -Infinity;
          for (let i = i0; i < n; i++) {
            const v = buf[histAt(hist, i)];
            if (v < lo) lo = v;
            if (v > hi) hi = v;
          }
          return { lo: lo, hi: hi, min: ser.min };
        });

        /* A quantity that cannot be negative is drawn from zero unless doing
           so would destroy the picture. Anchoring at zero is what makes the
           height of a trace mean its value rather than only its changes: a
           water mass floating on a fitted axis reads as a big swing when it is
           a two-percent ripple. The mode decides, because the exception is
           real: the temperature strip is a narrow band far from the origin and
           has to keep its own window. */
        const fit = (lo, hi, minSpan) => {
          if (spec.zero) {
            const top = Math.max(hi, minSpan) * 1.08;
            return [0, top > 0 ? top : 1];
          }
          const mid = (lo + hi) / 2;
          const span = Math.max(hi - lo, minSpan) * 1.25;
          return [mid - span / 2, mid + span / 2];
        };
        /* A shared axis is one range over every series, padded to the largest
           minimum span any of them asks for. */
        let axes;
        if (spec.shared) {
          let lo = Infinity, hi = -Infinity, msp = 0;
          for (const r of ranges) {
            if (r.lo < lo) lo = r.lo;
            if (r.hi > hi) hi = r.hi;
            if (r.min > msp) msp = r.min;
          }
          const a = fit(lo, hi, msp);
          axes = ranges.map(() => a);
        } else {
          axes = ranges.map((r) => fit(r.lo, r.hi, r.min));
        }
        const yOf = (a, v) => y1 - (y1 - y0) * (v - a[0]) / (a[1] - a[0]);

        /* Treatment windows as one span per run, not one bar per sample: a
           per-sample fill leaves gaps once the window is decimated and reads as
           hatching rather than as an interval. */
        /* --tool-subtle was invisible here. It is the page's quietest fill, a
           hair off the panel colour, which is right for a band behind a table
           and wrong for the one annotation on this chart that says a thing was
           DONE to the unit. The band now carries the accent at low alpha plus
           a solid edge on each side: the fill locates the interval, the edges
           give it the hard start and stop a switching event has, and neither
           competes with the traces over it because both stay behind them. */
        const band = COL.accent;
        let runFrom = -1;
        for (let i = i0; i < n; i++) {
          const on = hist.tr[histAt(hist, i)] === 1;
          if (on && runFrom < 0) runFrom = i;
          if ((!on || i === n - 1) && runFrom >= 0) {
            const a = xOfT(tOf(runFrom)), b = xOfT(tOf(on ? i : i - 1));
            const wd = Math.max(2, b - a);
            ctx.save();
            ctx.globalAlpha = 0.16;
            ctx.fillStyle = band;
            ctx.fillRect(a, y0, wd, y1 - y0);
            ctx.restore();
            ctx.strokeStyle = band;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(Math.round(a) + 0.5, y0);
            ctx.lineTo(Math.round(a) + 0.5, y1);
            ctx.moveTo(Math.round(a + wd) + 0.5, y0);
            ctx.lineTo(Math.round(a + wd) + 0.5, y1);
            ctx.stroke();
            runFrom = -1;
          }
        }

        /* Day boundaries. With five days on screen the diurnal ripple
           needs something to be counted against, or the seasonal drift and the
           daily cycle read as one undifferentiated wobble. */
        ctx.strokeStyle = COL.hairline;
        ctx.lineWidth = 1;
        for (let d = Math.ceil(tStart / C.DAY_MIN); d * C.DAY_MIN <= tEnd; d++) {
          const x = Math.round(xOfT(d * C.DAY_MIN)) + 0.5;
          ctx.beginPath();
          ctx.moveTo(x, y0);
          ctx.lineTo(x, y1);
          ctx.stroke();
        }

        /* A closed frame, not a baseline. Three open sides read as modern and
           cost the reader the plot area: with nothing on the right, a trace
           and the axis numbers beside it belong to the same picture only by
           proximity, and stacked panels have no edge to line up against.
           --tool-border rather than the heavier ink: the frame is there to
           bound the data, not to be seen. */
        ctx.strokeStyle = COL.border;
        ctx.lineWidth = 1;
        ctx.strokeRect(Math.round(x0) + 0.5, Math.round(y0) + 0.5,
          Math.round(x1 - x0), Math.round(y1 - y0));

        /* Decimating trace: when the window holds more samples than pixels,
           collapse each pixel column to its min and max. Stroking every sample
           at that density turns a clean daily cycle into visual noise. */
        const wPx = Math.max(1, Math.round(x1 - x0));
        const trace = (buf, a, colour, width) => {
          ctx.strokeStyle = colour;
          ctx.lineWidth = width;
          ctx.lineJoin = 'round';
          ctx.beginPath();
          if (m0 <= wPx) {
            for (let i = i0; i < n; i++) {
              const x = xOfT(tOf(i)), y = yOf(a, buf[histAt(hist, i)]);
              if (i === i0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
          } else {
            let col = -1, lo = 0, hi = 0, started = false;
            for (let i = i0; i < n; i++) {
              const c = Math.round(xOfT(tOf(i)));
              const v = buf[histAt(hist, i)];
              if (c !== col) {
                if (col >= 0) {
                  if (started) ctx.lineTo(col, yOf(a, lo));
                  else { ctx.moveTo(col, yOf(a, lo)); started = true; }
                  ctx.lineTo(col, yOf(a, hi));
                }
                col = c; lo = v; hi = v;
              } else {
                if (v < lo) lo = v;
                if (v > hi) hi = v;
              }
            }
            if (col >= 0) {
              if (started) ctx.lineTo(col, yOf(a, lo));
              else ctx.moveTo(col, yOf(a, lo));
              ctx.lineTo(col, yOf(a, hi));
            }
          }
          ctx.stroke();
        };
        /* The colour of one series. Categorical modes name a palette entry;
           the profile modes hand their position along the ramp instead, so the
           sixteen radial traces read as a direction rather than as sixteen
           unrelated lines. */
        const pr = PROFILE_RAMP[skinNow()] || PROFILE_RAMP.dark;
        const colOf = (ser) => spec.ramp
          ? rampAt(pr.ramp, ser.u, pr.flip) : COL[ser.col];

        /* Four traces need a thinner stroke than two, or the corner view is
           mostly line width, and sixteen need thinner still. */
        const lw = spec.series.length > 8 ? 1.2
          : spec.series.length > 2 ? 1.5 : 2;
        spec.series.forEach((ser, k) => {
          trace(hist[ser.key], axes[k], colOf(ser), lw);
        });

        /* Axis numbers. On a shared axis they are written once on the left; on
           split axes each series labels its own side in its own colour, which
           is the only thing keeping the two readable as different scales. */
        ctx.font = MONO;
        ctx.textBaseline = 'middle';
        const axNum = (a, fmt, side, colour) => {
          ctx.fillStyle = colour;
          if (side === 'l') {
            ctx.textAlign = 'right';
            ctx.fillText(fmt(a[1]), x0 - 10, y0 + 6);
            ctx.fillText(fmt(a[0]), x0 - 10, y1 - 6);
          } else {
            ctx.textAlign = 'left';
            ctx.fillText(fmt(a[1]), x1 + 10, y0 + 6);
            ctx.fillText(fmt(a[0]), x1 + 10, y1 - 6);
          }
        };
        if (spec.shared) {
          axNum(axes[0], spec.series[0].fmt, 'l', COL.note);
        } else {
          spec.series.forEach((ser, k) => {
            axNum(axes[k], ser.fmt, ser.axis, COL[ser.col]);
          });
        }

        /* The legend, in the right margin. With four series, or with two that
           no longer differ by unit, naming them under the axis is not enough:
           each entry carries its colour as a swatch. */
        ctx.font = FS.tick - 1 + 'px system-ui, sans-serif';
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'left';
        const lx = x1 + (spec.shared ? 14 : 56);
        if (spec.ramp) {
          /* A ramp legend rather than one entry per trace: sixteen names in a
             margin is a wall of text, and the names would be ordinals anyway.
             A vertical bar of the ramp with its two ends labelled says
             everything the colour carries, which is only the order. The bar is
             drawn in series order top to bottom, so the first cell of the grid
             (at the copper, or the tank bottom) is the top of the bar and
             matches the order the map is built in. */
          const by0 = y0 + 10, by1 = Math.min(y1 - 10, by0 + 86);
          for (let py = by0; py <= by1; py++) {
            ctx.fillStyle = rampAt(pr.ramp, (py - by0) / Math.max(1, by1 - by0), pr.flip);
            ctx.fillRect(lx, py, 12, 1);
          }
          ctx.strokeStyle = COL.border;
          ctx.lineWidth = 1;
          ctx.strokeRect(Math.round(lx) + 0.5, Math.round(by0) + 0.5, 12, by1 - by0);
          ctx.fillStyle = COL.note;
          ctx.textBaseline = 'top';
          ctx.fillText(T.stripEnds[mode][0], lx + 17, by0 - 1);
          ctx.textBaseline = 'bottom';
          ctx.fillText(T.stripEnds[mode][1], lx + 17, by1 + 1);
          ctx.textBaseline = 'middle';
        } else {
          spec.series.forEach((ser, k) => {
            const ly = y0 + 10 + k * 17;
            ctx.fillStyle = COL[ser.col];
            ctx.fillRect(lx, ly - 1.5, 12, 3);
            ctx.fillStyle = COL.note;
            ctx.fillText(T.stripSeries[ser.key], lx + 17, ly);
          });
        }

        /* The unit of the axis, under the left edge, and how much time is on
           screen. The window label carries BOTH counts because both are true
           at once: the axis holds five diurnal cycles and about three months
           of diffusion, and printing only the second is what made the old
           label read as a contradiction against what the eye saw. */
        ctx.font = FS.tick - 1 + 'px system-ui, sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'top';
        ctx.fillStyle = COL.faint;
        ctx.fillText(T.stripUnit[mode], x0 - 10, y1 + 6);

        ctx.textAlign = 'center';
        ctx.fillText(T.stripWindow(STRIP_SPAN / C.DAY_MIN), (x0 + x1) / 2, y1 + 6);
      });
      return html`<canvas ref=${cvRef} style=${{ height: h + 'px' }}></canvas>`;
    }

    /* ── The simulation ───────────────────────────────────────────────────
       One clock for the whole page. Both maps and the strip read the same
       state, so switching tabs never restarts anything and never starts a
       second loop: the animation frame lives here, in the root, not in a
       panel.

       Both the thermal state and the moisture state advance on the same
       minutes: one clock, no compression anywhere, so a displayed day is a
       day for the sun, for the oil and for the paper alike. */
    /* Nominal integration step, and the bounds the adaptive choice stays
       inside. The thermal model is stable well past this, and the moisture
       solver splits anything long internally, so the step is free to follow
       the frame rate rather than the physics. */
    const STEP_NOM = 10;
    const STEP_MIN_LO = 0.25;
    const STEP_MIN_HI = 30;
    /* Simulated minutes per real second at speed 1. A day is 1440 minutes, so
       60 puts a day on screen in 24 s and the five-day strip window in about
       two minutes. */
    const MIN_PER_SEC = 60;
    /* Ceiling on the integration done in one frame, so a hitch or a tab wake
       cannot turn into a multi-second freeze. */
    const MAX_STEPS_FRAME = 400;
    const SPEEDS = [0.25, 0.5, 1, 2, 4, 8];

    /* Step size for a speed setting. A FIXED step couples the redraw rate to
       the speed control: at a quarter speed only fifteen simulated minutes are
       owed per second, so a ten-minute step fires once or twice a second and
       the animation visibly stutters while the physics is perfectly fine.
       Slow motion should mean smaller steps, not rarer ones. This aims at
       roughly a step per frame at 60 Hz and clamps, so every speed redraws
       smoothly and the fast settings still take big strides. */
    function stepFor(speed) {
      const perFrame = MIN_PER_SEC * speed / 60;
      if (perFrame >= STEP_NOM) return STEP_NOM;
      return Math.max(STEP_MIN_LO, Math.min(STEP_MIN_HI, perFrame));
    }

    function useSim(siteId, stage, gradF, wpMean, hFilm, playing, speed) {
      const stateRef = useRef(null);
      const [, bump] = useState(0);
      const cfgRef = useRef({ siteId, stage, gradF, wpMean, hFilm });
      cfgRef.current = { siteId, stage, gradF, wpMean, hFilm };

      /* Build, or rebuild when a setting changes that invalidates the run.
         Site, insulation condition and surface transfer all change what the
         answer IS, so they restart; the cooling stage does not, because
         watching the grid respond to a stage change is the whole reason the
         switch exists. */
      useEffect(() => {
        const sc = C.scenarioById(siteId);
        const cfg0 = cfgRef.current;
        const P = C.stageParams(cfg0.stage, sc, {});
        const thA0 = C.compAmbient(0, sc, 0);
        const K0 = C.compLoadK(0, sc, 1);
        /* Settle the thermal state before anything reads it. initState fills
           the four differential states but leaves the two temperatures to the
           first step, and the maps are drawn before any step has run, so
           without this the temperature map has nothing to show on the opening
           frame. One step also puts the oil where the grid is seeded from,
           which is the consistent starting point anyway. */
        const th = C.initState(K0, thA0, P);
        C.stepThermal(th, K0, thA0, 1, P);
        const ms = C.initMoisture(wpMean, 20);
        C.equilibrateFromPaper(ms, wpMean, th.thetaO,
          C.gradKelvin(cfg0.gradF, th.thetaO, thA0));
        stateRef.current = {
          sc: sc, th: th, ms: ms, tMin: 0, hist: makeHist(), lastWall: 0,
          gradK: C.gradKelvin(cfg0.gradF, th.thetaO, thA0)
        };
        pushHist(stateRef.current.hist, 0,
          histSample(ms, th, stateRef.current.gradK, thA0), false);
        bump((n) => n + 1);
      }, [siteId, wpMean, hFilm]);

      /* The frame loop. One rAF while playing, none while paused.

         Simulated time is tied to the WALL CLOCK through an accumulator, not
         to the frame count. Stepping a fixed amount per frame makes the whole
         page run at a speed that depends on the monitor: the same build goes
         four times faster on a 240 Hz screen than on a 60 Hz one, and any
         rounding of a per-frame step count to a minimum of one step silently
         pins every speed setting to the same rate. With an accumulator, one
         second of real time is always the same amount of simulated time at a
         given speed, on any display. */
      useEffect(() => {
        if (!playing) return;
        let raf = 0, last = 0, acc = 0;
        const tick = (now) => {
          const st = stateRef.current;
          if (st) {
            if (!last) last = now;
            /* Capped so a backgrounded tab does not come back and integrate a
               year in one frame. */
            const dtWall = Math.min(250, now - last);
            last = now;
            const cfg = cfgRef.current;
            /* Simulated display minutes owed for the elapsed wall time. */
            acc += dtWall / 1000 * MIN_PER_SEC * speed;
            const step = stepFor(speed);
            let steps = Math.floor(acc / step);
            /* Keep the fractional remainder so slow speeds advance smoothly
               instead of stalling, and bound a single frame so one long hitch
               cannot lock the tab up in the integrator. */
            if (steps > MAX_STEPS_FRAME) {
              steps = MAX_STEPS_FRAME;
              acc = 0;
            } else {
              acc -= steps * step;
            }
            const sc = st.sc;
            const P = C.stageParams(cfg.stage, sc, {});
            for (let s = 0; s < steps; s++) {
              const tD = st.tMin;
              const thA = C.compAmbient(tD, sc, 0);
              const K = C.compLoadK(tD, sc, 1);
              const thAn = C.compAmbient(tD + step, sc, 0);
              const Kn = C.compLoadK(tD + step, sc, 1);
              C.stepThermal(st.th, K, thA, step, P, Kn, thAn);
              /* The axial spread is a fraction of the top-oil rise, so it is a
                 function of the state after the step, not a constant carried
                 alongside it. Computed here rather than inside the moisture
                 step so the two calls below cannot disagree about it. */
              const gK = C.gradKelvin(cfg.gradF, st.th.thetaO, thAn);
              st.gradK = gK;
              const treating = C.treatmentActive(st.ms);
              if (treating) {
                C.stepTreatment(st.ms, st.th.thetaO, gK, step);
              } else {
                C.stepMoisture(st.ms, st.th.thetaO, gK, step * COMP_FACTOR);
              }
              st.tMin += step;
              pushHist(st.hist, st.tMin,
                histSample(st.ms, st.th, gK, thAn), treating);
            }
            if (steps > 0) bump((n) => n + 1);
          }
          raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [playing, speed]);

      return [stateRef, () => bump((n) => n + 1)];
    }

    /* ── Field specs ──────────────────────────────────────────────────────
       Each is a key plus its unit and bounds; the label and the background
       note come from T.f[key], so a spec carries no words. */
    const SITE_AIR = [
      { k: 'ambMean', unit: 'C', min: -20, max: 50, step: 1 },
      { k: 'ambYearAmp', unit: 'K', min: 0, max: 30, step: 1 },
      { k: 'ambDayAmp', unit: 'K', min: 0, max: 30, step: 1 },
      { k: 'ambLat', unit: 'deg', min: 0, max: 70, step: 1 }
    ];
    const SITE_LOAD = [
      { k: 'loadBase', unit: 'pu', min: 0.1, max: 1.2, step: 0.01 },
      { k: 'loadDayAmp', unit: 'pu', min: 0, max: 0.5, step: 0.01 },
      { k: 'loadDayPeak', unit: 'h', min: 0, max: 23, step: 1 },
      { k: 'loadSeasonAmp', unit: 'pu', min: 0, max: 0.4, step: 0.01 },
      { k: 'loadFast', unit: '', min: 0, max: 1, step: 0.05 }
    ];
    const PAPER_FIELDS = [
      { k: 'wpMean', unit: '%', min: 0.5, max: 5, step: 0.1 },
      { k: 'lPaper', unit: 'mm', min: 0.5, max: 5, step: 0.1 },
      { k: 'mPaper', unit: 'kg', min: 500, max: 4000, step: 50 }
    ];
    /* Stored as a fraction, edited as a percentage: nobody reasons about an
       axial spread in units of 0.25. The spec carries the factor so the
       conversion lives with the field and not in the row component. */
    const TRANSPORT_FIELDS = [
      { k: 'gradF', unit: '%', min: 0, max: 40, step: 1, scale: 100 }
    ];

    function Transformer({ site, setSite, cfg, setCfgField }) {
      const [openInfo, setOpenInfo] = useState(null);
      const chips = C.SCENARIOS.map((s) => ({ id: s.id, label: T.scen[s.id] || s.label }));
      const rows = (specs) => specs.map((s) => html`
        <${NumRow} key=${s.k} spec=${s} value=${cfg[s.k]}
          onChange=${setCfgField} open=${openInfo === s.k} setOpen=${setOpenInfo} />
      `);
      return html`
        <div className="th-cfg">
          <${Group} title=${T.groups.site} className="th-cfgsite">
            <div className="th-chips">
              <${Seg} items=${chips} value=${site} onChange=${setSite} />
            </div>
          <//>
          <div className="th-cfgcol th-cfgleft">
            <${Group} title=${T.groups.air}>${rows(SITE_AIR)}<//>
            <${Group} title=${T.groups.load}>${rows(SITE_LOAD)}<//>
          </div>
          <div className="th-cfgcol th-cfgright">
            <${Group} title=${T.groups.paper}>${rows(PAPER_FIELDS)}<//>
            <${Group} title=${T.groups.transport}>
              ${rows(TRANSPORT_FIELDS)}
              <${HFilmRow} value=${cfg.hFilm} onChange=${setCfgField}
                open=${openInfo === 'hFilm'} setOpen=${setOpenInfo} />
            <//>
          </div>
        </div>
      `;
    }

    /* The surface transfer coefficient spans decades, so it gets a log slider
       rather than a number box: the interesting range is 1e-10 to 1e-6 and no
       one types that into a spinner. */
    function HFilmRow({ value, onChange, open, setOpen }) {
      const pos = Math.log(value / 1e-10) / Math.log(1e4);
      const lbl = T.f.hFilm[0];
      return html`
        <div className="th-row">
          <span className="th-anchor">
            <label htmlFor="ms-hfilm">${lbl}</label>
            <${InfoBtn} open=${open} label=${lbl}
              toggle=${() => setOpen(open ? null : 'hFilm')} />
            ${open ? html`<${Popover} close=${() => setOpen(null)}>${T.f.hFilm[1]}<//>` : null}
          </span>
          <span>
            <input id="ms-hfilm" type="range" min="0" max="1" step="0.02" value=${pos}
              onChange=${(e) => {
                const p = parseFloat(e.target.value);
                onChange('hFilm', 1e-10 * Math.pow(1e4, p));
              }} />
            <span className="th-unit th-unit-wide">${value.toExponential(1)} m/s</span>
          </span>
        </div>
      `;
    }

    /* The Model tab is static prose. */
    function Model() {
      const m = T.model;
      return html`
        <div className="th-model">
          <h3>${m.h1}</h3>
          <p>${m.p1}</p>
          <h3>${m.h2}</h3>
          <p>${m.p2}</p>
          <h3>${m.h3}</h3>
          <p>${m.p3}</p>
          <h3>${m.h4}</h3>
          <p>${m.p4}</p>
          <h3>${m.h5}</h3>
          <p>${m.p6}</p>
          <h3>${m.h6}</h3>
          <p>${m.p7}</p>
          <p className="th-src">${m.src}</p>
        </div>
      `;
    }

    /* ── Root ─────────────────────────────────────────────────────────────
       Holds the settings, owns the simulation, and reassigns LANG and T in its
       own render body BEFORE any child renders. That assignment is the whole
       language mechanism: there is no context and no prop drilling, and a
       child that reads T during its render gets the current language because
       this ran first. */
    const TREAT_HOURS = [12, 24, 48];
    const MOIST_DOMAIN = [0.5, 4.0];

    /* Colour domain of the temperature map. FIXED, like the moisture one next
       to it, and for a reason that only shows in motion: fitted to the field
       every frame, the domain tracked the oil, so a cell whose temperature had
       not moved still changed colour because the scale under it had. The map
       shimmered continuously and nothing on it could be compared against
       anything a minute earlier. A colour scale that moves is not a scale.

       The range has to hold every operating point the page can reach: a
       northern winter night puts the bottom of the tank near the oil floor,
       and an overloaded desert afternoon puts the top oil near 100 C. Both
       ends are outside what any one scenario visits, which costs contrast
       within a scenario and buys the one thing the fitted domain could not
       give: the same colour means the same temperature, always. */
    const TEMP_DOMAIN = [0, 100];

    function App() {
      const [lang, setLang] = useState(LANG);
      LANG = lang;
      T = STRINGS[lang];

      const [tab, setTab] = useState('live');
      const [site, setSiteRaw] = useState('desert');
      const [stage, setStage] = useState('onan');
      const [playing, setPlaying] = useState(true);
      const [speed, setSpeed] = useState(1);
      const [treatHours, setTreatHours] = useState(24);
      const [plotMode, setPlotMode] = useState('mass');
      /* One picked ramp per map, empty meaning "follow the theme". Two states
         and not one, because the two maps carry different quantities and the
         whole point of the picker is choosing a ramp for each. */
      const [rampPickM, setRampPickM] = useState('');
      const [rampPickT, setRampPickT] = useState('');
      const [, themeBump] = useState(0);

      const sc0 = C.scenarioById('desert');
      const [cfg, setCfg] = useState(() => ({
        ambMean: sc0.ambient.mean,
        ambYearAmp: sc0.ambient.yearAmp,
        ambDayAmp: sc0.ambient.dayAmp,
        ambLat: sc0.ambient.lat,
        loadBase: sc0.load.base,
        loadDayAmp: sc0.load.dayAmp,
        loadDayPeak: Math.round(sc0.load.dayPeak / 60),
        loadSeasonAmp: sc0.load.seasonAmp,
        loadFast: 0,
        wpMean: 2.5,
        lPaper: C.L_PAPER * 1000,
        mPaper: C.M_PAPER,
        gradF: C.GRAD_F.onan,
        hFilm: C.H_FILM
      }));

      const setCfgField = useCallback((k, v) => {
        setCfg((c) => (c[k] === v ? c : Object.assign({}, c, { [k]: v })));
      }, []);

      /* Choosing a site reseeds the editable numbers from that preset, so the
         chips stay meaningful instead of becoming labels on a state nobody
         changed. */
      const setSite = useCallback((id) => {
        const sc = C.scenarioById(id);
        setSiteRaw(id);
        setCfg((c) => Object.assign({}, c, {
          ambMean: sc.ambient.mean,
          ambYearAmp: sc.ambient.yearAmp,
          ambDayAmp: sc.ambient.dayAmp,
          ambLat: sc.ambient.lat,
          loadBase: sc.load.base,
          loadDayAmp: sc.load.dayAmp,
          loadDayPeak: Math.round(sc.load.dayPeak / 60),
          loadSeasonAmp: sc.load.seasonAmp,
          loadFast: sc.load.fast ? 1 : 0
        }));
      }, []);

      /* Changing the cooling stage moves the axial gradient with it. Tracking
         it is what makes the switch a single gesture rather than two. */
      const pickStage = useCallback((id) => {
        setStage(id);
        setCfg((c) => Object.assign({}, c, { gradF: C.GRAD_F[id] }));
      }, []);

      const [stateRef, poke] = useSim(site, stage, cfg.gradF, cfg.wpMean,
        cfg.hFilm, playing, speed);

      useEffect(() => {
        window.__setLang = (l) => setLang(l === 'de' ? 'de' : 'en');
        return () => { delete window.__setLang; };
      }, []);

      useEffect(() => {
        document.title = T.title;
        const m = document.querySelector('meta[name="description"]');
        if (m) m.setAttribute('content', T.desc);
      }, [lang]);

      useEffect(() => {
        const on = () => themeBump((n) => n + 1);
        window.addEventListener('themechange', on);
        return () => window.removeEventListener('themechange', on);
      }, []);

      const st = stateRef.current;
      const skin = skinNow();

      /* Everything the panels read, computed once per render. */
      const view = useMemo(() => {
        if (!st) return null;
        const shown = new Float64Array(C.N_R_SHOW * C.N_A);
        const temps = new Float64Array(C.N_R_SHOW * C.N_A);
        C.showGrid(st.ms, shown);
        const gradK = st.gradK == null ? 0 : st.gradK;
        C.tempGrid(st.th.thetaO, gradK, temps);
        const spans = C.gridSpans(st.ms);
        const hs = C.paperHotspot(st.ms);
        return {
          shown: shown, temps: temps, spans: spans, hs: hs,
          gradK: gradK,
          ppm: st.ms.ppm,
          wp: C.paperMean(st.ms),
          rsOil: st.ms.ppm / C.oilSat(st.th.thetaO),
          rsPaper: C.paperRelSat(st.ms),
          thetaO: st.th.thetaO,
          thetaH: st.th.thetaH,
          thetaA: C.compAmbient(st.tMin, st.sc, 0),
          wOil: C.waterInOil(st.ms),
          wPaper: C.waterInPaper(st.ms),
          treating: C.treatmentActive(st.ms),
          progress: C.treatmentProgress(st.ms),
          removed: st.ms.treat ? st.ms.treat.removed : 0
        };
      }, [st, st && st.tMin, lang, skin]);

      const startTreat = useCallback(() => {
        const s = stateRef.current;
        if (!s || C.treatmentActive(s.ms)) return;
        C.startTreatment(s.ms, treatHours);
        poke();
      }, [treatHours, poke, stateRef]);

      const tabs = [
        { id: 'transformer', label: T.tabs.transformer },
        { id: 'live', label: T.tabs.live },
        { id: 'heat', label: T.tabs.heat },
        { id: 'model', label: T.tabs.model }
      ];
      const stageItems = C.STAGES.map((s) => ({ id: s.id, label: T.stages[s.id] }));
      const hourItems = TREAT_HOURS.map((hr) => ({ id: String(hr), label: hr + ' h' }));
      const plotItems = STRIP_PICKABLE.map(
        (m) => ({ id: m, label: T.stripModes[m] }));
      /* The control row, built once and placed by both tabs that run the
         simulation. It was inline in the moisture tab, which meant the
         temperature tab showed a live, running model with no way to pause it:
         the one view where somebody wants to stop on a frame and read it out.
         One binding rather than a component, because it closes over a dozen
         pieces of this render and passing them all as props would be longer
         than the markup. */
      const controls = view ? html`
        <div className="th-row1">
          <div className="th-transport">
            <button type="button" className="tool-btn tool-btn-sm th-play"
              onClick=${() => setPlaying((p) => !p)}>
              <${Icon} name=${playing ? 'pause' : 'play'} />
              <span>${playing ? T.pause : T.play}</span>
            </button>
          </div>
          <${Ctl} id="ms-speed" label=${T.speed} min="0" max="5" step="1"
            value=${SPEEDS.indexOf(speed)}
            format=${(i) => SPEEDS[i] + 'x'}
            onChange=${(i) => setSpeed(SPEEDS[i])} />
          <span className="th-which"><b>${T.stageLabel}</b></span>
          <${Seg} items=${stageItems} value=${stage} onChange=${pickStage} />
          <div className="ms-treat">
            <span className="th-which"><b>${T.treatLabel}</b></span>
            <${Seg} items=${hourItems} value=${String(treatHours)}
              onChange=${(id) => setTreatHours(parseInt(id, 10))} />
            <button type="button" className="tool-btn tool-btn-sm ms-treatbtn"
              disabled=${view.treating} onClick=${startTreat}>
              ${view.treating ? html`
                <span className="ms-fill"
                  style=${{ width: (view.progress * 100).toFixed(1) + '%' }}></span>
              ` : null}
              <span className="ms-lbl"><${Icon} name="reset" /></span>
              <span className="ms-lbl">${view.treating ? T.treatRun : T.treatDone}</span>
            </button>
          </div>
        </div>
      ` : null;

      const rampM = rampFor('moisture', skin, rampPickM);
      const rampT = rampFor('temp', skin, rampPickT);

      return html`
        <div className="th-wrap">
          <${Tabs} items=${tabs} value=${tab} onChange=${setTab} />

          ${tab === 'transformer' ? html`
            <${Transformer} site=${site} setSite=${setSite} cfg=${cfg}
              setCfgField=${setCfgField} />
          ` : null}

          ${tab === 'live' && view ? html`
            <${React.Fragment}>
              ${controls}

              <div className="ms-stage ms-mapsplit">
                <${HeatmapPanel} field="moisture" values=${view.shown}
                  domain=${MOIST_DOMAIN} ramp=${rampM.ramp} flip=${rampM.flip}
                  title=${T.mapTitle} unit="%" format=${fmt2} markIdx=${-1} />
                <div className="ms-mapside">
                  <${RampPick} id="ms-ramp-m" value=${rampPickM} onChange=${setRampPickM} />
                  <${RampBar} ramp=${rampM.ramp} flip=${rampM.flip}
                    domain=${MOIST_DOMAIN} unit="%" format=${fmt2} />
                  <div className="ms-sidefacts">
                    <${SideFact} label=${T.spanAxial}
                      value=${view.spans.axial.toFixed(2) + ' pp'} />
                    <${SideFact} label=${T.spanRadial}
                      value=${view.spans.radial.toFixed(3) + ' pp'} />
                  </div>
                  <p className="ms-sidenote">${T.spanNote(C.N_R, C.N_A)}</p>
                </div>
              </div>

              <div className="ms-stage">
                <div className="ms-plotbar">
                  <span className="th-which"><b>${T.stripMode}</b></span>
                  <${Seg} items=${plotItems} value=${plotMode} onChange=${setPlotMode} />
                </div>
                <${StripPanel} hist=${st.hist} mode=${plotMode} />
                <!-- Four numbers, in two pairs. The oil and the paper each get
                     their content and their saturation, next to each other and
                     named on both, because a bare "relative saturation" next to
                     one ppm figure and one percentage read as belonging to
                     whichever number it happened to sit beside. The pairing is
                     also the physics: the two contents are far apart and the
                     two saturations are close, which is the whole argument. -->
                <p className="ms-spans">
                  <span>${T.nowOil}: <b>${view.ppm.toFixed(1)} ppm</b></span>
                  <span>${T.nowSatOil}: <b>${(view.rsOil * 100).toFixed(1)}%</b></span>
                  <span>${T.nowPaper}: <b>${view.wp.toFixed(2)}%</b></span>
                  <span>${T.nowSatPaper}: <b>${(view.rsPaper * 100).toFixed(1)}%</b></span>
                  ${view.removed > 0 ? html`
                    <span>${T.nowRemoved}: <b>${view.removed.toFixed(2)} kg</b></span>
                  ` : null}
                </p>
              </div>
            <//>
          ` : null}

          ${tab === 'heat' && view ? html`
            <${React.Fragment}>
              ${controls}

              <div className="ms-stage ms-mapsplit">
                <${HeatmapPanel} field="temp" values=${view.temps}
                  domain=${TEMP_DOMAIN} ramp=${rampT.ramp} flip=${rampT.flip}
                  title=${T.heatTitle} unit=" C" format=${fmt1} markIdx=${-1} />
                <div className="ms-mapside">
                  <${RampPick} id="ms-ramp-t" value=${rampPickT} onChange=${setRampPickT} />
                  <${RampBar} ramp=${rampT.ramp} flip=${rampT.flip}
                    domain=${TEMP_DOMAIN} unit=" C" format=${fmt1} />
                  <div className="ms-sidefacts">
                    <${SideFact} label=${T.spanAxial}
                      value=${view.gradK.toFixed(1) + ' K'} />
                    <${SideFact} label=${T.nowTop}
                      value=${view.thetaO.toFixed(1) + ' C'} />
                    <${SideFact} label=${T.nowHot}
                      value=${view.thetaH.toFixed(1) + ' C'} />
                    <${SideFact} label=${T.nowAmb}
                      value=${view.thetaA.toFixed(1) + ' C'} />
                  </div>
                </div>
              </div>

              <!-- The same five temperatures as a time series. The map shows
                   where they are in the tank, this shows what they have been
                   doing, and the axial spread being a fraction of the rise is
                   only visible here: on the map it is a gradient, in time it is
                   a band that opens under load and closes at night. -->
              <div className="ms-stage">
                <${StripPanel} hist=${st.hist} mode="heat" />
              </div>
            <//>
          ` : null}

          ${tab === 'model' ? html`<${Model} />` : null}
        </div>
      `;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>

</body>
</html>

         ppm curve, because the shortfall is one step out of a two-hour run and
         diffuses away within the recovery: an endpoint comparison passes on
         the broken code, and so does a ratio between neighbouring steps. What
         is unambiguous is how many minutes of physics the solver was asked to
         perform against how many minutes the caller's clock advanced. The
         probe counts the former by wrapping stepMoisture.

         The step deliberately does not divide the duration; one that does
         never reaches the partial-step path. */
      (function () {
        /* Two runs of identical total length over the same physics, differing
           only in where the step boundaries fall. Run A uses a step that
           straddles the end of the treatment; run B stops exactly on it by
           splitting that one step by hand, which is what a correct
           implementation does internally. If the straddling step silently drops
           the minutes past the boundary, A has integrated less physics than B
           and sits at a measurably different ppm right AFTER the transition,
           before the difference has had time to diffuse away. */
        var a = settled('onan'), b = settled('onan'), st = 7, hrs = 2;

          else C.stepMoisture(a, 62, GRAD, st);
          if (t + st >= total) break;
        }
        ppmA = a.ppm;
        /* The same elapsed time, but the last step is cut at the boundary. */
        C.startTreatment(b, hrs);
        for (t = 0; t + st <= total; t += st) C.stepTreatment(b, 62, GRAD, st);

      pass('the plant pulls at the same rate whatever the duration',
        res[0].tau === res[2].tau && Math.abs(res[0].tau - C.TREAT_TAU) < 1e-9,

      /* What the plant is actually for: while it runs, the oil sits far below
         where it started, because the turnover time is a couple of hours and
         the paper needs days to answer. */
      pass('the oil stays well below its starting value while the plant runs',
        res[0].lowest < 0.8 * res[0].ppm0 && res[2].lowest < 0.8 * res[2].ppm0,
        res.map(function (r) {
          return r.hrs + 'h: down to ' + r.lowest.toFixed(1) + ' from ' +
            r.ppm0.toFixed(1) + ' ppm';
        }).join(', '));

      pass('four times the treatment does not remove four times the water',
        res[2].rem > res[0].rem && res[2].rem < 4 * res[0].rem,
        res[0].hrs + 'h takes ' + res[0].rem.toFixed(2) + ' kg, ' +
        res[2].hrs + 'h takes ' + res[2].rem.toFixed(2) + ' kg');

      var ms = settled('onan'), out = new Float64Array(C.N_R_SHOW * C.N_A);

      pass('averaging down to the shown columns preserves the mean',
        Math.abs(s1 / out.length - s2 / C.N_CELL) < 1e-12,
        'shown ' + (s1 / out.length).toFixed(6) + ' against computed ' +
        (s2 / C.N_CELL).toFixed(6));

      tg = new Float64Array(C.N_R_SHOW * C.N_A);
      C.tempGrid(62, GRAD, tg);
      top = tg[(C.N_A - 1) * C.N_R_SHOW];
      pass('the temperature map runs cold at the bottom and hot at the top',
        tg[0] < top && Math.abs(top - 62) < 1e-9,
        'bottom ' + tg[0].toFixed(1) + ' C, top ' + top.toFixed(1) + ' C');
    })();

    /* The diagnostics the strip chart reads. Each of the three plot modes
       depends on one of these, so a silent change here would show up as a
       wrong picture rather than as an error. */
    (function () {
      var ms = settled('onan'), c = C.paperCorners(ms);
      var wp = C.waterInPaper(ms), wo = C.waterInOil(ms);

      /* The axial gradient dominates the radial one, which is the whole
         argument for showing the four corners rather than two. */
      pass('the bottom corners are wetter than the top corners',
        c.bottomInner > c.topInner && c.bottomOuter > c.topOuter,
        'bottom ' + c.bottomOuter.toFixed(3) + '/' + c.bottomInner.toFixed(3) +
        ', top ' + c.topOuter.toFixed(3) + '/' + c.topInner.toFixed(3) + ' percent');

      pass('the axial corner spread is larger than the radial one',
        Math.abs(c.bottomOuter - c.topOuter) >
        Math.abs(c.bottomOuter - c.bottomInner),
        'axial ' + Math.abs(c.bottomOuter - c.topOuter).toFixed(3) +

      /* The masses must add up to the same total the conservation test uses,

        wp.toFixed(2) + ' kg paper plus ' + wo.toFixed(3) + ' kg oil');

      pass('the paper holds at least ten times the water the oil does',
        wp / wo > 10, (wp / wo).toFixed(0) + ' times');

      /* Both saturations are fractions, and they sit close to each other

        grad = C.gradOf(st);
        thO = 62 + 22 * Math.sin(2 * Math.PI * i / 144);
        if (i === 500) C.startTreatment(ms, 6);
        if (C.treatmentActive(ms)) C.stepTreatment(ms, thO, grad, 10);
        else C.stepMoisture(ms, thO, grad, 10 * COMP);
        for (k = 0; k < C.N_CELL; k++) if (!(ms.C[k] > 0 && ms.C[k] <= 10)) bad++;
        if (!(ms.ppm > 0 && ms.ppm < 2 * C.oilSat(90))) bad++;
      }
      pass('no cell and no oil reading leaves its physical range over a full run',
        bad === 0, bad + ' violations, ending at ' + C.paperMean(ms).toFixed(2) +
        ' percent paper and ' + ms.ppm.toFixed(1) + ' ppm');
    })();

    /* One clock. This page used to advance the moisture solver 18.25 minutes
       per displayed minute while leaving the sun on the real clock, so a
       displayed day was one sunrise and eighteen days of diffusion at the same
       time. Pinned here because the failure mode is silent: nothing crashes,
       the picture just stops meaning anything. */
    (function () {
      var ms, n = 0;
      pass('the page runs on one clock, so a displayed day is a day',
        Math.abs(COMP - 1) < 1e-12,
        COMP.toFixed(4) + ' diffusion days per displayed day');

      /* The day phase and the season have to advance together, which is the
         property the old compressed year broke. Half a displayed year in must
         put the season half a year on. */
      pass('season and day phase advance on the same clock',
        Math.abs(C.compSeason(C.YEAR_MIN / 2) - C.YEAR_MIN / 2) < 1e-6,
        'half a year in lands at ' +
        (C.compSeason(C.YEAR_MIN / 2) / C.DAY_MIN).toFixed(1) + ' days');

      ms = settled('onan');
      C.startTreatment(ms, 1);
      while (C.treatmentActive(ms)) {
        C.stepTreatment(ms, 62, GRAD, 5);
        n += 5;
      }
      pass('a treatment runs in real time, not in compressed time',
        n === 60, 'a one-hour treatment took ' + n + ' simulated minutes');
    })();

    console.log((fails === 0 ? 'ALL PASS' : fails + ' FAILURES') +
      '   ' + (total - fails) + '/' + total + '   ' + (Date.now() - t0) + ' ms');
  })();

       four defaults come first because they are what the page ships with and
       what a comparison starts from; the rest follow in the order they were
       asked for. The name is the matplotlib one, capitalised the way
       matplotlib capitalises it, because that is the name to look up. */
    const RAMP_LIST = [
      ['ylgnbu', 'YlGnBu'], ['magma', 'magma'], ['bone', 'bone'], ['pink', 'pink'],
      ['viridis', 'viridis'], ['plasma', 'plasma'], ['cividis', 'cividis'],
      ['greys', 'Greys'], ['blues', 'Blues'], ['oranges', 'Oranges'],
      ['gnbu', 'GnBu'], ['bugn', 'BuGn'], ['ylgn', 'YlGn'],
      ['winter', 'winter'], ['cool', 'cool'], ['hot', 'hot'], ['afmhot', 'afmhot']
    ];

    /* Which ramp for a field on a skin, and which way round. `flip` puts the
       high end of the data at the dark end of the ramp.

       There is deliberately NO sub-range trimming here. An earlier version
       clipped every ramp to a slice, on the argument that a full sequential
       ramp passes through the luminance of whatever it is drawn on and those
       cells stop being separable from the background. The argument is true, but
       the remedy was wrong: it reshaped the ramp behind the reader's back, so
       the map never showed the colormap its label named, and the trim had to be
       re-derived by hand for every theme. Contrast against the panel is settled
       by CHOOSING a ramp that suits the ground it is drawn on, which is what
       the picker above each map is for. Do not reintroduce clipping.

       These defaults were chosen by eye against all three skins, one ramp at a
       time, using that picker. */
    const RAMP_FOR = {
      moisture: {
        light: { ramp: 'ylgnbu', flip: false },
        grey: { ramp: 'gnbu', flip: false },
        dark: { ramp: 'ylgnbu', flip: false }
      },
      temp: {
        light: { ramp: 'plasma', flip: false },
        grey: { ramp: 'pink', flip: false },
        dark: { ramp: 'afmhot', flip: false }
      }
    };

    /* Ramps whose natural direction runs the wrong way for the quantity, and
       so are drawn reversed when picked.

       Per FIELD, not global, because the two maps disagree and both are right.
       A moisture map wants wet to stand out; a temperature map wants hot to.
       Those land on opposite ends of a ramp like GnBu, which is therefore
       flipped for temperature and left alone for moisture. Keeping one shared
       list would have to be wrong for one of the two maps.
       The list is about the RAMP, not about the theme: it says which way round
       a colormap reads, which does not change when the page changes skin. */
    const FLIP_FOR = {
      moisture: ['viridis', 'winter', 'bone', 'greys'],
      temp: ['ylgn', 'blues', 'oranges', 'gnbu', 'bugn']
    };

    /* The ramp a map actually draws with. `pick` is the dropdown state: the
       empty string means "whatever the theme says", any other value is an
       explicit choice that outlives a theme switch, which is what makes the
       picker usable for comparing ramps against each other.

       A picked ramp is drawn in its own natural direction rather than
       inheriting the default's flip, because the defaults do not share a
       polarity: picking magma on the dark skin used to inherit pink's flip and
       come out running backwards, hot reading as black. A comparison tool that
       silently reshapes what it compares is worse than no tool. */
    function rampFor(field, skin, pick) {
      const base = RAMP_FOR[field][skin] || RAMP_FOR[field].dark;
      if (!pick || !RAMPS[pick]) return base;
      const list = FLIP_FOR[field] || [];
      return { ramp: pick, flip: list.indexOf(pick) >= 0 };
    }

    /* Which skin is live. Falls back to the dark ramp rather than throwing if
       the dataset is not there yet: the FOUC snippet in the head sets it
       before this script runs, but a ramp lookup is not worth a hard
       dependency on that ordering. */
    function skinNow() {
      const el = document.documentElement;
      const s = el && el.dataset ? el.dataset.skin : null;
      return s === 'light' || s === 'grey' || s === 'dark' ? s : 'dark';
    }

    /* Sample a ramp at u in 0..1. Linear in sRGB between the nearest stops:
       the stop lists are dense enough that a fancier interpolation would not
       change a pixel anyone can see. The whole ramp is always used: what the
       label names is what gets drawn. */
    function rampAt(name, u, flip) {
      const stops = RAMPS[name] || RAMPS.magma;
      let t = u < 0 ? 0 : u > 1 ? 1 : u;
      if (flip) t = 1 - t;
      const x = t * (stops.length - 1);
      const i = Math.min(stops.length - 2, Math.floor(x));
      const f = x - i;
      const a = stops[i], b = stops[i + 1];
      return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' +
        Math.round(a[1] + (b[1] - a[1]) * f) + ',' +
        Math.round(a[2] + (b[2] - a[2]) * f) + ')';
    }

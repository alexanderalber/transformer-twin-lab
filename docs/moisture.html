<!doctype html>
<html lang="en" data-theme="dark" data-skin="grey" data-theme-live data-lang-default="en">
<head>
  <meta charset="utf-8">
  <script>(function(){var d='grey',P={light:'light',dark:'dark',grey:'dark'},k=function(v){return typeof P[v]=='string'},e=document.documentElement,t=new URLSearchParams(location.search).get('theme');if(k(t)){try{localStorage.setItem('theme',t)}catch(x){}}else{try{t=localStorage.getItem('theme')}catch(x){}}if(!k(t))t=d;e.dataset.skin=t;e.dataset.theme=P[t];e.dataset.themeDefault=d;e.style.colorScheme=P[t];})();</script>
  <script>document.documentElement.lang=(new URLSearchParams(location.search).get('lang')||localStorage.getItem('lang')||'en');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moisture twin, paper and oil</title>
  <meta name="description" content="Where the water sits in a transformer. The same measured ppm in the oil means very different moisture in the paper depending on temperature, and drying the oil barely touches the paper.">
  <link rel="stylesheet" href="assets/css/pico.min.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <!-- Favicon: the bare triangle on a transparent ground, no plate behind it.
       A single fixed stroke colour would vanish against one of the two tab
       bars, so the SVG carries its own prefers-color-scheme rule: dark ink on
       a light tab bar, white on a dark one. Same mark on all pages. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cstyle%3Epath%7Bstroke:%231b1e23%7D@media(prefers-color-scheme:dark)%7Bpath%7Bstroke:%23fff%7D%7D%3C/style%3E%3Cpath%20d='M16%205%2028%2027H4Z'%20fill='none'%20stroke-width='2.5'%20stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    /* Same sizing pattern as the Duval page: one width for the whole page, so
       the header row and the columns below it share an edge. Wider than the
       triangle page because a year of temperature is a wide plot. */
    html { --th-w: 1240px; }
    .th-wrap { width: 100%; max-width: var(--th-w); margin: 0 auto; padding: 0 0 16px; }
    body > header.tw-head {
      width: 100%; max-width: var(--th-w); margin-inline: auto;
      padding: 10px 0 0; font-size: 1.3rem;
    }
    body > header.tw-head h1 { font-size: 1.3rem; color: var(--tool-emph); }
    /* Breadcrumb back to the overview: quieter than the page title, so the
       title still reads as the title. */
    .th-crumb { color: var(--tool-note); text-decoration: none; background: none; }
    .th-crumb:hover, .th-crumb:focus-visible { color: var(--pico-primary); text-decoration: underline; }
    .th-sep { color: var(--tool-faint); margin: 0 0.42em; font-weight: 400; }
    .th-note { margin: 0; font-size: 12px; color: var(--tool-note); }

    /* Row 1: the stage controls of the current tab. One line, no wrapping.
       Not a height budget, a reading one: wrapped, the transport, the sliders
       and the stage buttons stop reading as one control row. */
    .th-row1 {
      display: flex; align-items: center; justify-content: space-between;
      gap: 18px; height: 44px;
    }
    .th-segs { display: flex; align-items: center; }
    /* Which site the numbers on this tab belong to, quiet on purpose: the
       presenter should never have to switch tabs to find out. */
    .th-which { font-size: 13px; color: var(--tool-note); white-space: nowrap; }
    .th-which b { color: var(--tool-label); font-weight: 600; }
    /* One slider plus its label, inline in the control row. The track may give
       way when the row gets tight: shrinking a slider is the only thing on that
       row that costs nothing to read. */
    .th-ctl { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--tool-label); min-width: 0; }
    .th-ctl input[type="range"] { width: 108px; min-width: 60px; margin: 0; flex: 0 1 auto; }
    .th-ctl .th-ctlval {
      color: var(--tool-emph); font-variant-numeric: tabular-nums;
      min-width: 42px; text-align: right;
    }
    /* The shared segmented control is sized for body text; on a beamer it needs
       to be readable from the back of the room. */
    .th-seg { font-size: 14px; padding: 5px 12px; line-height: 1.5; }
    .th-transport { display: flex; align-items: center; gap: 12px; }
    /* Geometry now comes from .tool-btn; this only keeps the width stable, so
       the row does not shuffle sideways when "Pause" becomes "Play". */
    .th-play { min-width: 92px; }
    /* The plot is a wide strip, not a card, and now that "now" is pinned to the
       right-hand edge there is nothing on it to click. */
    .th-stage { cursor: default; }

    /* One line under the strip chart: what the colours are, and what they read
       at the right-hand edge. Quiet and fixed-width, so it does not jitter
       while the chart scrolls. */
    .th-legend {
      display: flex; align-items: center; gap: 18px;
      margin: 5px 2px 0; font-size: 13px; color: var(--tool-note);
      font-variant-numeric: tabular-nums;
    }
    .th-legend i {
      display: inline-block; width: 16px; height: 0;
      border-top: 2.5px solid currentColor; vertical-align: middle; margin-right: 6px;
    }
    .th-legend-note { margin-left: auto; color: var(--tool-faint); }
    .th-now { color: var(--tool-text); }
    .th-now b { color: var(--tool-emph); font-weight: 600; }

    .th-h2 {
      margin: 0 0 2px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.09em;
      text-transform: uppercase; color: var(--tool-note); line-height: 1.3;
    }
    /* Uppercasing a lowercase sigma turns it into a capital one, which is a
       different quantity. This part keeps its case. */
    .th-h2 .th-cased { text-transform: none; letter-spacing: 0.03em; }
    .th-hrow { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .th-hnote {
      font-size: 12px; color: var(--tool-faint); text-transform: none;
      letter-spacing: 0; font-variant-numeric: tabular-nums;
    }

    /* ── Model tab ───────────────────────────────────────────────────────
       A reading column, not a control surface: narrower than the page so
       the lines stay scannable, quiet headers in the .th-h2 voice. */
    .th-model { max-width: 780px; margin-top: 18px; }
    .th-model h3 {
      margin: 16px 0 3px; font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.09em; text-transform: uppercase; color: var(--tool-note);
    }
    .th-model h3:first-child { margin-top: 0; }
    .th-model p { margin: 0 0 6px; font-size: 15px; line-height: 1.55; color: var(--tool-text); }
    .th-model .th-src { margin-top: 14px; font-size: 12.5px; color: var(--tool-faint); }

    /* ── Transformer tab ─────────────────────────────────────────────────
       Two rows, two columns, placed explicitly rather than by auto-flow.
       The site picker owns the first row on its own, because it is the master
       switch: everything below it describes the site it selects. The second
       row carries two stacks, the site's own parameters on the left and the
       paper and its uncertainties on the right, and both stacks START on that
       row, so their frames are flush at the top.
       Each stack is a flex column, not further grid rows: inside a stack the
       blocks have to close up under one another, and grid rows would instead
       align the second block of the right stack with the second block of the
       left one and leave a hole. */
    .th-cfg {
      display: grid; grid-template-columns: 470px 320px;
      column-gap: 65px; row-gap: 12px;
      align-items: start;
      /* On top of the strip's own 20 px: the first frame needs more air than
         the old bare heading did, because its legend rides half above the top
         border and would otherwise sit close to the tabs. */
      margin-top: 14px;
    }
    .th-cfg > .th-cfgsite { grid-column: 1; grid-row: 1; }
    .th-cfg > .th-cfgleft { grid-column: 1; grid-row: 2; }
    .th-cfg > .th-cfgright { grid-column: 2; grid-row: 2; }
    .th-cfgcol { display: flex; flex-direction: column; gap: 12px; }
    /* Each labelled block gets a frame, and its title rides ON the frame the
       way a fieldset legend does. Not only decoration: a title inside the box
       would add its line height to all five blocks for nothing, since the
       line already exists as the heading. On the border it costs the padding
       alone, and the frame reads as one closed group rather than as a rule
       with text above it.
       The frame is a softened --tool-border rather than --tool-hairline:
       hairline disappears on the dark skin, and full --tool-border is pure
       white on the grey skin, which would put five loud boxes on the page. */
    .th-group {
      position: relative;
      display: flex; flex-direction: column; gap: 7px;
      border: 1px solid color-mix(in srgb, var(--tool-border) 55%, transparent);
      border-radius: 7px;
      padding: 12px 14px 11px;
    }
    /* The legend sits half above the top border and paints the page ground
       over it, so the frame appears to break around the words. */
    .th-group > .th-h2 {
      position: absolute; top: 0; left: 11px; transform: translateY(-50%);
      margin: 0; padding: 0 6px; white-space: nowrap;
      background: var(--page-bg);
    }
    /* Five chips have to sit on ONE line inside the 470 px column: wrapped they
       read as two broken rows rather than one control. Slightly tighter than
       the other segmented controls on the page, which is the price. */
    .th-chips { display: flex; flex-wrap: nowrap; gap: 0; margin-bottom: 4px; }
    /* Inside a frame the block padding already does the spacing. */
    .th-group > .th-chips { margin-bottom: 0; }
    .th-chips .th-seg { font-size: 13px; padding: 4px 9px; white-space: nowrap; }
    .th-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin: 0; font-size: 15px; line-height: 1.5; min-height: 28px;
      color: var(--tool-text); font-variant-numeric: tabular-nums;
    }
    /* The popover is absolutely positioned, so it is out of flow and cannot
       add to the row height. */
    .th-row > .th-anchor { min-width: 0; }
    .th-row input { width: 72px; margin: 0; padding: 2px 6px; font-size: 15px; height: auto; text-align: right; }
    /* No spinner arrows: too small to hit on a beamer, and the keyboard sets
       the value anyway. */
    .th-row input[type="number"] { appearance: textfield; -moz-appearance: textfield; }
    .th-row input[type="number"]::-webkit-outer-spin-button,
    .th-row input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .th-row .th-unit {
      display: inline-block; width: 30px; margin-left: 7px; text-align: right;
      color: var(--tool-note); font-size: 13px;
    }
    /* The surface transfer row shows a whole value, not a bare unit:
       "1.0e-8 m/s" does not fit the 30px cell sized for "K" or "pu", and broke
       over three lines mid-token. Its own width, and no wrapping. */
    .th-row .th-unit-wide {
      width: auto; min-width: 74px; white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    /* The one non-numeric site input: which half of the year the load peaks in. */
    .th-row .th-seg { font-size: 13px; padding: 2px 9px; }

    /* Round "i" next to a label, and the note it opens. The note floats above
       the page rather than expanding inline, so opening one never pushes the
       rows below it out of view. */
    /* Pico makes both `label` and `button` block-level and gives them a bottom
       margin, which put the info button on its own line and doubled the height
       of every parameter row. Label, button and the value slot have to share
       one line at the row's existing height, so both are forced back inline
       here and their margins are zeroed. */
    .th-anchor { position: relative; display: inline-flex; align-items: baseline; }
    .th-anchor > label {
      display: inline; width: auto; margin: 0; padding: 0;
      cursor: pointer; line-height: inherit;
    }
    .th-anchor > span { line-height: inherit; }
    .th-anchor > .th-info {
      display: inline-flex; align-items: center; justify-content: center;
      flex: 0 0 auto;
      width: 16px; height: 16px; min-width: 0; margin: 0 0 0 6px; padding: 0;
      align-self: center;
      border: 1px solid var(--tool-faint); border-radius: 50%; background: none;
      color: var(--tool-label); font-size: 11px; line-height: 1; font-weight: 700;
      cursor: pointer;
    }
    .th-anchor > .th-info:hover, .th-anchor > .th-info:focus-visible,
    .th-anchor > .th-info[aria-expanded="true"] {
      background: none; border-color: var(--tool-sig-info); color: var(--tool-sig-info);
    }
    .th-pop {
      position: absolute; z-index: 40; top: calc(100% + 8px); left: 50%;
      width: min(340px, calc(100vw - 28px)); max-height: min(58vh, 420px); overflow-y: auto;
      background: var(--tool-surface); border: 1px solid var(--tool-border); border-radius: 8px;
      box-shadow: var(--tool-panel-shadow);
      padding: 11px 30px 11px 13px; font-size: 13px; line-height: 1.55;
      color: var(--tool-label); font-weight: 400; text-align: left; cursor: auto;
      font-variant-numeric: normal;
    }
    .th-pop::before {
      content: ""; position: absolute; top: -5px; left: var(--arrow, 50%);
      width: 8px; height: 8px; margin-left: -4px; background: var(--tool-surface);
      border-left: 1px solid var(--tool-border); border-top: 1px solid var(--tool-border);
      transform: rotate(45deg);
    }
    .th-popclose {
      position: absolute; top: 4px; right: 4px; width: 22px; height: 22px;
      display: inline-flex; align-items: center; justify-content: center; margin: 0; padding: 0;
      border: none; border-radius: 5px; background: none; color: var(--tool-note);
      font-size: 16px; line-height: 1; cursor: pointer;
    }
    .th-popclose:hover { background: var(--tool-hairline); color: var(--tool-text); }

    /* Segmented buttons take their outline from --pico-muted-border-color,
       which is #262e3a on the dark skin and #d8e0ea on the light one: both sit
       at about 1.4:1 against their own background and disappear on a beamer.
       The grey skin is the reference here, #9aa1a6 on #55595f at about 2.6:1,
       and is deliberately left exactly as it is. --tool-faint lands at about
       3.0:1 on the other two (#566472 on #14181f, #8b96a1 on #ffffff), which
       reads as a group of buttons without shouting. Hover, focus and the active
       state keep the accent, hence the three exclusions; scoped to .th-wrap, so
       the theme switcher in the page header stays identical across the site. */
    html[data-skin="dark"] .th-wrap .lang-seg:not(.active):not(:hover):not(:focus),
    html[data-skin="light"] .th-wrap .lang-seg:not(.active):not(:hover):not(:focus) {
      border-color: var(--tool-faint);
    }

    /* Range sliders. Pico leaves the thumb to the browser, and the browser
       default is a pale disc that disappears on the grey skin from six metres
       away. Both vendor prefixes are needed: they are separate pseudo-elements
       and a shared rule would be dropped by both engines. The fill is the
       accent of the active skin (grey teal, dark blue-grey, light blue) and
       the ring is --tool-emph, which is white on both dark skins and near-black
       on the light one, so the thumb keeps a hard edge everywhere. */
    .th-wrap input[type="range"] {
      appearance: none; -webkit-appearance: none; background: none; height: 20px;
    }
    .th-wrap input[type="range"]:focus { outline: none; }
    .th-wrap input[type="range"]::-webkit-slider-runnable-track {
      height: 6px; border-radius: 3px; background: var(--tool-hairline);
      border: 1px solid var(--tool-border);
    }
    .th-wrap input[type="range"]::-moz-range-track {
      height: 6px; border-radius: 3px; background: var(--tool-hairline);
      border: 1px solid var(--tool-border);
    }
    .th-wrap input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px;
      border-radius: 50%; background: var(--pico-primary);
      border: 2px solid var(--tool-emph); cursor: pointer;
    }
    .th-wrap input[type="range"]::-moz-range-thumb {
      width: 18px; height: 18px; border-radius: 50%; background: var(--pico-primary);
      border: 2px solid var(--tool-emph); cursor: pointer;
    }
    .th-wrap input[type="range"]:focus-visible::-webkit-slider-thumb {
      box-shadow: 0 0 0 3px var(--pico-primary-focus);
    }
    .th-wrap input[type="range"]:focus-visible::-moz-range-thumb {
      box-shadow: 0 0 0 3px var(--pico-primary-focus);
    }

    /* The three stage buttons of the Live tab. Oil treatment is a one-shot, so
       it never latches: it flashes for a moment instead. */
    .th-stage-btns { display: flex; align-items: center; gap: 0; }
    .th-fire {
      background: var(--pico-primary); border-color: var(--pico-primary);
      color: var(--pico-primary-inverse);
    }

    /* ── Lifetime tab ────────────────────────────────────────────────────
       One large distribution with a method switch above it, then the two
       wide panels. 760 + 40 + 440 is the page width. */
    /* Below the design width the page keeps a gutter, same as the Duval page. */
    @media (max-width: 1260px) {
      .th-wrap, body > header.tw-head { padding-inline: 16px; }
    }
    /* ── The maps ─────────────────────────────────────────────────────────
       Two canvases with the same geometry, one for paper moisture and one for
       oil temperature, so they can be read against each other by flipping a
       tab without anything moving. */
    .ms-maprow { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 10px; }
    /* Stacked panels need air between them. Without it the two frames on the
       moisture tab share an edge and read as one box with a line through it,
       which is exactly what a frame is supposed to prevent. Margin on the
       element rather than a gap on a wrapper, because these are siblings of a
       fragment and not of a flex container. */
    .ms-stage {
      position: relative; border: 1px solid var(--tool-hairline);
      border-radius: 6px; background: var(--pico-card-background-color);
      padding: 8px 10px 6px;
      margin-top: 10px;
    }
    .ms-stage canvas { display: block; width: 100%; }

    /* A map panel is two columns: the picture on the left, everything that
       talks ABOUT the picture on the right. That is a vertical decision, not
       an aesthetic one. Stacked, the colour picker, the colour bar and the two
       span numbers each cost a line above or below the canvas, and on a 1080p
       screen those lines were the difference between the strip chart being
       visible and being below the fold. Beside the map they cost nothing: the
       map is far taller than the four items are.
       The map keeps its own aspect this way too. It is a 16 x 6 grid, so at
       full page width the cells came out long and flat and the radial
       direction, which is the one with the interesting structure, was the one
       squeezed. A narrower map makes the cells closer to square. */
    .ms-mapsplit {
      display: grid; grid-template-columns: minmax(0, 1fr) 210px;
      column-gap: 18px; align-items: start;
    }
    /* The right column. Quiet type throughout: it is a legend and a readout,
       not a second control surface competing with the toolbar. */
    .ms-mapside {
      display: flex; flex-direction: column; gap: 14px;
      padding-top: 2px; min-width: 0;
    }
    /* The picker fills the column rather than sitting at its natural width,
       so the label sits above the select instead of beside it: 210px is not
       enough for "default (by theme)" on one line with a label in front. */
    .ms-mapside .ms-rampsel { flex-direction: column; align-items: stretch; gap: 4px; }
    .ms-mapside .ms-rampsel select { width: 100%; }
    /* The colour bar, moved out of the canvas. In the canvas it forced a 52px
       top pad on a drawing that needed 30, and it had to be redrawn as a
       gradient on every frame. As DOM it is one element with a background
       image, set once per ramp change. */
    .ms-ramp { display: flex; flex-direction: column; gap: 3px; }
    .ms-ramp .ms-rampbar {
      height: 10px; border: 1px solid var(--tool-border); border-radius: 2px;
    }
    .ms-ramp .ms-rampends {
      display: flex; justify-content: space-between;
      font-size: 12px; color: var(--tool-faint);
      font-variant-numeric: tabular-nums;
    }
    /* The spans, stacked as label-over-value pairs. Beside the map there is no
       room for "bottom to top: 1.23 pp" on one line in either language, and a
       wrapping readout that carries live numbers is exactly the thing that
       reflows while the simulation runs. */
    .ms-sidefacts { display: flex; flex-direction: column; gap: 9px; }
    .ms-sidefact { display: flex; flex-direction: column; gap: 1px; }
    .ms-sidefact > span {
      font-size: 12px; color: var(--tool-note); line-height: 1.25;
    }
    .ms-sidefact > b {
      font-size: 15px; color: var(--tool-emph); font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .ms-sidenote { font-size: 12px; color: var(--tool-faint); line-height: 1.35; }
    /* Below the design width the side column would squeeze the map into a
       stripe. It goes back under the map instead, as a row. */
    @media (max-width: 900px) {
      .ms-mapsplit { grid-template-columns: minmax(0, 1fr); }
      .ms-mapside { flex-direction: row; flex-wrap: wrap; align-items: flex-end; gap: 18px; }
      .ms-sidefacts { flex-direction: row; gap: 18px; }
      .ms-ramp { min-width: 180px; }
    }

    /* Span readout under the map. The radial spread is the smaller of the two
       signals by an order of magnitude, so it gets a number rather than being
       left to the colours. */
    /* The readout line under a panel. Two things here exist to stop it moving
       while the simulation runs, because it is directly under a chart and any
       reflow of it drags the chart with it.

       tabular-nums: these are live counters. With proportional figures a 1
       is narrower than a 0, so every value that ticks over changes the width of
       its own label and shoves everything to its right sideways. Every other
       numeric readout on this page already asks for tabular figures; this one
       was the exception, which is why it was the one that jittered.

       No wrapping: the trailing note used to sit on this line when it fit and
       drop to a line of its own when it did not, and whether it fit depended on
       how wide the numbers happened to be that frame. So the panel changed
       HEIGHT as the values counted. The note now has its own line always, which
       costs one line of space and buys a layout that never reflows. */
    .ms-spans {
      display: flex; gap: 18px; align-items: baseline; flex-wrap: nowrap;
      font-size: 13px; color: var(--tool-note); margin: 6px 0 0;
      font-variant-numeric: tabular-nums;
    }
    .ms-spans > span { white-space: nowrap; }
    .ms-spans b { color: var(--tool-emph); font-weight: 600; }

    /* Header row of the strip panel: the plot selector sits above the chart
       rather than in the control bar at the top of the tab, because it changes
       what this one panel shows and nothing else on the page. */
    .ms-plotbar {
      display: flex; align-items: center; gap: 10px;
      margin: 0 0 4px; flex-wrap: wrap;
    }

    /* Treatment control: a duration choice and a button that arms it.
       The gap is not zero. It was, and with the label immediately against the
       first segment "Oil treatment" and "12 h" ran together into one word; the
       segments themselves still butt against each other, which is what makes
       them read as one control, so the spacing lives on the label instead. */
    /* Spacing lives on the container, not on the children. The button used to
       carry margin-left, which .tool-btn then reset to 0: same specificity, and
       .tool-btn is declared later, so source order decided and the gap silently
       vanished. A container gap cannot be overridden by a child rule at all.
       The segments still butt against each other, which is what makes them read
       as one control, so they get gap: 0 back explicitly. */
    .ms-treat { display: flex; align-items: center; gap: 10px; }
    .ms-treat > .th-segs { gap: 0; }
    .ms-treatbtn {
      white-space: nowrap;
      position: relative; overflow: hidden;
    }
    .ms-treatbtn:disabled { opacity: 0.55; cursor: default; }
    /* Progress fill while the plant runs, drawn behind the label. */
    .ms-treatbtn .ms-fill {
      position: absolute; inset: 0 auto 0 0; background: var(--pico-primary);
      opacity: 0.22; pointer-events: none;
    }
    .ms-treatbtn span.ms-lbl { position: relative; }

    /* The colour picker above each map. A label plus a select, quiet: it is a
       comparison aid, not one of the controls the demo is driven by. */
    .ms-rampsel {
      display: inline-flex; align-items: center; gap: 8px;

  <!-- ──────────────────────────────────────────────────────────────────────
       Moisture core: plain JS, no JSX and no DOM.
       The thermal half is the IEC 60076-7 exponential-solution equivalent,
       carried over unchanged from the thermal page. On top of it sits the
       water: solubility in oil, the paper isotherm in relative saturation,
       and Fickian diffusion through the insulation, solved implicitly on a
       radial grid at each of several winding heights.
       ────────────────────────────────────────────────────────────────────── -->
  <script id="moisturecore">
var MoistureCore = (function () {
  'use strict';
    var YEAR_MIN = 525600;   // 365 d, no leap handling: the demo is periodic
    var DAY_MIN = 1440;
    var IEC = {
      k11: 0.5, k21: 2.0, k22: 2.0,
      tauO: 210, tauW: 10,
      x: 0.8, y: 1.3,
      R: 10,
      dThOr: 45,
      dThHr: 26
    };


    /* Deterministic RNG, so the arc-furnace profile is the same on every
       reload and the plots do not shimmer. */
    function mulberry32(seed) {
      var a = seed >>> 0;
      return function () {
        a = (a + 0x6D2B79F5) >>> 0;
        var t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    /* Box-Muller on top of a given uniform source, one spare cached. */
    function gaussFactory(rnd) {
      var spare = null;
      return function () {
        if (spare !== null) { var v = spare; spare = null; return v; }
        var u1, u2, r, t;
        do { u1 = rnd(); } while (u1 <= 1e-12);
        u2 = rnd();
        r = Math.sqrt(-2 * Math.log(u1)); t = 2 * Math.PI * u2;
        spare = r * Math.sin(t);
        return r * Math.cos(t);
      };
    }

    /* Value noise for the arc-furnace load: a fixed table of nodes, smoothstep
       between them. Deterministic and cheap, and a pure function of tMin, so
       the profile can be evaluated out of order. */
    var NOISE_N = 4096;
    var NOISE_STEP = 23;   // min per node, incommensurate with 4, 7 and 13
    var NOISE = (function () {
      var rnd = mulberry32(20260820), a = new Float64Array(NOISE_N), i;
      for (i = 0; i < NOISE_N; i++) a[i] = rnd() * 2 - 1;
      return a;
    })();
    function valueNoise(tMin) {
      var u = tMin / NOISE_STEP, i0 = Math.floor(u), f = u - i0;
      var s = f * f * (3 - 2 * f);
      var a = NOISE[((i0 % NOISE_N) + NOISE_N) % NOISE_N];
      var b = NOISE[(((i0 + 1) % NOISE_N) + NOISE_N) % NOISE_N];
      return a + (b - a) * s;
    }

    var MID_JULY = 196 * DAY_MIN;    // yearly ambient peak, northern hemisphere
    var MID_JANUARY = 15 * DAY_MIN;  // yearly heating-load peak

    /* Four sites, chosen so that the same transformer ages very differently.
       Ambient: mean plus a yearly and a diurnal cosine, amplitudes are half
       swings in kelvin. Load: base per unit plus a diurnal and a seasonal
       cosine, plus a fast component for the arc furnace. */
    var SCENARIOS = [
      {
        id: 'desert', label: 'Desert', dtMin: 5,
        ambient: { mean: 28, yearAmp: 12, yearPeak: MID_JULY, dayAmp: 17, lat: 30 },
        /* Air conditioning: the load peak sits on the temperature peak instead
           of after it, which is the worst phase for the hot spot. */
        load: { base: 0.58, dayAmp: 0.115, dayPeak: 15 * 60, seasonAmp: 0.06, seasonPeak: MID_JULY, fast: null }
      },
      {
        id: 'nyc', label: 'City / overload', dtMin: 5,
        ambient: { mean: 13, yearAmp: 12, yearPeak: MID_JULY, dayAmp: 6, lat: 41 },
        /* Systematically run over nameplate: base plus both cosines put the
           summer evening peak at K = 1.20, which is where the hot spot starts
           to matter. */
        load: { base: 0.78, dayAmp: 0.26, dayPeak: 19 * 60, seasonAmp: 0.16, seasonPeak: MID_JULY, fast: null }
      },
      {
        id: 'northern', label: 'Northern', dtMin: 5,
        ambient: { mean: 4, yearAmp: 18, yearPeak: MID_JULY, dayAmp: 5, lat: 53 },
        /* Cold climate, winter-peaking load: electric heating puts the seasonal
           load peak in anti-phase with ambient, so the heavy load arrives with
           cold oil. */
        load: { base: 0.60, dayAmp: 0.10, dayPeak: 19 * 60, seasonAmp: 0.25, seasonPeak: MID_JANUARY, fast: null },
        /* Tank heaters hold a minimum oil temperature, modelled as a floor, no
           control dynamics. */
        oilFloor: 10
      },
      {
        id: 'eaf', label: 'EAF', dtMin: 1,
        /* Indoor enclosure near the furnace, ambient largely decoupled from
           weather: a high mean and only a few kelvin of daily and seasonal
           swing left. That, not the load, is what makes this the hard-ridden
           site: the same violent minute-scale load on 40 C air puts the hot
           spot over 100 C. The diurnal shape stays the Parton-Logan one; it
           carries unit peak-to-peak whatever the amplitude, so a small swing
           scales it down and nothing degenerates. */
        ambient: { mean: 40, yearAmp: 3, yearPeak: MID_JULY, dayAmp: 2, lat: 48 },
        /* Minute-scale swings: three incommensurate sinusoids so the pattern
           never repeats within a day, plus value noise for the melt cycles.
           Amplitudes sum to 0.50 pu around a base of 0.70, so K normally sweeps
           about 0.3 to 1.1 within minutes. dtMin is 1 here because tauW is
           10 min. */
        load: {
          base: 0.70, dayAmp: 0.05, dayPeak: 19 * 60, seasonAmp: 0.0, seasonPeak: MID_JULY,
          fast: { sin: [[4, 0.14], [7, 0.11], [13, 0.09]], noiseAmp: 0.16, min: 0.05, max: 1.4 }
        }
      }
    ];

    function scenarioById(id) {
      for (var i = 0; i < SCENARIOS.length; i++) if (SCENARIOS[i].id === id) return SCENARIOS[i];
      return SCENARIOS[0];
    }

    /* ── Custom site ──────────────────────────────────────────────────────
       The four presets above are the shipped sites; the Transformer tab also
       lets a site be edited. A flat config object is what the number inputs
       bind to, scenarioFromConfig turns it back into the nested form the model
       reads, and configFromScenario seeds the editor from whichever preset was
       selected when the first edit happened.
       Two things are simplified against the preset form. The seasonal load peak
       is a sign rather than a free date (summer peak = cooling, winter peak =
       heating; anything between is not a story anyone tells). The fast term is
       one amplitude that scales the whole arc-furnace block, so a single number
       takes a site from smooth to minute-scale. */
    var EAF_FAST = { sin: [[4, 0.14], [7, 0.11], [13, 0.09]], noiseAmp: 0.16, min: 0.05, max: 1.4 };

    function configFromScenario(sc) {
      var l = sc.load, a = sc.ambient;
      var fastAmp = l.fast ? l.fast.noiseAmp / EAF_FAST.noiseAmp : 0;
      return {
        ambMean: a.mean, ambYearAmp: a.yearAmp, ambDayAmp: a.dayAmp,
        ambLat: a.lat == null ? DEFAULT_LAT : a.lat,
        loadBase: l.base, loadDayAmp: l.dayAmp, loadDayPeakH: l.dayPeak / 60,
        loadSeasonAmp: l.seasonAmp, loadWinterPeak: l.seasonPeak === MID_JANUARY ? 1 : 0,
        loadFastAmp: fastAmp,
        /* A site without tank heaters gets a floor far below anything its
           ambient can reach, so the same input exists on every site and simply
           never binds. */
        oilFloor: sc.oilFloor == null ? -40 : sc.oilFloor
      };
    }

    function scenarioFromConfig(cfg, id, label) {
      var f = cfg.loadFastAmp > 0.001;
      var sc = {
        id: id || 'custom', label: label || 'Custom',
        /* A fast site needs a 1 min step, tauW is 10 min; a smooth one does
           not, and 5 min keeps the compressed year cheap. */
        dtMin: f ? 1 : 5,
        ambient: {
          mean: cfg.ambMean, yearAmp: cfg.ambYearAmp, yearPeak: MID_JULY,
          dayAmp: cfg.ambDayAmp, lat: cfg.ambLat
        },
        load: {
          base: cfg.loadBase, dayAmp: cfg.loadDayAmp, dayPeak: cfg.loadDayPeakH * 60,
          seasonAmp: cfg.loadSeasonAmp,
          seasonPeak: cfg.loadWinterPeak ? MID_JANUARY : MID_JULY,
          fast: f ? {
            sin: EAF_FAST.sin.map(function (s) { return [s[0], s[1] * cfg.loadFastAmp]; }),
            noiseAmp: EAF_FAST.noiseAmp * cfg.loadFastAmp,
            min: EAF_FAST.min, max: EAF_FAST.max
          } : null
        }
      };
      sc.oilFloor = cfg.oilFloor;
      return sc;
    }

    var TWO_PI = 2 * Math.PI;

    /* ── Diurnal air temperature, Parton and Logan (1981) ─────────────────
       Source: Parton, W.J. and Logan, J.A. (1981), "A model for diurnal
       variation in soil and air temperature", Agricultural Meteorology
       23:205-216.

       A day of air temperature is not a cosine. The paper's shape is a
       truncated sine through the daylight hours whose peak lags solar noon,
       and an exponential decay through the night towards the next morning's
       minimum. The asymmetry matters here: the load peak of a city feeder sits
       in the evening, on the steep side of that curve, and a cosine puts the
       air several kelvin away from where it really is at that hour.

       PL_A  hours by which the daily maximum lags solar noon
       PL_B  night-time decay coefficient, per night length
       PL_C  hours by which the minimum lags sunrise; the paper's value is
             negative, the coldest moment is about ten minutes BEFORE sunrise,
             because the ground keeps radiating until the direct beam arrives. */
    var PL_A = 1.86;
    var PL_B = 2.20;
    var PL_C = -0.17;

    /* The piecewise construction matches its two branches in VALUE at sunset
       and at the morning minimum, never in SLOPE, so it has a corner at each.
       A corner in the forcing is not something a real day has, and it repeats
       every cycle, so it would be a periodic artefact rather than a one-off.
       The fix keeps the paper's TIMING, which is the validated part, and
       replaces the piecewise evaluation: the normalised shape is projected onto
       a Fourier series over the 24 h period and each coefficient is multiplied
       by exp(-(k omega sigma)^2/2), which is exactly a convolution with a
       Gaussian of width sigma in time. The result is periodic and smooth by
       construction, corners and the midnight wrap together, with no case
       distinction left in the evaluator.
       The series is carried to where the taper has actually killed the
       coefficients (exp(-x^2/2) at x = 4.5 is 4e-5), not to two or three
       harmonics: a brick-wall truncation that low moves the extremes by hours.
       The Gaussian taper is what makes the truncation harmless. */
    var PL_OMEGA = 2 * Math.PI / 24;   // rad per hour
    var PL_SIGMA_H = 0.30;             // mollifier width, hours
    var PL_TAPER_CUTOFF = 4.5;
    var PL_PROJ_N = 2880;              // projection samples, 30 s

    /* Normalised Parton-Logan shape, argument in hours since the daily
       minimum: 0 at the minimum, 1 at the daylight peak. */
    function plShapeFactory(dayLen, a, b) {
      var nightLen = 24 - dayLen;
      var k = Math.PI / (dayLen + 2 * a);
      var gSunset = Math.sin(k * dayLen);
      /* The raw night branch does not return to the minimum at the next
         sunrise, it leaves a step of gSunset*exp(-b). Harmless for a one-off
         daily curve, fatal here, because that step would inject a spurious
         thermal impulse every cycle. Renormalising the decay to
         (e^-x - e^-b)/(1 - e^-b) keeps the shape and the time constant and
         forces exact closure. */
      var expNegB = Math.exp(-b);
      var scale = gSunset / (1 - expNegB);
      var invNight = 1 / nightLen;
      return function (m) {
        m = m - 24 * Math.floor(m / 24);
        if (m <= dayLen) return Math.sin(k * m);
        return scale * (Math.exp(-b * (m - dayLen) * invNight) - expNegB);
      };
    }

    /* Project a 24 h periodic shape onto cos and sin and apply the taper. The
       harmonics are stepped by a rotation recurrence, so there is one cos and
       one sin per sample and none per harmonic. */
    function plHarmonics(shape, sigma) {
      var K = Math.max(2, Math.ceil(PL_TAPER_CUTOFF / (PL_OMEGA * sigma)));
      var N = PL_PROJ_N;
      var a = new Float64Array(K + 1), b = new Float64Array(K + 1);
      var dth = 2 * Math.PI / N;
      var cD = Math.cos(dth), sD = Math.sin(dth);
      var cB = 1, sB = 0, i, k, ck, sk, cn, sn, v, x, taper;
      for (i = 0; i < N; i++) {
        v = shape(24 * i / N);
        a[0] += v;
        ck = 1; sk = 0;
        for (k = 1; k <= K; k++) {
          cn = ck * cB - sk * sB; sn = sk * cB + ck * sB;
          ck = cn; sk = sn;
          a[k] += v * ck; b[k] += v * sk;
        }
        cn = cB * cD - sB * sD; sn = sB * cD + cB * sD;
        cB = cn; sB = sn;
      }
      a[0] /= N;
      for (k = 1; k <= K; k++) {
        x = k * PL_OMEGA * sigma;
        taper = Math.exp(-0.5 * x * x) * 2 / N;
        a[k] *= taper; b[k] *= taper;
      }
      return { a: a, b: b, K: K };
    }

    function plHarmonicValue(h, m) {
      var th = PL_OMEGA * m;
      var cB = Math.cos(th), sB = Math.sin(th);
      var a = h.a, b = h.b, K = h.K;
      var s = a[0], ck = 1, sk = 0, cn, sn, k;
      for (k = 1; k <= K; k++) {
        cn = ck * cB - sk * sB; sn = sk * cB + ck * sB;
        ck = cn; sk = sn;
        s += a[k] * ck + b[k] * sk;
      }
      return s;
    }

    /* ── The shape as a table ─────────────────────────────────────────────
       Evaluating fifty-odd harmonics per call would be fine once a day and is
       not fine here: a year of the arc-furnace site is half a million ambient
       evaluations, and the compressed year has a CONTINUOUS season, so there
       is no "once per day" to hang a cache on.
       So the shape is tabulated once, at page load, over a grid of day lengths
       by minute of the day, and read back with a bilinear interpolation. The
       simulation steps on whole minutes, so the time axis is hit exactly at
       every step it ever takes and only the day-length axis interpolates.
       Each row is normalised to mean 0 and peak-to-peak 1, which is what makes
       the two Transformer-tab inputs mean exactly what they say: the yearly
       average stays the daily mean and the day/night swing stays the daily
       peak-to-peak, whatever the shape does in between. */
    var PL_DL_LO = 5, PL_DL_HI = 19.5, PL_DL_STEP = 0.25;
    var PL_DL_N = Math.round((PL_DL_HI - PL_DL_LO) / PL_DL_STEP) + 1;
    var PL_TIME_N = 1440;

    var PL_TAB = (function () {
      var tab = new Float32Array(PL_DL_N * PL_TIME_N);
      var row = new Float64Array(PL_TIME_N);
      var r, i, dayLen, harm, sum, mn, mx, span, v;
      for (r = 0; r < PL_DL_N; r++) {
        dayLen = PL_DL_LO + r * PL_DL_STEP;
        harm = plHarmonics(plShapeFactory(dayLen, PL_A, PL_B), PL_SIGMA_H);
        sum = 0; mn = Infinity; mx = -Infinity;
        for (i = 0; i < PL_TIME_N; i++) {
          v = plHarmonicValue(harm, 24 * i / PL_TIME_N);
          row[i] = v; sum += v;
          if (v < mn) mn = v;
          if (v > mx) mx = v;
        }
        sum /= PL_TIME_N;
        span = mx - mn;
        if (!(span > 1e-12)) span = 1;
        for (i = 0; i < PL_TIME_N; i++) tab[r * PL_TIME_N + i] = (row[i] - sum) / span;
      }
      return tab;
    })();

    function plTableAt(dayLen, m) {
      var x = (dayLen - PL_DL_LO) / PL_DL_STEP;
      if (x < 0) x = 0;
      if (x > PL_DL_N - 1) x = PL_DL_N - 1;
      var r = Math.floor(x), fr = x - r;
      if (r >= PL_DL_N - 1) { r = PL_DL_N - 2; fr = 1; }
      var u = m / 24 * PL_TIME_N;
      var c0 = Math.floor(u), fc = u - c0;
      c0 = ((c0 % PL_TIME_N) + PL_TIME_N) % PL_TIME_N;
      var c1 = c0 + 1 === PL_TIME_N ? 0 : c0 + 1;
      var o0 = r * PL_TIME_N, o1 = o0 + PL_TIME_N;
      var v0 = PL_TAB[o0 + c0] + (PL_TAB[o0 + c1] - PL_TAB[o0 + c0]) * fc;
      var v1 = PL_TAB[o1 + c0] + (PL_TAB[o1 + c1] - PL_TAB[o1 + c0]) * fc;
      return v0 + (v1 - v0) * fr;
    }

    /* Zero-mean, unit peak-to-peak diurnal shape at a clock hour. Sunrise is
       taken symmetric about noon: the demo has no longitude and no equation of
       time, and neither changes the shape, only the clock it is drawn on. */
    function plShapeZ(dayLen, hour) {
      var t0 = 12 - 0.5 * dayLen + PL_C;   // clock time of the daily minimum
      var m = hour - t0;
      m -= 24 * Math.floor(m / 24);
      return plTableAt(dayLen, m);
    }

    /* ── Day length ───────────────────────────────────────────────────────
       Declination after Cooper (1969), sunrise hour angle from the standard
       geometry, tabulated once per latitude because the compressed year sweeps
       the seasons continuously and would otherwise call acos on every step. */
    var DEFAULT_LAT = 45;
    var DAYLEN_CACHE = {};

    function dayLengthTable(latDeg) {
      var key = latDeg.toFixed(2);
      if (DAYLEN_CACHE[key]) return DAYLEN_CACHE[key];
      var t = new Float64Array(367);
      var tanPhi = Math.tan(latDeg * Math.PI / 180);
      var i, dec, cosW;
      for (i = 0; i <= 366; i++) {
        dec = 23.45 * Math.PI / 180 * Math.sin(TWO_PI * (284 + i) / 365);
        cosW = -tanPhi * Math.tan(dec);
        /* Polar day and polar night: clamp rather than produce a NaN. The
           shape table is clamped to its own range on top of that. */
        if (cosW < -1) cosW = -1;
        if (cosW > 1) cosW = 1;
        t[i] = 2 * Math.acos(cosW) * 24 / TWO_PI;
      }
      DAYLEN_CACHE[key] = t;
      return t;
    }

    function dayLengthAt(doy, latDeg) {
      var t = dayLengthTable(latDeg == null ? DEFAULT_LAT : latDeg);
      var d = doy - 365 * Math.floor(doy / 365);
      var i = Math.floor(d), f = d - i;
      return t[i] + (t[i + 1] - t[i]) * f;
    }

    /* The two drivers split into a seasonal clock and a diurnal clock. In the
       real year both are the same minute count; the compressed year of the live
       view runs the season slowly and the day fast, so it needs them apart.
       Keeping the split in the core means the compressed year is built from the
       same expressions as the real one instead of a second copy.
         tSeason  minutes into the year, drives the yearly cosines
         tDay     minutes into the day, drives the diurnal cosines
         tFast    minutes on the real clock, drives the minute-scale terms
       offset shifts the whole ambient series, which is how a warmer site is
       modelled. */
    function ambientSplit(tSeason, tDay, sc, offset) {
      var a = sc.ambient;
      var mean = a.mean + (offset || 0)
        + a.yearAmp * Math.cos(TWO_PI * (tSeason - a.yearPeak) / YEAR_MIN);
      /* Seasonal part: still the yearly cosine. Diurnal part: the Parton and
         Logan shape above, whose day length comes from the site latitude and
         the day of the year, so summer days are long and flat-topped and
         winter days are short and steep. The shape carries mean 0 and
         peak-to-peak 1, so dayAmp stays the half swing it always was. */
      var dayLen = dayLengthAt(tSeason / DAY_MIN, a.lat);
      var hour = (tDay - DAY_MIN * Math.floor(tDay / DAY_MIN)) / 60;
      return mean + 2 * a.dayAmp * plShapeZ(dayLen, hour);
    }

    /* Load factor K in per unit of rated current. Clamped to a range a real
       feeder could plausibly sit in. */
    function loadSplit(tSeason, tDay, tFast, sc) {
      var l = sc.load;
      var K = l.base
        + l.dayAmp * Math.cos(TWO_PI * (tDay - l.dayPeak) / DAY_MIN)
        + l.seasonAmp * Math.cos(TWO_PI * (tSeason - l.seasonPeak) / YEAR_MIN);
      if (l.fast) {
        var i;
        for (i = 0; i < l.fast.sin.length; i++) {
          K += l.fast.sin[i][1] * Math.sin(TWO_PI * tFast / l.fast.sin[i][0]);
        }
        K += l.fast.noiseAmp * valueNoise(tFast);
        K = Math.max(l.fast.min, Math.min(l.fast.max, K));
      }
      return Math.max(0.05, Math.min(1.5, K));
    }

    /* tMin is minutes since 1 January 00:00: one clock for all three. */
    function ambientAt(tMin, sc, offset) { return ambientSplit(tMin, tMin, sc, offset); }
    function loadAt(tMin, sc) { return loadSplit(tMin, tMin, tMin, sc); }

    /* ── Time on this page runs at one rate ───────────────────────────────
       ONE CLOCK. A displayed day is a day, the diurnal cycle takes a day, and
       the paper ages a day. Nothing here is compressed, and the time axis of
       every panel can be read as ordinary elapsed time.

       This page previously inherited a compressed year from the thermal twin:
       twenty displayed days swept a full season, so the moisture solver was
       advanced 18.25 minutes per displayed minute while the SUN was left on
       the real clock. That produces a picture with no consistent reading. A
       displayed day was one sunrise and eighteen days of diffusion at the same
       time, which is not a thing that can happen to a transformer, and a
       reader who tries to reconcile the daily ripple with the diffusion figure
       under the axis is right to conclude that one of them is lying.
       The compression is therefore gone rather than relabelled. What it cost
       is real and is accepted: the season no longer sweeps inside a demo, so
       the seasonal term is effectively a slow constant over any window anyone
       will watch, and the paper moves over hours to days rather than visibly
       per second. What is gained is that every number on the page means what
       it says.
       The comp* functions are kept as the interface the panels already call,
       with the compression set to one. DAYS_SHOWN = 365 makes compSeason the
       identity, so season and day phase advance on the same tDisp and the
       drivers stay periodic over a year exactly as before. */
    var DAYS_SHOWN = 365;
    var COMP_MIN = DAYS_SHOWN * DAY_MIN;

    function compSeason(tDisp) { return tDisp / COMP_MIN * YEAR_MIN; }
    function compAmbient(tDisp, sc, offset) {
      return ambientSplit(compSeason(tDisp), tDisp % DAY_MIN, sc, offset);
    }
    /* The fast term keeps the real clock: an arc furnace swings in real
       minutes, and the displayed day is a real day. */
    function compLoad(tDisp, sc) {
      return loadSplit(compSeason(tDisp), tDisp % DAY_MIN, tDisp, sc);
    }
    /* Day of the year the cursor is standing on, for the date label. */
    function compDayOfYear(tDisp) {
      return Math.max(0, Math.min(364, Math.floor(tDisp / COMP_MIN * 365)));
    }

    /* Load with a stage multiplier on top, clamped the same way loadSplit
       clamps: an emergency overload is still a load factor, not a licence to
       leave the range a feeder can sit in. */
    function compLoadK(tDisp, sc, kScale) {
      var K = compLoad(tDisp, sc);
      if (kScale && kScale !== 1) K = Math.max(0.05, Math.min(1.5, K * kScale));
      return K;
    }

    /* ── Periodic start state ─────────────────────────────────────────────
       Starting the year from the steady state at t0 leaves the tank
       out of step with its own drivers: the oil then spends the first days
       climbing to where it should have been, and when the strip chart wraps
       from the end of the year back to the start, top oil and hot spot jump by
       that same amount.
       The fix is a lead-in. The year is periodic in its drivers, so three days
       BEFORE t0 are the last three days of the same year: run them from the
       steady state and hand the resulting state to t0. Three days is about twenty oil time constants at tauO 210 min, which
       is far more than enough to forget the steady-state start. */
    var COMP_WARMUP = 3 * DAY_MIN;

    function params(over) {
      var P = {}, k;
      for (k in IEC) if (Object.prototype.hasOwnProperty.call(IEC, k)) P[k] = IEC[k];
      if (over) for (k in over) if (Object.prototype.hasOwnProperty.call(over, k)) P[k] = over[k];
      return P;
    }

    /* Steady state of the exponential solution: used for the initial condition
       and as the reference the difference equations must converge to. */
    function steadyState(K, thetaA, P) {
      P = P || IEC;
      var dThO = P.dThOr * Math.pow((1 + P.R * K * K) / (1 + P.R), P.x);
      var dThH = P.dThHr * Math.pow(K, P.y);
      return { thetaO: thetaA + dThO, thetaH: thetaA + dThO + dThH, dThO: dThO, dThH: dThH };
    }

    function initState(K, thetaA, P) {
      P = P || IEC;
      var ss = steadyState(K, thetaA, P);
      var h = Math.pow(K, P.y) * P.dThHr;
      var dThO = ss.dThO;
      /* Tank heaters hold a minimum oil temperature, modelled as a floor, no
         control dynamics. */
      if (P.oilFloor != null && thetaA + dThO < P.oilFloor) dThO = P.oilFloor - thetaA;
      /* Effective ambient starts on the actual ambient, so a constant-ambient
         run is in steady state from the first step. */
      return { dThO: dThO, dThH1: P.k21 * h, dThH2: (P.k21 - 1) * h, thetaAeff: thetaA };
    }

    /* One forward-Euler step of the three states. Fastest time constant is
       k22*tauW = 20 min, so dt <= 5 min keeps dt/tau <= 0.25 and the explicit
       step is stable and accurate enough; the arc-furnace scenario runs at
       dt = 1 min because its load moves faster than that anyway.
       Returns the same object, mutated, plus the two temperatures. */
    /* ── One RK2 step ─────────────────────────────────────────────────────
       Heun, that is the explicit trapezoid: a predictor at the end of the step
       and then the average of the two slopes. Second order in dt against the
       forward Euler this used to be, at the cost of one extra evaluation of
       the driving terms.
       Heun rather than midpoint on purpose. Every caller here has the drivers
       on a grid, and the end of a step IS the next stored sample, exactly; a
       midpoint rule would have to interpolate them, which puts a first-order
       error back into the very place the second-order rule was meant to
       remove. So the end-of-step load and ambient are passed in as Kn and
       thetaAn, and callers that genuinely have a constant driver may leave
       them out.
       All four states are of the form y' = (target(u) - y)/tau, so the
       predictor is written out per state rather than through a generic
       vector routine: this is the innermost loop of the whole page. */
    function stepThermal(st, K, thetaA, dtMin, P, Kn, thetaAn) {
      P = P || IEC;
      if (Kn == null) Kn = K;
      if (thetaAn == null) thetaAn = thetaA;

      var Ky = Math.pow(K, P.y), Kyn = Math.pow(Kn, P.y);
      var ssO = P.dThOr * Math.pow((1 + P.R * K * K) / (1 + P.R), P.x);
      var ssOn = P.dThOr * Math.pow((1 + P.R * Kn * Kn) / (1 + P.R), P.x);
      var h = dtMin, h2 = 0.5 * dtMin;
      var s1, s2, tgt, tgtn, tau;

      /* Effective ambient. IEC 60076-7 recommends weighting a varying ambient
         with the oil time constant rather than using the instantaneous value;
         modelled here as a first-order lag with tauAmb = tauO. Without it a
         step in the ambient series arrives in the top oil within one time step,
         which the tank cannot do. The DISPLAYED ambient stays the raw one. */
      if (st.thetaAeff == null) st.thetaAeff = thetaA;
      tau = P.tauO;
      s1 = (thetaA - st.thetaAeff) / tau;
      s2 = (thetaAn - (st.thetaAeff + h * s1)) / tau;
      st.thetaAeff += h2 * (s1 + s2);
      var aEff = st.thetaAeff;

      tau = P.k11 * P.tauO;
      s1 = (ssO - st.dThO) / tau;
      s2 = (ssOn - (st.dThO + h * s1)) / tau;
      st.dThO += h2 * (s1 + s2);

      tau = P.k22 * P.tauW;
      tgt = P.k21 * P.dThHr;
      s1 = (tgt * Ky - st.dThH1) / tau;
      s2 = (tgt * Kyn - (st.dThH1 + h * s1)) / tau;
      st.dThH1 += h2 * (s1 + s2);

      tau = P.tauO / P.k22;
      tgtn = (P.k21 - 1) * P.dThHr;
      s1 = (tgtn * Ky - st.dThH2) / tau;
      s2 = (tgtn * Kyn - (st.dThH2 + h * s1)) / tau;
      st.dThH2 += h2 * (s1 + s2);

      st.thetaO = aEff + st.dThO;
      /* Tank heaters hold a minimum oil temperature, modelled as a floor, no
         control dynamics. The state itself is clamped, so the oil sits on the
         floor instead of drifting below it and springing back. */
      if (P.oilFloor != null && st.thetaO < P.oilFloor) {
        st.dThO = P.oilFloor - aEff;
        st.thetaO = P.oilFloor;
      }
      st.thetaH = st.thetaO + st.dThH1 - st.dThH2;
      return st;
    }

    /* Effective parameter set from the UI knobs. The scales multiply the IEC
       constants, which is how a mis-parametrised twin is expressed here. */
    function effectiveParams(prm) {
      prm = prm || {};
      return params({
        dThOr: IEC.dThOr * (prm.dThOrScale == null ? 1 : prm.dThOrScale),
        tauO: IEC.tauO * (prm.tauOScale == null ? 1 : prm.tauOScale)
      });
    }

    /* Same, plus whatever the site adds to the model. Currently that is only
       the minimum oil temperature of the northern site. */
    function scenarioParams(sc, prm) {
      var P = effectiveParams(prm);
      if (sc && sc.oilFloor != null) P.oilFloor = sc.oilFloor;
      return P;
    }

    /* ── Cooling stages ───────────────────────────────────────────────────
       Three IEC 60076-7:2018 Table 4 parameter sets, selected by hand. There
       is no control loop here and no optimisation: a stage is a setting the
       operator changes, and the model shows what follows.

       ONAN is the base set above, fans off. ONAF1 and ONAF2 are the same unit
       with one and with two fan groups running: ONAF throughout, so all three
       stages share the ON oil-flow column of Table 4 (k11 0.5, k21 2.0,
       k22 2.0, x 0.8) and differ only in how much heat the radiators shed.

       This replaces an earlier ONAN/ONAF/OFAF triple. OFAF is not a third fan
       step of the same machine, it is a different cooling circuit with pumps,
       so offering it as the next notch on one switch said something untrue
       about the unit being shown. Two fan groups is what an ONAN/ONAF/ONAF
       nameplate actually means.

       ONAF1 is the Table 4 based set taken unchanged from the sibling page,
       with a dual-rating derivation for R, dThOr and dThHr so that the load
       factor K keeps meaning ONAN per unit across a stage change. ONAF2 adds
       the second fan group: more radiator surface in circulation, so the rated
       top-oil rise drops again and the oil time constant falls with it, while
       the winding-to-oil gradient dThHr is untouched because fans do not
       change how heat leaves the copper. [design] for the step size between
       the two fan stages, [table] for the shape of the column they share. */
    var ONAF1 = {
      k11: 0.5, k21: 2.0, k22: 2.0,
      tauO: 150, tauW: 7,
      x: 0.8, y: 1.3,
      R: 6.4,
      dThOr: 32.8,
      dThHr: 19.4
    };

    var ONAF2 = {
      k11: 0.5, k21: 2.0, k22: 2.0,
      tauO: 125, tauW: 7,
      x: 0.8, y: 1.3,
      R: 6.4,
      dThOr: 27.5,
      dThHr: 19.4
    };

    /* Top-to-bottom oil temperature difference, as a FRACTION of the top-oil
       rise over ambient. [design]

       This used to be a fixed number of kelvin per cooling stage, and that was
       wrong in a way that showed. A constant 25 K spread survives a night at
       low load, when the whole top-oil rise is 12 K: the model then put the
       bottom of the tank well below the air around it, which no transformer
       does. The spread is not a property of the tank, it is a consequence of
       how much heat is flowing through it, and it collapses with the load.

       So the control is a fraction: bottom oil sits a fixed share of the way
       from the top oil back down to ambient, and the axial spread follows the
       operating point by itself. At rated load on ONAN the top-oil rise is
       about 45 K, so 0.25 gives roughly 11 K bottom to top, in the range
       reported for natural circulation; at a quarter of that load the rise is
       a few kelvin and so is the spread, which is the behaviour the fixed
       number could not produce.

       The ORDERING across the stages is the standard and physical one, natural
       circulation being the steepest and forced fans flattening it, and it is
       the ordering that carries the demonstration. The magnitudes are
       engineering estimates for a plausible unit, and the fraction is exposed
       as a control so a reader who prefers other values can set them and watch
       the conclusion hold or fail. */
    var GRAD_F = { onan: 0.25, onaf1: 0.19, onaf2: 0.15 };

    /* The spread in kelvin at a given operating point. Floored at zero rather
       than allowed to go negative: the driving rise is positive whenever the
       unit is loaded, but the oil floor of the cold scenarios can push the top
       oil above a steady state that the ambient is already above, and a
       negative spread would draw the tank upside down. */
    function gradKelvin(frac, thetaO, thetaA) {
      var rise = thetaO - thetaA;
      return rise > 0 ? frac * rise : 0;
    }

    var STAGES = [
      { id: 'onan', base: null },
      { id: 'onaf1', base: ONAF1 },
      { id: 'onaf2', base: ONAF2 }
    ];

    function stageById(id) {
      for (var i = 0; i < STAGES.length; i++) if (STAGES[i].id === id) return STAGES[i];
      return STAGES[0];
    }

    /* Parameter set for a stage, with the same override semantics as params.
       The ONAN stage falls through to the IEC table at the top of the file so
       there is one copy of those numbers, not two. */
    function paramsStage(stage, over) {
      var st = stageById(stage), P = {}, k;
      var src = st.base || IEC;
      for (k in src) if (Object.prototype.hasOwnProperty.call(src, k)) P[k] = src[k];
      if (over) for (k in over) if (Object.prototype.hasOwnProperty.call(over, k)) P[k] = over[k];
      return P;
    }

    /* Same, plus whatever the site adds. Mirrors scenarioParams. */
    function stageParams(stage, sc, prm) {
      prm = prm || {};
      var P = paramsStage(stage, {});
      P.dThOr = P.dThOr * (prm.dThOrScale == null ? 1 : prm.dThOrScale);
      P.tauO = P.tauO * (prm.tauOScale == null ? 1 : prm.tauOScale);
      if (sc && sc.oilFloor != null) P.oilFloor = sc.oilFloor;
      return P;
    }

    function gradOf(stage, over) {
      if (over != null) return over;
      return GRAD_F[stage] == null ? GRAD_F.onan : GRAD_F[stage];
    }

    /* ── Water: oil, paper, and the curve that couples them ───────────────
       PROVENANCE OF THE CONSTANTS IN THIS BLOCK.
       Everything from here to the end of the grid section is the physics this
       page adds on top of the thermal model above, and it is the part whose
       numbers a reader should be able to check. They are gathered here, in one
       block, with a confidence marker each:

         [table]  a tabulated value from a standard, transcribed
         [fit]    a published functional form whose constants are reproduced
         [tuned]  a value chosen so the model behaves like reported practice
         [design] a geometry or size chosen for a plausible example unit

       A [tuned] or [design] number is not a measurement and the Model tab says
       so in as many words. Nothing here is specific to any real transformer. */

    /* Water solubility of mineral oil, ppm (mg water per kg oil), over
       temperature in C. [fit]
       Base 10 matters: the natural-log form of this relation carries different
       constants, and mixing them is wrong by about a decade.
       Anchors this produces: 53 ppm at 20 C, 255 at 60 C, 491 at 80 C. */
    var SOL_A = 7.42;
    var SOL_B = 1670;
    function oilSat(thetaC) {
      return Math.pow(10, SOL_A - SOL_B / (thetaC + 273.15));
    }

    /* Equilibrium isotherm, paper moisture against RELATIVE SATURATION of the
       oil rather than against ppm. [fit]
       Relative saturation is the coupling variable on purpose: expressed this
       way the isotherm is only weakly temperature dependent, so one curve
       covers the whole operating range, and all of the temperature dependence
       of the paper/oil split is carried by oilSat above. That split is the
       first thing this page is about: the ppm a monitor reads says nothing
       about the paper until it is divided by the solubility at the local
       temperature.
       Wp in percent of dry paper mass, rs dimensionless in (0, 1]. */
    var ISO_A = 9.091;
    var ISO_B = 0.7610;
    function paperFromRS(rs) {
      return ISO_A * Math.pow(Math.max(1e-12, rs), ISO_B);
    }
    function rsFromPaper(wp) {
      return Math.pow(Math.max(1e-12, wp) / ISO_A, 1 / ISO_B);
    }
    /* The two directions of the headline statement, in one call each. */
    function paperFromPpm(ppm, thetaC) {
      return paperFromRS(ppm / oilSat(thetaC));
    }
    function ppmFromPaper(wp, thetaC) {
      return rsFromPaper(wp) * oilSat(thetaC);
    }

    /* Moisture diffusivity in kraft paper, m2/s. [fit]
       D = D0 exp(k C) exp(Ea/R/T0 - Ea/R/T), concentration C in percent and
       temperature in C. Strongly dependent on both, which is the reason the
       radial equilibration time runs from days at operating temperature to
       months on a cold tank.
       The reference temperature is written out rather than folded into D0:
       published parameter sets differ in that convention and folding it in is
       how the two get mixed. */
    var DIF_D0 = 1.34e-13;
    var DIF_K = 0.5;
    /* 8074, not 8140: the two published Foss sets must not be crossed. The
       oil-impregnated pair is D0 = 1.34e-13 with Ea/R = 8074, the dry-paper
       pair is D0 = 2.62e-13 with Ea/R = 8140. This page models impregnated
       kraft, so it takes the impregnated pair whole. The mix was worth under
       4% in D over the operating range, so it never showed; it was wrong
       about where the numbers come from, which is what this page trades on. */
    var DIF_EAR = 8074;
    var DIF_T0 = 298;
    function diffusivity(wp, thetaC) {
      return DIF_D0 * Math.exp(DIF_K * wp) *
        Math.exp(DIF_EAR / DIF_T0 - DIF_EAR / (thetaC + 273.15));
    }

    /* Half-thickness of the insulation slab, m. [design]
       Zero flux at the copper face, oil at the other, so this is a half
       thickness and not a full winding build. 2 mm puts the slowest radial
       mode 4L^2/(pi^2 D) at about 3.7 d at 60 C and 104 d at 20 C, which is
       the range reported for drying and re-wetting of real windings. At 1 mm
       the paper follows the oil almost immediately and at 4 mm nothing moves
       inside a year. */
    var L_PAPER = 2.0e-3;

    /* Mass transfer coefficient at the paper/oil face, m/s. [tuned]
       The outer boundary is a Robin condition, flux = h (Ceq - Csurface), not
       an equilibrium one. With equilibrium imposed on the surface the outermost
       cell tracks the oil within minutes and no interfacial resistance is left;
       a real surface has a fluid film, and an aged one has a barrier layer.
       This value is chosen, not measured. It sets how fast the oil recovers
       after a treatment, so it is exposed as a control rather than buried:
       the Biot number h L / D is about 67 at 20 C and 2.5 at 60 C, i.e. the
       interior stays diffusion limited at operating temperature, which is the
       regime the model is meant to be in.
       Not comparable to the film coefficients quoted for forced-flow rigs
       (order 1e-6 to 1e-5 m/s, from a Nernst layer in moving oil). Those put
       the Biot number in the hundreds or thousands, which is the same as
       imposing equilibrium on the surface: the interfacial resistance this
       control exists to show would disappear. */
    var H_FILM = 1e-8;

    /* Masses of the example unit, kg. [design]
       A medium power transformer, at about 10:1 oil to solid, which is the
       ratio reported for real units of this size. The RATIO is what the page
       turns on: about 37 kg of water in the solid insulation at 2.5% against
       about 0.45 kg in the oil at 30 ppm, so the oil is a small buffer hanging
       off a large reservoir, and that is why drying the oil does so little. */
    var M_OIL = 15000;
    var M_PAPER = 1500;

    /* ── The grid ─────────────────────────────────────────────────────────
       Radial: the insulation slab, cell 0 at the copper, cell N_R-1 at the oil.
       Axial: winding levels, 0 at the bottom of the tank, N_A-1 at the top.

       The two directions are not the same kind of thing, which is why they do
       not get the same resolution. Radially there is a diffusion equation and
       the cells are degrees of freedom of a boundary value problem, with the
       gradient sitting in a thin layer at the oil face. Axially there is no
       coupling between levels at all: each level is an independent column
       driven by its own oil temperature, so the levels are sampling points on
       a smooth monotone ramp.
       So radial resolution buys accuracy and axial resolution buys only a
       finer reading of a known curve. N_R = 16 holds the radial span to about
       5% of a 64-cell reference; at 8 cells it is understated by 15% and at 4
       by nearly 40%, and that span is the smaller of the two signals on the
       map, so coarsening it would flatter the picture in the one place where
       the picture should not be flattered.
       N_A = 6 is a legibility limit, not a numerical one. */
    var N_R = 16;
    var N_A = 6;
    var N_CELL = N_R * N_A;
    var DX = L_PAPER / N_R;
    var M_CELL = M_PAPER / N_CELL;

    /* Shown columns. Sixteen columns at a readable cell gap is finer than a
       projector resolves, so pairs of computed cells are averaged for the
       display. The computation stays on N_R and so does the span readout:
       averaging narrows a range, and the number next to the map should be the
       one the model produced. */
    var N_R_SHOW = 8;

    /* Upper bound on one diffusion sub-step, minutes.
       The paper is solved implicitly and is unconditionally stable, but the oil
       balance is advanced explicitly from the summed flux, and THAT coupling is
       what limits the step.

       The binding case is a COLD tank, not a hot one, which is the opposite of
       the usual intuition about explicit schemes. What matters here is the
       capacity ratio between the paper and the oil, and that ratio grows as the
       tank cools because the isotherm steepens: about 12:1 at 90 C but 150:1 at
       20 C. With a large step the paper can therefore ask the oil for more
       water than the oil contains, and the ppm shoots through zero.
       Measured against a one-minute reference over a full compressed run: at
       62 C every bound up to 180 min is exact, but at 32 C the oil goes
       NEGATIVE from 60 min upward. 30 min agrees with the reference to the
       printed digits at both temperatures.
       Callers pass whatever step the view implies and this splits it. */
    var DT_MAX_EFF = 30;

    /* Physical floor on the oil reading. Not zero: a monitor never reads zero
       and a vanishing denominator would make relative saturation meaningless
       for the panel that displays it. */
    var PPM_FLOOR = 0.5;

    /* Index of radial cell i at axial level j. */
    function gi(j, i) { return j * N_R + i; }

    /* Oil temperature at axial level j. Linear in winding height between the
       bottom oil and the top oil; thetaO from the thermal model is the top oil,
       gradK the top-to-bottom difference. */
    function levelTemp(thetaO, gradK, j) {
      return thetaO - gradK * (1 - j / (N_A - 1));
    }

    /* Moisture state. Mutated in place, same discipline as stepThermal.
       The Thomas scratch vectors live on the state so a step allocates
       nothing: this runs N_A solves per substep and several substeps per
       frame. */
    function initMoisture(wp0, ppm0) {
      var ms = {
        C: new Float64Array(N_CELL),
        ppm: ppm0,
        treat: null,
        _a: new Float64Array(N_R),
        _b: new Float64Array(N_R),
        _c: new Float64Array(N_R),
        _d: new Float64Array(N_R),
        _x: new Float64Array(N_R)
      };
      for (var k = 0; k < N_CELL; k++) ms.C[k] = wp0;
      return ms;
    }

    /* One implicit step of one axial column, backward Euler in time and finite
       volume in space, solved by the Thomas algorithm.
       Inner face (i = 0): zero flux at the copper, so the west coefficient is
       dropped rather than set to a value.
       Outer face (i = N_R-1): flux = h (Ceq - C), so the east coefficient is
       replaced by the film term and Ceq enters the right hand side.
       Returns the water that LEFT this column, in kg. The caller turns the sum
       over columns into a change in oil ppm; keeping the accounting here, as an
       explicit sum of cell changes, is what makes the mass balance exact
       instead of nearly exact. */
    function columnStep(ms, j, thetaC, Ceq, dtSec) {
      var a = ms._a, b = ms._b, c = ms._c, d = ms._d, x = ms._x, C = ms.C;
      var o = j * N_R, i, w, e, Dw, De, m;
      var f = dtSec / (DX * DX);

      for (i = 0; i < N_R; i++) {
        Dw = i > 0 ? diffusivity(0.5 * (C[o + i] + C[o + i - 1]), thetaC) : 0;
        De = i < N_R - 1 ? diffusivity(0.5 * (C[o + i] + C[o + i + 1]), thetaC) : 0;
        w = i > 0 ? Dw * f : 0;
        e = i < N_R - 1 ? De * f : 0;
        a[i] = -w;
        c[i] = -e;
        b[i] = 1 + w + e;
        d[i] = C[o + i];
        if (i === N_R - 1) {
          var g = H_FILM * dtSec / DX;
          b[i] += g;
          d[i] += g * Ceq;
        }
      }

      for (i = 1; i < N_R; i++) {
        m = a[i] / b[i - 1];
        b[i] -= m * c[i - 1];
        d[i] -= m * d[i - 1];
      }
      x[N_R - 1] = d[N_R - 1] / b[N_R - 1];
      for (i = N_R - 2; i >= 0; i--) x[i] = (d[i] - c[i] * x[i + 1]) / b[i];

      var out = 0;
      for (i = 0; i < N_R; i++) {
        out += (C[o + i] - x[i]) * 0.01 * M_CELL;
        C[o + i] = x[i];
      }
      return out;
    }

    /* Advance the whole grid and the oil by dtMin minutes of DIFFUSION time,
       splitting into substeps no longer than DT_MAX_EFF.
       The oil is one well-mixed reservoir in ppm. Oil TEMPERATURE is
       stratified, oil WATER is not: a monitor samples one point and the oil
       turns over in minutes while the paper moves over days, so a single ppm
       is the honest simplification. It also makes the water balance a one-line
       identity, which the self-test leans on. */
    function stepMoisture(ms, thetaO, gradK, dtMin) {
      var rem = dtMin, sub, dtSec, flux, j, T, Ceq, dPpm;
      while (rem > 1e-9) {
        sub = rem < DT_MAX_EFF ? rem : DT_MAX_EFF;
        rem -= sub;
        dtSec = sub * 60;
        flux = 0;
        for (j = 0; j < N_A; j++) {
          T = levelTemp(thetaO, gradK, j);
          Ceq = paperFromRS(ms.ppm / oilSat(T));
          flux += columnStep(ms, j, T, Ceq, dtSec);
        }
        /* Water only moves here, it is never created, so the balance is exact

          for (i = nr - 2; i >= 0; i--) x[i] = (d[i] - c[i] * x[i + 1]) / b[i];
          fl = 0;
          for (i = 0; i < nr; i++) {

            cc[i] = x[i];
          }
          ppm += fl / C.M_OIL * 1e6;
        }
        lo = Infinity;
        hi = -Infinity;
        for (i = 0; i < nr; i++) {
          if (cc[i] < lo) lo = cc[i];
          if (cc[i] > hi) hi = cc[i];

        return hi - lo;
      }
      var ship = spreadAt(C.N_R), ref = spreadAt(64), err = Math.abs(ship - ref) / ref;
      pass('the shipped radial resolution holds the radial spread to the fine grid',
        err < 0.08, C.N_R + ' cells give ' + ship.toFixed(4) + ' pp against ' +
        ref.toFixed(4) + ' at 64 cells, ' + (100 * err).toFixed(1) + ' percent low');
    })();

    /* Step splitting: a long call must behave like the substeps it decomposes
       into, and those must track a much finer reference. The bound exists
       because past it the explicit oil balance goes quietly wrong. */
    (function () {
      var A = C.initMoisture(2.5, 30), B = C.initMoisture(2.5, 30), k, worst;
      var D, E, i, rel;
      C.equilibrate(A, 70, GRAD);
      C.equilibrate(B, 70, GRAD);
      C.stepMoisture(A, 70, GRAD, 5 * C.DT_MAX_EFF);
      for (k = 0; k < 5; k++) C.stepMoisture(B, 70, GRAD, C.DT_MAX_EFF);
      worst = Math.abs(A.ppm - B.ppm);
      for (k = 0; k < C.N_CELL; k++) worst = Math.max(worst, Math.abs(A.C[k] - B.C[k]));
      pass('a long call splits internally into bounded substeps',
        worst < 1e-12, 'largest difference ' + worst.toExponential(1));

      /* Started well away from equilibrium on purpose: comparing two step
         sizes on a state that is already settled compares nothing. */
      D = C.initMoisture(2.5, 30);
      E = C.initMoisture(2.5, 30);
      C.equilibrate(D, 70, GRAD);
      C.equilibrate(E, 70, GRAD);
      D.ppm = 3;
      E.ppm = 3;
      C.stepMoisture(D, 70, GRAD, 1440);
      for (i = 0; i < 288; i++) C.stepMoisture(E, 70, GRAD, 5);
      rel = Math.abs(D.ppm - E.ppm) / E.ppm;
      pass('the bounded step tracks a five-minute reference over a day',
        rel < 0.01, 'ppm ' + D.ppm.toFixed(3) + ' against ' + E.ppm.toFixed(3) +
        ', ' + (100 * rel).toFixed(2) + ' percent apart');
    })();

    /* Water is conserved. This is the assertion the whole accounting structure
       exists to satisfy: cell changes are summed explicitly and converted to
       ppm, rather than oil and paper being solved independently. */
    (function () {
      var ms = C.initMoisture(2.5, 20), s, thO, w0, drift;
      C.equilibrate(ms, 60, GRAD);
      w0 = C.totalWater(ms);
      for (s = 0; s < 20000; s++) {
        thO = 60 + 20 * Math.sin(2 * Math.PI * s / 700);
        C.stepMoisture(ms, thO, GRAD, 10);
      }
      drift = Math.abs(C.totalWater(ms) - w0) / w0;
      pass('total water is conserved to machine precision over a long swinging run',
        drift < 1e-10, 'drift ' + drift.toExponential(1) + ' over 20000 steps, ' +
        w0.toFixed(2) + ' kg in the system');
    })();

    (function () {
      var ms = settled('onan'), w0 = C.totalWater(ms), w1, booked, err;
      C.startTreatment(ms, 6);
      while (C.treatmentActive(ms)) C.stepTreatment(ms, 62, GRAD, 5);
      w1 = C.totalWater(ms);
      booked = ms.treat.removed;
      err = Math.abs((w0 - w1) - booked);
      pass('what the plant books as removed is what left the system',
        err < 1e-10, 'removed ' + booked.toFixed(4) + ' kg, balance error ' +
        err.toExponential(1) + ' kg');
    })();

    (function () {

      C.equilibrate(ms, 55, GRAD);
      for (s = 0; s < 6000; s++) C.stepMoisture(ms, 55, GRAD, C.DT_MAX_EFF);
      sp = C.gridSpans(ms);
      pass('a held temperature flattens the radial profile completely',
        sp.radial < 1e-6, 'radial spread ' + sp.radial.toExponential(1) +
        ' pp, axial ' + sp.axial.toFixed(3) + ' pp');

      ref = C.initMoisture(1, ms.ppm);
      C.equilibrate(ref, 55, GRAD);
      for (k = 0; k < C.N_CELL; k++) worst = Math.max(worst, Math.abs(ref.C[k] - ms.C[k]));
      pass('the solver converges to the analytic equilibrium',
        worst < 1e-6, 'largest cell difference ' + worst.toExponential(1) + ' pp');
    })();

    /* The axial profile, and what the cooling stage does to it. */
    (function () {
      var ms = settled('onan'), ax = new Float64Array(C.N_A), sp = C.gridSpans(ms);
      var hs, a, b;
      C.axialProfile(ms, ax);
      pass('the bottom of the winding is wetter than the top',
        ax[0] > ax[C.N_A - 1] && sp.axial > 0.8 && sp.axial < 2.5,
        'bottom ' + ax[0].toFixed(2) + ' percent, top ' + ax[C.N_A - 1].toFixed(2) +
        ' percent, spread ' + sp.axial.toFixed(2) + ' pp');

      hs = C.paperHotspot(ms);
      pass('the wettest paper is at the coldest level, not the hottest',
        hs.j === 0, 'wettest cell at level ' + hs.j + ' of ' + (C.N_A - 1) +
        ' carrying ' + hs.wp.toFixed(2) + ' percent');

      a = C.gridSpans(settled('onan')).axial;
      b = C.gridSpans(settled('onaf2')).axial;
      pass('running the fans flattens the moisture profile',
        a > b * 1.2, 'ONAN spreads ' + a.toFixed(2) + ' pp against ' + b.toFixed(2) +
        ' pp on ONAF2');

    (function () {
      var res = [], i, hrs, ms, ppm0, w0, p0, t, ppmEnd, pEnd, rem, lowest;
      var allBack = true, allPaper = true;
      for (i = 0; i < 3; i++) {
        hrs = [12, 24, 48][i];
        ms = settled('onan');
        ppm0 = ms.ppm;
        w0 = C.totalWater(ms);
        p0 = C.paperMean(ms);
        t = 0;
        lowest = Infinity;
        C.startTreatment(ms, hrs);
        while (C.treatmentActive(ms)) {
          C.stepTreatment(ms, 62, GRAD, 5);
          if (ms.ppm < lowest) lowest = ms.ppm;
        }
        ppmEnd = ms.ppm;
        pEnd = C.paperMean(ms);
        rem = ms.treat.removed;
        while (t < 1440) {

          hrs: hrs, ppm0: ppm0, ppmEnd: ppmEnd, ppm1d: ms.ppm,
          dPaper: pEnd - p0, rem: rem, frac: rem / w0,
          lowest: lowest, tau: C.TREAT_TAU
        });
      }
      for (i = 0; i < res.length; i++) {

        }).join(', '));

         water. It must, or the plant is being modelled as weaker the longer it
         is left on, which is what an earlier version did by deriving the time
         constant from the requested duration. */
      pass('a longer treatment removes more water than a shorter one',
        res[1].rem > res[0].rem && res[2].rem > res[1].rem,
        res.map(function (r) {
          return r.hrs + 'h: ' + r.rem.toFixed(2) + ' kg, ' +

      /* And the plant pulls at a rate that is a property of the plant, not of

      /* The clock and the physics must advance together across the moment the

         the end of every treatment: stepTreatment clamped its own dt to the

         step, so state and time came apart by up to one step exactly once per
         run.

<!doctype html>
<html lang="en" data-theme="dark" data-skin="grey" data-theme-live>
<head>
  <meta charset="utf-8">
  <script>(function(){var d='grey',P={light:'light',dark:'dark',grey:'dark'},k=function(v){return typeof P[v]=='string'},e=document.documentElement,t=new URLSearchParams(location.search).get('theme');if(k(t)){try{localStorage.setItem('theme',t)}catch(x){}}else{try{t=localStorage.getItem('theme')}catch(x){}}if(!k(t))t=d;e.dataset.skin=t;e.dataset.theme=P[t];e.dataset.themeDefault=d;e.style.colorScheme=P[t];})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thermal mini-twin, IEC 60076-7</title>
  <meta name="description" content="A year of top-oil and hot-spot temperature from a load profile, and what the uncertainty in it does to insulation ageing.">
  <link rel="stylesheet" href="assets/css/pico.min.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <!-- Favicon: the bare triangle on a transparent ground, no plate behind it.
       A single fixed stroke colour would vanish against one of the two tab
       bars, so the SVG carries its own prefers-color-scheme rule: dark ink on
       a light tab bar, white on a dark one. Same mark on all three pages. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cstyle%3Epath%7Bstroke:%231b1e23%7D@media(prefers-color-scheme:dark)%7Bpath%7Bstroke:%23fff%7D%7D%3C/style%3E%3Cpath%20d='M16%205%2028%2027H4Z'%20fill='none'%20stroke-width='2.5'%20stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    /* Same sizing pattern as the Duval page: one width for the whole page, so
       the header row and the columns below it share an edge. Wider than the
       triangle page because a year of temperature is a wide plot. */
    html { --th-w: 1240px; }
    .th-wrap { width: 100%; max-width: var(--th-w); margin: 0 auto; padding: 0 0 16px; }
    body > header.tw-head {
      width: 100%; max-width: var(--th-w); margin-inline: auto;
      padding: 10px 0 0; font-size: 1.3rem;
    }
    body > header.tw-head h1 { font-size: 1.3rem; color: var(--tool-emph); }
    /* Breadcrumb back to the overview: quieter than the page title, so the
       title still reads as the title. */
    .th-crumb { color: var(--tool-note); text-decoration: none; background: none; }
    .th-crumb:hover, .th-crumb:focus-visible { color: var(--pico-primary); text-decoration: underline; }
    .th-sep { color: var(--tool-faint); margin: 0 0.42em; font-weight: 400; }
    .th-note { margin: 0; font-size: 12px; color: var(--tool-note); }

    /* Tabs: the house pattern for choosing a VIEW, as opposed to .lang-seg,
       which chooses a SETTING. The distinction is the point: as a segmented
       control the tab switch would look exactly like the half dozen settings
       under it. Underlined tabs say "these are the sections" instead.
       The strip carries the baseline and the active tab overpaints it thicker,
       so the underline must sit ON the strip's line, hence the negative bottom
       margin on the buttons. */
    .tabstrip {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--tool-hairline);
      /* A line of air under the strip, for every tab at once. Each tab keeps
         its own margin on top of this for whatever else it needs; putting the
         common part here is what stops the four from drifting apart. */
      margin-bottom: 20px;
    }
    .tabstrip > button {
      margin: 0 0 -1px;
      padding: 4px 2px 6px;
      width: auto;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.3;
      color: var(--tool-label);
      cursor: pointer;
    }
    /* Pico redefines colour and border on button:is(:hover,:active,:focus);
       both have to be taken back explicitly or the tab grows a blue box. */
    .tabstrip > button:hover:not(.active),
    .tabstrip > button:focus:not(.active) {
      background: transparent;
      border-color: transparent;
      border-bottom-color: var(--tool-hairline);
      color: var(--tool-emph);
    }
    .tabstrip > button.active,
    .tabstrip > button.active:hover,
    .tabstrip > button.active:focus {
      background: transparent;
      color: var(--pico-primary);
      border-bottom-color: var(--pico-primary);
      font-weight: 600;
    }
    .tabstrip > button:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Row 1: the stage controls of the current tab. One line, no wrapping.
       Not a height budget, a reading one: wrapped, the transport, the sliders
       and the stage buttons stop reading as one control row. */
    .th-row1 {
      display: flex; align-items: center; justify-content: space-between;
      gap: 18px; height: 44px;
    }
    .th-segs { display: flex; align-items: center; }
    /* Which site the numbers on this tab belong to, quiet on purpose: the
       presenter should never have to switch tabs to find out. */
    .th-which { font-size: 13px; color: var(--tool-note); white-space: nowrap; }
    .th-which b { color: var(--tool-label); font-weight: 600; }
    /* One slider plus its label, inline in the control row. The track may give
       way when the row gets tight: shrinking a slider is the only thing on that
       row that costs nothing to read. */
    .th-ctl { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--tool-label); min-width: 0; }
    .th-ctl input[type="range"] { width: 108px; min-width: 60px; margin: 0; flex: 0 1 auto; }
    .th-ctl .th-ctlval {
      color: var(--tool-emph); font-variant-numeric: tabular-nums;
      min-width: 42px; text-align: right;
    }
    /* The shared segmented control is sized for body text; on a beamer it needs
       to be readable from the back of the room. */
    .th-seg { font-size: 14px; padding: 5px 12px; line-height: 1.5; }
    .th-transport { display: flex; align-items: center; gap: 12px; }
    .th-play {
      width: auto; min-width: 82px; margin: 0; padding: 5px 14px;
      font-size: 14px; line-height: 1.5;
    }
    /* The plot is a wide strip, not a card, and now that "now" is pinned to the
       right-hand edge there is nothing on it to click. */
    .th-stage { cursor: default; }

    /* One line under the strip chart: what the colours are, and what they read
       at the right-hand edge. Quiet and fixed-width, so it does not jitter
       while the chart scrolls. */
    .th-legend {
      display: flex; align-items: center; gap: 18px;
      margin: 5px 2px 0; font-size: 13px; color: var(--tool-note);
      font-variant-numeric: tabular-nums;
    }
    .th-legend i {
      display: inline-block; width: 16px; height: 0;
      border-top: 2.5px solid currentColor; vertical-align: middle; margin-right: 6px;
    }
    .th-legend-note { margin-left: auto; color: var(--tool-faint); }
    .th-now { color: var(--tool-text); }
    .th-now b { color: var(--tool-emph); font-weight: 600; }

    .th-h2 {
      margin: 0 0 2px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.09em;
      text-transform: uppercase; color: var(--tool-note); line-height: 1.3;
    }
    /* Uppercasing a lowercase sigma turns it into a capital one, which is a
       different quantity. This part keeps its case. */
    .th-h2 .th-cased { text-transform: none; letter-spacing: 0.03em; }
    .th-hrow { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .th-hnote {
      font-size: 12px; color: var(--tool-faint); text-transform: none;
      letter-spacing: 0; font-variant-numeric: tabular-nums;
    }

    /* ── Model tab ───────────────────────────────────────────────────────
       A reading column, not a control surface: narrower than the page so
       the lines stay scannable, quiet headers in the .th-h2 voice. */
    .th-model { max-width: 780px; margin-top: 18px; }
    .th-model h3 {
      margin: 16px 0 3px; font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.09em; text-transform: uppercase; color: var(--tool-note);
    }
    .th-model h3:first-child { margin-top: 0; }
    .th-model p { margin: 0 0 6px; font-size: 15px; line-height: 1.55; color: var(--tool-text); }
    .th-model .th-src { margin-top: 14px; font-size: 12.5px; color: var(--tool-faint); }

    /* ── Transformer tab ─────────────────────────────────────────────────
       Two rows, two columns, placed explicitly rather than by auto-flow.
       The site picker owns the first row on its own, because it is the master
       switch: everything below it describes the site it selects. The second
       row carries two stacks, the site's own parameters on the left and the
       paper and its uncertainties on the right, and both stacks START on that
       row, so their frames are flush at the top.
       Each stack is a flex column, not further grid rows: inside a stack the
       blocks have to close up under one another, and grid rows would instead
       align the second block of the right stack with the second block of the
       left one and leave a hole. */
    .th-cfg {
      display: grid; grid-template-columns: 470px 320px;
      column-gap: 65px; row-gap: 12px;
      align-items: start;
      /* On top of the strip's own 20 px: the first frame needs more air than
         the old bare heading did, because its legend rides half above the top
         border and would otherwise sit close to the tabs. */
      margin-top: 14px;
    }
    .th-cfg > .th-cfgsite { grid-column: 1; grid-row: 1; }
    .th-cfg > .th-cfgleft { grid-column: 1; grid-row: 2; }
    .th-cfg > .th-cfgright { grid-column: 2; grid-row: 2; }
    .th-cfgcol { display: flex; flex-direction: column; gap: 12px; }
    /* Each labelled block gets a frame, and its title rides ON the frame the
       way a fieldset legend does. Not only decoration: a title inside the box
       would add its line height to all five blocks for nothing, since the
       line already exists as the heading. On the border it costs the padding
       alone, and the frame reads as one closed group rather than as a rule
       with text above it.
       The frame is a softened --tool-border rather than --tool-hairline:
       hairline disappears on the dark skin, and full --tool-border is pure
       white on the grey skin, which would put five loud boxes on the page. */
    .th-group {
      position: relative;
      display: flex; flex-direction: column; gap: 7px;
      border: 1px solid color-mix(in srgb, var(--tool-border) 55%, transparent);
      border-radius: 7px;
      padding: 12px 14px 11px;
    }
    /* The legend sits half above the top border and paints the page ground
       over it, so the frame appears to break around the words. */
    .th-group > .th-h2 {
      position: absolute; top: 0; left: 11px; transform: translateY(-50%);
      margin: 0; padding: 0 6px; white-space: nowrap;
      background: var(--page-bg);
    }
    /* Five chips have to sit on ONE line inside the 470 px column: wrapped they
       read as two broken rows rather than one control. Slightly tighter than
       the other segmented controls on the page, which is the price. */
    .th-chips { display: flex; flex-wrap: nowrap; gap: 0; margin-bottom: 4px; }
    /* Inside a frame the block padding already does the spacing. */
    .th-group > .th-chips { margin-bottom: 0; }
    .th-chips .th-seg { font-size: 13px; padding: 4px 9px; white-space: nowrap; }
    .th-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin: 0; font-size: 15px; line-height: 1.5; min-height: 28px;
      color: var(--tool-text); font-variant-numeric: tabular-nums;
    }
    /* The popover is absolutely positioned, so it is out of flow and cannot
       add to the row height. */
    .th-row > .th-anchor { min-width: 0; }
    .th-row input { width: 72px; margin: 0; padding: 2px 6px; font-size: 15px; height: auto; text-align: right; }
    /* No spinner arrows: too small to hit on a beamer, and the keyboard sets
       the value anyway. */
    .th-row input[type="number"] { appearance: textfield; -moz-appearance: textfield; }
    .th-row input[type="number"]::-webkit-outer-spin-button,
    .th-row input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .th-row .th-unit {
      display: inline-block; width: 30px; margin-left: 7px; text-align: right;
      color: var(--tool-note); font-size: 13px;
    }
    /* The one non-numeric site input: which half of the year the load peaks in. */
    .th-row .th-seg { font-size: 13px; padding: 2px 9px; }

    /* Round "i" next to a label, and the note it opens. The note floats above
       the page rather than expanding inline, so opening one never pushes the
       rows below it out of view. */
    /* Pico makes both `label` and `button` block-level and gives them a bottom
       margin, which put the info button on its own line and doubled the height
       of every parameter row. Label, button and the value slot have to share
       one line at the row's existing height, so both are forced back inline
       here and their margins are zeroed. */
    .th-anchor { position: relative; display: inline-flex; align-items: baseline; }
    .th-anchor > label {
      display: inline; width: auto; margin: 0; padding: 0;
      cursor: pointer; line-height: inherit;
    }
    .th-anchor > span { line-height: inherit; }
    .th-anchor > .th-info {
      display: inline-flex; align-items: center; justify-content: center;
      flex: 0 0 auto;
      width: 16px; height: 16px; min-width: 0; margin: 0 0 0 6px; padding: 0;
      align-self: center;
      border: 1px solid var(--tool-faint); border-radius: 50%; background: none;
      color: var(--tool-label); font-size: 11px; line-height: 1; font-weight: 700;
      cursor: pointer;
    }
    .th-anchor > .th-info:hover, .th-anchor > .th-info:focus-visible,
    .th-anchor > .th-info[aria-expanded="true"] {
      background: none; border-color: var(--tool-sig-info); color: var(--tool-sig-info);
    }
    .th-pop {
      position: absolute; z-index: 40; top: calc(100% + 8px); left: 50%;
      width: min(340px, calc(100vw - 28px)); max-height: min(58vh, 420px); overflow-y: auto;
      background: var(--tool-surface); border: 1px solid var(--tool-border); border-radius: 8px;
      box-shadow: var(--tool-panel-shadow);
      padding: 11px 30px 11px 13px; font-size: 13px; line-height: 1.55;
      color: var(--tool-label); font-weight: 400; text-align: left; cursor: auto;
      font-variant-numeric: normal;
    }
    .th-pop::before {
      content: ""; position: absolute; top: -5px; left: var(--arrow, 50%);
      width: 8px; height: 8px; margin-left: -4px; background: var(--tool-surface);
      border-left: 1px solid var(--tool-border); border-top: 1px solid var(--tool-border);
      transform: rotate(45deg);
    }
    .th-popclose {
      position: absolute; top: 4px; right: 4px; width: 22px; height: 22px;
      display: inline-flex; align-items: center; justify-content: center; margin: 0; padding: 0;
      border: none; border-radius: 5px; background: none; color: var(--tool-note);
      font-size: 16px; line-height: 1; cursor: pointer;
    }
    .th-popclose:hover { background: var(--tool-hairline); color: var(--tool-text); }

    /* Segmented buttons take their outline from --pico-muted-border-color,
       which is #262e3a on the dark skin and #d8e0ea on the light one: both sit
       at about 1.4:1 against their own background and disappear on a beamer.
       The grey skin is the reference here, #9aa1a6 on #55595f at about 2.6:1,
       and is deliberately left exactly as it is. --tool-faint lands at about
       3.0:1 on the other two (#566472 on #14181f, #8b96a1 on #ffffff), which
       reads as a group of buttons without shouting. Hover, focus and the active
       state keep the accent, hence the three exclusions; scoped to .th-wrap, so
       the theme switcher in the page header stays identical across the site. */
    html[data-skin="dark"] .th-wrap .lang-seg:not(.active):not(:hover):not(:focus),
    html[data-skin="light"] .th-wrap .lang-seg:not(.active):not(:hover):not(:focus) {
      border-color: var(--tool-faint);
    }

    /* Range sliders. Pico leaves the thumb to the browser, and the browser
       default is a pale disc that disappears on the grey skin from six metres
       away. Both vendor prefixes are needed: they are separate pseudo-elements
       and a shared rule would be dropped by both engines. The fill is the
       accent of the active skin (grey teal, dark blue-grey, light blue) and
       the ring is --tool-emph, which is white on both dark skins and near-black
       on the light one, so the thumb keeps a hard edge everywhere. */
    .th-wrap input[type="range"] {
      appearance: none; -webkit-appearance: none; background: none; height: 20px;
    }
    .th-wrap input[type="range"]:focus { outline: none; }
    .th-wrap input[type="range"]::-webkit-slider-runnable-track {
      height: 6px; border-radius: 3px; background: var(--tool-hairline);
      border: 1px solid var(--tool-border);
    }
    .th-wrap input[type="range"]::-moz-range-track {
      height: 6px; border-radius: 3px; background: var(--tool-hairline);
      border: 1px solid var(--tool-border);
    }
    .th-wrap input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px;
      border-radius: 50%; background: var(--pico-primary);
      border: 2px solid var(--tool-emph); cursor: pointer;
    }
    .th-wrap input[type="range"]::-moz-range-thumb {
      width: 18px; height: 18px; border-radius: 50%; background: var(--pico-primary);
      border: 2px solid var(--tool-emph); cursor: pointer;
    }
    .th-wrap input[type="range"]:focus-visible::-webkit-slider-thumb {
      box-shadow: 0 0 0 3px var(--pico-primary-focus);
    }
    .th-wrap input[type="range"]:focus-visible::-moz-range-thumb {
      box-shadow: 0 0 0 3px var(--pico-primary-focus);
    }

    /* The three stage buttons of the Live tab. Oil treatment is a one-shot, so
       it never latches: it flashes for a moment instead. */
    .th-stage-btns { display: flex; align-items: center; gap: 0; }
    .th-fire {
      background: var(--pico-primary); border-color: var(--pico-primary);
      color: var(--pico-primary-inverse);
    }
    /* Hands the year in the ring over to the Lifetime tab. Not one of the stage
       buttons: it changes nothing on this tab, so it stands on its own. */
    /* One notch smaller than the stage buttons: the row is full, and this is
       the label that pays for the space the site name used to take. */
    .th-export { white-space: nowrap; font-size: 13px; padding: 4px 10px; }
    .th-export:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Lifetime tab ────────────────────────────────────────────────────
       One large distribution with a method switch above it, then the two
       wide panels. 760 + 40 + 440 is the page width. */
    .th-life { margin-top: 10px; }
    .th-life-top {
      display: grid; grid-template-columns: 760px 440px; gap: 40px; align-items: start;
    }
    .th-methods { display: flex; align-items: center; gap: 0; margin-bottom: 6px; }
    .th-methods .th-seg { font-size: 13.5px; padding: 4px 11px; }
    .th-r2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; margin-top: 10px; }
    .th-stat {
      margin: 4px 0 0; font-size: 14px; color: var(--tool-text);
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .th-explain {
      margin: 26px 0 0; font-size: 14px; line-height: 1.5; color: var(--tool-note);
    }
    .th-explain b { color: var(--tool-label); font-weight: 600; }
    /* Which year the numbers on this tab were computed over. Quiet, but it has
       to be legible from the back of the room once it stops saying the default. */
    .th-source {
      display: flex; align-items: center; gap: 10px;
      margin: 2px 0 0; font-size: 13px; color: var(--tool-note);
    }
    .th-source .th-chip { font-size: 12px; padding: 2px 8px; margin: 0; }
    /* The panels are read-only, so no grab cursor. */
    .th-life .tw-stage { cursor: default; }
    /* Below the design width the page keeps a gutter, same as the Duval page. */
    @media (max-width: 1260px) {
      .th-wrap, body > header.tw-head { padding-inline: 16px; }
    }
  </style>

<body>
  <header class="container tw-head">
    <h1><a class="th-crumb" href="index.html">twin-lab</a><span class="th-sep">/</span>Thermal mini-twin, IEC 60076-7</h1>
    <div class="theme-switcher">
      <button class="lang-seg theme-seg" data-theme-set="light" aria-label="Light theme" title="Light"></button><button class="lang-seg theme-seg" data-theme-set="grey" aria-label="Grey theme" title="Grey"></button><button class="lang-seg theme-seg" data-theme-set="dark" aria-label="Dark theme" title="Dark"></button>
    </div>
  </header>
  <script src="assets/js/theme.js"></script>

  <main>
    <div id="root">
      <div class="th-wrap"></div>
    </div>
  </main>

  <!-- ──────────────────────────────────────────────────────────────────────
       Thermal core: plain JS, no JSX and no DOM. The difference equations are
       the IEC 60076-7 exponential-solution equivalents; the ageing kinetics
       follow the Ekenstam chain-scission form used in the CIGRE brochures.
       ────────────────────────────────────────────────────────────────────── -->
  <script id="thermalcore">
  var ThermalCore = (function () {
    'use strict';

    var YEAR_MIN = 525600;   // 365 d, no leap handling: the demo is periodic
    var DAY_MIN = 1440;

    /* IEC 60076-7:2018 Table 4, ONAN column for medium and large power
       transformers. tauO and tauW in minutes, dThOr and dThHr in kelvin.
       dThOr is the rated top-oil rise over ambient, dThHr the rated hot-spot
       rise over top-oil.
       R is the loss ratio (load loss over no-load loss at rated current), not
       in Table 4 and not a standard-prescribed constant: 10 is a typical
       engineering value, ordinary range about 8 to 15.
       dThOr and dThHr are likewise not in Table 4: they are typical design
       values sitting inside the IEC 60076-2 limits (60 K top-oil rise, 78 K
       hot-spot rise over ambient at rated load), which prescribes limits, not
       typical values. */
    var IEC = {
      k11: 0.5, k21: 2.0, k22: 2.0,
      tauO: 210, tauW: 10,
      x: 0.8, y: 1.3,
      R: 10,
      dThOr: 45,
      dThHr: 26
    };

    /* Relative ageing rate, non-thermally-upgraded kraft paper, reference
       hot spot 98 C: V = 2^((thetaH - 98)/6) (IEC 60076-7). The
       thermally-upgraded Arrhenius form with 110 C reference is the other
       option in the standard; the demo unit is an older one, so the
       non-upgraded form applies. Six kelvin is one doubling, which is why a
       hot-spot uncertainty of a few kelvin is worth propagating at all.

       Ekenstam chain scission for the absolute number: 1/DP - 1/DP0 = k t,
       k = A exp(-Ea/(R T)), end of life at DP 200.
       A in 1/h, Ea in J/mol, moisture in percent of paper mass.
       Source: Emsley and Stevens values as tabulated in Lundgaard et al.,
       IEEE Trans. Power Delivery 19(1), 2004, Table II, for Ea = 111 kJ/mol,
       kraft paper, sealed system.
       Sanity anchor: dry paper (0.5 %) held at a constant 98 C hot spot runs
       DP 1000 to DP 200 in about 18 years, consistent with the IEC notion of
       normal insulation life at a 98 C hot spot.
       Lundgaard's own measured A set runs roughly 2x faster than the Emsley
       values tabulated here; that spread between two published sources is the
       literature, not a modelling error. */
    var AGING = {
      Ea: 111e3,
      Rgas: 8.314,
      DP0: 1000,
      DP_EOL: 200,
      A_TABLE: [[0.5, 1.07e8], [1, 3.5e8], [2, 7.8e8], [3.5, 35e8]]
    };

    /* Log-linear in A over moisture, extrapolated along the outer segments.
       Moisture is clamped to [0.3, 6] %: below that the table says nothing and
       above it the paper is wet enough that this kinetic form stops meaning
       much anyway. */

       in the evening, on the steep side of that curve, and a cosine puts the
       air several kelvin away from where it really is at that hour.

    var COMP_N = COMP_MIN / COMP_STRIDE + 1;   // 14401

    /* ── Periodic start state ─────────────────────────────────────────────

       out of step with its own drivers: the oil then spends the first days
       climbing to where it should have been, and when the strip chart wraps
       from the end of the year back to the start, top oil and hot spot jump by
       that same amount.

       three displayed days BEFORE t0 are the last three displayed days of the
       same year: run them from the steady state and hand the resulting state to
       t0. Three days is about twenty oil time constants at tauO 210 min, which
       is far more than enough to forget the steady-state start. */

       a temporary sag: the paper hands its water back and the moisture creeps
       to wherever the tank is heading.

       need to exclude each other: leakage moves the TARGET to saturation, oil
       treatment resets the STATE to dry. Pressing treatment during a leak is a
       perfectly sensible thing to show, so it is allowed.

       creeps back visibly inside one pass of the strip chart. */

    /* ── Causal live ring ─────────────────────────────────────────────────

       a stage event changes the drivers or the state from the instant it is
       pressed on, so the kink appears under the cursor and scrolls out to the
       left, exactly the way the moisture buffer has always behaved.

       ensemble, each with its own time and ring index. Independent because the
       ensemble is allowed to trail the nominal by a few steps when a frame runs
       out of budget; the price is a second evaluation of the driver pair per

      var off = new Float64Array(N), hsE = new Float64Array(N);
      var cAm = new Float64Array(N), cOm = new Float64Array(N), cH2m = new Float64Array(N);

          tS = Math.max(0.05, 1 + 2 * (kn.sigModel || 0) / 100 * g());

      /* Effective ambient. IEC 60076-7 recommends weighting a varying ambient

      /* Tank heaters hold a minimum oil temperature, modelled as a floor, no
         control dynamics. The state itself is clamped, so the oil sits on the
         floor instead of drifting below it and springing back. */
      if (P.oilFloor != null && st.thetaO < P.oilFloor) {
        st.dThO = P.oilFloor - aEff;
        st.thetaO = P.oilFloor;
      }
      st.thetaH = st.thetaO + st.dThH1 - st.dThH2;
      return st;
    }

    /* Effective parameter set from the UI knobs. The scales multiply the IEC
       constants, which is how a mis-parametrised twin is expressed here. */
    function effectiveParams(prm) {
      prm = prm || {};
      return params({
        dThOr: IEC.dThOr * (prm.dThOrScale == null ? 1 : prm.dThOrScale),
        tauO: IEC.tauO * (prm.tauOScale == null ? 1 : prm.tauOScale)
      });
    }

    /* Same, plus whatever the site adds to the model. Currently that is only
       the minimum oil temperature of the northern site. */
    function scenarioParams(sc, prm) {
      var P = effectiveParams(prm);
      if (sc && sc.oilFloor != null) P.oilFloor = sc.oilFloor;
      return P;
    }

    /* One year at sc.dtMin, sampled into typed arrays every strideMin. At
       dtMin 5 that is 105120 steps and 17520 stored points. */
    function simulateTrajectory(sc, P, opts) {
      opts = opts || {};
      var dt = opts.dtMin || sc.dtMin;
      var stride = opts.strideMin || 30;
      var offset = opts.ambientOffset || 0;
      var nSteps = Math.round(YEAR_MIN / dt);
      var every = Math.max(1, Math.round(stride / dt));
      var nOut = Math.floor(nSteps / every) + 1;
      P = P || IEC;

      var tMin = new Float64Array(nOut), thA = new Float64Array(nOut);
      var thO = new Float64Array(nOut), thH = new Float64Array(nOut), Ks = new Float64Array(nOut);

      var K0 = loadAt(0, sc), a0 = ambientAt(0, sc, offset);
      var st = initState(K0, a0, P);
      st.thetaO = a0 + st.dThO;
      st.thetaH = a0 + st.dThO + st.dThH1 - st.dThH2;

      var o = 0, i, t, KN, aN;
      var K = K0, a = a0;
      for (i = 0; i <= nSteps; i++) {
        if (i % every === 0 && o < nOut) {
          tMin[o] = i * dt; thA[o] = a;
          thO[o] = st.thetaO; thH[o] = st.thetaH; Ks[o] = K;
          o++;
        }
        if (i === nSteps) break;
        t = (i + 1) * dt;

        stepThermal(st, K, a, dt, P, KN, aN);

    /* One year, nothing stored: time averages of the relative ageing rate and
       of the Ekenstam rate constant at the hot spot including its error. Both are averages
       over the year, so vMean is directly the loss of life in equivalent years
       per calendar year and kMean drives DP over the same year. */
    function yearlyAging(sc, prm) {
      prm = prm || {};
      var P = scenarioParams(sc, prm);
      var hsError = prm.hsError || 0;
      var offset = prm.ambientOffset || 0;
      var A = agingA(prm.moisture == null ? 0.5 : prm.moisture);
      var dt = sc.dtMin;
      var nSteps = Math.round(YEAR_MIN / dt);
      var eaR = AGING.Ea / AGING.Rgas;

      var K0 = loadAt(0, sc), a0 = ambientAt(0, sc, offset);
      var st = initState(K0, a0, P);
      var vSum = 0, kSum = 0, i, t, thH, KN, aN;
      var K = K0, a = a0;
      for (i = 0; i < nSteps; i++) {

        KN = loadAt(t, sc); aN = ambientAt(t, sc, offset);
        stepThermal(st, K, a, dt, P, KN, aN);
        K = KN; a = aN;
        thH = st.thetaH + hsError;
        vSum += Math.pow(2, (thH - 98) / 6);
        kSum += A * Math.exp(-eaR / (thH + 273.15));
      }
      return { vMean: vSum / nSteps, kMean: kSum / nSteps, A: A };
    }

    /* ── Profile cache ────────────────────────────────────────────────────
       yearlyAging spends most of its time in loadAt and ambientAt (three to
       six trigonometric calls plus value noise per step), not in the
       difference equations. Across a Monte Carlo run over one scenario those
       two series are identical for every sample: the ambient offset is purely
       additive, the parameter scales touch only dThOr and tauO, and the
       ageing knobs enter only the evaluation of the hot spot.
       So one year of driving series is built once. Stored per step: the
       ambient without offset, K^y, and the relative top-oil steady state
       ((1 + R K^2)/(1 + R))^x, which takes the two Math.pow calls out of the
       inner loop as well. Float32 is 1e-7 relative, far below the modelling
       error of anything on this page.

       sub = 1 the profile is point-sampled and reproduces yearlyAging exactly.
       With sub = dt/dtMin the fast load components are averaged rather than
       aliased, which lets the arc-furnace year run at a coarser step: measured
       against dt 1 min, dt 4 min with sub 4 is within 0.7 % on both vMean and
       kMean, while point sampling at dt 2 min is already 3.2 % off. */
    function buildProfile(sc, dtMin, sub) {
      var dt = dtMin || sc.dtMin;
      var m = Math.max(1, Math.round(sub || 1));
      var n = Math.round(YEAR_MIN / dt);
      var thA = new Float32Array(n), Ky = new Float32Array(n), ssRel = new Float32Array(n);
      var i, s, t, K, a, ky, ss;
      for (i = 0; i < n; i++) {

        for (s = 0; s < m; s++) {
          t = i * dt + s * dt / m;
          K = loadAt(t, sc);
          a += ambientAt(t, sc, 0);
          ky += Math.pow(K, IEC.y);
          ss += Math.pow((1 + IEC.R * K * K) / (1 + IEC.R), IEC.x);
        }

      }
      return { sc: sc, dtMin: dt, sub: m, n: n, thA: thA, Ky: Ky, ssRel: ssRel };
    }

    /* Same result as yearlyAging, driven from a cached profile. The Heun step
       is inlined because this runs a thousand times per Monte Carlo. */
    function yearlyAgingCached(prof, prm) {
      prm = prm || {};
      var P = scenarioParams(prof.sc, prm);
      var hsError = prm.hsError || 0;
      var offset = prm.ambientOffset || 0;
      var mIn = prm.moisture == null ? 0.5 : prm.moisture;
      /* A profile exported from the live view carries a moisture SERIES. The
         moisture entry of the uncertain vector is then not the level itself but
         an offset on that series: the difference between the drawn value and
         the level the export was taken at. agingA clamps to 0.3 to 6 % on the
         way in, so a large offset saturates instead of leaving the table. */
      var mSer = prof.m || null;
      var mOff = mSer ? mIn - (prof.mRef == null ? 0 : prof.mRef) : 0;
      var A = agingA(mSer ? (prof.mRef == null ? 0.5 : prof.mRef) + mOff : mIn);
      var dt = prof.dtMin, n = prof.n;
      var thAr = prof.thA, KyAr = prof.Ky, ssAr = prof.ssRel;
      var eaR = AGING.Ea / AGING.Rgas;

      var cO = dt / (P.k11 * P.tauO);
      var cH1 = dt / (P.k22 * P.tauW);
      var cH2 = dt / (P.tauO / P.k22);

         out: identical value, and Math.pow costs about twice a Math.exp. */
      var cV = Math.LN2 / 6, kV = Math.exp(-98 * Math.LN2 / 6);

      /* Heun, written out. For one state y with target T and coefficient
         c = dt/tau, the predictor is y + c*d0 with d0 = T0 - y, and the
         corrector is y + (c/2)*(d0 + d1) with d1 = T1 - y - c*d0. The
         end-of-step targets are the next stored samples, so this is exactly
         the same rule stepThermal applies, with no interpolation anywhere.
         The year is periodic, so the last step reads back to sample 0. */
      var vSum = 0, kSum = 0, i, iN, thO, thH, d0, d1, t0v, t1v;
      var a = thAr[0] + offset, Ky = KyAr[0], ss = ssAr[0];
      var aN, KyN, ssN;

        aN = thAr[iN] + offset; KyN = KyAr[iN]; ssN = ssAr[iN];

        d0 = a - aEff; d1 = aN - aEff - cA * d0;
        aEff += 0.5 * cA * (d0 + d1);

        t0v = dThOr * ss; t1v = dThOr * ssN;
        d0 = t0v - dThO; d1 = t1v - dThO - cO * d0;
        dThO += 0.5 * cO * (d0 + d1);

        t0v = k21H * Ky; t1v = k21H * KyN;
        d0 = t0v - dThH1; d1 = t1v - dThH1 - cH1 * d0;
        dThH1 += 0.5 * cH1 * (d0 + d1);

        t0v = k21H2 * Ky; t1v = k21H2 * KyN;
        d0 = t0v - dThH2; d1 = t1v - dThH2 - cH2 * d0;
        dThH2 += 0.5 * cH2 * (d0 + d1);

        a = aN; Ky = KyN; ss = ssN;

        thO = aEff + dThO;
        if (floor !== null && thO < floor) { dThO = floor - aEff; thO = floor; }
        thH = thO + dThH1 - dThH2 + hsError;
        vSum += kV * Math.exp(cV * thH);
        /* Constant moisture keeps A outside the sum, as it always did; a
           moisture series folds log A(m_i) into the same exponent, which costs
           one piecewise-linear evaluation per step and no second exp. */
        kSum += mSer
          ? Math.exp(logAgingA(mSer[i] + mOff) - eaR / (thH + 273.15))
          : Math.exp(-eaR / (thH + 273.15));
      }
      return { vMean: vSum / n, kMean: (mSer ? kSum : A * kSum) / n, A: A };
    }

    /* ── Uncertainty propagation on remaining life ────────────────────────
       The quantity is the years left before the paper reaches DP 200, from
       the Ekenstam rate constant averaged over one year of operation. The
       uncertain vector is six-dimensional, in this fixed order:
         0  ambient offset            K,  mean 0
         1  dThOr scale               1 plus the model sigma
         2  tauO scale                1 plus twice the model sigma
         3  hot-spot error            K,  mean 0
         4  moisture                  % of paper mass, clamped in agingA
         5  DP at the start of life
       Entries 0 to 3 change the thermal year, 4 and 5 only the kinetics and
       the DP distance still to go. */
    var LIFE = { nDim: 6, mcN: 1000, mcSeed: 20260821, kappa: 3 };

    function lifeEval(prof, v) {
      var r = yearlyAgingCached(prof, {
        ambientOffset: v[0],
        /* At large model sigma a draw can turn a scale negative; the
           difference equations need a positive time constant and a positive
           rated rise, so both are floored well below any plausible unit. */
        dThOrScale: Math.max(0.05, v[1]),
        tauOScale: Math.max(0.05, v[2]),
        hsError: v[3],
        moisture: v[4]
      });
      var dp0 = Math.max(250, Math.min(1400, v[5]));
      var years = dp0 <= AGING.DP_EOL ? 0
        : (1 / AGING.DP_EOL - 1 / dp0) / r.kMean / 8760;
      return { years: years > 0 ? years : 0, v: r.vMean };
    }

    /* Normal CDF through the Abramowitz-Stegun 7.1.26 error function,

        - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);

    /* Inverse normal CDF, Acklam's rational approximation, relative error

       Newton or Halley step against it would make the quantile worse, not

        1.383577518672690e+02, -3.066479806614716e+01, 2.506628277459239e+00];
      var b = [-5.447609879822406e+01, 1.615858368580409e+02, -1.556989798598866e+02,
        6.680131188771972e+01, -1.328068155288572e+01];
      var c = [-7.784894002430293e-03, -3.223964580411365e-01, -2.400758277161838e+00,
        -2.549732539343734e+00, 4.374664141464968e+00, 2.938163982698783e+00];
      var d = [7.784695709041462e-03, 3.224671290700398e-01, 2.445134137142996e+00,

        x = (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q /

    /* ── Shifted-lognormal moment match ───────────────────────────────────
       The unscented transform hands back a weighted point cloud. Fitting a
       Gaussian to it throws the asymmetry away, which is exactly the property
       that matters for remaining life. A three-parameter lognormal keeps it:
         R = c + s exp(Z),  Z ~ N(0, sig^2),  s > 0
       with, writing w = exp(sig^2),
         E[R]    = c + s sqrt(w)
         Var[R]  = s^2 w (w - 1)
         skew[R] = (w + 2) sqrt(w - 1)
       The skew relation is monotone in w on w > 1, so w is found by bisection
       and the other two are then explicit. Negative skew is fitted mirrored
       (fit -R, report the reflected density).

       visually a Gaussian anyway, and a non-positive variance has no fit. */
    var SKEW_MIN = 0.05;
    var SKEW_MAX = 20;      // w beyond about 8.5, past which the shape is a spike

    function fitShiftedLognormal(mean, variance, skew) {
      if (!(variance > 0) || !isFinite(skew)) return null;
      var sign = skew < 0 ? -1 : 1;
      var g = Math.abs(skew);
      if (g < SKEW_MIN || g > SKEW_MAX) return null;

      /* (w + 2)^2 (w - 1) = g^2, increasing in w, so 60 bisections on
         w in (1, 1e4] land on the root to full double precision. */
      var lo = 1 + 1e-12, hi = 1e4, i, w, f;
      for (i = 0; i < 100; i++) {

        if (f > 0) hi = w; else lo = w;

      w = 0.5 * (lo + hi);
      var sig2 = Math.log(w);
      if (!(sig2 > 0)) return null;
      var s = Math.sqrt(variance / (w * (w - 1)));
      if (!(s > 0) || !isFinite(s)) return null;
      var c = m - s * Math.sqrt(w);
      return {
        sign: sign, c: c, s: s, sigma: Math.sqrt(sig2),
        mean: mean, sd: Math.sqrt(variance), skew: skew,
        /* Median of R = c + s exp(Z) is c + s, reflected for negative skew. */
        median: sign * (c + s),
        /* Mode, only used to scale the plot: c + s exp(-sig^2). */
        mode: sign * (c + s / w)

    /* Density and CDF of the fit, in the original orientation. */
    function slnPdf(fit, x) {

      return Math.exp(-0.5 * z * z) / (u * fit.sigma * Math.sqrt(2 * Math.PI));

      var u = fit.sign * x - fit.c;
      var p = u > 0 ? normCdf(Math.log(u / fit.s) / fit.sigma) : 0;
      return fit.sign > 0 ? p : 1 - p;

    function slnQuantile(fit, p) {

      return fit.sign * (fit.c + fit.s * Math.exp(fit.sigma * normQuantile(pp)));
    }

    /* ── One propagated shape, three ways to ask it something ─────────────
       `st` is any of the objects lifeStats produces: a Gaussian method carries
       mean and sigma, the skew fit carries `fit` as well (null when it fell
       back, which lands on the Gaussian branch by itself). These live here
       rather than in the drawing code so the self-test checks exactly what the
       panels draw. */
    function shapeSurvival(st, t) {
      if (st.fit) return 1 - slnCdf(st.fit, t);
      if (!(st.sigma > 0)) return t < st.mean ? 1 : 0;
      return 1 - normCdf((t - st.mean) / st.sigma);

      if (st.fit) return slnQuantile(st.fit, p);

    }
    /* Density against a log10 axis. The panel coordinate is u = log10(v), so
       the ordinate has to carry the Jacobian dv/du = v ln(10); without it the
       area under the drawn curve is not a probability and the four shapes on
       the rate panel are not comparable. Mass at v <= 0, which a Gaussian on a
       positive quantity usually has, has no place on a log axis and is simply
       absent from the curve: the stat line reports it as P(<0) instead. */
    function shapeLogDensity(st, u) {
      var v = Math.pow(10, u);
      if (st.fit) return slnPdf(st.fit, v) * v * Math.LN10;
      if (!(st.sigma > 0)) return 0;

    }

    function sampleStats(arr, from, n) {
      var s = new Float64Array(n), i, sum = 0, vv = 0;
      for (i = 0; i < n; i++) { s[i] = arr[from + i]; sum += s[i]; }
      s.sort();

      };
      return {
        n: n, sorted: s, mean: mean, sd: Math.sqrt(vv / (n > 1 ? n - 1 : 1)),
        median: q(0.5), p01: q(0.01), p10: q(0.10), p90: q(0.90),
        p95: q(0.95), p99: q(0.99),

    function gaussStat(mean, sigma) {
      return { mean: mean, sigma: sigma, median: mean, pNeg: sigma > 0 ? normCdf(-mean / sigma) : 0 };
    }

    /* Statistics over however many jobs of a run have finished. */
    /* The three deterministic propagations of ONE output quantity, off the same
       evaluation order lifeRun produces. Remaining life and the yearly ageing

       drives every panel from one choice instead of one panel from a choice and
       two from the Monte Carlo. */
    function propOne(vals, at, nDet) {
      var n = LIFE.nDim, o = { lin: null, ut: null, utSkew: null, sigmaPts: null };
      var i, d, m, vv, sk, w0, wi, g, fit;
      /* Linearisation: forward differences with a step of one sigma, so each
         difference already is the gradient times that sigma. */
      if (at > n) {
        vv = 0;
        for (i = 0; i < n; i++) { d = vals[1 + i] - vals[0]; vv += d * d; }
        o.lin = gaussStat(vals[0], Math.sqrt(vv));
      }
      /* Unscented: symmetric set, 2n + 1 points at sqrt(n + kappa) sigma,
         w0 = kappa/(n + kappa) = 1/3 at kappa 3. */
      if (at >= nDet) {
        w0 = LIFE.kappa / (n + LIFE.kappa);
        wi = 1 / (2 * (n + LIFE.kappa));

        o.sigmaPts = { y: [vals[0]], w: [w0] };
        for (i = 0; i < 2 * n; i++) { o.sigmaPts.y.push(vals[1 + n + i]); o.sigmaPts.w.push(wi); }
        g = vv > 0 ? sk / Math.pow(vv, 1.5) : 0;
        fit = fitShiftedLognormal(m, vv, g);

        o.utSkew = fit
          ? { fit: fit, mean: m, sigma: Math.sqrt(vv), median: fit.median, skew: g,
              pNeg: slnCdf(fit, 0), fallback: false }
          : { fit: null, mean: m, sigma: Math.sqrt(vv), median: m, skew: g,
              pNeg: o.ut.pNeg, fallback: true };

    }

    /* Statistics over however many jobs of a run have finished, for both
       outputs. */

    pass('rate normalisation', Math.abs(r1 - 1) < 1e-12,
      'rate(98 C, 0.5 %) = ' + r1.toFixed(15) + ', rate(98 C, 1.5 %) = ' +
      T.rateNorm(98, 1.5).toFixed(3) + ', rate(110 C, 0.5 %) = ' + T.rateNorm(110, 0.5).toFixed(3));

    /* The split form the live draw uses has to agree with it exactly, and it
       has to be monotone in the hot spot: that monotonicity is what lets the
       sorted hot-spot blocks be read as sorted rates. */
    (function () {
      var worst = 0, mono = true, mm, tt, prev;
      [0.5, 1.5, 3, 5].forEach(function (m) {
        var f = T.rateFactor(m);
        prev = -Infinity;
        for (tt = -20; tt <= 140; tt += 0.5) {
          var a = T.rateFromFactor(f, tt), b = T.rateNorm(tt, m);
          worst = Math.max(worst, Math.abs(a / b - 1));
          if (a <= prev) mono = false;
          prev = a;
        }
        mm = m;
      });
      pass('split rate form matches and is monotone', worst < 1e-12 && mono,
        'worst relative difference ' + worst.toExponential(1) + ' over 4 moistures x 321 hot spots, ' +
        'factor at 0.5 % ' + T.rateFactor(0.5).toExponential(3) + ', at ' + mm + ' % ' +
        T.rateFactor(mm).toExponential(3));
    })();

    /* 3d: the confidence slider is nothing but a pair of quantile indices. */
    var ci0 = T.ciIndices(100, 0), ci50 = T.ciIndices(100, 50), ci99 = T.ciIndices(100, 99);
    pass('CI indices', ci0[0] >= ci0[1] - 1 && ci99[0] === 0 && ci99[1] === 99 &&
      ci50[0] === 25 && ci50[1] === 74,
      '0 % -> ' + ci0 + ', 50 % -> ' + ci50 + ', 99 % -> ' + ci99 + ' of 100 members');

    // 4: a full year has to be fast enough to run on a slider drag.
    ['desert', 'eaf'].forEach(function (id) {
      var sc = T.scenarioById(id);
      var t0 = Date.now();
      var tr = T.simulateTrajectory(sc, P, {});
      var ms = Date.now() - t0;
      pass('year ' + id, ms < 2000,
        ms + ' ms, ' + tr.n + ' stored points, dt ' + tr.dtMin + ' min, thH max ' +
        Math.max.apply(null, Array.prototype.slice.call(tr.thH)).toFixed(1) + ' C');
    });

    // 5: cold site with a moderate load must age far slower than a hot one.
    var prm = { ambientOffset: 0, dThOrScale: 1, tauOScale: 1, hsError: 0, moisture: 0.5 };
    var aQ = T.yearlyAging(T.scenarioById('northern'), prm);
    var aD = T.yearlyAging(T.scenarioById('desert'), prm);
    pass('northern << desert', aQ.vMean < aD.vMean / 5,
      'vMean northern ' + aQ.vMean.toExponential(3) + ', desert ' + aD.vMean.toExponential(3) +
      ', ratio ' + (aD.vMean / aQ.vMean).toFixed(1) + 'x');

    // 6: the A table anchor, dry paper held at a constant 98 C hot spot.
    var years = T.dpYears(T.ekenstamK(98, T.agingA(0.5)));
    pass('dry 98 C DP 1000 to 200', years > 15 && years < 20, years.toFixed(2) + ' a');

    // 7: the northern site must never see oil below its heater floor.
    var scQ = T.scenarioById('northern');
    var trQ = T.simulateTrajectory(scQ, T.scenarioParams(scQ, {}), {});
    var minO = Infinity, maxHN = -Infinity, q;
    for (q = 0; q < trQ.n; q++) {
      if (trQ.thO[q] < minO) minO = trQ.thO[q];
      if (trQ.thH[q] > maxHN) maxHN = trQ.thH[q];
    }
    pass('northern oil floor', minO >= scQ.oilFloor - 1e-9,
      'min top-oil ' + minO.toFixed(2) + ' C, floor ' + scQ.oilFloor + ' C, max hot spot ' + maxHN.toFixed(1) + ' C');

    // 8: the city load peak has to land in the intended overload window.
    var scN = T.scenarioById('nyc'), maxK = 0, kt;
    for (kt = 0; kt < T.YEAR_MIN; kt += 5) maxK = Math.max(maxK, T.loadAt(kt, scN));
    pass('nyc peak K 1.15 to 1.25', maxK >= 1.15 && maxK <= 1.25, 'max K ' + maxK.toFixed(3) + ' pu');

    // 9: the arc furnace has to swing inside minutes, not hours.
    var scE = T.scenarioById('eaf'), lo = 9, hi = 0, et, kv;
    for (et = 0; et < 1440; et++) { kv = T.loadAt(et, scE); if (kv < lo) lo = kv; if (kv > hi) hi = kv; }
    pass('eaf day range', lo < 0.45 && hi > 1.0, 'K ' + lo.toFixed(2) + ' to ' + hi.toFixed(2) + ' pu over one day');

    /* ── Lifetime mode ─────────────────────────────────────────────────── */

    /* The shifted-lognormal moment match, checked against distributions whose
       moments are known in closed form rather than sampled. For
       R = c + s exp(Z), Z ~ N(0, sig^2), w = exp(sig^2):
         mean = c + s sqrt(w), var = s^2 w (w - 1), skew = (w + 2) sqrt(w - 1)
       Feeding those three back in has to recover c, s and sig. */
    [[5, 2, 0.6], [-30, 40, 0.25], [0, 1, 1.1], [12, 3, 0.05]].forEach(function (t) {
      var c = t[0], s = t[1], sig = t[2], w = Math.exp(sig * sig);
      var mean = c + s * Math.sqrt(w);
      var vr = s * s * w * (w - 1);
      var sk = (w + 2) * Math.sqrt(w - 1);
      var f = T.fitShiftedLognormal(mean, vr, sk);
      var ok = f && Math.abs(f.c - c) < 1e-6 * (1 + Math.abs(c)) &&
        Math.abs(f.s - s) < 1e-6 * (1 + s) && Math.abs(f.sigma - sig) < 1e-9;
      pass('skew fit round trip sig=' + sig, !!ok,
        'c ' + c + ' -> ' + (f ? f.c.toFixed(6) : 'null') + ', s ' + s + ' -> ' +
        (f ? f.s.toFixed(6) : 'null') + ', sig ' + sig + ' -> ' + (f ? f.sigma.toFixed(9) : 'null') +
        ', skew in ' + sk.toFixed(4));
    });

    /* Mirrored fit: the same shape reflected has to come back reflected, and
       the CDF has to follow. */
    (function () {
      var w = Math.exp(0.49), c = 4, s = 3;
      var mean = c + s * Math.sqrt(w), vr = s * s * w * (w - 1), sk = (w + 2) * Math.sqrt(w - 1);
      var fp = T.fitShiftedLognormal(mean, vr, sk);
      var fm = T.fitShiftedLognormal(-mean, vr, -sk);
      var x = mean + 0.7 * Math.sqrt(vr);
      var d = Math.abs(T.slnCdf(fp, x) - (1 - T.slnCdf(fm, -x)));
      /* Numeric moments of the fitted density, so the drawn curve is checked
         and not only the parameters. */
      var lo = fp.c + 1e-9, hi = fp.c + fp.s * Math.exp(6 * fp.sigma), n = 200000, h = (hi - lo) / n;
      var m0 = 0, m1 = 0, m2 = 0, i, xv, pv;
      for (i = 0; i < n; i++) {
        xv = lo + (i + 0.5) * h; pv = T.slnPdf(fp, xv) * h;
        m0 += pv; m1 += xv * pv; m2 += xv * xv * pv;
      }
      var mNum = m1 / m0, vNum = m2 / m0 - mNum * mNum;
      pass('skew fit density and mirror', d < 1e-12 &&
        Math.abs(mNum / mean - 1) < 2e-3 && Math.abs(vNum / vr - 1) < 5e-3,
        'CDF mirror delta ' + d.toExponential(1) + ', numeric mean ' + mNum.toFixed(4) +
        ' vs ' + mean.toFixed(4) + ', numeric var ' + vNum.toFixed(4) + ' vs ' + vr.toFixed(4) +
        ', mass ' + m0.toFixed(5));
    })();

    /* The inverse normal CDF and the shifted-lognormal quantile have to invert
       their own CDFs. normCdf is the Abramowitz-Stegun form, absolute error
       1.5e-7, which is the tolerance here; normQuantile itself is better. */
    (function () {
      var w = Math.exp(0.36), c = 2, s = 5;
      var mean = c + s * Math.sqrt(w), vr = s * s * w * (w - 1), sk = (w + 2) * Math.sqrt(w - 1);
      var f = T.fitShiftedLognormal(mean, vr, sk);
      var worstN = 0, worstS = 0, i, p, x;
      var ps = [0.001, 0.01, 0.1, 0.25, 0.5, 0.75, 0.9, 0.99, 0.999];
      for (i = 0; i < ps.length; i++) {
        p = ps[i];
        worstN = Math.max(worstN, Math.abs(T.normCdf(T.normQuantile(p)) - p));
        x = T.slnQuantile(f, p);
        worstS = Math.max(worstS, Math.abs(T.slnCdf(f, x) - p));
      }
      pass('quantile inverts CDF', worstN < 2e-7 && worstS < 2e-7,
        'normal worst ' + worstN.toExponential(1) + ', shifted lognormal worst ' +
        worstS.toExponential(1) + ' over 9 probabilities');
    })();

    /* Below the threshold the fit declines and the caller falls back. */
    pass('skew fit declines a symmetric input', T.fitShiftedLognormal(10, 4, 0.0) === null &&
      T.fitShiftedLognormal(10, 4, 0.02) === null && T.fitShiftedLognormal(10, 0, 1) === null,
      'skew 0, 0.02 and zero variance all return null');

    /* The profile cache has to reproduce the uncached year exactly when it is
       point sampled at the scenario step. */
    var prm2 = { ambientOffset: 1.3, dThOrScale: 1.07, tauOScale: 0.9, hsError: 1.5, moisture: 1.5 };
    ['desert', 'northern'].forEach(function (id) {
      var s = T.scenarioById(id);
      var t0 = Date.now();
      var direct = T.yearlyAging(s, prm2);
      var msDirect = Date.now() - t0;
      var pf = T.buildProfile(s, s.dtMin, 1);
      t0 = Date.now();
      var cached = T.yearlyAgingCached(pf, prm2);
      var msCached = Date.now() - t0;
      var dv = Math.abs(cached.vMean / direct.vMean - 1);
      var dk = Math.abs(cached.kMean / direct.kMean - 1);
      pass('profile cache ' + id, dv < 1e-5 && dk < 1e-5,
        'dV ' + dv.toExponential(1) + ', dK ' + dk.toExponential(1) +
        ', ' + msDirect + ' ms direct vs ' + msCached + ' ms cached');
    });

    /* The arc furnace runs its Monte Carlo on a 4 min profile with four
       averaged sub-samples. Point sampling at 2 min is 3.2 % off; averaging is
       what makes the coarse step usable. */
    var scE2 = T.scenarioById('eaf');
    var pf1 = T.buildProfile(scE2, 1, 1), pf4 = T.buildProfile(scE2, 4, 4), pf2 = T.buildProfile(scE2, 2, 1);
    [{ hsError: 0, moisture: 1.5 }, { ambientOffset: 4, dThOrScale: 1.1, tauOScale: 0.7, hsError: 5, moisture: 3 }]
      .forEach(function (p, ix) {
        var a = T.yearlyAgingCached(pf1, p), b = T.yearlyAgingCached(pf4, p), c = T.yearlyAgingCached(pf2, p);
        var dv = b.vMean / a.vMean - 1, dk = b.kMean / a.kMean - 1;
        pass('eaf dt4 sub4 vs dt1 #' + (ix + 1), Math.abs(dv) < 0.02 && Math.abs(dk) < 0.02,
          'dV ' + (100 * dv).toFixed(2) + ' %, dK ' + (100 * dk).toFixed(2) +
          ' %, dt2 point sampled would be ' + (100 * (c.vMean / a.vMean - 1)).toFixed(2) + ' %');
      });

    var mvOf = function (kn) { return [0, 1, 1, 0, kn.moist, kn.dp0]; };
    var svOf = function (kn) {
      return [kn.sigAmbient, kn.sigModel / 100, 2 * kn.sigModel / 100, kn.sigHs, kn.sigMoist, kn.sigDp0];
    };
    var KN = { sigAmbient: 2, sigModel: 5, sigHs: 3, moist: 1.5, sigMoist: 0.7, dp0: 1000, sigDp0: 100 };
    var quarter = function (kn) {
      return {
        sigAmbient: kn.sigAmbient / 4, sigModel: kn.sigModel / 4, sigHs: kn.sigHs / 4,
        moist: kn.moist, sigMoist: kn.sigMoist / 4, dp0: kn.dp0, sigDp0: kn.sigDp0 / 4
      };
    };
    var profFor = function (s) {
      return s.dtMin >= 4 ? T.buildProfile(s, s.dtMin, 1) : T.buildProfile(s, 4, Math.round(4 / s.dtMin));
    };
    var runAll = function (s, kn, mcN) {
      var r = T.lifeRun(profFor(s), mvOf(kn), svOf(kn), mcN);
      var t0 = Date.now(), tDet = 0;
      while (!r.done()) { r.one(); if (!tDet && r.detDone()) tDet = Date.now() - t0; }
      var res = r.result();
      res.msDet = tDet; res.msAll = Date.now() - t0;
      return res;
    };

    /* Small spread: all three propagations have to agree, because that is the
       regime the two Gaussian ones assume. 400 samples, so the Monte Carlo
       mean itself carries about 1.5 % standard error. */
    var SMALL_N = 400;
    ['desert', 'eaf'].forEach(function (id) {
      var L = runAll(T.scenarioById(id), quarter(KN), SMALL_N);
      var dL = L.lin.mean / L.mc.mean - 1, dU = L.ut.mean / L.mc.mean - 1;
      pass('small sigma agreement ' + id, Math.abs(dL) < 0.08 && Math.abs(dU) < 0.04,
        'MC mean ' + L.mc.mean.toFixed(2) + ' a, lin ' + (100 * dL).toFixed(2) +
        ' %, ut ' + (100 * dU).toFixed(2) + ' %, sd MC ' + L.mc.sd.toFixed(2) +
        ' lin ' + L.lin.sigma.toFixed(2) + ' ut ' + L.ut.sigma.toFixed(2));
    });

    /* Default spread: the distribution is skewed, both Gaussians are too
       narrow, and the linearised one puts real mass at negative remaining
       life. */
    ['desert', 'nyc', 'northern', 'eaf'].forEach(function (id) {
      var L = runAll(T.scenarioById(id), KN, SMALL_N);
      pass('skew ' + id, L.mc.median < L.mc.mean,
        'median ' + L.mc.median.toFixed(1) + ' a, mean ' + L.mc.mean.toFixed(1) +
        ' a, ratio ' + (L.mc.median / L.mc.mean).toFixed(3) +
        ', p10 ' + L.mc.p10.toFixed(1) + ' a, p90 ' + L.mc.p90.toFixed(1) + ' a');
      pass('gaussians too narrow ' + id, L.ut.sigma < L.mc.sd && L.lin.sigma < L.ut.sigma,
        'sd MC ' + L.mc.sd.toFixed(1) + ' a, ut ' + L.ut.sigma.toFixed(1) +
        ' a (' + (L.ut.sigma / L.mc.sd).toFixed(2) + 'x), lin ' + L.lin.sigma.toFixed(1) +
        ' a (' + (L.lin.sigma / L.mc.sd).toFixed(2) + 'x)');
      pass('impossible mass ' + id, L.lin.pNeg > 0.01,
        'linearised P(remaining < 0) ' + (100 * L.lin.pNeg).toFixed(1) +
        ' %, unscented ' + (100 * L.ut.pNeg).toFixed(1) + ' %');
      /* The skew fit sits on the same 13 points as the unscented Gaussian, so
         it must keep mean and sd and move the median down, towards the Monte
         Carlo one, and its P(<0) is a shifted-lognormal tail, not a normal
         one, so it cannot be larger than the Gaussian's. */
      var S = L.utSkew;
      pass('skew fit ' + id, !S.fallback && S.median < L.ut.median && S.pNeg <= L.ut.pNeg + 1e-9,
        'skew ' + S.skew.toFixed(3) + ', median ut ' + L.ut.median.toFixed(1) +
        ' a -> skew fit ' + S.median.toFixed(1) + ' a (MC ' + L.mc.median.toFixed(1) +
        ' a), P(<0) ' + (100 * S.pNeg).toFixed(1) + ' % vs ut ' + (100 * L.ut.pNeg).toFixed(1) +
        ' %, shift c ' + S.fit.c.toFixed(1) + ' a');
      /* The survival panel of methods 1 to 3 is analytic, so the curve has to
         cross 0.5 exactly at the median it labels. This is what catches a
         shape wired to the wrong stat object. */
      ['lin', 'ut', 'utSkew'].forEach(function (k) {
        var st = L[k];
        var med = T.shapeQuantile(st, 0.5);
        var sMed = T.shapeSurvival(st, med);
        var s10 = T.shapeSurvival(st, T.shapeQuantile(st, 0.1));
        var s0 = T.shapeSurvival(st, 0);
        pass('survival at median ' + k + ' ' + id, Math.abs(sMed - 0.5) < 1e-6 &&
          Math.abs(s10 - 0.9) < 1e-6,
          'S(median ' + med.toFixed(2) + ' a) = ' + sMed.toFixed(9) + ', S(p10) = ' +
          s10.toFixed(9) + ', S(0) = ' + s0.toFixed(4));
      });
      /* The rate densities are drawn against a log10 axis, so they carry the
         Jacobian v ln(10). Integrated over u the area has to be the
         probability of a positive rate, that is 1 minus the mass the shape
         puts at or below zero. A missing Jacobian misses this by decades. */
      ['rateLin', 'rateUt', 'rateUtSkew'].forEach(function (k) {
        var st = L[k];
        var lo = -8, hi = Math.log(Math.max(1e-9, st.mean + 40 * st.sigma)) / Math.LN10 + 1;
        var nI = 400000, du = (hi - lo) / nI, I = 0, q;
        for (q = 0; q < nI; q++) I += T.shapeLogDensity(st, lo + (q + 0.5) * du) * du;
        var want = 1 - (st.pNeg || 0);
        pass('log-axis rate density integral ' + k + ' ' + id,
          Math.abs(I - want) < 0.01 && I > 0.9,
          'integral ' + I.toFixed(5) + ', expected 1 - P(<0) = ' + want.toFixed(5) +
          ', mean x' + st.mean.toFixed(3) + ', sd x' + st.sigma.toFixed(3));
      });
      pass('sigma points ' + id, L.sigmaPts && L.sigmaPts.y.length === 13,
        L.sigmaPts.y.length + ' points, ' + Math.min.apply(null, L.sigmaPts.y).toFixed(1) +
        ' to ' + Math.max.apply(null, L.sigmaPts.y).toFixed(1) + ' a about the nominal ' +
        L.nom.years.toFixed(1) + ' a');
      pass('timing ' + id, L.msDet < 250,
        L.msDet + ' ms for the 19 deterministic runs, ' + L.msAll + ' ms for ' +
        SMALL_N + ' samples, projected ' + Math.round(L.msAll / SMALL_N * 1000) +
        ' ms for 1000');
    });

    /* ── The exported live year as a Lifetime profile ──────────────────────
       An export with no stage events on it is the configured site, integrated
       over the compressed year instead of over the real one. The two are not
       the same quadrature: the compressed year is 20 diurnal cycles over a
       season that sweeps continuously, the configured year is 365 of them. The
       remaining gap is what this measures, and it is the honest bound on
       reading anything off an exported year. */
    (function () {
      var flatRun = function (prof, kn, mcN) {
        var r = T.lifeRun(prof, mvOf(kn), svOf(kn), mcN);
        while (!r.done()) r.one();
        return r.result();
      };
      ['desert', 'nyc', 'northern', 'eaf'].forEach(function (id) {
        var sc = T.scenarioById(id), P = T.scenarioParams(sc, {});
        var L = T.makeLive(sc, P, { ensN: 0 });
        L.reset(0); L.fillNominal();
        var pf = T.liveProfile(L, null, KN.moist);
        var cfgR = flatRun(profFor(sc), KN, SMALL_N);
        var expR = flatRun(pf, KN, SMALL_N);
        var dNom = expR.nom.years / cfgR.nom.years - 1;
        var dMed = expR.mc.median / cfgR.mc.median - 1;
        var dRate = expR.nom.rate / cfgR.nom.rate - 1;
        pass('exported event-free year reproduces the configuration ' + id,
          Math.abs(dNom) < 0.02 && Math.abs(dMed) < 0.02,
          'nominal remaining ' + cfgR.nom.years.toFixed(1) + ' a from the configuration vs ' +
          expR.nom.years.toFixed(1) + ' a exported (' + (100 * dNom).toFixed(2) +
          ' %), MC median ' + cfgR.mc.median.toFixed(1) + ' vs ' + expR.mc.median.toFixed(1) +
          ' a (' + (100 * dMed).toFixed(2) + ' %), yearly rate ' + (100 * dRate).toFixed(2) + ' %');
      });

      /* A leak in the exported year has to move the answer, and downwards: the
         paper is wetter for most of the year than the configuration says. The
         moisture series is built the way the page builds it, by relaxing
         towards saturation along display time. */
      var sc = T.scenarioById('nyc'), P = T.scenarioParams(sc, {});
      var L = T.makeLive(sc, P, { ensN: 0 });
      L.reset(0); L.fillNominal();
      var W = L.W, m = new Float32Array(W), cur = KN.moist, i;
      for (i = 0; i < W; i++) { m[i] = cur; cur = T.moistStep(cur, T.MOIST_SAT, T.COMP_STRIDE); }
      var dry = T.liveProfile(L, null, KN.moist);
      var wet = T.liveProfile(L, m, KN.moist);
      var rDry = flatRun(dry, KN, SMALL_N), rWet = flatRun(wet, KN, SMALL_N);
      var shift = rWet.mc.median / rDry.mc.median - 1;
      pass('a leak in the exported year shortens the life, city site',
        rWet.mc.median < rDry.mc.median && rWet.nom.years < rDry.nom.years,
        'paper ' + KN.moist + ' % relaxing to ' + m[W - 1].toFixed(2) +
        ' % over the year: MC median ' + rDry.mc.median.toFixed(1) + ' a -> ' +
        rWet.mc.median.toFixed(1) + ' a (' + (100 * shift).toFixed(1) +
        ' %), nominal ' + rDry.nom.years.toFixed(1) + ' a -> ' + rWet.nom.years.toFixed(1) + ' a');

      /* The moisture sigma has to keep acting on an exported year: it is an
         offset on the series there, so the spread must not collapse. */
      var noSig = { sigAmbient: 0, sigModel: 0, sigHs: 0, moist: KN.moist, sigMoist: KN.sigMoist,
        dp0: KN.dp0, sigDp0: 0 };
      var rS = flatRun(wet, noSig, 200);
      pass('moisture sigma still spreads an exported year',
        rS.mc.sd > 0.02 * rS.mc.mean,
        'moisture alone, sigma ' + KN.sigMoist + ' %: mean ' + rS.mc.mean.toFixed(1) +
        ' a, sd ' + rS.mc.sd.toFixed(1) + ' a (' + (100 * rS.mc.sd / rS.mc.mean).toFixed(1) + ' %)');
    })();
  })();
  </script>

  <script id="app">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;
    const html = htm.bind(React.createElement);
    const C = ThermalCore;

    /* Canvas code cannot read var(--) itself, so the palette lives in mutable
       bindings, re-read on `themechange` (see assets/js/theme.js). */
    const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const COL = {};
    function readPalette() {
      Object.assign(COL, {
        emph: cssVar('--tool-emph'), text: cssVar('--tool-text'),
        label: cssVar('--tool-label'), note: cssVar('--tool-note'),
        faint: cssVar('--tool-faint'), border: cssVar('--tool-border'),
        grid: cssVar('--tool-grid'), ink: cssVar('--tool-panel'),
        subtle: cssVar('--tool-subtle'), accent: cssVar('--pico-primary')
      });
    }
    readPalette();

    /* ── Compressed year ──────────────────────────────────────────────────
       20 representative days: the diurnal cycle runs 20 times while the season
       sweeps January to December once. The mapping and the simulation both
       live in ThermalCore (compAmbient, compLoad, simulateCompressedYear), so
       the self-test checks the same expressions the chart draws. Both ends of
       the compressed year carry the same drivers AND the same thermal state
       (see the warm-up in the core), so the series can be scrolled through
       with a plain index wrap and no seam. */
    const DAY_MIN = C.DAY_MIN;
    const COMP_MIN = C.COMP_MIN;
    const STRIDE = C.COMP_STRIDE;         // minutes between stored samples
    const N_OUT = C.COMP_N;               // 14401, first and last sample coincide
    const WRAP = N_OUT - 1;
    const wrapI = (i) => ((i % WRAP) + WRAP) % WRAP;

    /* Fixed y-range per site, with room for the band, so the axis does not jump
       when the ensemble arrives. */
    function tempScale(ring) {
      let lo = Infinity, hi = -Infinity;
      for (let i = 0; i < ring.W; i++) {
        if (ring.thA[i] < lo) lo = ring.thA[i];
        if (ring.thH[i] > hi) hi = ring.thH[i];
      }
      return { lo: Math.floor((lo - 6) / 10) * 10, hi: Math.ceil((hi + 10) / 10) * 10 };
    }

    /* An emergency overload runs the hot spot past the top of that range. Sizing
       every site for an overload that may never be pressed costs 15 to 25 % of
       the lane height, so the range GROWS the first time one is armed and never
       shrinks again: one rescale per session, none afterwards. The bound is the
       quasi-static hot spot of the same year at the raised load, which the tank
       never overtakes. Mutated in place, because the draw reads the same object
       on the next frame. */
    function growForOverload(scale, ring, kScale) {
      let hi = -Infinity;
      for (let i = 0; i < ring.W; i++) {
        const K = Math.max(0.05, Math.min(1.5, ring.K[i] * kScale));
        const s = C.steadyState(K, ring.thA[i], ring.P).thetaH;
        if (s > hi) hi = s;
      }
      const want = Math.ceil((hi + 4) / 10) * 10;
      if (want > scale.hi) scale.hi = want;
    }

    /* ── Live ensemble ────────────────────────────────────────────────────
       100 members over the compressed year, each with its own ambient offset,
       rated-rise and time-constant scale and hot-spot error, drawn from the
       same uncertainty configuration the Lifetime tab propagates. ONE series
       is stored per member, the hot spot. The integration itself is
       ThermalCore.makeLive, which advances the nominal run and all members
       forward with the display cursor and writes into ring buffers; nothing
       here recomputes a year that has already been shown.

       The ageing rate is deliberately not stored. Live moisture is a state
       that moves while the cursor runs (treatment presses it dry, leakage
       pulls it up), so a precomputed rate matrix would be stale the moment
       anyone touched a button. Instead the rate is formed at draw time from
       the stored hot spot and the moisture of that step. rateFromFactor is
       strictly increasing in the hot spot, so the sorted hot-spot blocks give
       sorted rates for free and the confidence slider still indexes straight
       into them.

       Memory: 100 members x 14401 steps x 1 series x 4 bytes = 5.8 MB, plus
       two 14401-entry moisture arrays. Acceptable for a page that holds one
       scenario at a time.

       Layout is time-major (step, then member), for two reasons: the inner
       loop over members writes contiguously, and the per-step quantiles are
       then a plain in-place sort of a contiguous block of 100. Member identity
       is lost by that sort, which is fine: only quantiles are ever drawn.

       Each member gets the same three-day periodic warm-up as the nominal run,
       so the band closes on itself at the year wrap too.

       Fixed seed, so the band is the same on every reload and does not shimmer
       while the chart scrolls. */
    const ENS_N = 100;
    const ENS_SEED = 20260820;

    const OVER_K = 1.25;                  // emergency overload, load multiplier
    const LIVE_BUDGET_MS = 6;             // integration allowance per frame

    /* ── Redraw rate ──────────────────────────────────────────────────────
       The strip chart is a scrolling trend, not a game. On a high-refresh
       panel requestAnimationFrame fires at 240 Hz, and the whole chart would
       then be rasterised 240 times a second for no visible gain. That is not
       free: with the arc-furnace ripple on, nearly every segment of the
       hot-spot path is close to vertical, so a 2.8 px stroke with round joins
       covers on the order of a hundred pixels per segment instead of five,
       times 720 segments, times five curves. The rasteriser falls behind, the
       browser stalls rAF to 20 to 75 ms, and the scroll judders. Capping the
       redraw at about 60 Hz cuts that load by four on such a panel and is
       exactly invisible.
       The CURSOR still advances on every frame: motion is integrated from the
       frame period, so skipping a redraw costs no smoothness, it only stops
       drawing pictures nobody can see. The threshold sits just below a 60 Hz
       vsync period so a 60 Hz display keeps drawing every frame.
       #perfuncap lifts the cap. That is the stress test: an uncapped 240 Hz
       panel asks the rasteriser for four times the work of a 60 Hz one, which
       is a decent stand-in for a 60 Hz machine with a quarter of the graphics
       power. If the frame period stays flat there, it will stay flat on a
       conference laptop. */
    const DRAW_MIN_MS =
      typeof location !== 'undefined' && /perfuncap/.test(location.hash) ? 0 : 15;

    /* ── Frame probe, only on #perf ───────────────────────────────────────
       The Live tab has to hold a steady scroll on a conference laptop, and
       "it stutters" is not a measurement. With the flag set the last 120
       frames are kept and their quantiles are printed into the chart: the
       frame period the browser actually delivered, the time spent
       integrating, and how many samples the frame asked for against the cap
       in advanceTo. Draw times get their own ring, filled only on frames that
       actually drew, so the cap above does not dilute them with zeros; the
       overlay prints how many of the last 120 frames those were. Off, this
       costs nothing but one branch per frame.
       Caveat worth remembering when reading it: a canvas draw call is
       recorded, not executed. Rasterisation happens after the call returns,
       so a low draw time next to a long frame period means the cost is in the
       compositor, not in the JavaScript. */
    /* No word boundary after perf: #perfuncap has to switch on the overlay
       as well as lift the redraw cap, otherwise the stress test runs blind. */
    const PERF = typeof location !== 'undefined' && /(^|[#&])perf/.test(location.hash);
    const PERF_N = 120;
    const perf = {
      dt: new Float32Array(PERF_N), int: new Float32Array(PERF_N),
      smp: new Float32Array(PERF_N), at: 0, n: 0, cap: 0,
      drw: new Float32Array(PERF_N), gap: new Float32Array(PERF_N),
      dAt: 0, dN: 0, dPrev: 0,
      scratch: new Float32Array(PERF_N)
    };
    function perfPush(dtMs, intMs, smp, cap) {
      const i = perf.at;
      perf.dt[i] = dtMs; perf.int[i] = intMs; perf.smp[i] = smp;
      perf.at = (i + 1) % PERF_N;
      if (perf.n < PERF_N) perf.n++;
      perf.cap = cap;
    }
    /* One entry per frame that actually drew: how long the call took, and how
       long since the previous one. The second number is the rate the chart is
       really refreshing at, which is not the frame rate once DRAW_MIN_MS
       starts skipping. */
    function perfDrew(ts, ms) {
      const i = perf.dAt;
      perf.drw[i] = ms;
      perf.gap[i] = perf.dPrev ? ts - perf.dPrev : 0;
      perf.dPrev = ts;
      perf.dAt = (i + 1) % PERF_N;
      if (perf.dN < PERF_N) perf.dN++;
    }
    /* Quantile over the first n entries of a ring. Sorting 120 floats per
       frame is well under the resolution of what is being measured. */
    function perfQ(arr, n, q) {
      if (!n) return 0;
      const s = perf.scratch.subarray(0, n);
      s.set(arr.subarray(0, n));
      s.sort();
      return s[Math.min(n - 1, Math.round(q * (n - 1)))];
    }

    /* ── Live moisture, a ring buffer along display time ──────────────────
       All three Live buttons are STAGE EFFECTS. None of them writes back into
       the Transformer tab, and the Lifetime tab ignores all three unless the
       live year is explicitly exported to it, so the propagation on the other
       tab keeps talking about the configured site until someone says otherwise.

       Moisture is integrated as the cursor advances and stored per display
       step, so the trailing window shows the history: press oil treatment and
       the sag stays visible behind the cursor while it creeps back up. The
       buffer also holds the ready-made rate factor A(m)/RATE_REF for that
       step, which is what keeps the draw down to one exponential per point. */
    function makeMoisture(m0) {
      const m = new Float32Array(N_OUT), fac = new Float32Array(N_OUT);
      const f0 = C.rateFactor(m0);
      m.fill(m0); fac.fill(f0);
      return { m: m, fac: fac, cur: m0, at: -1 };
    }

    /* Fill every step the cursor has crossed since the last frame. A long
       frame or a big speed can cross many; more than one wrap of the buffer
       is pointless, so it is capped at one. */
    function advanceMoisture(ms, idx, target) {
      if (ms.at < 0) {
        ms.at = idx; ms.m[idx] = ms.cur; ms.fac[idx] = C.rateFactor(ms.cur);
        return 0;
      }
      let steps = idx - ms.at;
      if (steps < 0) steps += WRAP;
      if (steps > WRAP) steps = WRAP;
      for (let s = 0; s < steps; s++) {
        ms.at = wrapI(ms.at + 1);
        ms.cur = C.moistStep(ms.cur, target, STRIDE);
        ms.m[ms.at] = ms.cur;
        ms.fac[ms.at] = C.rateFactor(ms.cur);
      }
      return steps;
    }

    /* Oil treatment: a one-shot press, not a mode. It sets the state dry at
       the instant it is pressed and nothing else; the relaxation above then
       carries it back towards whatever the tank is heading for. */
    function treatMoisture(ms, idx) {
      ms.cur = C.MOIST_DRY;
      ms.at = idx;
      ms.m[idx] = ms.cur;
      ms.fac[idx] = C.rateFactor(ms.cur);
    }

    /* ── Decade range for the rate lane ──────────────────────────────────
       Dynamic: the limits follow what is actually inside the trailing window,
       nominal plus the band when it is shown, padded by RATE_PAD decades on
       each side and never narrower than RATE_MIN_SPAN. A fixed range that
       always spanned dry paper to saturation was mostly air.
       rateFromFactor is increasing in the hot spot AND in the moisture factor,
       so the extremes of those two are enough and the window scan stays a pair
       of comparisons per sample, with no exponential in it.
       The limits GLIDE towards that target with a first-order filter of about
       one second of wall clock, so a hot day entering the window slides the
       axis instead of snapping it once per frame. All of this is local to the
       draw path, state included (one object in a ref), so it can be taken out
       again without touching the simulation. */
    const RATE_PAD = 0.3;         // decades of headroom on each side
    const RATE_MIN_SPAN = 1.0;    // decades, never less than this
    const RATE_GLIDE_S = 1.0;     // time constant of the glide, seconds

    function rateTarget(fLo, fHi, tLo, tHi) {
      let lo = Math.log(Math.max(1e-30, C.rateFromFactor(fLo, tLo))) / Math.LN10 - RATE_PAD;
      let hi = Math.log(Math.max(1e-30, C.rateFromFactor(fHi, tHi))) / Math.LN10 + RATE_PAD;
      if (hi - lo < RATE_MIN_SPAN) {
        const mid = 0.5 * (lo + hi);
        lo = mid - 0.5 * RATE_MIN_SPAN;
        hi = mid + 0.5 * RATE_MIN_SPAN;
      }
      return { lo: lo, hi: hi };
    }

    /* ── The live simulation ──────────────────────────────────────────────
       One ring engine per configuration. The nominal year is filled
       synchronously, so the chart is complete on the first frame; the ensemble
       is filled over the following frames, and the display cursor waits for it
       rather than running ahead of a band that does not exist yet. From then
       on both advance with the cursor and stage events act forward only.
       cursorRef is the monotone display clock and is handed in, because the
       fill costs one compressed year of it and the caller has to be told where
       the frontier ended up. */
    function useLive(sc, sig, knobs, cursorRef) {
      const [sim, setSim] = useState(null);

      useEffect(() => {
        const P = C.scenarioParams(sc, {});
        const ring = C.makeLive(sc, P, { ensN: ENS_N, seed: ENS_SEED, knobs: knobs });
        const t0 = performance.now();
        ring.reset(cursorRef.current);
        ring.fillNominal();
        const msNom = performance.now() - t0;
        cursorRef.current = ring.frontierT();
        const base = {
          sig: sig, sc: sc, ring: ring, scale: tempScale(ring),
          ready: false, msNom: msNom, msEns: 0, stepsPerMs: 1
        };
        setSim(base);

        const tEns = performance.now();
        let raf = 0, alive = true;
        const step = () => {
          const s0 = performance.now();
          let done = false;
          while (performance.now() - s0 < 10 && !done) done = ring.fillEnsemble(256);
          if (!done) { raf = requestAnimationFrame(step); return; }
          if (!alive) return;
          const ms = performance.now() - tEns;
          /* What the fill cost is what a produced sample costs, so the frame
             budget below is calibrated on the machine the demo runs on rather
             than on a guess. */
          setSim((s) => (s && s.sig === sig
            ? Object.assign({}, s, {
                ready: true, msEns: ms,
                stepsPerMs: Math.max(0.5, ring.W / Math.max(1, ms))
              })
            : s));
        };
        raf = requestAnimationFrame(step);
        return () => { alive = false; cancelAnimationFrame(raf); };
        // sc and knobs are folded into sig.
      }, [sig]);

      return sim;
    }

    /* ── Drawing helpers ─────────────────────────────────────────────────── */

    /* One series as a path, read through get(i) so the caller can wrap the
       index around the compressed year. Beyond two samples per pixel the column
       min and max are drawn instead, which keeps the arc-furnace jaggedness
       visible in the year view instead of aliasing it into a smooth line. */
    function pathSeries(ctx, get, i0, i1, xOfI, yOf, wPx, stepped) {
      const nPix = Math.max(1, Math.round(wPx));
      const n = i1 - i0 + 1;
      ctx.beginPath();
      if (n <= 2 * nPix) {
        for (let i = i0; i <= i1; i++) {
          const x = xOfI(i), y = yOf(get(i));
          if (i === i0) ctx.moveTo(x, y);
          else if (stepped) { ctx.lineTo(x, yOf(get(i - 1))); ctx.lineTo(x, y); }
          else ctx.lineTo(x, y);
        }
        return;
      }
      const per = n / nPix;
      for (let p = 0; p < nPix; p++) {
        const a = i0 + Math.floor(p * per);
        const b = Math.min(i1, i0 + Math.floor((p + 1) * per) - 1);
        let mn = Infinity, mx = -Infinity;
        for (let i = a; i <= b; i++) { const v = get(i); if (v < mn) mn = v; if (v > mx) mx = v; }
        const x = xOfI(a);
        if (p === 0) ctx.moveTo(x, yOf(mx));
        ctx.lineTo(x, yOf(mx));
        ctx.lineTo(x, yOf(mn));
      }
    }

    function fillBand(ctx, getUp, getDn, i0, i1, xOfI, yOf, wPx) {
      const nPix = Math.max(1, Math.round(wPx));
      const n = i1 - i0 + 1;
      const per = Math.max(1, n / nPix);
      ctx.beginPath();
      let first = true;
      for (let p = 0; p * per < n; p++) {
        const a = i0 + Math.floor(p * per);
        const b = Math.min(i1, i0 + Math.floor((p + 1) * per) - 1);
        let mx = -Infinity;
        for (let i = a; i <= b; i++) { const v = getUp(i); if (v > mx) mx = v; }
        const x = xOfI(a);

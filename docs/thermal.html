        if (first) { ctx.moveTo(x, yOf(mx)); first = false; } else ctx.lineTo(x, yOf(mx));
      }
      for (let p = Math.ceil(n / per) - 1; p >= 0; p--) {
        const a = i0 + Math.floor(p * per);
        const b = Math.min(i1, i0 + Math.floor((p + 1) * per) - 1);
        let mn = Infinity;
        for (let i = a; i <= b; i++) { const v = getDn(i); if (v < mn) mn = v; }
        ctx.lineTo(xOfI(a), yOf(mn));
      }
      ctx.closePath();
    }

    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const MONTH_START = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];

    function dateLabel(dayOfYear) {
      let m = 11;
      for (let i = 0; i < 12; i++) if (dayOfYear >= MONTH_START[i]) m = i;
      return (dayOfYear - MONTH_START[m] + 1) + ' ' + MONTHS[m];
    }

    /* ── The strip chart ──────────────────────────────────────────────────
       Three lanes on one canvas, sharing the x axis: temperature, load, ageing
       rate. "Now" is pinned to the right-hand edge and the curves scroll left
       underneath it, which is what a control-room trend looks like and what
       makes the window a trailing one rather than a fixed frame with a cursor
       running through it.
       The lane heights add up to LIVE_H exactly, and every y mapping below
       reads them as absolute canvas coordinates: change one bound and the
       lanes overlap or leave a gap, so any edit here has to keep the sum. */
    const LIVE_H = 540;
    const LANE = {
      padL: 62, padR: 14,
      tT: 12, tB: 246,      // temperature lane, 234 px
      sep1: 254,
      kT: 262, kB: 386,     // load lane, its band from sep1 to sep2 is 25 % of the canvas
      sep2: 394,
      rT: 414, rB: 522,     // ageing-rate lane, its title sits just under sep2
      xLab: 525
    };
    const K_FULL = 1.4;

    /* Display minutes per real second at speed 1x: one displayed day per ten
       seconds. The speed slider spans 0.5x to 20x on a LOG scale, so the low
       end stays reachable with a mouse and the top end can run the whole
       compressed year in ten seconds. The slider itself carries the log
       position 0 to 1000; the speed is 0.5 * 40^(pos/1000). */
    const LIVE_BASE_RATE = DAY_MIN / 10;
    const SPEED_MIN = 0.5, SPEED_MAX = 20;
    const speedOfPos = (pos) => SPEED_MIN * Math.pow(SPEED_MAX / SPEED_MIN, pos / 1000);
    const posOfSpeed = (v) => Math.round(1000 * Math.log(v / SPEED_MIN) / Math.log(SPEED_MAX / SPEED_MIN));
    const fmtSpeed = (v) => (v >= 10 ? v.toFixed(0) : v.toFixed(1)) + 'x';

    function LiveCanvas({ sim, view, moist, leak, ci, height, cursorRef, drawRef }) {
      const cvRef = useRef(null);
      const [bumpN, bump] = useState(0);
      /* Glide state of the rate lane: current limits, the wall clock they were
         last moved at, and which configuration they belong to. */
      const rsRef = useRef(null);

      useEffect(() => {
        const on = () => bump((n) => n + 1);
        window.addEventListener('resize', on);
        window.addEventListener('themechange', on);
        return () => { window.removeEventListener('resize', on); window.removeEventListener('themechange', on); };
      }, []);

      useEffect(() => {
        const cv = cvRef.current;
        if (!cv) return;
        // Re-read here rather than relying on a listener elsewhere: whoever
        // triggers the redraw, the colours are the ones in effect right now.
        readPalette();
        const rect = cv.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const w = Math.max(1, Math.round(rect.width)), h = height;
        cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
        const ctx = cv.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const x0 = LANE.padL, x1 = w - LANE.padR, wPlot = x1 - x0;

        const draw = () => {
          ctx.clearRect(0, 0, w, h);
          if (!sim || !sim.ring) return;
          const nom = sim.ring, sc = sim.scale;
          const ens = sim.ready ? sim.ring : null;
          const fac = moist.fac;

          /* Trailing window: now sits on the right edge, the past scrolls off
             to the left. */
          const W = view === 'day' ? DAY_MIN : COMP_MIN;
          const t1 = cursorRef.current, t0 = t1 - W;

          const xOfT = (tm) => x0 + (tm - t0) / W * wPlot;
          const xOfI = (i) => xOfT(i * STRIDE);
          const yOfT = (v) => LANE.tB - (v - sc.lo) / (sc.hi - sc.lo) * (LANE.tB - LANE.tT);
          const yOfK = (k) => LANE.kB - Math.max(0, Math.min(K_FULL, k)) / K_FULL * (LANE.kB - LANE.kT);
          const i0 = Math.floor(t0 / STRIDE);
          /* Never past the newest produced sample: the simulation is causal now,
             so the sample the cursor is walking towards does not exist yet. */
          const i1 = Math.floor(t1 / STRIDE);

          const gA = (i) => nom.thA[wrapI(i)];
          const gO = (i) => nom.thO[wrapI(i)];
          const gH = (i) => nom.thH[wrapI(i)];
          const gK = (i) => nom.K[wrapI(i)];
          /* The rate lane is built here, not stored: one exponential per
             point, with the moisture factor of that display step already in
             the ring buffer. About 1200 points in the day view and 14400 in
             the year view, times three curves. */
          const gR = (i) => { const j = wrapI(i); return C.rateFromFactor(fac[j], nom.thH[j]); };
          const gRq = (q) => (i) => {
            const j = wrapI(i);
            return C.rateFromFactor(fac[j], ens.matH[j * ENS_N + q]);
          };

          const idx = C.ciIndices(ENS_N, ci);
          const showBand = ens && ci > 0 && idx[0] < idx[1];
          const colBand = (mat, q) => (i) => mat[wrapI(i) * ENS_N + q];

          /* Rate lane limits from the window, then the glide. Two comparisons
             per sample and no exponential: the rate is increasing in both the
             hot spot and the moisture factor, so their extremes bound it. */
          let tLo = Infinity, tHi = -Infinity, fLo = Infinity, fHi = -Infinity;
          for (let i = i0; i <= i1; i++) {
            const j = wrapI(i);
            const f = fac[j];
            if (f < fLo) fLo = f;
            if (f > fHi) fHi = f;
            let a = nom.thH[j], b = a;
            if (showBand) {
              const u = ens.matH[j * ENS_N + idx[0]], v = ens.matH[j * ENS_N + idx[1]];
              if (u < a) a = u;
              if (v > b) b = v;
            }
            if (a < tLo) tLo = a;
            if (b > tHi) tHi = b;
          }
          const want = rateTarget(fLo, fHi, tLo, tHi);
          const now = performance.now();
          let rs = rsRef.current;
          if (!rs || rs.sig !== sim.sig || !isFinite(rs.lo)) {
            rs = { sig: sim.sig, lo: want.lo, hi: want.hi, at: now };
            rsRef.current = rs;
          } else {
            const dtS = Math.max(0, Math.min(0.25, (now - rs.at) / 1000));
            const a = 1 - Math.exp(-dtS / RATE_GLIDE_S);
            rs.lo += (want.lo - rs.lo) * a;
            rs.hi += (want.hi - rs.hi) * a;
            rs.at = now;
          }
          const yOfR = (v) => {
            const l = Math.log(v > 1e-30 ? v : 1e-30) / Math.LN10;
            const f = Math.max(0, Math.min(1, (l - rs.lo) / (rs.hi - rs.lo)));
            return LANE.rB - f * (LANE.rB - LANE.rT);
          };

          // Temperature axis and its grid.
          const span = sc.hi - sc.lo;
          const tick = span <= 70 ? 10 : span <= 140 ? 20 : 25;
          ctx.save();
          ctx.font = '13px system-ui, sans-serif';
          ctx.textAlign = 'right';
          ctx.textBaseline = 'middle';
          for (let v = Math.ceil(sc.lo / tick) * tick; v <= sc.hi; v += tick) {
            const y = yOfT(v);
            ctx.strokeStyle = COL.grid;
            ctx.globalAlpha = 0.22;
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
            ctx.globalAlpha = 1;
            ctx.fillStyle = COL.note;
            ctx.fillText(v + ' C', x0 - 10, y);
          }
          ctx.restore();

          /* Vertical grid plus the x labels. The window scrolls, so the label
             positions are computed from the window, not from a fixed frame. */
          const marks = [];
          if (view === 'day') {
            const first = Math.ceil(t0 / 240) * 240;
            for (let t = first; t <= t1; t += 240) {
              const hAt = Math.round((((t % DAY_MIN) + DAY_MIN) % DAY_MIN) / 60) % 24;
              marks.push([t, (hAt < 10 ? '0' : '') + hAt + ':00']);
            }
          } else {
            const base = Math.floor(t0 / COMP_MIN) * COMP_MIN;
            for (let c = 0; c <= 1; c++) {
              for (let m = 0; m < 12; m++) {
                const t = base + c * COMP_MIN + MONTH_START[m] / 365 * COMP_MIN;
                if (t >= t0 && t <= t1) marks.push([t, MONTHS[m]]);
              }
            }
          }
          ctx.save();
          ctx.font = '13px system-ui, sans-serif';
          ctx.textBaseline = 'top';
          ctx.textAlign = view === 'day' ? 'center' : 'left';
          marks.forEach((mk) => {
            const x = xOfT(mk[0]);
            ctx.strokeStyle = COL.grid; ctx.globalAlpha = 0.18; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(x, LANE.tT); ctx.lineTo(x, LANE.rB); ctx.stroke();
            ctx.globalAlpha = 1;
            ctx.fillStyle = COL.note;
            ctx.fillText(mk[1], x + (view === 'day' ? 0 : 4), LANE.xLab);
          });
          ctx.restore();

          // Everything that carries a temperature stays inside its lane.
          ctx.save();
          ctx.beginPath(); ctx.rect(x0, LANE.tT, wPlot, LANE.tB - LANE.tT); ctx.clip();
          if (showBand) {
            ctx.fillStyle = COL.accent;
            ctx.globalAlpha = 0.17;
            fillBand(ctx, colBand(ens.matH, idx[1]), colBand(ens.matH, idx[0]),
              i0, i1, xOfI, yOfT, wPlot);
            ctx.fill();
            ctx.globalAlpha = 1;
          }
          /* Bevel, not round. A round join is a tessellated arc cap at every
             vertex, and with the arc-furnace ripple on there are 720 vertices
             per curve, nearly all of them a sharp reversal: that is the
             expensive case for the rasteriser. A bevel is one triangle. On a
             smooth site the joins are almost straight and the two are
             indistinguishable; on a rippled one the difference is the tip of
             each spike, well under a pixel at these widths. The static charts
             on the Lifetime tab keep round joins, they are drawn once. */
          ctx.lineJoin = 'bevel';
          ctx.strokeStyle = COL.note; ctx.lineWidth = 1.2;
          pathSeries(ctx, gA, i0, i1, xOfI, yOfT, wPlot, false); ctx.stroke();
          ctx.strokeStyle = COL.text; ctx.lineWidth = 1.9;
          pathSeries(ctx, gO, i0, i1, xOfI, yOfT, wPlot, false); ctx.stroke();
          ctx.strokeStyle = COL.accent; ctx.lineWidth = 2.8;
          pathSeries(ctx, gH, i0, i1, xOfI, yOfT, wPlot, false); ctx.stroke();
          ctx.restore();

          // Lane separators: two panels on one canvas, not one crowded plot.
          const hair = (y) => {
            ctx.save();
            ctx.strokeStyle = COL.border;
            ctx.globalAlpha = 0.55;
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(x0 - LANE.padL + 2, y + 0.5); ctx.lineTo(x1, y + 0.5); ctx.stroke();
            ctx.restore();
          };
          hair(LANE.sep1);
          hair(LANE.sep2);

          // Load lane: same x, its own tiny axis.
          ctx.save();
          ctx.beginPath(); ctx.rect(x0, LANE.kT - 2, wPlot, LANE.kB - LANE.kT + 4); ctx.clip();
          ctx.strokeStyle = COL.faint;
          ctx.globalAlpha = 0.5;
          ctx.setLineDash([3, 4]);
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(x0, yOfK(1)); ctx.lineTo(x1, yOfK(1)); ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = 1;
          ctx.strokeStyle = COL.faint; ctx.lineWidth = 1.4;
          pathSeries(ctx, gK, i0, i1, xOfI, yOfK, wPlot, true); ctx.stroke();
          ctx.restore();

          ctx.save();
          ctx.font = '12px system-ui, sans-serif';
          ctx.fillStyle = COL.note;
          ctx.textAlign = 'right';
          ctx.textBaseline = 'middle';
          ctx.fillText('0.5', x0 - 10, yOfK(0.5));
          ctx.fillStyle = COL.faint;
          ctx.fillText('K = 1', x0 - 10, yOfK(1));
          ctx.font = '600 11px system-ui, sans-serif';
          ctx.fillStyle = COL.note;
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';
          ctx.fillText('LOAD', x0 + 4, LANE.sep1 + 5);
          ctx.restore();

          // Ageing-rate lane, log axis: the same year spans decades.
          ctx.save();
          ctx.font = '12px system-ui, sans-serif';
          ctx.fillStyle = COL.note;
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';
          ctx.fillText('aging rate, dry paper at 98 C = 1'
            + ', paper ' + moist.cur.toFixed(2) + ' %' + (leak ? ', leaking' : ''),
            x0 + 4, LANE.sep2 + 5);
          ctx.textAlign = 'right';
          ctx.textBaseline = 'middle';
          for (let d = Math.ceil(rs.lo - 1e-9); d <= rs.hi + 1e-9; d++) {
            const v = Math.pow(10, d), y = yOfR(v);
            ctx.strokeStyle = COL.grid;
            ctx.globalAlpha = 0.22;
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
            ctx.globalAlpha = 1;
            ctx.fillStyle = COL.note;
            ctx.fillText(d >= 0 ? String(v) : v.toFixed(-d), x0 - 10, y);
          }
          ctx.restore();

          ctx.save();
          ctx.beginPath(); ctx.rect(x0, LANE.rT, wPlot, LANE.rB - LANE.rT); ctx.clip();
          if (showBand) {
            ctx.fillStyle = COL.accent;
            ctx.globalAlpha = 0.17;
            fillBand(ctx, gRq(idx[1]), gRq(idx[0]), i0, i1, xOfI, yOfR, wPlot);
            ctx.fill();
            ctx.globalAlpha = 1;
          }
          // The reference: dry paper at 98 C ages at 1.
          if (rs.lo <= 0 && rs.hi >= 0) {
            ctx.strokeStyle = COL.faint;
            ctx.globalAlpha = 0.7;
            ctx.setLineDash([4, 4]);
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(x0, yOfR(1)); ctx.lineTo(x1, yOfR(1)); ctx.stroke();
            ctx.setLineDash([]);
            ctx.globalAlpha = 1;
          }
          ctx.strokeStyle = COL.accent; ctx.lineWidth = 2.2;
          ctx.lineJoin = 'bevel';   // same reason as the temperature lane
          pathSeries(ctx, gR, i0, i1, xOfI, yOfR, wPlot, false); ctx.stroke();
          ctx.restore();

          // Now: the right-hand edge, and the date it stands on.
          ctx.save();
          ctx.strokeStyle = COL.emph;
          ctx.globalAlpha = 0.8;
          ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(x1 - 0.5, LANE.tT); ctx.lineTo(x1 - 0.5, LANE.rB); ctx.stroke();
          ctx.restore();

          ctx.save();
          ctx.font = '600 15px system-ui, sans-serif';
          ctx.fillStyle = COL.label;
          ctx.textAlign = 'right';
          ctx.textBaseline = 'top';
          const tNow = ((t1 % COMP_MIN) + COMP_MIN) % COMP_MIN;
          const clock = Math.floor(tNow % DAY_MIN);
          const hh = Math.floor(clock / 60), mm = clock % 60;
          ctx.fillText(dateLabel(C.compDayOfYear(tNow)) + ', ' +
            (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm,
            x1 - 6, LANE.tT + 2);
          ctx.restore();

          /* The frame probe. Drawn last so it sits on top, and it reports the
             PREVIOUS frame's draw time, which is what the ring holds at this
             point. p50 next to p99 is the whole point: a stutter is a tail,
             not a mean. */
          if (PERF && perf.n > 4) {
            ctx.save();
            ctx.font = '12px ui-monospace, Consolas, monospace';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            const txt = 'frame ' + perfQ(perf.dt, perf.n, 0.5).toFixed(1) + ' / ' +
              perfQ(perf.dt, perf.n, 0.99).toFixed(1) + ' ms   int ' +
              perfQ(perf.int, perf.n, 0.5).toFixed(2) + ' / ' +
              perfQ(perf.int, perf.n, 0.99).toFixed(2) +
              '   draw ' + perfQ(perf.drw, perf.dN, 0.5).toFixed(2) + ' / ' +
              perfQ(perf.drw, perf.dN, 0.99).toFixed(2) +
              '   redraw ' + perfQ(perf.gap, perf.dN, 0.5).toFixed(1) + ' / ' +
              perfQ(perf.gap, perf.dN, 0.99).toFixed(1) +
              ' ms   smp ' + perfQ(perf.smp, perf.n, 0.5).toFixed(0) + ' / ' +
              perfQ(perf.smp, perf.n, 0.99).toFixed(0) + ' of ' + perf.cap +
              '   dpr ' + dpr.toFixed(2);
            const wTx = ctx.measureText(txt).width;
            ctx.fillStyle = COL.ink;
            ctx.globalAlpha = 0.82;
            ctx.fillRect(x0 + 2, LANE.tT + 24, wTx + 12, 19);
            ctx.globalAlpha = 1;
            ctx.fillStyle = COL.emph;
            ctx.fillText(txt, x0 + 8, LANE.tT + 27);
            ctx.restore();
          }
        };

        drawRef.current = draw;
        draw();
        return () => { if (drawRef.current === draw) drawRef.current = null; };
      }, [sim, view, moist, leak, ci, height, bumpN, cursorRef, drawRef]);

      return html`
        <canvas ref=${cvRef} className="tw-stage th-stage"
          style=${{ height: height + 'px' }} />
      `;
    }

    /* ── Formatting ──────────────────────────────────────────────────────── */

    function fmtV(v) {
      if (!isFinite(v)) return '-';
      if (v >= 100) return v.toFixed(0);
      if (v >= 10) return v.toFixed(1);
      if (v >= 1) return v.toFixed(2);
      return String(Number(v.toPrecision(2)));
    }

    function Seg({ items, value, onChange, className }) {
      return html`
        <div className=${className || 'th-segs'}>
          ${items.map((it) => html`
            <button key=${it.id} type="button"
              className=${'lang-seg th-seg' + (it.id === value ? ' active' : '')}
              onClick=${() => onChange(it.id)}>${it.label}</button>
          `)}
        </div>
      `;
    }

    function Tabs({ items, value, onChange }) {
      return html`
        <div className="tabstrip" role="tablist">
          ${items.map((it) => html`
            <button key=${it.id} type="button" role="tab"
              aria-selected=${it.id === value ? 'true' : 'false'}
              className=${it.id === value ? 'active' : ''}
              onClick=${() => onChange(it.id)}>${it.label}</button>
          `)}
        </div>
      `;
    }

    /* The Model tab is static prose: what is modelled, what is assumed, what
       is deliberately absent. It answers the questions the other tabs raise,
       in the order they come up. */
    function Model() {
      return html`
        <div className="th-model">
          <h3>thermal model</h3>
          <p>IEC 60076-7 loading guide, difference-equation form, cooling fixed at ONAN,
            integrated with a second-order scheme. Load factor and ambient temperature go in;
            top-oil and hot-spot temperature come out. Constants are the standard's values for
            medium and large power transformers. Ambient is low-passed with the oil time
            constant before the tank feels it; a steel box holding tonnes of oil does not
            read the thermometer in real time.</p>

          <h3>the compressed year</h3>
          <p>The Live tab shows 20 representative days: the seasonal envelope sweeps January
            to December once while the daily cycle runs 20 times, and each displayed day is
            thermally a real day. The daily temperature shape follows Parton and Logan (1981),
            with day length from latitude. A warm-up run makes the year periodic. All
            scenarios are synthetic; no real site data is involved.</p>

          <h3>aging</h3>
          <p>Paper ages with temperature and water. The rate follows Ekenstam kinetics,
            1/DP − 1/DP0 = k·t with k = A·exp(−Ea/RT); A grows roughly thirtyfold from dry
            paper to 3-4 % water (Lundgaard 2004, CIGRE TB 738). The rate lane is normalised
            so dry paper at a 98 °C hot-spot reads 1. End of life is DP 200. Oil treatment,
            leakage and emergency overload are display-time events: they change the Live
            curves from the moment they happen and change nothing else.</p>

          <h3>lifetime</h3>
          <p>The Lifetime tab simulates one full year from the configuration, converts that
            year's DP consumption into remaining years, and assumes the year repeats until
            DP 200. Every number on that tab inherits this assumption. The Live animation
            and its events stay out of it, unless you press "use this year in Lifetime",
            which swaps the exported year in as the one that repeats.</p>

          <h3>uncertainty</h3>
          <p>Six inputs are uncertain: ambient offset, two model parameters, hot-spot error,
            moisture, starting DP. Four methods propagate them. Linearisation assumes the
            model is linear; it is not, and the resulting Gaussian contains transformers that
            fail before they were built. The unscented transform sends 13 points through the
            model and estimates the width more honestly, which puts more mass below zero, not
            less; the shape was the problem, not the width. The skew fit keeps the third
            moment of those same 13 points. Monte Carlo runs the model a thousand times and
            counts. The methods disagree. The switch is there so you can watch them do it.</p>
          <p>The skew fit uses a shifted lognormal because the mechanism is multiplicative:
            the aging rate is exponential in temperature, so Gaussian temperature errors
            become factors on the rate, and remaining life is a budget divided by that rate.
            The log of such a quantity is close to Gaussian, so the fit happens on the right
            scale; the shift is the third parameter that lets mean, width and skew all
            match.</p>

          <h3>deliberately missing</h3>
          <p>Fans (ONAN only), manufacturer data. Every number comes from public standards
            and papers.</p>

          <p className="th-src">Sources: IEC 60076-7:2018; IEC 60076-2; CIGRE TB 738 (2018);
            Lundgaard et al., IEEE Trans. Power Delivery 19(1), 2004; Parton and Logan,
            Agricultural Meteorology 23, 1981.</p>
        </div>
      `;
    }

    /* One slider in the live control row. */
    function Ctl({ id, label, min, max, step, value, format, onChange }) {
      return html`
        <div className="th-ctl">
          <label htmlFor=${id}>${label}</label>
          <input id=${id} type="range" min=${min} max=${max} step=${step} value=${value}
            onChange=${(e) => onChange(parseFloat(e.target.value))} />
          <span className="th-ctlval">${format(value)}</span>
        </div>
      `;
    }

    /* ── Info button and popover ──────────────────────────────────────────
       A small round "i" next to a label, opening a box that floats above the
       page instead of expanding inline, so opening one never pushes the rows
       below it out of view. Closes on Escape, on its own close button and on a
       click anywhere outside. Only one is open at a time, which the caller
       enforces by holding a single key. */
    function InfoBtn({ open, toggle, label }) {
      return html`
        <button type="button" className="th-info" onClick=${toggle} aria-expanded=${open}
          aria-label=${(open ? 'hide' : 'show') + ' note on ' + label}>i</button>
      `;
    }

    function Popover({ children, close }) {
      const ref = useRef(null);
      const [dx, setDx] = useState(0);

      useEffect(() => {
        const el = ref.current;
        if (el && el.getBoundingClientRect) {
          const r = el.getBoundingClientRect(), pad = 12;
          let d = 0;
          if (r.left < pad) d = pad - r.left;
          else if (r.right > window.innerWidth - pad) d = window.innerWidth - pad - r.right;
          if (d) setDx(Math.round(d));
        }
        const onKey = (e) => { if (e.key === 'Escape') close(); };
        const onDown = (e) => {
          const el2 = ref.current;
          if (!el2 || (el2.contains && el2.contains(e.target))) return;
          const anchor = el2.parentElement;
          if (anchor && anchor.contains(e.target) && e.target.closest &&
            e.target.closest('.th-info')) return;
          close();
        };
        document.addEventListener('keydown', onKey);
        document.addEventListener('mousedown', onDown);
        return () => {
          document.removeEventListener('keydown', onKey);
          document.removeEventListener('mousedown', onDown);
        };
      }, []);

      /* The multiplication sign is written as the character: htm does not
         decode HTML entities, it would render the literal string. */
      return html`
        <div className="th-pop" ref=${ref} role="tooltip"
          style=${{ transform: 'translateX(calc(-50% + ' + dx + 'px))', '--arrow': 'calc(50% - ' + dx + 'px)' }}>
          <button type="button" className="th-popclose" onClick=${close}
            aria-label="close note">×</button>
          ${children}
        </div>
      `;
    }

    /* ── Transformer tab ──────────────────────────────────────────────────
       Labels are plain English on purpose: this is shown to an audience that
       reads conference English, not textbook English. Latinate meteorological
       vocabulary and abstract words like amplitude mean nothing at a glance,
       so every label says what the number does instead. The unit stays in its
       own slot on the right, and every row carries one sentence of background
       behind the info button. */
    const SITE_AMBIENT = [
      { k: 'ambMean', label: 'yearly average', unit: 'C', min: -40, max: 45, step: 1,
        info: 'Air temperature around the tank, averaged over the year, in degrees C.' },
      { k: 'ambYearAmp', label: 'seasonal swing', unit: 'K', min: 0, max: 30, step: 0.5,
        info: 'Half the difference between the warmest and the coldest time of year, in kelvin.' },
      { k: 'ambDayAmp', label: 'day/night swing', unit: 'K', min: 0, max: 25, step: 0.5,
        info: 'Peak-to-peak spread over one day is twice this number, in kelvin. Diurnal shape after Parton and Logan (1981): a truncated sine by day, an exponential decay by night.' },
      { k: 'ambLat', label: 'latitude', unit: 'deg', min: 0, max: 66, step: 1,
        info: 'Site latitude in degrees, north or south alike; sets how the day length varies over the year.' }
    ];
    const SITE_LOAD = [
      { k: 'loadBase', label: 'average load', unit: 'pu', min: 0.05, max: 1.4, step: 0.01,
        info: 'Mean load in per unit of nameplate current.' },
      { k: 'loadDayAmp', label: 'day/night swing', unit: 'pu', min: 0, max: 0.6, step: 0.01,
        info: 'Half the difference between the daily peak and the daily minimum, in per unit.' },
      { k: 'loadDayPeakH', label: 'peak at hour', unit: 'h', min: 0, max: 23, step: 1,
        info: 'Clock hour of the daily load peak, 0 to 23.' },
      { k: 'loadSeasonAmp', label: 'seasonal swing', unit: 'pu', min: 0, max: 0.5, step: 0.01,
        info: 'Half the difference between the busiest and the quietest season, in per unit.' },
      { k: 'loadFastAmp', label: 'furnace ripple', unit: 'x', min: 0, max: 2, step: 0.05,
        info: 'Strength of minute-scale load swings, as a multiple of the arc-furnace preset. 0 is a smooth feeder; 1 swings between about 0.3 and 1.1 pu within minutes.' },
      { k: 'oilFloor', label: 'oil heater floor', unit: 'C', min: -40, max: 40, step: 1,
        info: 'Lowest top-oil temperature the tank heaters hold, in degrees C. Set it far below the local winter and it simply never acts.' }
    ];
    const PAPER_FIELDS = [
      { k: 'moist', label: 'paper moisture', unit: '%', min: 0.3, max: 6, step: 0.1,
        info: 'Water in the insulation paper, in percent of paper mass. It multiplies the ageing rate: 1.5 % ages about five times as fast as dry paper at the same hot spot, 3.5 % about thirty-three times.' },
      { k: 'dp0', label: 'DP today', unit: '', min: 400, max: 1400, step: 10,
        info: 'Degree of polymerisation of the paper right now. New paper is about 1000, end of life is 200.' }
    ];
    /* Three disjoint error sources, in the order they enter the model: what
       goes in, what the model is parametrised with, and what the model class
       gets wrong after both of those are right. Named that way on purpose, so
       the three do not read as three tries at the same number. */
    const SIGMA_FIELDS = [
      { k: 'sigAmbient', label: 'ambient sensor', unit: 'K', min: 0, max: 5, step: 0.1,
        info: 'Measurement error of the ambient probe, one standard deviation, in kelvin. Sun on the sensor or a badly placed one is worth several kelvin.' },
      { k: 'sigModel', label: 'parameters', unit: '%', min: 0, max: 15, step: 0.5,
        info: 'Spread of the type-test values within heat-run tolerances, one standard deviation, in percent. It scales the rated top-oil rise, and twice that the oil time constant.' },
      { k: 'sigHs', label: 'model residual', unit: 'K', min: 0, max: 6, step: 0.1,
        info: 'What is left once ambient and parameters are right: the model class itself misses measured hot spots by a few kelvin (hot-spot factor, exponents, harmonics), as fibre-optic probes show wherever they are installed.' },
      { k: 'sigMoist', label: 'moisture', unit: '%', min: 0, max: 1.5, step: 0.05,
        info: 'Uncertainty on the paper moisture, one standard deviation, in percent of paper mass. Moisture is rarely measured directly, so this is usually large.' },
      { k: 'sigDp0', label: 'DP today', unit: '', min: 0, max: 200, step: 5,
        info: 'Uncertainty on the current degree of polymerisation, one standard deviation. Without a paper sample this is an educated guess.' }
    ];
    const SITE_FIELDS = SITE_AMBIENT.concat(SITE_LOAD);
    const KNOB_DEF = { sigAmbient: 2, sigModel: 5, sigHs: 3, moist: 1.5, sigMoist: 0.7, dp0: 1000, sigDp0: 100 };

    /* A row is a div and not a label: a label would hand every click on the
       info button straight to the number input next to it. */
    function NumRow({ spec, value, onChange, open, setOpen }) {
      const id = 'th-f-' + spec.k;
      return html`
        <div className="th-row">
          <span className="th-anchor">
            <label htmlFor=${id}>${spec.label}</label>
            <${InfoBtn} open=${open} label=${spec.label}
              toggle=${() => setOpen(open ? null : spec.k)} />
            ${open ? html`<${Popover} close=${() => setOpen(null)}>${spec.info}<//>` : null}
          </span>
          <span>
            <input id=${id} type="number" min=${spec.min} max=${spec.max} step=${spec.step}
              value=${value}
              onChange=${(e) => {
                const v = parseFloat(e.target.value);
                if (isFinite(v)) onChange(spec.k, Math.max(spec.min, Math.min(spec.max, v)));
              }} />
            <span className="th-unit">${spec.unit}</span>
          </span>
        </div>
      `;
    }

    /* One framed block with its title on the frame. title takes a node, not
       just a string: the sigma block carries markup in its heading. The
       optional className is how a block gets placed in the grid; blocks
       inside a stack do not need one. */
    function Group({ title, className, children }) {
      return html`
        <section className=${'th-group' + (className ? ' ' + className : '')}>
          <h2 className="th-h2">${title}</h2>
          ${children}
        </section>
      `;
    }

    function Transformer({ site, cfg, setSite, setCfgField, knobs, setKnob }) {
      const [openInfo, setOpenInfo] = useState(null);
      const chips = C.SCENARIOS.map((s) => ({ id: s.id, label: s.label }))
        .concat([{ id: 'custom', label: 'Custom' }]);
      const rows = (specs, values, onChange) => specs.map((s) => html`
        <${NumRow} key=${s.k} spec=${s} value=${values[s.k]} onChange=${onChange}
          open=${openInfo === s.k} setOpen=${setOpenInfo} />
      `);
      return html`
        <div className="th-cfg">
          <${Group} className="th-cfgsite" title="site">
            <${Seg} className="th-chips" items=${chips} value=${site} onChange=${setSite} />
          <//>

          <div className="th-cfgcol th-cfgleft">
            <${Group} title="air around the tank">
              ${rows(SITE_AMBIENT, cfg, setCfgField)}
            <//>
            <${Group} title="load">
              ${rows(SITE_LOAD, cfg, setCfgField)}
              <div className="th-row">
                <span className="th-anchor">
                  <span>busiest season</span>
                  <${InfoBtn} open=${openInfo === 'season'} label="busiest season"
                    toggle=${() => setOpenInfo(openInfo === 'season' ? null : 'season')} />
                  ${openInfo === 'season' ? html`<${Popover} close=${() => setOpenInfo(null)}>
                    Which half of the year carries the seasonal load peak. Summer means cooling load, so heavy load meets warm oil; winter means electric heating, so heavy load meets cold oil, which is much kinder to the paper.
                  <//>` : null}
                </span>
                <span>
                  <${Seg} items=${[{ id: 0, label: 'summer' }, { id: 1, label: 'winter' }]}
                    value=${cfg.loadWinterPeak ? 1 : 0}
                    onChange=${(v) => setCfgField('loadWinterPeak', v)} />
                </span>
              </div>
            <//>
          </div>

          <div className="th-cfgcol th-cfgright">
            <${Group} title="paper">
              ${rows(PAPER_FIELDS, knobs, setKnob)}
            <//>
            <${Group} title=${html`how well do we know it <span className="th-cased">(1 sigma)</span>`}>
              ${rows(SIGMA_FIELDS, knobs, setKnob)}
            <//>
          </div>
        </div>
      `;
    }

    /* ── Lifetime tab ─────────────────────────────────────────────────────
       Remaining years to DP 200, propagated four ways through the same
       year-long model. The propagation itself is in ThermalCore (lifeRun);
       everything below only schedules it and draws the result. */

    const SQRT2PI = Math.sqrt(2 * Math.PI);
    const NBIN = 60;
    const MC_BUDGET_MS = 10;      // work per animation frame while sampling
    const DEBOUNCE_MS = 150;

    /* The hot-spot error is a zero-mean uncertainty, not an offset anybody
       dials in: nothing on the page shifts its mean. */
    function meanVec(kn) { return [0, 1, 1, 0, kn.moist, kn.dp0]; }
    function sigmaVec(kn) {
      return [kn.sigAmbient, kn.sigModel / 100, 2 * kn.sigModel / 100, kn.sigHs, kn.sigMoist, kn.sigDp0];
    }

    /* One cached year per site, built on first use and kept. The arc furnace
       runs its Monte Carlo year at 4 min with four averaged sub-samples instead
       of its native 1 min step: 6 ms per sample instead of 24 ms, with year
       means inside 0.7 % (see the self-test). */
    const PROFILES = {};
    function mcProfile(sc, sig) {
      if (!PROFILES[sig]) {
        PROFILES[sig] = sc.dtMin >= 4
          ? C.buildProfile(sc, sc.dtMin, 1)
          : C.buildProfile(sc, 4, Math.round(4 / sc.dtMin));
      }
      return PROFILES[sig];
    }

    /* ── Panel drawing ───────────────────────────────────────────────────── */

    /* Same canvas pattern as the Duval page: fixed CSS height, backing store
       at device resolution, redrawn on every render and on theme or size
       change. */
    function useCanvas(height, draw) {
      const cvRef = useRef(null);
      const [, bump] = useState(0);
      useEffect(() => {
        const on = () => bump((n) => n + 1);
        window.addEventListener('resize', on);
        window.addEventListener('themechange', on);
        return () => { window.removeEventListener('resize', on); window.removeEventListener('themechange', on); };
      }, []);
      useEffect(() => {
        const cv = cvRef.current;
        if (!cv) return;
        readPalette();
        const rect = cv.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const w = Math.max(1, Math.round(rect.width)), h = height;
        cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
        const ctx = cv.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);
        draw(ctx, w, h);
      });
      return cvRef;
    }

    function niceStep(span, target) {
      const raw = Math.abs(span) / Math.max(1, target);
      if (!(raw > 0)) return 1;
      const p = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
      const m = raw / p;
      return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p;
    }
    function niceCeil(v) {
      if (!(v > 0)) return 1;
      const s = niceStep(v, 4);
      return Math.ceil(v / s) * s;
    }
    /* Axis labels for years: 2.5 as well as 2500 have to stay short. */
    function fmtAx(v) {
      const a = Math.abs(v);
      if (a >= 1000) return (v / 1000).toFixed(a >= 9500 ? 0 : 1) + 'k';
      if (a >= 10 || a < 1e-9) return v.toFixed(0);
      return v.toFixed(1);
    }
    function fmtYears(v) {
      if (!isFinite(v)) return '-';
      const a = Math.abs(v);
      if (a >= 100) return v.toFixed(0);
      if (a >= 10) return v.toFixed(1);
      return v.toFixed(2);
    }
    function fmtRate(v) {
      if (!isFinite(v) || v <= 0) return '-';
      if (v >= 100) return v.toFixed(0);
      if (v >= 10) return v.toFixed(1);
      if (v >= 1) return v.toFixed(2);
      return String(Number(v.toPrecision(2)));
    }

    function xAxis(ctx, x0, x1, yB, lo, hi, step, fmt) {
      ctx.save();
      ctx.strokeStyle = COL.border;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.85;
      ctx.beginPath(); ctx.moveTo(x0, yB + 0.5); ctx.lineTo(x1, yB + 0.5); ctx.stroke();
      ctx.font = '13px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      const first = Math.ceil(lo / step - 1e-9) * step;
      for (let v = first; v <= hi + 1e-9; v += step) {
        const x = x0 + (v - lo) / (hi - lo) * (x1 - x0);
        ctx.globalAlpha = 0.7;
        ctx.beginPath(); ctx.moveTo(x, yB); ctx.lineTo(x, yB + 4); ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.fillStyle = COL.note;
        ctx.fillText(fmt(v), x, yB + 6);
      }
      ctx.restore();
    }

    /* Mean and median as ticks over the shape. Where a propagation asserts
       that the two coincide they are labelled once, which is the difference
       to the skewed shapes next to it. */
    function markers(ctx, xMean, xMed, yT, yB, x0, x1, labMean, labMed) {
      ctx.save();
      ctx.strokeStyle = COL.emph;
      ctx.lineWidth = 1.4;
      ctx.globalAlpha = 0.72;   // annotation, not data
      const tick = (x, dash) => {
        if (x < x0 - 1 || x > x1 + 1) return;
        ctx.setLineDash(dash);
        ctx.beginPath(); ctx.moveTo(x, yT - 4); ctx.lineTo(x, yB); ctx.stroke();
        ctx.setLineDash([]);
      };
      tick(xMean, [4, 3]);
      tick(xMed, []);
      ctx.globalAlpha = 1;
      ctx.font = '13px system-ui, sans-serif';
      ctx.fillStyle = COL.label;
      ctx.textBaseline = 'top';
      const put = (x, y, text) => {
        ctx.textAlign = 'center';
        const half = ctx.measureText(text).width / 2 + 2;
        ctx.fillText(text, Math.max(x0 + half, Math.min(x1 - half, x)), y);
      };
      if (Math.abs(xMean - xMed) < 8) {
        put(xMean, yT - 36, 'mean = median ' + labMean);
      } else {
        put(xMean, yT - 36, 'mean ' + labMean);
        put(xMed, yT - 20, 'median ' + labMed);
      }
      ctx.restore();
    }

    /* The one large distribution. All four methods share the x range and the y
       density scale, computed once per result set, so switching the method is a
       pure change of shape. */
    function DistPanel({ method, life, view, height }) {
      const cvRef = useCanvas(height, (ctx, w, h) => {
        if (!life || !view) return;
        const range = view.range, yMax = view.yMax;
        const x0 = 12, x1 = w - 12, yT = 46, yB = h - 30;
        const xOf = (v) => x0 + (v - range.lo) / (range.hi - range.lo) * (x1 - x0);
        const yOf = (d) => yB - Math.max(0, Math.min(1, d / yMax)) * (yB - yT);

        const stat = life[method === 'utskew' ? 'utSkew' : method];
        if (!stat) return;

        // Everything left of zero is remaining life that cannot exist.
        if (range.lo < 0) {
          const xz = xOf(0);
          ctx.save();
          ctx.fillStyle = COL.faint;
          ctx.globalAlpha = 0.14;
          ctx.fillRect(x0, yT - 6, xz - x0, yB - yT + 6);
          ctx.globalAlpha = 0.9;
          ctx.strokeStyle = COL.faint;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(xz, yT - 6); ctx.lineTo(xz, yB); ctx.stroke();
          ctx.restore();
        }

        ctx.save();
        ctx.beginPath(); ctx.rect(x0, yT - 10, x1 - x0, yB - yT + 10); ctx.clip();
        if (method === 'mc') {
          const bins = view.bins;
          if (bins) {
            ctx.fillStyle = COL.accent;
            ctx.globalAlpha = 0.45;
            const bw = (x1 - x0) / bins.n;
            for (let b = 0; b < bins.n; b++) {
              const y = yOf(bins.d[b]);
              if (y >= yB - 0.6) continue;
              ctx.fillRect(x0 + b * bw + 0.5, y, Math.max(1, bw - 1), yB - y);
            }
          }
        } else {
          /* A curve of the density, sampled per pixel. The skew fit uses the
             shifted lognormal where it exists, otherwise it falls back to the
             Gaussian and says so in the stat line. */
          const fit = method === 'utskew' && stat.fit ? stat.fit : null;
          const dens = fit
            ? (v) => C.slnPdf(fit, v)
            : (stat.sigma > 0
              ? (v) => Math.exp(-0.5 * (v - stat.mean) * (v - stat.mean) / (stat.sigma * stat.sigma))
                  / (stat.sigma * SQRT2PI)
              : null);
          if (dens) {
            const nPt = Math.max(2, Math.round(x1 - x0));
            ctx.beginPath();
            for (let p = 0; p <= nPt; p++) {
              const f = p / nPt;
              const v = range.lo + (range.hi - range.lo) * f;
              const x = x0 + (x1 - x0) * f, y = yOf(dens(v));
              if (p === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = COL.accent;
            ctx.lineWidth = 2.4;
            ctx.lineJoin = 'round';
            ctx.stroke();
            ctx.lineTo(x1, yB); ctx.lineTo(x0, yB); ctx.closePath();
            ctx.fillStyle = COL.accent;
            ctx.globalAlpha = 0.16;
            ctx.fill();
          } else {
            ctx.strokeStyle = COL.accent;
            ctx.lineWidth = 2.4;
            ctx.beginPath(); ctx.moveTo(xOf(stat.mean), yB); ctx.lineTo(xOf(stat.mean), yT); ctx.stroke();
          }
        }
        ctx.restore();

        /* The 13 transformed sigma points as stems on the axis: the cloud the
           two unscented shapes are fitted to. Their spread is asymmetric while
           the Gaussian above them is not, which is the whole argument for the
           third method. */
        if ((method === 'ut' || method === 'utskew') && life.sigmaPts) {
          const pts = life.sigmaPts;
          ctx.save();
          ctx.strokeStyle = COL.emph;
          ctx.globalAlpha = 0.6;
          ctx.lineWidth = 1.6;
          for (let i = 0; i < pts.y.length; i++) {
            const x = xOf(pts.y[i]);
            if (x < x0 || x > x1) continue;
            const len = i === 0 ? 16 : 10;   // the centre point carries a third of the weight
            ctx.beginPath(); ctx.moveTo(x, yB); ctx.lineTo(x, yB - len); ctx.stroke();
          }
          ctx.globalAlpha = 1;
          ctx.font = '12px system-ui, sans-serif';
          ctx.fillStyle = COL.faint;
          ctx.textAlign = 'left';
          ctx.textBaseline = 'bottom';
          ctx.fillText('sigma points', x0 + 2, yB - 20);
          ctx.restore();
        }

        xAxis(ctx, x0, x1, yB, range.lo, range.hi, range.step, fmtAx);
        ctx.save();
        ctx.font = '12px system-ui, sans-serif';
        ctx.fillStyle = COL.faint;
        ctx.textAlign = 'right';
        ctx.textBaseline = 'top';
        ctx.fillText('remaining years to DP 200', x1, yB + 6);
        ctx.restore();
        markers(ctx, xOf(stat.mean), xOf(stat.median), yT, yB, x0, x1,
          fmtYears(stat.mean), fmtYears(stat.median));
      });
      return html`<canvas ref=${cvRef} className="tw-stage" style=${{ height: height + 'px' }} />`;
    }

    /* ── Method-linked distributions ──────────────────────────────────────
       All three panels read the same method switch. Each method hands over a
       survival function, a set of deciles and a density; only the Monte Carlo
       one works off samples, the other three are analytic. */

    /* Survival, deciles and log-axis density all come out of ThermalCore
       (shapeSurvival, shapeQuantile, shapeLogDensity), so the self-test
       exercises the same functions these panels draw with. The Monte Carlo
       method has samples and never goes through them. */
    function survivalOf(stat) {
      return stat ? (t) => C.shapeSurvival(stat, t) : null;
    }
    function decilesOf(stat) {
      if (!stat) return null;
      return {
        p10: C.shapeQuantile(stat, 0.1),
        median: C.shapeQuantile(stat, 0.5),
        p90: C.shapeQuantile(stat, 0.9)
      };
    }
    function rateDensityU(stat) {
      if (!stat || !(stat.fit || stat.sigma > 0)) return null;
      return (u) => C.shapeLogDensity(stat, u);
    }

    const YEAR_STAT = { lin: 'lin', ut: 'ut', utskew: 'utSkew', mc: 'mc' };
    const RATE_STAT = { lin: 'rateLin', ut: 'rateUt', utskew: 'rateUtSkew', mc: 'rate' };

    /* P(remaining life > t). The Monte Carlo method draws the empirical step
       curve off its sorted samples; the other three draw their analytic
       survival. The x range is fixed across methods, so switching reads as a
       change of shape and not of zoom. */
    function SurvivalPanel({ method, life, view, height }) {
      const cvRef = useCanvas(height, (ctx, w, h) => {
        if (!life || !view) return;
        const tMax = view.tMax;
        const stat = life[YEAR_STAT[method]];
        if (!stat) return;
        const isMc = method === 'mc';
        const dec = isMc ? stat : decilesOf(stat);
        const S = isMc ? null : survivalOf(stat);
        if (!dec) return;

        const x0 = 44, x1 = w - 12, yT = 16, yB = h - 28;
        const xOf = (t) => x0 + Math.max(0, Math.min(1, t / tMax)) * (x1 - x0);
        const yOf = (p) => yB - Math.max(0, Math.min(1, p)) * (yB - yT);

        ctx.save();
        ctx.strokeStyle = COL.grid;
        ctx.lineWidth = 1;
        ctx.font = '12px system-ui, sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        for (let p = 0; p <= 1.0001; p += 0.25) {
          const y = yOf(p);
          ctx.globalAlpha = 0.2;
          ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
          ctx.globalAlpha = 1;
          ctx.fillStyle = COL.note;
          ctx.fillText(p.toFixed(2), x0 - 8, y);
        }
        ctx.restore();

        ctx.save();
        ctx.beginPath(); ctx.rect(x0, yT - 4, x1 - x0, yB - yT + 4); ctx.clip();
        ctx.beginPath();
        if (isMc) {
          ctx.moveTo(x0, yOf(1));
          let prevY = yOf(1);
          for (let i = 0; i < stat.n; i++) {
            const t = stat.sorted[i];
            if (t > tMax) break;
            const x = xOf(t), y = yOf((stat.n - i - 1) / stat.n);
            ctx.lineTo(x, prevY); ctx.lineTo(x, y);
            prevY = y;
          }
          ctx.lineTo(x1, prevY);
        } else {
          const nPt = Math.max(2, Math.round(x1 - x0));
          for (let p = 0; p <= nPt; p++) {
            const t = tMax * p / nPt;
            const x = x0 + (x1 - x0) * p / nPt, y = yOf(S(t));
            if (p === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
        }
        ctx.strokeStyle = COL.accent;
        ctx.lineWidth = 2.6;
        ctx.lineJoin = 'round';
        ctx.stroke();
        ctx.restore();

        /* Where the curve meets the left edge. A Gaussian on remaining life
           starts below 1 there, and how far below is P(remaining < 0). */
        if (!isMc) {
          const s0 = S(0);
          if (s0 < 0.995) {
            ctx.save();
            ctx.strokeStyle = COL.faint;
            ctx.globalAlpha = 0.9;
            ctx.lineWidth = 1.4;
            ctx.beginPath(); ctx.moveTo(x0, yOf(s0)); ctx.lineTo(x0, yOf(1)); ctx.stroke();
            ctx.globalAlpha = 1;
            ctx.font = '12px system-ui, sans-serif';
            ctx.fillStyle = COL.note;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.fillText('starts at ' + s0.toFixed(2) + ' at t = 0', x0 + 6, yOf(1) - 3);
            ctx.restore();
          }
        }

        // The median crossing, drawn as the path a reader would follow.
        ctx.save();
        ctx.strokeStyle = COL.emph;
        ctx.globalAlpha = 0.8;
        ctx.lineWidth = 1.2;
        ctx.setLineDash([4, 3]);
        const xm = xOf(dec.median), ym = yOf(0.5);
        ctx.beginPath();
        ctx.moveTo(x0, ym); ctx.lineTo(xm, ym); ctx.lineTo(xm, yB);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
        ctx.font = '600 13px system-ui, sans-serif';
        ctx.fillStyle = COL.label;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'bottom';
        ctx.fillText('median ' + fmtYears(dec.median) + ' a', Math.min(xm + 6, x1 - 96), ym - 5);
        ctx.restore();

        // Where the ninth and the first decile land on the same curve.
        ctx.save();
        ctx.font = '12px system-ui, sans-serif';
        [[dec.p10, 0.9], [dec.p90, 0.1]].forEach((d) => {
          if (d[0] < 0 || d[0] > tMax) return;
          const x = xOf(d[0]), y = yOf(d[1]);
          ctx.fillStyle = COL.emph;
          ctx.beginPath(); ctx.arc(x, y, 3.4, 0, 2 * Math.PI); ctx.fill();
          ctx.fillStyle = COL.note;
          ctx.textAlign = d[1] > 0.5 ? 'left' : 'right';
          ctx.textBaseline = d[1] > 0.5 ? 'top' : 'bottom';
          const lab = d[1].toFixed(1) + ' at ' + fmtYears(d[0]) + ' a';
          ctx.fillText(lab, x + (d[1] > 0.5 ? 7 : -7), y + (d[1] > 0.5 ? 4 : -5));
        });
        ctx.restore();

        xAxis(ctx, x0, x1, yB, 0, tMax, niceStep(tMax, 5), fmtAx);
        ctx.save();
        ctx.font = '12px system-ui, sans-serif';
        ctx.fillStyle = COL.faint;
        ctx.textAlign = 'right';
        ctx.textBaseline = 'bottom';
        ctx.fillText('years', x1, yT + 10);
        ctx.restore();
      });
      return html`<canvas ref=${cvRef} className="tw-stage" style=${{ height: height + 'px' }} />`;
    }

    /* The yearly IEC relative ageing rate, on a log x axis because the same
       fleet spans decades. Monte Carlo draws its histogram, the other three
       their fitted density transformed onto the log axis (see rateDensityU).
       Range and density scale are fixed across methods. */
    function RatePanel({ method, life, view, height }) {
      const cvRef = useCanvas(height, (ctx, w, h) => {
        if (!life || !view || !view.rate) return;
        const R = view.rate;
        const stat = life[RATE_STAT[method]];
        if (!stat) return;
        const x0 = 14, x1 = w - 14, yT = 42, yB = h - 28;
        const lo = R.lo, hi = R.hi;
        const xOfU = (u) => x0 + (u - lo) / (hi - lo) * (x1 - x0);
        const xOf = (v) => xOfU(Math.log(Math.max(1e-30, v)) / Math.LN10);
        const yOf = (d) => yB - Math.max(0, Math.min(1, d / R.yMax)) * (yB - yT);

        ctx.save();
        ctx.beginPath(); ctx.rect(x0, yT - 10, x1 - x0, yB - yT + 10); ctx.clip();
        if (method === 'mc') {
          ctx.fillStyle = COL.accent;
          ctx.globalAlpha = 0.45;
          const bw = (x1 - x0) / R.nb;
          const hd = view.rateD ? view.rateD.d : null;
          for (let b = 0; hd && b < R.nb; b++) {
            const y = yOf(hd[b]);
            if (y >= yB - 0.6) continue;
            ctx.fillRect(x0 + b * bw + 0.5, y, Math.max(1, bw - 1), yB - y);
          }
          ctx.globalAlpha = 1;
        } else {
          const dens = rateDensityU(stat);
          if (dens) {
            const nPt = Math.max(2, Math.round(x1 - x0));
            ctx.beginPath();
            for (let p = 0; p <= nPt; p++) {
              const u = lo + (hi - lo) * p / nPt;
              const x = x0 + (x1 - x0) * p / nPt, y = yOf(dens(u));
              if (p === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = COL.accent;
            ctx.lineWidth = 2.4;
            ctx.lineJoin = 'round';
            ctx.stroke();
            ctx.lineTo(x1, yB); ctx.lineTo(x0, yB); ctx.closePath();
            ctx.fillStyle = COL.accent;
            ctx.globalAlpha = 0.16;
            ctx.fill();
          } else if (stat.mean > 0) {
            /* Degenerate fit, a spread of zero: a spike at the mean is the
               honest picture, and the stat line carries the numbers. */
            ctx.strokeStyle = COL.accent;
            ctx.lineWidth = 2.4;
            ctx.beginPath(); ctx.moveTo(xOf(stat.mean), yB); ctx.lineTo(xOf(stat.mean), yT); ctx.stroke();
          }
        }
        ctx.restore();

        // Decade ticks, with the halves added when the span is narrow.
        ctx.save();
        ctx.strokeStyle = COL.border;
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.85;
        ctx.beginPath(); ctx.moveTo(x0, yB + 0.5); ctx.lineTo(x1, yB + 0.5); ctx.stroke();
        ctx.font = '12px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        const mults = (hi - lo) < 1.6 ? [1, 2, 5] : [1];
        const putTick = (v) => {
          const x = xOf(v);
          if (x < x0 - 0.5 || x > x1 + 0.5) return 0;
          ctx.globalAlpha = 0.7;
          ctx.beginPath(); ctx.moveTo(x, yB); ctx.lineTo(x, yB + 4); ctx.stroke();
          ctx.globalAlpha = 1;
          ctx.fillStyle = COL.note;
          ctx.fillText('x' + fmtRate(v), x, yB + 6);
          return 1;
        };
        let nTick = 0;
        for (let k = Math.floor(lo) - 1; k <= Math.ceil(hi) + 1; k++) {
          for (const m of mults) nTick += putTick(m * Math.pow(10, k));
        }
        // A spread of nearly zero can miss every decade tick; then the middle
        // of the axis gets a label, so the panel still carries a number.
        if (!nTick) putTick(Math.pow(10, (lo + hi) / 2));
        ctx.restore();

        const dec = method === 'mc' ? stat : decilesOf(stat);
        markers(ctx, xOf(stat.mean), xOf(dec.median), yT, yB, x0, x1,
          'x' + fmtRate(stat.mean), 'x' + fmtRate(dec.median));
      });
      return html`<canvas ref=${cvRef} className="tw-stage" style=${{ height: height + 'px' }} />`;
    }

    /* ── Lifetime layout ─────────────────────────────────────────────────── */

    const DIST_H = 300;
    const R2_H = 200;
    const RATE_NB = 48;

    const METHODS = [
      { id: 'lin', label: 'linearised' },
      { id: 'ut', label: 'unscented' },
      { id: 'utskew', label: 'unscented, skew fit' },
      { id: 'mc', label: 'Monte Carlo' }
    ];
    const METHOD_NOTE = {
      lin: 'One gradient at the nominal point, one sigma per input. Cheapest, symmetric by construction.',
      ut: 'Thirteen deterministic runs, then a Gaussian fitted to their mean and variance. The points are drawn on the axis: their spread is not symmetric, the fitted curve is.',
      utskew: 'The same thirteen runs, but mean, variance and skewness are matched to a shifted lognormal instead of a Gaussian. Three moments, still thirteen runs.',
      mc: 'A thousand full years, no distributional assumption at all.'
    };

    /* ── Frozen axes ─────────────────────────────────────────────────────
       Every range on this tab is set ONCE per result set, from the three
       analytic propagations, and never moves again. The Monte Carlo gets no
       vote at all: it arrives over several seconds, and an axis that keeps
       adjusting itself under four static curves reads as instability in the
       result rather than in the drawing.
       The skew fit carries the range, because it is the analytic shape that
       tracks the sampled one most closely; the two Gaussians only widen it,
       and only where they have to. Their mass below zero is the point of the
       whole tab, so the lower end always reaches at least 2.5 sigma below the
       wider Gaussian's mean, and always includes zero.
       Samples outside the axis clip, and how much of them does is reported
       next to the numbers rather than left for the reader to wonder about. */
    const AX_LO_P = 0.005, AX_HI_P = 0.995;   // quantiles of the skew fit
    const AX_GAUSS_LO = 2.5;                  // sigmas of the widest Gaussian

    function sharedRange(L) {
      let lo = Infinity, hi = -Infinity;
      const add = (a, b) => { if (a < lo) lo = a; if (b > hi) hi = b; };
      const S = L.utSkew;
      if (S && S.fit) add(C.slnQuantile(S.fit, AX_LO_P), C.slnQuantile(S.fit, AX_HI_P));
      else if (S) add(S.mean - 3.2 * S.sigma, S.mean + 4.5 * S.sigma);
      /* The Gaussians only pull the lower end down, far enough that the mass
         they put at impossible remaining life stays on the page. */
      [L.lin, L.ut].forEach((g) => { if (g) add(g.mean - AX_GAUSS_LO * g.sigma, -Infinity); });
      if (!isFinite(lo) || !isFinite(hi)) { lo = 0; hi = 50; }
      hi = Math.max(hi, 5);
      lo = Math.min(lo, 0);
      /* A little padding, then a round step. */
      const pad = 0.03 * (hi - lo);
      lo -= pad; hi += pad;
      const step = niceStep(hi - lo, 6);
      return { lo: Math.floor(lo / step) * step, hi: Math.ceil(hi / step) * step, step: step };
    }

    /* The survival axis runs from 0 to one number shared by all four methods,
       so the curves can be laid over each other mentally. Same principle: the
       skew fit sets it, the Gaussians only widen it. */
    function survivalMax(L) {
      let t = 0;
      const S = L.utSkew;
      if (S) t = Math.max(t, C.shapeQuantile(S, 0.97));
      [L.lin, L.ut].forEach((g) => { if (g) t = Math.max(t, g.mean + 1.6 * g.sigma); });
      return niceCeil(Math.max(t, 1e-3));
    }

    /* Log-x range and shared density scale for the rate panel. The lower end of
       a Gaussian is clamped at two percent of its own mean rather than at its
       3.2 sigma point: on a positive quantity that point is regularly negative,
       and letting it set a log axis would open six empty decades. */
    function rateAxis(L) {
      let lo = Infinity, hi = -Infinity;
      const add = (a, b) => { if (a > 0 && a < lo) lo = a; if (b > hi) hi = b; };
      if (L.rateUtSkew && L.rateUtSkew.fit) {
        const f = L.rateUtSkew.fit;
        add(Math.max(C.slnQuantile(f, 0.002), 0.02 * L.rateUtSkew.mean),
          C.slnQuantile(f, 0.998));
      }
      [L.rateLin, L.rateUt].forEach((g) => {
        if (!g) return;
        add(Math.max(g.mean - 3.2 * g.sigma, 0.02 * g.mean), g.mean + 3.2 * g.sigma);
      });
      if (!(lo > 0) || !(hi > lo)) return null;
      const l0 = Math.log(lo) / Math.LN10, h0 = Math.log(hi) / Math.LN10;
      const pad = Math.max(0.04, (h0 - l0) * 0.04);
      const uLo = l0 - pad, uHi = h0 + pad;
      /* Peak of each analytic curve, sampled: closed forms exist but the three
         shapes differ and one loop over the axis is cheap and cannot be wrong.
         The histogram does not raise it; a Monte Carlo peak taller than every
         fitted density clips, and the reader can see that it does. */
      let yMax = 0;
      ['rateLin', 'rateUt', 'rateUtSkew'].forEach((k) => {
        const f = rateDensityU(L[k]);
        if (!f) return;
        for (let p = 0; p <= 240; p++) {
          const v = f(uLo + (uHi - uLo) * p / 240);
          if (v > yMax) yMax = v;
        }
      });
      return { lo: uLo, hi: uHi, nb: RATE_NB, yMax: yMax || 1 };
    }

    /* The Monte Carlo histogram as a density in u, on the axis that is already
       fixed. Recomputed as the run fills; the axis it is binned onto does not
       move, so this never reflows anything. */
    function rateHist(ax, mcR) {
      if (!ax || !mcR) return null;
      const du = (ax.hi - ax.lo) / RATE_NB;
      const d = new Float64Array(RATE_NB);
      let out = 0;
      for (let i = 0; i < mcR.n; i++) {
        const u = Math.log(Math.max(1e-30, mcR.sorted[i])) / Math.LN10;
        let b = Math.floor((u - ax.lo) / du);
        if (b < 0) { b = 0; out++; } else if (b >= RATE_NB) { b = RATE_NB - 1; out++; }
        d[b]++;
      }
      for (let b = 0; b < RATE_NB; b++) d[b] /= mcR.n * du;
      return { d: d, out: out / mcR.n };
    }

    function histo(sorted, n, range) {
      const d = new Float64Array(NBIN);
      const bw = (range.hi - range.lo) / NBIN;
      let out = 0;
      for (let i = 0; i < n; i++) {
        let b = Math.floor((sorted[i] - range.lo) / bw);
        // Whatever runs off the fixed axis piles into the edge bin and is counted.
        if (b < 0) { b = 0; out++; } else if (b >= NBIN) { b = NBIN - 1; out++; }
        d[b]++;
      }
      let peak = 0;
      for (let b = 0; b < NBIN; b++) { d[b] /= n * bw; if (d[b] > peak) peak = d[b]; }
      return { n: NBIN, d: d, peak: peak, out: out / n };
    }

    function Lifetime({ life, method, setMethod, siteLabel, exported, stale, clearExport }) {
      /* The axes are built from the first result set that carries the analytic
         shapes and then kept, object identity included, for as long as that
         result set lives. Everything that depends on the samples is computed
         outside this object, so a Monte Carlo update cannot move an axis even
         by accident.
         The key is the signature CARRIED BY THE RESULT SET, not the one the app
         currently holds. The two part company for the length of the debounce
         after a knob move: the signature is already the new one while `life` is
         still the old result set, and keying on the app's signature stored an
         axis built from the old results under the new key, so the new results
         then inherited a scale that was never theirs and the skew fit ran off
         the top of the panel. */
      const axRef = useRef(null);
      const axes = useMemo(() => {
        if (!life || !life.lin) return null;
        const prev = axRef.current;
        if (prev && prev.sig === life.sig) return prev.ax;
        const range = sharedRange(life);
        /* One density scale for all four, so the switch shows a change of
           shape and not a change of zoom. */
        let yMax = 0;
        [life.lin, life.ut].forEach((g) => {
          if (g && g.sigma > 0) yMax = Math.max(yMax, 1 / (g.sigma * SQRT2PI));
        });
        if (life.utSkew && life.utSkew.fit) {
          yMax = Math.max(yMax, C.slnPdf(life.utSkew.fit, life.utSkew.fit.mode));
        }
        const ax = {
          range: range, yMax: yMax || 1,
          tMax: survivalMax(life), rate: rateAxis(life)
        };
        axRef.current = { sig: life.sig, ax: ax };
        return ax;
      }, [life]);

      const view = useMemo(() => {
        if (!axes) return null;
        const bins = life.mc ? histo(life.mc.sorted, life.mc.n, axes.range) : null;
        return Object.assign({}, axes, { bins: bins, rateD: rateHist(axes.rate, life.rate) });
      }, [axes, life]);

      const stat = life ? life[YEAR_STAT[method]] : null;
      const rateStat = life ? life[RATE_STAT[method]] : null;
      const statLine = (s) => {
        if (!s) return 'computing';
        let t = 'mean ' + fmtYears(s.mean) + ' a, median ' + fmtYears(s.median) + ' a'
          + ', sd ' + fmtYears(s.sd != null ? s.sd : s.sigma) + ' a';
        if (s.skew != null) t += ', skew ' + s.skew.toFixed(2);
        if (s.p10 != null) t += ', p10 to p90 ' + fmtYears(s.p10) + ' to ' + fmtYears(s.p90) + ' a';
        if (s.pNeg != null && s.pNeg > 0.005) t += ', P(<0) ' + (100 * s.pNeg).toFixed(0) + ' %';
        if (s.fallback) t += ', symmetric, no skew fit';
        /* The axis is fixed before the samples arrive, so a few of them can
           land outside it. Saying how many is cheaper than moving the axis. */
        if (method === 'mc' && view && view.bins && view.bins.out > 0.0005) {
          t += ', ' + (100 * view.bins.out).toFixed(1) + ' % beyond the axis';
        }
        return t;
      };

      /* The two small panels carry their numbers in the header note rather than
         in a second stat line: the tab has no room for three of them. */
      const survNote = (() => {
        if (!stat) return '';
        const d = method === 'mc' ? stat : decilesOf(stat);
        if (!d) return '';
        return 'p10 ' + fmtYears(d.p10) + ' a, median ' + fmtYears(d.median) +
          ' a, p90 ' + fmtYears(d.p90) + ' a';
      })();
      const rateNote = (() => {
        if (!rateStat) return '';
        const d = method === 'mc' ? rateStat : decilesOf(rateStat);
        let t = 'mean x' + fmtRate(rateStat.mean) + ', median x' + fmtRate(d.median);
        if (rateStat.pNeg != null && rateStat.pNeg > 0.005) {
          t += ', P(<0) ' + (100 * rateStat.pNeg).toFixed(0) + ' %';
        }
        return t;
      })();

      const mcN = life ? life.mcN : 0;
      const mcTotal = C.LIFE.mcN;
      const nominal = life && life.nom
        ? 'nominal: rate x' + fmtRate(life.nom.rate) + ', remaining ' + fmtYears(life.nom.years) + ' a'
        : '';

      return html`
        <div className="th-life">
          <div className="th-life-top">
            <div>
              <div className="th-hrow">
                <${Seg} className="th-methods" items=${METHODS} value=${method} onChange=${setMethod} />
                ${method === 'mc' && mcN < mcTotal
                  ? html`<span className="th-hnote">n = ${mcN} / ${mcTotal}</span>`
                  : null}
              </div>
              <${DistPanel} method=${method} life=${life} view=${view} height=${DIST_H} />
              <p className="th-stat">${statLine(stat)}</p>
            </div>
            <div>
              <h2 className="th-h2">${siteLabel}</h2>
              <p className="th-source">
                <span>based on: ${exported
                  ? (stale ? 'exported live year, site edited since' : 'exported live year')
                  : 'configuration'}</span>
                ${exported ? html`<button type="button" className="lang-seg th-seg th-chip"
                  onClick=${clearExport}>back to config</button>` : null}
              </p>
              <p className="th-explain">${METHOD_NOTE[method]}</p>
              <p className="th-explain" style=${{ marginTop: 12 }}>${nominal}</p>
            </div>
          </div>

          <div className="th-r2">
            <div>
              <div className="th-hrow">
                <h2 className="th-h2">survival, P(remaining > t)</h2>
                <span className="th-hnote">${survNote}</span>
              </div>
              <${SurvivalPanel} method=${method} life=${life} view=${view} height=${R2_H} />
            </div>
            <div>
              <div className="th-hrow">
                <h2 className="th-h2">relative aging rate, year mean</h2>
                <span className="th-hnote">${rateNote}</span>
              </div>
              <${RatePanel} method=${method} life=${life} view=${view} height=${R2_H} />
            </div>
          </div>
        </div>
      `;
    }

    /* ── App ─────────────────────────────────────────────────────────────── */

    function App() {
      /* The page opens on the transformer, not on the animation: the site is
         what everything else on the page is about, and it is the tab a talk
         starts on. Nothing depends on Live having been mounted first. The ring
         is built and bulk-filled by useLive on mount whatever the tab shows, so
         the year is already in the buffer when Live is first opened; the play
         clock is gated on the tab (see playRef below), so the cursor does not
         move and no display time is spent while nobody is watching. */
      const [tab, setTab] = useState('transformer');
      const [site, setSite] = useState({ id: 'nyc', cfg: null });
      const [knobs, setKnobs] = useState(KNOB_DEF);
      const [view, setView] = useState('day');
      const [playing, setPlaying] = useState(true);
      const [speed, setSpeed] = useState(1);
      const [ci, setCi] = useState(90);
      const [leak, setLeak] = useState(false);
      const [over, setOver] = useState(false);
      const [flash, setFlash] = useState(0);   // brief pressed state on the one-shot button
      const [readout, setReadout] = useState(null);
      const [method, setMethod] = useState('lin');
      const [life, setLife] = useState(null);
      /* The live year handed over to the Lifetime tab, or null for the
         configured one. A new export overwrites the previous one. */
      const [exported, setExported] = useState(null);
      const [, themeBump] = useState(0);

      /* The cursor starts one full window into the year, so the trailing window
         is complete on the first frame. */
      const cursorRef = useRef(DAY_MIN);
      const drawRef = useRef(null);
      const playRef = useRef(true);
      const viewRef = useRef('day');
      const speedRef = useRef(1);
      const simRef = useRef(null);
      /* Live moisture state, kept in a ref: it advances on every animation
         frame and is read by the draw, so it must not go through React. */
      const moistRef = useRef(null);
      const targetRef = useRef(1.5);
      const treatRef = useRef(false);   // a press waiting to be applied on the next frame

      /* The site config the editor shows: the custom one when custom is
         selected, otherwise the preset read back into the same flat shape. */
      const cfg = useMemo(() => (site.id === 'custom' && site.cfg
        ? site.cfg
        : C.configFromScenario(C.scenarioById(site.id))), [site]);

      const sc = useMemo(() => (site.id === 'custom' && site.cfg
        ? C.scenarioFromConfig(site.cfg, 'custom', 'Custom')
        : C.scenarioById(site.id)), [site]);

      const scSig = site.id === 'custom' && site.cfg
        ? 'custom|' + SITE_FIELDS.map((s) => site.cfg[s.k]).join(',') + ',' + site.cfg.loadWinterPeak
        : site.id;

      /* Picking a chip. Custom starts as a copy of whichever preset was showing,
         so the editor opens on numbers the presenter has just been looking at.
         An exported live year is dropped here: its drivers belong to the site
         it was recorded on, and carrying them over to another one would put a
         different transformer's year under the same numbers. Editing individual
         fields does not drop it; the source line says so instead. */
      const pickSite = useCallback((id) => {
        setExported(null);
        setSite((s) => (id === 'custom'
          ? { id: 'custom', cfg: s.id === 'custom' && s.cfg ? s.cfg : C.configFromScenario(C.scenarioById(s.id)) }
          : { id: id, cfg: s.cfg }));
      }, []);

      /* Editing any site number while a preset is selected switches to Custom,
         seeded from that preset. */
      const setCfgField = useCallback((k, v) => {
        setSite((s) => {
          const base = s.id === 'custom' && s.cfg ? s.cfg : C.configFromScenario(C.scenarioById(s.id));
          const next = Object.assign({}, base);
          next[k] = v;
          return { id: 'custom', cfg: next };
        });
      }, []);

      const setKnob = useCallback((k, v) => setKnobs((p) => Object.assign({}, p, { [k]: v })), []);

      /* All three Live buttons are stage events now: they act from the instant
         they are pressed and nothing they do is part of the signature, so no
         year is ever recomputed under the presenter's hands. Only the site and
         the three thermal sigmas rebuild the ring, and that is a full reset
         followed by one event-free bulk fill. */
      const simSig = scSig + '|' + knobs.sigAmbient + ',' + knobs.sigModel + ',' + knobs.sigHs;
      const sim = useLive(sc, simSig, knobs, cursorRef);
      simRef.current = sim;

      /* The overload is armed on the ring, not on a signature. Waiting for the
         ensemble keeps the band's own fill event-free; the cursor is standing
         still until then anyway. */
      useEffect(() => {
        if (!sim || !sim.ring || !sim.ready) return;
        sim.ring.setKScale(over ? OVER_K : 1);
        if (over) growForOverload(sim.scale, sim.ring, OVER_K);
      }, [over, sim]);

      useEffect(() => { playRef.current = playing && tab === 'live'; }, [playing, tab]);
      useEffect(() => { viewRef.current = view; }, [view]);
      useEffect(() => { speedRef.current = speed; }, [speed]);

      useEffect(() => {
        const on = () => { readPalette(); themeBump((n) => n + 1); };
        window.addEventListener('themechange', on);
        return () => window.removeEventListener('themechange', on);
      }, []);

      /* The moisture buffer starts flat at the configured value and is rebuilt
         whenever that value changes, and with the ring on a configuration
         change: the two buffers are one display year on the same grid and have
         to be reset together. A leak or a treatment then writes history into it
         as the cursor runs. */
      if (!moistRef.current) moistRef.current = makeMoisture(knobs.moist);
      useEffect(() => { moistRef.current = makeMoisture(knobs.moist); }, [knobs.moist, simSig]);
      useEffect(() => { targetRef.current = leak ? C.MOIST_SAT : knobs.moist; }, [leak, knobs.moist]);

      /* Handing the live year over. What is snapshotted is what the ring
         actually did: the load including any overload periods, and the moisture
         series that ran alongside it. The arrays are copied, so the live view
         keeps running and the export stays what it was. */
      const onExport = useCallback(() => {
        const s = simRef.current;
        if (!s || !s.ring || !s.ready) return;
        setExported({
          id: Date.now(),
          prof: C.liveProfile(s.ring, moistRef.current.m, knobs.moist),
          scSig: scSig, label: sc.label
        });
        /* The press is a request to see what this year does to the paper, so it
           goes there. Leaving the presenter on the Live tab would hide the only
           effect the button has. */
        setTab('lifetime');
      }, [scSig, sc, knobs.moist]);

      /* Oil treatment is a one-shot: the press is recorded here and applied on
         the next frame, at the display instant the cursor is standing on. */
      const onTreat = useCallback(() => {
        treatRef.current = true;
        setFlash((n) => n + 1);
      }, []);
      useEffect(() => {
        if (!flash) return undefined;
        const t = setTimeout(() => setFlash(0), 190);
        return () => clearTimeout(t);
      }, [flash]);

      /* React state only carries the readout numbers, at about 10 Hz. The
         cursor itself lives in a ref and is drawn imperatively. */
      const pushReadout = useCallback(() => {
        const s = simRef.current;
        if (!s || !s.ring) return;
        const r = s.ring;
        const i = wrapI(Math.floor(cursorRef.current / STRIDE));
        setReadout((prev) => (prev && prev.i === i && prev.sig === s.sig ? prev : {
          sig: s.sig, i: i, thA: r.thA[i], thO: r.thO[i], thH: r.thH[i],
          K: r.K[i],
          rate: C.rateFromFactor(moistRef.current.fac[i], r.thH[i]),
          moist: moistRef.current.cur
        }));
      }, []);

      useEffect(() => {
        let raf = 0, last = 0, lastRead = 0, lastDraw = 0;
        const tick = (ts) => {
          raf = requestAnimationFrame(tick);
          if (!last) last = ts;
          const dtS = Math.min(0.25, (ts - last) / 1000);
          const framePeriod = ts - last;
          last = ts;
          const p0 = PERF ? performance.now() : 0;
          let nSmp = 0, capSmp = 0;
          const s = simRef.current;
          if (s && s.ring && s.ready) {
            if (playRef.current) {
              /* One time base for both views: a displayed day takes ten seconds
                 of wall clock at 1x, whichever window is showing. The year view
                 is not a different clock, only a wider trailing window, so it
                 simply crawls; the speed slider is what makes it usable.
                 The clock is monotone; the ring wraps, the cursor does not. */
              cursorRef.current += LIVE_BASE_RATE * speedRef.current * dtS;
            }
            /* The ring integrates up to the cursor. If a frame cannot afford
               all of it the cursor is held on the frontier, so the display
               slows down instead of running ahead of a year that has not been
               integrated yet. Measured throughput leaves a factor of about a
               hundred at 20x, so this has nothing to do in practice. */
            const maxSteps = Math.max(8, Math.round(s.stepsPerMs * LIVE_BUDGET_MS));
            const before = s.ring.frontierT();
            const front = s.ring.advanceTo(cursorRef.current, maxSteps);
            if (cursorRef.current > front + STRIDE) cursorRef.current = front + STRIDE;
            nSmp = Math.round((front - before) / STRIDE); capSmp = maxSteps;
          }
          /* Moisture follows the cursor, so the trailing window carries the
             history of every press. Floor, not round: the moisture buffer and
             the thermal ring have to agree on which sample is the newest. */
          const ms = moistRef.current;
          const idx = wrapI(Math.floor(cursorRef.current / STRIDE));
          if (treatRef.current) { treatRef.current = false; treatMoisture(ms, idx); }
          else advanceMoisture(ms, idx, targetRef.current);
          const p1 = PERF ? performance.now() : 0;
          if (PERF) perfPush(framePeriod, p1 - p0, nSmp, capSmp);
          /* Redraw at about 60 Hz, whatever the panel does. See DRAW_MIN_MS. */
          if (drawRef.current && ts - lastDraw >= DRAW_MIN_MS) {
            lastDraw = ts;
            drawRef.current();
            if (PERF) perfDrew(ts, performance.now() - p1);
          }
          if (ts - lastRead > 100) { lastRead = ts; pushReadout(); }
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [pushReadout]);

      useEffect(() => { pushReadout(); }, [sim, pushReadout]);

      /* ── Lifetime propagation ───────────────────────────────────────────
         Everything the run depends on is in one signature string, which is
         also the key of the one-entry cache: coming back from another tab or
         returning to a configuration already computed shows the finished
         result instead of running it again. The Live stage buttons are
         deliberately not part of it; an exported live year is, because that is
         the domain the propagation then integrates over. */
      const lifeSig = tab === 'lifetime'

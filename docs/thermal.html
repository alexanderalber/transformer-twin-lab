        ? (exported ? 'live' + exported.id : scSig) + '|' +
          [knobs.sigAmbient, knobs.sigModel, knobs.sigHs, knobs.moist,
            knobs.sigMoist, knobs.dp0, knobs.sigDp0].join(',')
        : '';
      const lifeCache = useRef(null);

      useEffect(() => {
        if (tab !== 'lifetime') return undefined;
        if (lifeCache.current && lifeCache.current.sig === lifeSig) {
          setLife(lifeCache.current.res);
          return undefined;
        }
        let alive = true, raf = 0;
        /* Every result set carries the signature it was computed for. The
           Lifetime panels freeze their axes on THAT, not on whatever the app
           holds while a debounce is still running. */
        const stamp = (res) => { res.sig = lifeSig; return res; };
        /* Number inputs fire on every keystroke; only the value the field comes
           to rest at is worth a year of arithmetic. */
        const timer = setTimeout(() => {
          /* Either the configured year or the exported live one. The sigmas
             apply the same way to both; on an exported year the moisture sigma
             is an offset on its moisture series rather than on a level. */
          const prof = exported ? exported.prof : mcProfile(sc, scSig);
          const run = C.lifeRun(prof, meanVec(knobs), sigmaVec(knobs));
          /* The nominal point, the six finite differences and the twelve
             sigma points are 19 runs, under 120 ms even for the arc furnace,
             so all three deterministic shapes appear in one go. The thousand
             samples behind them are then spread over frames. */
          while (!run.detDone()) run.one();
          if (!alive) return;
          setLife(stamp(run.result()));
          let frames = 0;
          const pump = () => {
            const t0 = performance.now();
            do { run.one(); } while (!run.done() && performance.now() - t0 < MC_BUDGET_MS);
            if (!alive) return;
            frames++;
            if (run.done() || frames % 5 === 0) {
              const res = stamp(run.result());
              setLife(res);
              if (run.done()) lifeCache.current = { sig: lifeSig, res: res };
            }
            if (!run.done()) raf = requestAnimationFrame(pump);
          };
          raf = requestAnimationFrame(pump);
        }, DEBOUNCE_MS);
        return () => { alive = false; clearTimeout(timer); cancelAnimationFrame(raf); };
        // knobs and the site are all folded into lifeSig.
      }, [tab, lifeSig]);

      const rNow = readout ? readout.rate : null;
      const siteLabel = sc.label;

      const tabs = [
        { id: 'transformer', label: 'Transformer' },
        { id: 'live', label: 'Live' },
        { id: 'lifetime', label: 'Lifetime' },
        { id: 'model', label: 'Model' }
      ];

      return html`
        <div className="th-wrap">
          <${Tabs} items=${tabs} value=${tab} onChange=${setTab} />

          ${tab === 'transformer'
            ? html`<${Transformer} site=${site.id} cfg=${cfg} setSite=${pickSite}
                setCfgField=${setCfgField} knobs=${knobs} setKnob=${setKnob} />`
            : null}

          ${tab === 'live'
            ? html`
              <${React.Fragment}>
                <div className="th-row1">
                  <div className="th-transport">
                    <button type="button" className="lang-seg th-seg th-play"
                      onClick=${() => setPlaying((p) => !p)}>${playing ? 'pause' : 'play'}</button>
                    <${Seg} items=${[{ id: 'day', label: 'day' }, { id: 'year', label: 'year' }]}
                      value=${view} onChange=${setView} />
                  </div>
                  <${Ctl} id="th-speed" label="speed" min=${0} max=${1000} step=${1}
                    value=${posOfSpeed(speed)} onChange=${(p) => setSpeed(speedOfPos(p))}
                    format=${() => fmtSpeed(speed)} />
                  <${Ctl} id="th-ci" label="confidence" min=${0} max=${99} step=${1}
                    value=${ci} onChange=${setCi} format=${(v) => v.toFixed(0) + ' %'} />
                  <div className="th-stage-btns">
                    <button type="button"
                      className=${'lang-seg th-seg' + (flash ? ' th-fire' : '')}
                      onClick=${onTreat}>oil treatment</button>
                    <button type="button"
                      className=${'lang-seg th-seg' + (leak ? ' active' : '')}
                      aria-pressed=${leak ? 'true' : 'false'}
                      onClick=${() => setLeak((v) => !v)}>leakage</button>
                    <button type="button"
                      className=${'lang-seg th-seg' + (over ? ' active' : '')}
                      aria-pressed=${over ? 'true' : 'false'}
                      onClick=${() => setOver((v) => !v)}>emergency overload</button>
                  </div>
                  <button type="button" className="lang-seg th-seg th-export"
                    disabled=${!(sim && sim.ready)} onClick=${onExport}>use this year in Lifetime</button>
                </div>

                <${LiveCanvas} sim=${sim} view=${view} moist=${moistRef.current}
                  leak=${leak} ci=${ci}
                  height=${LIVE_H} cursorRef=${cursorRef} drawRef=${drawRef} />

                <div className="th-legend">
                  <span style=${{ color: 'var(--tool-note)' }}><i /> ambient</span>
                  <span style=${{ color: 'var(--tool-text)' }}><i /> top-oil</span>
                  <span style=${{ color: 'var(--pico-primary)' }}><i /> hot-spot</span>
                  <span className="th-now">now: hot-spot <b>${readout ? readout.thH.toFixed(1) : '-'} C</b>, top-oil <b>${readout ? readout.thO.toFixed(1) : '-'} C</b>, load <b>${readout ? readout.K.toFixed(2) : '-'} pu</b>, paper <b>${readout ? readout.moist.toFixed(2) : '-'} %</b>, rate <b>x${rNow === null ? '-' : fmtV(rNow)}</b></span>
                  <span className="th-legend-note">site <b className="th-which">${siteLabel}</b>, ${sim && sim.ready ? (ci > 0 ? ci + ' % band over ' + ENS_N + ' draws' : 'band off') : 'ensemble computing'}</span>
                </div>
              <//>
            `
            : null}

          ${tab === 'lifetime'
            ? html`<${Lifetime} life=${life} method=${method} setMethod=${setMethod}
                siteLabel=${siteLabel} exported=${exported} stale=${!!(exported && exported.scSig !== scSig)}
                clearExport=${() => setExported(null)} />`
            : null}

          ${tab === 'model' ? html`<${Model} />` : null}
        </div>
      `;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>

</body>
</html>

<!doctype html>
<html lang="en" data-theme="dark" data-skin="grey" data-theme-live>
<head>
  <meta charset="utf-8">
  <script>(function(){var d='grey',P={light:'light',dark:'dark',grey:'dark'},k=function(v){return typeof P[v]=='string'},e=document.documentElement,t=new URLSearchParams(location.search).get('theme');if(k(t)){try{localStorage.setItem('theme',t)}catch(x){}}else{try{t=localStorage.getItem('theme')}catch(x){}}if(!k(t))t=d;e.dataset.skin=t;e.dataset.theme=P[t];e.dataset.themeDefault=d;e.style.colorScheme=P[t];})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Five levels of a digital twin</title>
  <meta name="description" content="Descriptive, diagnostic, predictive, prescriptive, autonomous: the same transformer and the same thermal model, one capability level at a time.">
  <link rel="stylesheet" href="assets/css/pico.min.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <!-- Favicon: the bare triangle on a transparent ground, no plate behind it.
       A single fixed stroke colour would vanish against one of the two tab
       bars, so the SVG carries its own prefers-color-scheme rule: dark ink on
       a light tab bar, white on a dark one. Same mark on all pages. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cstyle%3Epath%7Bstroke:%231b1e23%7D@media(prefers-color-scheme:dark)%7Bpath%7Bstroke:%23fff%7D%7D%3C/style%3E%3Cpath%20d='M16%205%2028%2027H4Z'%20fill='none'%20stroke-width='2.5'%20stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    /* Same sizing pattern as the thermal page: one width for the whole page, so
       the header row and everything below it share an edge. Wide, because every
       one of the five tabs shows a time series. */
    html { --lv-w: 1240px; }
    .lv-wrap { width: 100%; max-width: var(--lv-w); margin: 0 auto; padding: 0 0 16px; }
    body > header.tw-head {
      width: 100%; max-width: var(--lv-w); margin-inline: auto;
      padding: 10px 0 0; font-size: 1.3rem;
    }
    body > header.tw-head h1 { font-size: 1.3rem; color: var(--tool-emph); }
    /* Breadcrumb back to the overview: quieter than the page title, so the
       title still reads as the title. */
    .lv-crumb { color: var(--tool-note); text-decoration: none; background: none; }
    .lv-crumb:hover, .lv-crumb:focus-visible { color: var(--pico-primary); text-decoration: underline; }
    .lv-sep { color: var(--tool-faint); margin: 0 0.42em; font-weight: 400; }
    .lv-note { margin: 0; font-size: 12px; color: var(--tool-note); }

    /* Tabs: the house pattern for choosing a VIEW, as opposed to .lang-seg,
       which chooses a SETTING. The distinction is the point: as a segmented
       control the tab switch would look exactly like the half dozen settings
       under it. Underlined tabs say "these are the sections" instead.
       The strip carries the baseline and the active tab overpaints it thicker,
       so the underline must sit ON the strip's line, hence the negative bottom
       margin on the buttons. */
    .tabstrip {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--tool-hairline);
      /* A line of air under the strip, for every tab at once. Each tab keeps
         its own margin on top of this for whatever else it needs; putting the
         common part here is what stops the four from drifting apart. */
      margin-bottom: 20px;
    }
    .tabstrip > button {
      margin: 0 0 -1px;
      padding: 4px 2px 6px;
      width: auto;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.3;
      color: var(--tool-label);
      cursor: pointer;
    }
    /* Pico redefines colour and border on button:is(:hover,:active,:focus);
       both have to be taken back explicitly or the tab grows a blue box. */
    .tabstrip > button:hover:not(.active),
    .tabstrip > button:focus:not(.active) {
      background: transparent;
      border-color: transparent;
      border-bottom-color: var(--tool-hairline);
      color: var(--tool-emph);
    }
    .tabstrip > button.active,
    .tabstrip > button.active:hover,
    .tabstrip > button.active:focus {
      background: transparent;
      color: var(--pico-primary);
      border-bottom-color: var(--pico-primary);
      font-weight: 600;
    }
    .tabstrip > button:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Number tiles ─────────────────────────────────────────────────────
       The row of readouts over every chart. Sized for a projector: the value
       is 34 px, roughly three times the readout size on the thermal page,
       which is what "readable from the last row" costs. Tabular figures, so
       the row does not twitch while a slider is dragged, and a fixed minimum
       width per tile, so it does not reflow either. */
    /* The autonomous tab carries six readouts beside a 350 px log column, which
       is the tightest case: the column gap shrinks there so the row stays on
       one line instead of dropping a single tile onto a second. */
    .lv-tiles {
      display: flex; flex-wrap: wrap; align-items: flex-end;
      gap: 10px 34px; margin: 0 2px 12px;
    }
    .lv-split .lv-tiles { gap: 10px 22px; }
    .lv-tile { min-width: 128px; }
    .lv-split .lv-tile { min-width: 118px; }
    .lv-tile .lv-k {
      display: block; font-size: 13px; line-height: 1.3;
      letter-spacing: 0.02em; color: var(--tool-label);
    }
    .lv-tile .lv-v {
      display: block; font-size: 34px; line-height: 1.18; font-weight: 600;
      color: var(--tool-text); font-variant-numeric: tabular-nums;
    }
    .lv-tile .lv-u {
      margin-left: 5px; font-size: 15px; font-weight: 400; color: var(--tool-note);
    }
    /* The one number the tab is about. On the grey skin --pico-primary is a
       muted teal rather than a colour, which is the whole point of that skin. */
    .lv-tile.lv-emph .lv-k { color: var(--tool-emph); }
    .lv-tile.lv-emph .lv-v { color: var(--pico-primary); }

    /* One slider and its value. Wide track: this is the only interaction on
       the tab, so it may have the room. */
    .lv-ctl {
      display: flex; align-items: center; gap: 12px;
      margin: 12px 2px 0; font-size: 15px; color: var(--tool-label);
    }
    .lv-ctl input[type="range"] { width: 380px; max-width: 52vw; margin: 0; flex: 0 1 auto; }
    .lv-ctl .lv-ctlval {
      min-width: 96px; font-size: 17px; font-weight: 600;
      color: var(--tool-emph); font-variant-numeric: tabular-nums;
    }

    /* Range sliders, taken over from the thermal page: Pico leaves the thumb
       to the browser and the browser default disappears on the grey skin from
       six metres away. Both vendor prefixes are needed, they are separate
       pseudo-elements and a shared rule is dropped by both engines. */
    .lv-wrap input[type="range"] {
      appearance: none; -webkit-appearance: none; background: none; height: 22px;
    }
    .lv-wrap input[type="range"]:focus { outline: none; }
    .lv-wrap input[type="range"]::-webkit-slider-runnable-track {
      height: 6px; border-radius: 3px; background: var(--tool-hairline);
      border: 1px solid var(--tool-border);
    }
    .lv-wrap input[type="range"]::-moz-range-track {
      height: 6px; border-radius: 3px; background: var(--tool-hairline);
      border: 1px solid var(--tool-border);
    }
    .lv-wrap input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 20px; height: 20px; margin-top: -8px;
      border-radius: 50%; background: var(--pico-primary);
      border: 2px solid var(--tool-emph); cursor: pointer;
    }
    .lv-wrap input[type="range"]::-moz-range-thumb {
      width: 20px; height: 20px; border-radius: 50%; background: var(--pico-primary);
      border: 2px solid var(--tool-emph); cursor: pointer;
    }
    .lv-wrap input[type="range"]:focus-visible::-webkit-slider-thumb {
      box-shadow: 0 0 0 3px var(--pico-primary-focus);
    }
    .lv-wrap input[type="range"]:focus-visible::-moz-range-thumb {
      box-shadow: 0 0 0 3px var(--pico-primary-focus);
    }

    /* One button and a quiet note beside it, for the two tabs whose single
       interaction is a button rather than a slider. Same vertical rhythm as
       .lv-ctl. Pico stretches a bare button to the full width of its
       container, so the width has to be taken back explicitly. */
    .lv-act {
      display: flex; align-items: center; flex-wrap: wrap;
      gap: 10px 18px; margin: 12px 2px 0;
    }
    .lv-act button {
      width: auto; margin: 0; padding: 7px 20px;
      font-size: 15px; font-weight: 600; line-height: 1.3;
    }
    .lv-act .lv-actnote {
      font-size: 15px; color: var(--tool-note); font-variant-numeric: tabular-nums;
    }
    /* Pause and play are drawn, not typed. The Geometric Shapes glyphs that
       stood here render as heavy filled boxes in most interface fonts, so the
       pause read as two bricks. Two inline SVG marks instead: same metrics on
       every machine, and the fixed min-width keeps the row from shifting when
       the bars swap for the triangle. */
    .lv-act button.lv-playbtn {
      min-width: 74px; padding: 7px 14px;
      display: inline-flex; align-items: center; justify-content: center;
    }

    /* Chart and event log side by side. min-width: 0 is what stops the chart
       from refusing to shrink below the intrinsic width of its content, which
       is the usual reason a flex row overflows. */
    .lv-split { display: flex; align-items: flex-start; gap: 18px; }
    .lv-split > .lv-main { flex: 1 1 auto; min-width: 0; }
    .lv-log {
      flex: 0 0 350px; box-sizing: border-box;
      height: 500px; overflow-y: auto;
      padding: 8px 12px;
      border: 1px solid var(--tool-hairline); border-radius: 6px;
      background: var(--tool-subtle);
      font-family: var(--pico-font-family-monospace, monospace);
      /* 15 px monospace is small on a desk and readable from the back row of
         a lecture hall at 1080p full screen, which is the size that counts. */
      font-size: 15px; line-height: 1.42;
    }
    .lv-logh {
      font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--tool-label); margin-bottom: 6px;
    }
    .lv-logline { padding: 6px 0; border-top: 1px solid var(--tool-hairline); }
    .lv-logline:first-of-type { border-top: none; }
    .lv-logt { display: block; color: var(--tool-note); }
    .lv-logb { display: block; color: var(--tool-text); }
    .lv-logb b { color: var(--tool-emph); font-weight: 600; }
    .lv-logempty { color: var(--tool-faint); }

    /* Colour key under the chart. A line swatch for a curve, a dashed one for
       a forecast, a filled block for a band. */
    .lv-legend {
      display: flex; align-items: center; flex-wrap: wrap; gap: 6px 20px;
      margin: 8px 2px 0; font-size: 13.5px; color: var(--tool-note);
      font-variant-numeric: tabular-nums;
    }
    .lv-legend i {
      display: inline-block; width: 18px; height: 0; vertical-align: middle;
      border-top: 3px solid currentColor; margin-right: 7px;
    }
    .lv-legend i.lv-dash { border-top-style: dashed; opacity: 0.75; }
    .lv-legend i.lv-sw {
      height: 11px; border-top: none; border-radius: 2px;
      background: currentColor; opacity: 0.42; vertical-align: -1px;
    }

    /* The premise of level 4, one sentence, set as a lead: it is the whole
       briefing and everything under it is the answer to it. */
    .lv-lead {
      margin: 2px 2px 14px; max-width: 100ch;
      font-size: 1.2rem; line-height: 1.4; color: var(--tool-emph);
    }

    /* The three dispatch windows as a segmented control. Same recipe as
       .lang-seg in app.css, which is the house pattern for choosing a
       SETTING, scaled up for a projector: the three labels are the only
       interaction on the tab and they carry clock times, so tabular figures
       and no wrapping. */
    .lv-seg { display: flex; flex-wrap: wrap; gap: 0; margin: 0 2px 14px; }
    /* flex: 0 0 auto is not decoration: the row carries role="group", and Pico
       gives the children of a group flex: 1, which would stretch three
       switches across the whole page width. */
    .lv-seg button {
      flex: 0 0 auto; width: auto; margin: 0; padding: 8px 22px;
      font-size: 1.02rem; font-weight: 600; line-height: 1.3;
      font-variant-numeric: tabular-nums; white-space: nowrap;
      background: transparent; color: var(--tool-label);
      border: 1px solid var(--tool-border); border-radius: 5px;
      cursor: pointer;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .lv-seg button:has(+ button) {
      border-top-right-radius: 0; border-bottom-right-radius: 0; border-right: none;
    }
    .lv-seg button + button {
      border-top-left-radius: 0; border-bottom-left-radius: 0;
    }
    .lv-seg button.active,
    .lv-seg button.active:hover,
    .lv-seg button.active:focus {
      background: var(--pico-primary); color: var(--page-bg); border-color: var(--pico-primary);
    }
    .lv-seg button:hover:not(.active), .lv-seg button:focus:not(.active) {
      background: transparent; color: var(--pico-primary); border-color: var(--pico-primary);
    }

    /* The result of the selected window, one line under the chart, set like a
       caption rather than like a dashboard. */
    .lv-result {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 22px;
      margin: 10px 2px 0; font-size: 15px; color: var(--tool-note);
      font-variant-numeric: tabular-nums;
    }
    .lv-result b { font-weight: 600; color: var(--tool-text); }
    .lv-result .lv-verdict { font-weight: 600; }

    /* Each tab's module gets a frame, and its title rides ON the frame the
       way a fieldset legend does, taken over unchanged from the thermal
       page's .th-group / .th-h2 pattern (same border recipe, same legend
       placement), so the two pages read as one family.
       The frame is a softened --tool-border rather than --tool-hairline:
       hairline disappears on the dark skin, and full --tool-border is pure
       white on the grey skin, which would put a loud box on the page.
       margin-top gives the legend, which rides half above the top border,
       air from the tab strip above it. */
    .lv-group {
      position: relative;
      margin-top: 14px;
      border: 1px solid color-mix(in srgb, var(--tool-border) 55%, transparent);
      border-radius: 7px;
      padding: 16px 18px 14px;
    }
    /* The legend sits half above the top border and paints the page ground
       over it, so the frame appears to break around the words. */
    .lv-group > .lv-h2 {
      position: absolute; top: 0; left: 14px; transform: translateY(-50%);
      margin: 0; padding: 0 6px; white-space: nowrap;
      background: var(--page-bg);
    }
    .lv-h2 {
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.09em;
      text-transform: uppercase; color: var(--tool-note); line-height: 1.3;
    }
    .lv-canvas { display: block; width: 100%; }

    @media (max-width: 1280px) {
      .lv-wrap, body > header.tw-head { padding-inline: 16px; }
    }
    /* Below this the log next to the chart leaves neither of the two enough
       room, so it goes underneath. */
    @media (max-width: 980px) {
      .lv-split { flex-direction: column; }
      .lv-log { flex: 1 1 auto; width: 100%; height: 240px; }
    }
  </style>
  <script src="assets/js/react.production.min.js"></script>
  <script src="assets/js/react-dom.production.min.js"></script>
  <script src="assets/js/htm.js"></script>

<body>
  <header class="container tw-head">
    <h1><a class="lv-crumb" href="index.html">twin-lab</a><span class="lv-sep">/</span>Five levels of a digital twin</h1>
    <div class="theme-switcher">
      <button class="lang-seg theme-seg" data-theme-set="light" aria-label="Light theme" title="Light"></button><button class="lang-seg theme-seg" data-theme-set="grey" aria-label="Grey theme" title="Grey"></button><button class="lang-seg theme-seg" data-theme-set="dark" aria-label="Dark theme" title="Dark"></button>
    </div>
  </header>
  <script src="assets/js/theme.js"></script>

  <main>
    <div id="root">
      <div class="lv-wrap"></div>
    </div>
  </main>

  <!-- ──────────────────────────────────────────────────────────────────────
       Simulation core: plain JS, no JSX and no DOM. The thermal model is the
       IEC 60076-7:2018 difference-equation form, taken over unchanged from the
       thermal mini-twin page, with a second cooling stage (ONAF) added. Ageing
       is the IEC relative rate 2^((thetaH - 98)/6) for non-thermally-upgraded
       kraft paper.
       Every tab of the page is one pure function in here. Nothing on this page
       integrates anything while a frame is being drawn.
       ────────────────────────────────────────────────────────────────────── -->
  <script id="levelscore">
  var LevelsCore = (function () {
    'use strict';

    var DAY_MIN = 1440;

    /* ── Thermal constants ────────────────────────────────────────────────
       IEC 60076-7:2018 Table 4, ONAN column for medium and large power
       transformers. tauO and tauW in minutes, dThOr and dThHr in kelvin.
       dThOr is the rated top-oil rise over ambient, dThHr the rated hot-spot
       rise over top-oil.
       R is the loss ratio (load loss over no-load loss at rated current), not
       in Table 4 and not a standard-prescribed constant: 10 is a typical
       engineering value, ordinary range about 8 to 15.
       dThOr and dThHr are likewise not in Table 4: they are typical design
       values sitting inside the IEC 60076-2 limits (60 K top-oil rise, 78 K
       hot-spot rise over ambient at rated load), which prescribes limits, not
       typical values. */
    var IEC = {
      k11: 0.5, k21: 2.0, k22: 2.0,
      tauO: 210, tauW: 10,
      x: 0.8, y: 1.3,
      R: 10,
      dThOr: 45,
      dThHr: 26
    };

    /* Second cooling stage, ONAF, same unit with the fans running.
       IEC 60076-7:2018 Table 4, ONAF column: k11 = 0.5, k21 = 2.0, k22 = 2.0,
       x = 0.8, y = 1.3. The oil time constant drops because forced air moves
       the tank heat out faster (tauO 150 min against 210 min ONAN) and the
       winding time constant with it (tauW 7 min against 10 min).

       The three remaining numbers are a dual-rating derivation, not table
       values. The unit is rated 1.25 pu with fans, and the load factor K on
       this page stays in ONAN per-unit throughout, so that one number means
       the same thing on all five tabs and across a stage change.
         R      = 10 / 1.25^2 = 6.4       loss ratio rescaled from the ONAF
                                          rated current into ONAN per-unit
         dThOr  = 32.8 K   chosen so that 32.8 * ((1 + 6.4*1.25^2)/(1 + 6.4))^0.8
                           = 45.0 K, the ONAN rated top-oil rise, at K = 1.25 pu
         dThHr  = 19.4 K   chosen so that 19.4 * 1.25^1.3 = 25.9 K, the ONAN
                           rated hot-spot rise, at K = 1.25 pu
       In words: with the fans on, the unit reaches its rated rises at 1.25 pu
       instead of at 1.00 pu. At K = 1.00 pu and 20 C ambient that gives a
       72 C hot spot against 91 C on ONAN, which is the whole point of the
       stage. */
    var ONAF = {
      k11: 0.5, k21: 2.0, k22: 2.0,
      tauO: 150, tauW: 7,
      x: 0.8, y: 1.3,
      R: 6.4,
      dThOr: 32.8,
      dThHr: 19.4
    };

    /* ── Demo constants ───────────────────────────────────────────────────
       Everything the five tabs agree on. Kept in one object so the numbers
       quoted in the UI and the numbers used by the integrator cannot drift
       apart. */
    var DEMO = {
      dtMin: 2,            // integration step, min. Fastest tau is k22*tauW = 14 min
      warmMin: 1440,       // 24 h warm-up before t = 0, so t = 0 is not a transient
      seed: 20260820,      // fixed, so nothing on the page shimmers between reloads
      /* Top-oil sensor noise, 1 sigma, K. The error is CORRELATED, not white:
         a thermometer pocket in oil has a time constant of its own, and so has
         the transmitter behind it, so the error wanders over half an hour
         instead of being redrawn every two minutes. See arNoiseFactory.
         Everything below follows from that and is measured, not derived. */
      noiseK: 0.9,
      noiseTauMin: 30,     // correlation time of the sensor noise, min
      smoothMin: 30,       // trailing mean on the residual, min
      /* Standard deviation of the 30 min smoothed residual per kelvin of sensor
         sigma, healthy plant. For WHITE noise this would be the textbook
         1/sqrt(15) = 0.258 of a 15-sample mean. Correlated noise does not
         average out anything like as well: measured over 25 seeds times 48 h of
         the healthy stream it is 0.884, three and a half times as wide. An
         analytic band here would be wrong by that factor and the tab would
         flag a healthy plant every few hours. */
      residSmPerSigma: 0.884,
      /* Band half-width in sigma of the smoothed residual. Three sigma is the
         reflex and it is too tight for a correlated process: measured over 400
         seeds times 48 h of healthy stream, 3 sigma raises a false alarm in
         6 % of the runs, 3.5 sigma in 0.25 %. The excursions of a process with
         a memory are not independent samples, so the tail costs more than the
         Gaussian table suggests. */
      residSigma: 3.5,
      residRun: 3,         // samples outside the band before flagging
      /* The three samples are read half a smoothing window apart, so together
         they span a full window and are not three looks at the same 30 min.
         Three ADJACENT samples of a 30 min trailing mean at dt = 2 min are
         correlated at 0.93 and buy almost no evidence. */
      residSpread: 0.5,    // sample spacing as a fraction of the smoothing window
      /* Coming back out of the alarm is not the same test as going into it:
         dead band plus dwell time, which is what any alarm system worth the
         name does. The residual has to be back inside residDeadFrac of the
         band AND stay there for residDwellMin before the status returns to OK.
         Both numbers are measured, not chosen for looks. With the plain
         threshold the verdict flickered: a 25 % cooling loss is nearly
         invisible at the 0.50 pu night trough, so the smoothed residual of a
         plant that is still faulted sags to about 1.2 band there and dips under
         it on some seeds, and the tab called such a plant healthy for a couple
         of hours every night.
         Measured over 40 seeds times 60 h with the fault running: inside half
         the band the residual of a faulted plant never lands at all, not once,
         and even at a much looser three quarters of the band the longest spell
         is 32 min. The hour of dwell is therefore roughly twice the worst
         excursion seen under a deliberately weakened dead band, which is the
         margin that makes this a rule and not a fitted constant.
         The cost is on the way back: after a real repair the alarm drops after
         323 min on average and 518 min at worst, measured over 20 seeds. At
         1200x that is half a minute on stage. */
      residDeadFrac: 0.5,  // inner dead band, as a fraction of the band
      residDwellMin: 60,   // how long the residual must stay in it, min
      /* The cooling fault: rated top-oil rise 45 K -> 56.25 K, faded in
         linearly over 2 h. Fouled radiators, which is the ordinary way a unit
         loses cooling, not a catastrophic one.
         It is a subtle fault by design, and with a sensor error that wanders by
         a kelvin over half an hour it takes longer than it used to to prove:
         the band is 2.8 K wide instead of 0.4 K, so the residual has to climb
         seven times as far before three spaced samples clear it. Measured over
         all 24 onset hours, the flag arrives after 172 min on average and after
         254 min at worst, that worst case being an onset at the 06:00 load
         trough. That is the honest cost of low-frequency sensor noise and it is
         left standing rather than bought off with an implausibly large fault:
         at 1200x even the worst case is thirteen seconds on stage, and the
         residual settles at four to five times the band. */
      faultScale: 1.25,
      faultBlendMin: 120,  // the fault fades in linearly over 2 h, no step
      ensembleN: 100,      // forecast members
      fcstHours: 48,       // forecast horizon, h
      histHours: 24,       // history shown next to the forecast, h
      overTemp: 98,        // hot-spot reference for the exceedance probability, C
      limitCyclic: 120,    // IEC 60076-7 Table 5, normal cyclic loading, C
      fanOnC: 95,          // controller: hot spot at which the fans start, C
      fanOffC: 85,         // controller: hot spot at which the fans stop, C
      limitOnC: 110,       // controller: hot spot at which the load limiter arms, C
      limitTargetC: 105,   // controller: steady-state hot spot the limiter aims at, C
      limitOffC: 100,      // controller: hot spot at which the limiter releases, C
      tripC: 140,          // controller: latched trip, IEC long-time emergency limit, C
      ctrlMin: 10,         // controller tick, min. Nothing decides faster than this
      /* How far the controller integrates the model forward at every tick.
         Measured, not felt. The relevant time constant of the plant is
         k11 * tauO = 105 min on ONAN and 75 min on ONAF; the winding part
         (k22 * tauW = 14 min) is an order of magnitude faster and does not set
         the horizon. Sweeping the closed loop over 30 to 180 min on the same
         heat wave gives peak hot spot, curtailed energy, ageing, and the mean
         error of the forecast at the far end of the horizon:
            30 min   108.1 C   1.74 pu h   1.79 d   0.60 K
            45 min   105.1 C   1.73 pu h   1.79 d   0.88 K
            60 min   105.1 C   1.74 pu h   1.77 d   1.23 K
            90 min   105.1 C   1.77 pu h   1.74 d   1.94 K
           120 min   105.0 C   1.79 pu h   1.73 d   2.48 K
           180 min   105.1 C   1.82 pu h   1.71 d   3.42 K
         Three readings. Thirty minutes is too short: the loop overshoots its
         own 105 C target by three kelvin, because the tank remembers heat for
         longer than that. From 45 min on the peak is held and everything
         further is bought by acting earlier, which costs a little energy and
         saves a little paper. And the forecast decays with lead time at about
         2 K per hour of it, so a horizon of a quarter of a day would have the
         loop curtailing against weather it does not know.
         90 min sits in the flat part of the peak, stays under the ONAN oil
         time constant of 105 min, and pays 2 K of forecast error for it. */
      horizonMin: 90,
      /* The controller does not get to see the weather. It gets a forecast of
         the ambient temperature that is FCST_BIAS_K too cold and FCST_LAG_MIN
         behind the real diurnal rise, both deterministic, both adverse: during
         the morning rise, which is the part of the day the loop is judged on,
         a forecast that is cold and late makes the loop act later and less than
         it should. The load, by contrast, is a schedule and is known exactly:
         that is the honest split, because a dispatcher does know tomorrow's
         programme and nobody knows tomorrow's air to a tenth of a kelvin.
         1.4 K and half an hour is the order of magnitude of a good short-range
         2 m temperature forecast, not a worst case. */
      fcstBiasK: -1.4,
      fcstLagMin: 30,
      /* The loop will not curtail below this on a temperature argument. If
         0.30 pu is not enough to hold the predicted peak, the problem is not a
         load problem any more and the trip is the function that owns it. */
      capFloorPu: 0.30
    };

    /* ── Ageing ───────────────────────────────────────────────────────────
       Relative ageing rate, non-thermally-upgraded kraft paper, reference
       hot spot 98 C: V = 2^((thetaH - 98)/6) (IEC 60076-7). Six kelvin is one
       doubling, which is why a hot-spot uncertainty of a few kelvin is worth
       carrying around at all. */
    function agingRate(thetaH) {
      return Math.pow(2, (thetaH - 98) / 6);
    }

    /* Ageing consumed by a hot-spot series, in equivalent days at the 98 C
       reference. dtMin is the spacing of the series in minutes. */
    function agingDaysOf(series, dtMin) {
      var s = 0, i;
      for (i = 0; i < series.length; i++) s += agingRate(series[i]);
      return s * dtMin / DAY_MIN;
    }

    /* ── Random numbers ───────────────────────────────────────────────────
       Deterministic RNG, so the ensemble is the same on every reload and the
       plots do not shimmer. */
    function mulberry32(seed) {
      var a = seed >>> 0;
      return function () {
        a = (a + 0x6D2B79F5) >>> 0;
        var t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    /* Box-Muller on top of a given uniform source, one spare cached. */
    function gaussFactory(rnd) {
      var spare = null;
      return function () {
        if (spare !== null) { var v = spare; spare = null; return v; }
        var u1, u2, r, t;
        do { u1 = rnd(); } while (u1 <= 1e-12);
        u2 = rnd();
        r = Math.sqrt(-2 * Math.log(u1)); t = 2 * Math.PI * u2;
        spare = r * Math.sin(t);
        return r * Math.cos(t);
      };
    }

    /* Correlated sensor noise, AR(1). A top-oil thermometer does not deliver a
       fresh independent error every two minutes: the pocket, the oil around it
       and the transmitter all have time constants, so the error wanders. The
       process is x <- phi x + sqrt(1 - phi^2) g with phi = exp(-dt/tau), which
       is the exactly sampled Ornstein-Uhlenbeck process: unit variance at every
       lag and autocorrelation exp(-lag/tau). Started from the stationary
       distribution, so there is no burn-in transient at t = 0. */
    function arNoiseFactory(rnd, tauMin, dtMin) {
      var gauss = gaussFactory(rnd);
      var phi = tauMin > 0 ? Math.exp(-dtMin / tauMin) : 0;
      var s = Math.sqrt(Math.max(0, 1 - phi * phi));
      var x = gauss();
      return function () { var v = x; x = phi * x + s * gauss(); return v; };
    }

    /* ── Weather texture ──────────────────────────────────────────────────
       Smooth value noise: random nodes NOISE_STEP minutes apart, smoothstep
       between them. A pure function of tMin, so the drivers stay evaluable out
       of order, which the warm-up and the ensemble both rely on. The node
       spacing is what makes this weather rather than sensor noise: a few hours,
       so it reads as a passing cloud bank and not as a jittering thermometer. */
    var NOISE_N = 2048;
    var NOISE_STEP = 190;   // min per node, about three hours
    var NOISE = (function () {
      var rnd = mulberry32(20260821), a = new Float64Array(NOISE_N), i;
      for (i = 0; i < NOISE_N; i++) a[i] = rnd() * 2 - 1;
      return a;
    })();
    function valueNoise(tMin) {
      var u = tMin / NOISE_STEP, i0 = Math.floor(u), f = u - i0;
      var s = f * f * (3 - 2 * f);
      var a = NOISE[((i0 % NOISE_N) + NOISE_N) % NOISE_N];
      var b = NOISE[(((i0 + 1) % NOISE_N) + NOISE_N) % NOISE_N];
      return a + (b - a) * s;
    }

    /* ── Diurnal air temperature, Parton and Logan (1981) ─────────────────
       Source: Parton, W.J. and Logan, J.A. (1981), "A model for diurnal
       variation in soil and air temperature", Agricultural Meteorology
       23:205-216. Taken over from the thermal mini-twin page, reduced to the
       one thing this page needs: a single fixed day length, because there is no
       season and no latitude here, only one repeating demo day.

       A day of air temperature is not a cosine. The shape is a truncated sine
       through the daylight hours whose peak lags solar noon, and an exponential
       decay through the night towards the next morning's minimum. Air warms
       faster than it cools: the minimum sits just before sunrise, the maximum
       in the early afternoon, and the two are not half a day apart. That
       asymmetry is the point. The load peak of this demo day sits at 19:00, on
       the falling side of the air curve, and a cosine puts the air two to three
       kelvin away from where it really is at that hour.

       PL_A  hours by which the daily maximum lags solar noon
       PL_B  night-time decay coefficient, per night length
       PL_C  hours by which the minimum lags sunrise; negative, the coldest
             moment is about ten minutes BEFORE sunrise, because the ground
             keeps radiating until the direct beam arrives. */
    var PL_A = 1.86;
    var PL_B = 2.20;
    var PL_C = -0.17;
    var PL_DAY_LEN = 14;    // h of daylight, one fixed demo day, no season here

    /* The piecewise construction matches its two branches in VALUE at sunset
       and at the morning minimum, never in SLOPE, so it has a corner at each.
       A corner in the forcing is not something a real day has, and it repeats
       every cycle, so it would be a periodic artefact rather than a one-off.
       The fix keeps the paper's TIMING, which is the validated part, and
       replaces the piecewise evaluation: the normalised shape is projected onto
       a Fourier series over the 24 h period and each coefficient is multiplied
       by exp(-(k omega sigma)^2/2), which is exactly a convolution with a
       Gaussian of width sigma in time. The result is periodic and smooth by
       construction, corners and the midnight wrap together. */
    var PL_OMEGA = 2 * Math.PI / 24;   // rad per hour
    var PL_SIGMA_H = 0.30;             // mollifier width, hours
    var PL_TAPER_CUTOFF = 4.5;
    var PL_PROJ_N = 2880;              // projection samples, 30 s

    /* Normalised shape, argument in hours since the daily minimum: 0 at the
       minimum, 1 at the daylight peak. */
    function plShapeFactory(dayLen, a, b) {
      var nightLen = 24 - dayLen;
      var k = Math.PI / (dayLen + 2 * a);
      var gSunset = Math.sin(k * dayLen);
      /* The raw night branch does not return to the minimum at the next
         sunrise, it leaves a step of gSunset*exp(-b). Renormalising the decay
         to (e^-x - e^-b)/(1 - e^-b) keeps the shape and the time constant and
         forces exact closure, so no spurious impulse is injected every cycle. */
      var expNegB = Math.exp(-b);
      var scale = gSunset / (1 - expNegB);
      var invNight = 1 / nightLen;
      return function (m) {
        m = m - 24 * Math.floor(m / 24);
        if (m <= dayLen) return Math.sin(k * m);
        return scale * (Math.exp(-b * (m - dayLen) * invNight) - expNegB);
      };
    }

    /* Project a 24 h periodic shape onto cos and sin and apply the taper. The
       harmonics are stepped by a rotation recurrence, so there is one cos and
       one sin per sample and none per harmonic. */
    function plHarmonics(shape, sigma) {
      var K = Math.max(2, Math.ceil(PL_TAPER_CUTOFF / (PL_OMEGA * sigma)));
      var N = PL_PROJ_N;
      var a = new Float64Array(K + 1), b = new Float64Array(K + 1);
      var dth = 2 * Math.PI / N;
      var cD = Math.cos(dth), sD = Math.sin(dth);
      var cB = 1, sB = 0, i, k, ck, sk, cn, sn, v, x, taper;
      for (i = 0; i < N; i++) {
        v = shape(24 * i / N);
        a[0] += v;
        ck = 1; sk = 0;
        for (k = 1; k <= K; k++) {
          cn = ck * cB - sk * sB; sn = sk * cB + ck * sB;
          ck = cn; sk = sn;
          a[k] += v * ck; b[k] += v * sk;
        }
        cn = cB * cD - sB * sD; sn = sB * cD + cB * sD;
        cB = cn; sB = sn;
      }
      a[0] /= N;
      for (k = 1; k <= K; k++) {
        x = k * PL_OMEGA * sigma;
        taper = Math.exp(-0.5 * x * x) * 2 / N;
        a[k] *= taper; b[k] *= taper;
      }
      return { a: a, b: b, K: K };
    }

    function plHarmonicValue(h, m) {
      var th = PL_OMEGA * m;
      var cB = Math.cos(th), sB = Math.sin(th);
      var a = h.a, b = h.b, K = h.K;
      var s = a[0], ck = 1, sk = 0, cn, sn, k;
      for (k = 1; k <= K; k++) {
        cn = ck * cB - sk * sB; sn = sk * cB + ck * sB;
        ck = cn; sk = sn;
        s += a[k] * ck + b[k] * sk;
      }
      return s;
    }

    /* Fifty-odd harmonics per call would be fine once a day and is not fine at
       a quarter of a million driver evaluations per forecast, so the shape is
       tabulated once at load, one entry per minute of the day, and read back
       linearly. The row is normalised to mean 0 and peak-to-peak 1, which is
       what keeps the stated daily mean the daily mean and the stated amplitude
       the half swing, whatever the shape does in between. */
    var PL_TIME_N = 1440;
    var PL_TAB = (function () {
      var tab = new Float64Array(PL_TIME_N);
      var harm = plHarmonics(plShapeFactory(PL_DAY_LEN, PL_A, PL_B), PL_SIGMA_H);
      var i, v, sum = 0, mn = Infinity, mx = -Infinity;
      for (i = 0; i < PL_TIME_N; i++) {
        v = plHarmonicValue(harm, 24 * i / PL_TIME_N);
        tab[i] = v; sum += v;
        if (v < mn) mn = v;
        if (v > mx) mx = v;
      }
      sum /= PL_TIME_N;
      var span = mx - mn;
      if (!(span > 1e-12)) span = 1;
      for (i = 0; i < PL_TIME_N; i++) tab[i] = (tab[i] - sum) / span;
      return tab;
    })();

    /* Zero-mean, unit peak-to-peak diurnal shape at a clock hour. Sunrise is
       taken symmetric about noon: the demo has no longitude and no equation of
       time, and neither changes the shape, only the clock it is drawn on. */
    var PL_T0 = 12 - 0.5 * PL_DAY_LEN + PL_C;   // clock time of the daily minimum
    function plShapeZ(hour) {
      var m = hour - PL_T0;
      m -= 24 * Math.floor(m / 24);
      var u = m / 24 * PL_TIME_N;
      var c0 = Math.floor(u), fc = u - c0;
      c0 = ((c0 % PL_TIME_N) + PL_TIME_N) % PL_TIME_N;
      var c1 = c0 + 1 === PL_TIME_N ? 0 : c0 + 1;
      return PL_TAB[c0] + (PL_TAB[c1] - PL_TAB[c0]) * fc;
    }

    /* ── Thermal model, IEC 60076-7 difference equations ──────────────────
       Taken over unchanged from the thermal mini-twin page. The only addition
       is paramsFan, the same merge against the ONAF base set. */

    function params(over) {
      var P = {}, k;
      for (k in IEC) if (Object.prototype.hasOwnProperty.call(IEC, k)) P[k] = IEC[k];
      if (over) for (k in over) if (Object.prototype.hasOwnProperty.call(over, k)) P[k] = over[k];
      return P;
    }

    function paramsFan(over) {
      var P = {}, k;
      for (k in ONAF) if (Object.prototype.hasOwnProperty.call(ONAF, k)) P[k] = ONAF[k];
      if (over) for (k in over) if (Object.prototype.hasOwnProperty.call(over, k)) P[k] = over[k];
      return P;
    }

    /* Steady state of the exponential solution: used for the initial condition
       and as the reference the difference equations must converge to. */
    function steadyState(K, thetaA, P) {
      P = P || IEC;
      var dThO = P.dThOr * Math.pow((1 + P.R * K * K) / (1 + P.R), P.x);
      var dThH = P.dThHr * Math.pow(K, P.y);
      return { thetaO: thetaA + dThO, thetaH: thetaA + dThO + dThH, dThO: dThO, dThH: dThH };
    }

    function initState(K, thetaA, P) {
      P = P || IEC;
      var ss = steadyState(K, thetaA, P);
      var h = Math.pow(K, P.y) * P.dThHr;
      var dThO = ss.dThO;
      /* Tank heaters hold a minimum oil temperature, modelled as a floor, no
         control dynamics. */
      if (P.oilFloor != null && thetaA + dThO < P.oilFloor) dThO = P.oilFloor - thetaA;
      /* Effective ambient starts on the actual ambient, so a constant-ambient
         run is in steady state from the first step. */
      return { dThO: dThO, dThH1: P.k21 * h, dThH2: (P.k21 - 1) * h, thetaAeff: thetaA };
    }

    /* ── One RK2 step ─────────────────────────────────────────────────────
       Heun, that is the explicit trapezoid: a predictor at the end of the step
       and then the average of the two slopes. Second order in dt at the cost of
       one extra evaluation of the driving terms.
       Heun rather than midpoint on purpose. Every caller here has the drivers
       on a grid, and the end of a step IS the next stored sample, exactly; a
       midpoint rule would have to interpolate them, which puts a first-order
       error back into the very place the second-order rule was meant to
       remove. So the end-of-step load and ambient are passed in as Kn and
       thetaAn, and callers that genuinely have a constant driver may leave
       them out.
       All four states are of the form y' = (target(u) - y)/tau. */
    function stepThermal(st, K, thetaA, dtMin, P, Kn, thetaAn) {
      P = P || IEC;
      if (Kn == null) Kn = K;
      if (thetaAn == null) thetaAn = thetaA;

      var Ky = Math.pow(K, P.y), Kyn = Math.pow(Kn, P.y);
      var ssO = P.dThOr * Math.pow((1 + P.R * K * K) / (1 + P.R), P.x);
      var ssOn = P.dThOr * Math.pow((1 + P.R * Kn * Kn) / (1 + P.R), P.x);
      var h = dtMin, h2 = 0.5 * dtMin;
      var s1, s2, tgt, tgtn, tau;

      /* Effective ambient. IEC 60076-7 recommends weighting a varying ambient
         with the oil time constant rather than using the instantaneous value;
         modelled here as a first-order lag with tauAmb = tauO. Without it a
         step in the ambient series arrives in the top oil within one time step,
         which the tank cannot do. The DISPLAYED ambient stays the raw one. */
      if (st.thetaAeff == null) st.thetaAeff = thetaA;
      tau = P.tauO;
      s1 = (thetaA - st.thetaAeff) / tau;
      s2 = (thetaAn - (st.thetaAeff + h * s1)) / tau;
      st.thetaAeff += h2 * (s1 + s2);
      var aEff = st.thetaAeff;

      tau = P.k11 * P.tauO;
      s1 = (ssO - st.dThO) / tau;
      s2 = (ssOn - (st.dThO + h * s1)) / tau;
      st.dThO += h2 * (s1 + s2);

      tau = P.k22 * P.tauW;
      tgt = P.k21 * P.dThHr;
      s1 = (tgt * Ky - st.dThH1) / tau;
      s2 = (tgt * Kyn - (st.dThH1 + h * s1)) / tau;
      st.dThH1 += h2 * (s1 + s2);

      tau = P.tauO / P.k22;
      tgtn = (P.k21 - 1) * P.dThHr;
      s1 = (tgtn * Ky - st.dThH2) / tau;
      s2 = (tgtn * Kyn - (st.dThH2 + h * s1)) / tau;
      st.dThH2 += h2 * (s1 + s2);

      st.thetaO = aEff + st.dThO;
      /* Tank heaters hold a minimum oil temperature, modelled as a floor, no
         control dynamics. The state itself is clamped, so the oil sits on the
         floor instead of drifting below it and springing back. */
      if (P.oilFloor != null && st.thetaO < P.oilFloor) {
        st.dThO = P.oilFloor - aEff;
        st.thetaO = P.oilFloor;
      }
      st.thetaH = st.thetaO + st.dThH1 - st.dThH2;
      return st;
    }

    function copyState(st) {
      return { dThO: st.dThO, dThH1: st.dThH1, dThH2: st.dThH2, thetaAeff: st.thetaAeff };
    }

    /* ── Drivers ──────────────────────────────────────────────────────────
       One demo day, repeated. tMin is minutes from midnight of day 0 and may be
       negative (warm-up).
       The load is a plain cosine: the point of this page is the five capability
       levels, not a load-flow study, and a cosine is a shape a presenter can
       read off the axis while talking. The ambient is not, because the whole
       page hangs on WHEN the air is warm relative to when the load is heavy,
       and a cosine gets that wrong by hours. */
    var LOAD_PEAK_MIN = 19 * 60;   // load peaks at 19:00, the domestic evening

    /* Ambient temperature in C, as the Parton-Logan day above plus a slow
       weather texture. Demo day: 22 C mean, 7 K half swing, so about 15 C
       shortly before sunrise and 29 C in the early afternoon. Heat wave: 30 C
       mean, 8 K half swing. The texture is another 1.5 K of drift on a scale of
       hours, which is what stops two consecutive demo days from being the same
       day twice. It is part of the DRIVER, not of the measurement: the twin
       sees the same air the plant does, so it never shows up in the residual of
       level 2. */
    var WEATHER_K = 1.5;

    function ambientAt(tMin, opts) {
      opts = opts || {};
      var mean = opts.heatwave ? 30 : 22;
      var amp = opts.heatwave ? 8 : 7;
      if (opts.ambMean != null) mean = opts.ambMean;
      if (opts.ambAmp != null) amp = opts.ambAmp;
      var wx = opts.weatherK == null ? WEATHER_K : opts.weatherK;
      var hour = (tMin - DAY_MIN * Math.floor(tMin / DAY_MIN)) / 60;
      var v = mean + 2 * amp * plShapeZ(hour) + wx * valueNoise(tMin);
      if (opts.ambTrendPerDay) v += opts.ambTrendPerDay * tMin / DAY_MIN;
      if (opts.ambOffset) v += opts.ambOffset;
      return v;
    }

    /* Load factor in pu of the ONAN rating. Demo day: 0.75 pu mean, 0.25 pu
       amplitude, so 0.50 pu at night and 1.00 pu at the evening peak.
       opts.ramp overrides the cosine with a piecewise-linear profile given as
       [[tMin, K], ...] knots, clamped at both ends. opts.peakScale scales the
       amplitude only, so the daily mean stays put and only the peak moves.
       opts.loadBlendMin eases a CHANGED profile in instead of applying it from
       the first minute: over the first opts.loadBlendMin minutes after t = 0
       the mean and the amplitude slide from the profile the past ran on
       (opts.loadFromMean, opts.loadFromAmp, both defaulting to the demo day)
       to the stated one, on a smoothstep. Without it a forecast that assumes a
       different peak load starts with a step in K at t = 0, and a step in K is
       an overshoot in the hot spot within a winding time constant: the history
       ends at one load and the forecast begins at another, which is an artefact
       of the slider and not a property of the day.
       opts.windows is the contingency form: a list of [t0, t1] minute pairs
       during which the load is held at opts.windowK instead of following the
       cosine, faded in and out over WINDOW_RAMP_MIN so that nothing steps.
       Held, not added: the transferred load replaces the local one, which is
       what makes the served energy identical across the three options and the
       comparison a comparison of timing only. */
    var WINDOW_RAMP_MIN = 10;

    function loadAt(tMin, opts) {
      opts = opts || {};
      var r = opts.ramp, i, t0, t1, u;
      if (r && r.length) {
        if (tMin <= r[0][0]) return r[0][1];
        for (i = 1; i < r.length; i++) {
          if (tMin <= r[i][0]) {
            t0 = r[i - 1][0]; t1 = r[i][0];
            u = t1 === t0 ? 1 : (tMin - t0) / (t1 - t0);
            return r[i - 1][1] + u * (r[i][1] - r[i - 1][1]);
          }
        }
        return r[r.length - 1][1];
      }
      var mean = opts.loadMean == null ? 0.75 : opts.loadMean;
      var amp = opts.loadAmp == null ? 0.25 : opts.loadAmp;
      if (opts.peakScale != null) amp *= opts.peakScale;
      if (opts.loadBlendMin > 0) {
        var m0 = opts.loadFromMean == null ? 0.75 : opts.loadFromMean;
        var a0 = opts.loadFromAmp == null ? 0.25 : opts.loadFromAmp;
        var uB = tMin <= 0 ? 0 : tMin >= opts.loadBlendMin ? 1 : tMin / opts.loadBlendMin;
        var sB = uB * uB * (3 - 2 * uB);
        mean = m0 + sB * (mean - m0);
        amp = a0 + sB * (amp - a0);
      }
      var K = mean + amp * Math.cos(2 * Math.PI * (tMin - LOAD_PEAK_MIN) / DAY_MIN);
      if (opts.windows) {
        var w = opts.windows, g = 0, a, b, f;
        for (i = 0; i < w.length; i++) {
          a = w[i][0]; b = w[i][1];
          if (tMin <= a - WINDOW_RAMP_MIN || tMin >= b + WINDOW_RAMP_MIN) continue;
          if (tMin < a) f = (tMin - (a - WINDOW_RAMP_MIN)) / WINDOW_RAMP_MIN;
          else if (tMin > b) f = ((b + WINDOW_RAMP_MIN) - tMin) / WINDOW_RAMP_MIN;
          else f = 1;
          if (f > g) g = f;
        }
        if (g > 0) K = K + g * (opts.windowK - K);
      }
      return K < 0.02 ? 0.02 : K;
    }

    /* Warm the model up for DEMO.warmMin before t = 0 on the given drivers, so
       that t = 0 is a periodic operating point and not an initial transient.
       tEnd moves the end of the warm-up off t = 0, which is what the live
       stream needs: its window starts two days BEFORE t = 0, so its own
       warm-up has to end there. */
    function warmUp(P, opts, dtMin, warmMin, tEnd) {
      dtMin = dtMin || DEMO.dtMin;
      warmMin = warmMin == null ? DEMO.warmMin : warmMin;
      tEnd = tEnd == null ? 0 : tEnd;
      var t = tEnd - warmMin;
      var st = initState(loadAt(t, opts), ambientAt(t, opts), P);
      for (; t < tEnd - 1e-9; t += dtMin) {
        stepThermal(st, loadAt(t, opts), ambientAt(t, opts), dtMin, P,
          loadAt(t + dtMin, opts), ambientAt(t + dtMin, opts));
      }
      return st;
    }

    /* Smallest load factor whose steady-state hot spot is at most targetC, at
       the given ambient and parameter set. Bisection, because steadyState is
       strictly increasing in K and the closed form is not worth deriving for
       a controller that runs once every 10 min. */
    function kForHotspot(targetC, thetaA, P) {
      var lo = 0.02, hi = 2.5, mid, i;
      if (steadyState(lo, thetaA, P).thetaH > targetC) return lo;
      if (steadyState(hi, thetaA, P).thetaH < targetC) return hi;
      for (i = 0; i < 60; i++) {
        mid = 0.5 * (lo + hi);
        if (steadyState(mid, thetaA, P).thetaH < targetC) lo = mid; else hi = mid;
      }
      return 0.5 * (lo + hi);
    }

    /* ── Level 1 and 2: descriptive and diagnostic ────────────────────────
       One run of the plant and one run of the twin on the same drivers.
       The plant may carry a cooling fault (rated top-oil rise scaled by
       DEMO.faultScale, faded in linearly over DEMO.faultBlendMin so nothing
       steps); the twin never does, because the twin does not know about it.
       Level 1 is what the two top-oil traces look like. Level 2 is their
       difference: the residual, a trailing 30 min mean of it, and a band at
       DEMO.residSigma sigma of that mean, sized by residBand below.
       hours is the logged horizon; opts.faultAtMin is the fault onset in
       minutes from t = 0, or null for a healthy run. */

    /* Half-width of the residual band. Not analytic: the sensor error is
       correlated on the same scale as the smoothing window, so the textbook
       sigma/sqrt(k) of a k-sample mean does not apply. DEMO.residSmPerSigma is
       the measured ratio, see there. */
    function residBand(noiseK, opts) {
      opts = opts || {};
      var mult = opts.residSigma == null ? DEMO.residSigma : opts.residSigma;
      var per = opts.residSmPerSigma == null ? DEMO.residSmPerSigma : opts.residSmPerSigma;
      return mult * per * noiseK;
    }
    function simPlant(hours, opts) {
      opts = opts || {};
      var dt = DEMO.dtMin;
      var n = Math.round(hours * 60 / dt) + 1;
      var faultAt = opts.faultAtMin == null ? null : opts.faultAtMin;
      var scale = opts.faultScale == null ? DEMO.faultScale : opts.faultScale;
      var blend = opts.faultBlendMin == null ? DEMO.faultBlendMin : opts.faultBlendMin;
      var noiseK = opts.noiseK == null ? DEMO.noiseK : opts.noiseK;
      var noiseTau = opts.noiseTauMin == null ? DEMO.noiseTauMin : opts.noiseTauMin;
      var Pnom = params();
      var noise = arNoiseFactory(mulberry32(opts.seed == null ? DEMO.seed : opts.seed),
        noiseTau, dt);

      function faultFac(tMin) {
        if (faultAt == null || tMin <= faultAt) return 1;
        var u = blend <= 0 ? 1 : (tMin - faultAt) / blend;
        if (u > 1) u = 1;
        return 1 + (scale - 1) * u;
      }
      var Pfault = params();

      /* Both runs share the warm-up, because the fault starts after t = 0. */
      var stT = warmUp(Pnom, opts, dt);
      var stW = copyState(stT);

      var t = new Float64Array(n);
      var thOtrue = new Float64Array(n), thHtrue = new Float64Array(n);
      var thOmeas = new Float64Array(n);
      var thOtwin = new Float64Array(n), thHtwin = new Float64Array(n);
      var resid = new Float64Array(n), residSm = new Float64Array(n);
      var amb = new Float64Array(n), load = new Float64Array(n);
      var i, tm, K, A, Kn, An;

      for (i = 0; i < n; i++) {
        tm = i * dt;
        K = loadAt(tm, opts); A = ambientAt(tm, opts);
        if (i > 0) {
          Pfault.dThOr = IEC.dThOr * faultFac(tm);
          stepThermal(stT, load[i - 1], amb[i - 1], dt, Pfault, K, A);
          stepThermal(stW, load[i - 1], amb[i - 1], dt, Pnom, K, A);
        } else {
          Pfault.dThOr = IEC.dThOr * faultFac(tm);
          stT.thetaO = stT.thetaAeff + stT.dThO;
          stT.thetaH = stT.thetaO + stT.dThH1 - stT.dThH2;
          stW.thetaO = stW.thetaAeff + stW.dThO;
          stW.thetaH = stW.thetaO + stW.dThH1 - stW.dThH2;
        }
        t[i] = tm; load[i] = K; amb[i] = A;
        thOtrue[i] = stT.thetaO; thHtrue[i] = stT.thetaH;
        thOtwin[i] = stW.thetaO; thHtwin[i] = stW.thetaH;
        thOmeas[i] = stT.thetaO + noiseK * noise();
        resid[i] = thOmeas[i] - thOtwin[i];
      }

      /* Trailing mean. The band belongs to the full window, so the first
         w - 1 samples get the full-window band too and are simply short of
         data; they are never used for flagging (see the run counter below). */
      var w = Math.max(1, Math.round(DEMO.smoothMin / dt));
      var acc = 0;
      for (i = 0; i < n; i++) {
        acc += resid[i];
        if (i >= w) acc -= resid[i - w];
        residSm[i] = acc / Math.min(i + 1, w);
      }
      var band = residBand(noiseK, opts);

      var stride = Math.max(1, Math.round(DEMO.residSpread * w));
      var flagIdx = -1, j, hit;
      for (i = w - 1 + (DEMO.residRun - 1) * stride; i < n; i++) {
        hit = true;
        for (j = 0; j < DEMO.residRun; j++) {
          if (Math.abs(residSm[i - j * stride]) <= band) { hit = false; break; }
        }
        if (hit) { flagIdx = i; break; }
      }

      return {
        t: t, dtMin: dt, amb: amb, load: load,
        thOtrue: thOtrue, thHtrue: thHtrue, thOmeas: thOmeas,
        thOtwin: thOtwin, thHtwin: thHtwin,
        resid: resid, residSm: residSm, band: band,
        smoothW: w, flagStride: stride,
        flagIdx: flagIdx, flagMin: flagIdx < 0 ? null : t[flagIdx],
        faultAtMin: faultAt
      };
    }

    /* ── The same plant as a running stream ───────────────────────────────
       simPlant computes a fixed 48 h once. makeLive does the same physics one
       step at a time and keeps the last 48 h in a ring buffer, which is what
       levels 1 and 2 actually show: a trend that walks left while the newest
       sample sits on the right edge.
       Two things follow from that and are the whole reason this exists rather
       than an index walking over a precomputed array.
       First, the fault is an event in the RUNNING stream. setFault(true)
       starts blending the rated top-oil rise from wherever it is now towards
       DEMO.faultScale over DEMO.faultBlendMin, at the present simulated time;
       setFault(false) blends back from wherever the blend had got to. Time is
       never moved, nothing already in the ring is rewritten, and the truth
       state is continuous across every toggle.
       Second, the flag has to be decided online: a trailing 30 min mean and a
       run of DEMO.residRun samples a stride apart outside the band, exactly
       the rule simPlant applies in one pass afterwards. The status returns to
       OK by itself once the smoothed residual is back inside the band, which
       is what makes "clear the fault" visible as a recovery rather than as a
       reset.
       The constructor prefills the whole window with healthy operation, so
       the chart is full on the first frame and the trailing mean is already
       up to speed. After construction the newest sample sits at t = 0. */
    var LIVE_WINDOW_MIN = 48 * 60;

    function makeLive(opts) {
      opts = opts || {};
      var dt = DEMO.dtMin;
      var winMin = opts.windowMin == null ? LIVE_WINDOW_MIN : opts.windowMin;
      var cap = Math.max(2, Math.round(winMin / dt));
      var noiseK = opts.noiseK == null ? DEMO.noiseK : opts.noiseK;
      var noiseTau = opts.noiseTauMin == null ? DEMO.noiseTauMin : opts.noiseTauMin;
      var fScale = opts.faultScale == null ? DEMO.faultScale : opts.faultScale;
      var fBlend = opts.faultBlendMin == null ? DEMO.faultBlendMin : opts.faultBlendMin;
      var seed = opts.seed == null ? DEMO.seed : opts.seed;
      var dopts = opts.drivers || {};

      /* The twin runs on the nominal parameters and never learns about the
         fault; the plant object is the one whose dThOr is moved. */
      var Pnom = params(), Ptrue = params();
      var w = Math.max(1, Math.round(DEMO.smoothMin / dt));
      var band = residBand(noiseK, opts);
      var deadFrac = opts.residDeadFrac == null ? DEMO.residDeadFrac : opts.residDeadFrac;
      var dwellMin = opts.residDwellMin == null ? DEMO.residDwellMin : opts.residDwellMin;
      var stride = Math.max(1, Math.round(DEMO.residSpread * w));
      var hLen = (DEMO.residRun - 1) * stride + 1;

      var arr = {
        tMin: new Float64Array(cap), K: new Float64Array(cap), thA: new Float64Array(cap),
        thOtrue: new Float64Array(cap), thOmeas: new Float64Array(cap),
        thOtwin: new Float64Array(cap), thHtwin: new Float64Array(cap),
        residRaw: new Float64Array(cap), residSm: new Float64Array(cap)
      };
      var at = 0, count = 0;

      var tNow = 0, prevK = 0, prevA = 0, stT = null, stW = null, noise = null;
      var smBuf = null, smAcc = 0, smN = 0, smAt = 0;
      var hist = null, hAt = 0, hN = 0;
      var facFrom = 1, facTo = 1, facT0 = null, faultOn = false;
      var status = 'OK', onsetMin = null, flagMin = null, clearMin = null;
      /* When the residual first came back inside the inner dead band, or null
         if it is not in there now. The alarm drops when this is dwellMin old. */
      var calmSince = null;

      /* The blend factor at the present simulated time. Reading it from the
         current time rather than storing it per step is what keeps a toggle
         in the middle of a blend continuous: the next blend starts from this
         value, not from 1 or from DEMO.faultScale. */
      function facNow() {
        if (facT0 == null) return facTo;
        var u = fBlend <= 0 ? 1 : (tNow - facT0) / fBlend;
        if (u >= 1) return facTo;
        if (u <= 0) return facFrom;
        return facFrom + (facTo - facFrom) * u;
      }

      function phys(k) {
        var i = (at - count + k) % cap;
        return i < 0 ? i + cap : i;
      }

      /* One sample: measure, difference, smooth, judge, store. */
      function push(K, A) {
        var meas = stT.thetaO + noiseK * noise();
        var r = meas - stW.thetaO;

        if (smN === w) smAcc -= smBuf[smAt]; else smN++;
        smBuf[smAt] = r; smAcc += r;
        smAt = smAt + 1 === w ? 0 : smAt + 1;
        var sm = smAcc / smN;

        hist[hAt] = sm;
        hAt = hAt + 1 === hLen ? 0 : hAt + 1;
        if (hN < hLen) hN++;

        if (smN === w && hN === hLen) {
          var outside = true, j, q;
          for (j = 0; j < DEMO.residRun; j++) {
            q = hAt - 1 - j * stride;
            while (q < 0) q += hLen;
            if (Math.abs(hist[q]) <= band) { outside = false; break; }
          }
          if (status === 'OK') {
            if (outside) { status = 'FLAGGED'; flagMin = tNow; calmSince = null; }
          } else {
            /* Coming back is not the same test as going out. Standard alarm
               practice, dead band plus dwell time: the residual has to be back
               inside HALF the band, and stay there for dwellMin, before the
               alarm is dropped. Both halves earn their keep here.
               The dead band is what stops an alarm from chattering on the very
               threshold that raised it. The dwell time is what carries the
               verdict through the night: a cooling fault is nearly invisible at
               the 0.50 pu load trough, so the residual of a plant that is still
               faulted sags towards the band in the small hours and comes back
               up with the morning load. Without the dwell the tab would report
               the plant healthy for a couple of hours every night while the
               fault is still running, which is a false negative dressed up as a
               recovery. */
            if (Math.abs(sm) <= deadFrac * band) {
              if (calmSince == null) calmSince = tNow;
            } else calmSince = null;
            if (calmSince != null && tNow - calmSince >= dwellMin) {
              status = 'OK'; flagMin = null; calmSince = null;
            }
          }
        }

        arr.tMin[at] = tNow; arr.K[at] = K; arr.thA[at] = A;
        arr.thOtrue[at] = stT.thetaO; arr.thOmeas[at] = meas;
        arr.thOtwin[at] = stW.thetaO; arr.thHtwin[at] = stW.thetaH;
        arr.residRaw[at] = r; arr.residSm[at] = sm;
        at = at + 1 === cap ? 0 : at + 1;
        if (count < cap) count++;
      }

      function advance() {
        var tn = tNow + dt;
        var K = loadAt(tn, dopts), A = ambientAt(tn, dopts);
        tNow = tn;
        Ptrue.dThOr = IEC.dThOr * facNow();
        stepThermal(stT, prevK, prevA, dt, Ptrue, K, A);
        stepThermal(stW, prevK, prevA, dt, Pnom, K, A);
        prevK = K; prevA = A;
        push(K, A);
      }

      function reset() {
        var tA = -(cap - 1) * dt;
        at = 0; count = 0;
        noise = arNoiseFactory(mulberry32(seed), noiseTau, dt);
        smBuf = new Float64Array(w); smAcc = 0; smN = 0; smAt = 0;
        hist = new Float64Array(hLen); hAt = 0; hN = 0;
        facFrom = 1; facTo = 1; facT0 = null; faultOn = false;
        status = 'OK'; onsetMin = null; flagMin = null; clearMin = null; calmSince = null;
        Ptrue.dThOr = IEC.dThOr;
        stT = warmUp(Pnom, dopts, dt, DEMO.warmMin, tA);
        stW = copyState(stT);
        tNow = tA;
        prevK = loadAt(tA, dopts); prevA = ambientAt(tA, dopts);
        stT.thetaO = stT.thetaAeff + stT.dThO;
        stT.thetaH = stT.thetaO + stT.dThH1 - stT.dThH2;
        stW.thetaO = stW.thetaAeff + stW.dThO;
        stW.thetaH = stW.thetaO + stW.dThH1 - stW.dThH2;
        push(prevK, prevA);
        var i;
        for (i = 1; i < cap; i++) advance();
      }

      reset();

      return {
        dtMin: dt, capacity: cap, windowMin: cap * dt,
        band: band, smoothW: w, flagStride: stride,
        arr: arr, phys: phys,
        count: function () { return count; },
        now: function () { return tNow; },
        status: function () { return status; },
        faultOn: function () { return faultOn; },
        onsetMin: function () { return onsetMin; },
        flagMin: function () { return flagMin; },
        clearMin: function () { return clearMin; },
        faultFactor: function () { return facNow(); },
        /* Newest sample, the one the readouts show. */
        last: function (key) { return count === 0 ? 0 : arr[key][phys(count - 1)]; },
        step: function (n) {
          var i, m = n == null ? 1 : Math.max(0, Math.round(n));
          for (i = 0; i < m; i++) advance();
        },
        /* Inject or clear at the present simulated time. Never moves time,
           never clears the ring, and may be called as often and as erratically
           as a presenter can press a button.
           The blend always starts from facNow(), so a press in the middle of a
           blend bends the parameter from where it stands: the plant temperature
           has no step in it no matter how the button is worked.
           Injecting also opens a new EPISODE. The onset moves to now and the
           flag of the previous episode is dropped, because "flagged 40 min
           after onset" has to refer to the onset that is on the screen. The
           detector itself is not reset: its history of smoothed residuals is
           the data, not the verdict, so if the residual is still outside the
           band from the last episode the status comes straight back, which is
           exactly what "the status follows the residual" means. */
        setFault: function (on) {
          on = !!on;
          if (on === faultOn) return;
          facFrom = facNow();
          facTo = on ? fScale : 1;
          facT0 = tNow;
          faultOn = on;
          if (on) {
            onsetMin = tNow; clearMin = null;
            flagMin = null; status = 'OK'; calmSince = null;
          } else clearMin = tNow;
        },
        reset: reset
      };
    }

    /* ── Level 3: predictive ──────────────────────────────────────────────
       24 h of nominal history, then a 48 h ensemble forecast. Every member
       starts from the same state, which is what the twin actually knows at
       "now", and then differs in four draws:
         ambient offset       N(0, 1.5 K)        a systematic weather bias
         ambient trend        N(0, 1.5 K/day)    the part that grows with horizon
         load scale           N(1, 0.06)         demand forecast error
         rated top-oil rise   N(1, 0.05)         parameter uncertainty
       The trend draw is why the band widens with the horizon instead of
       saturating after a few oil time constants: a constant offset stops
       adding width once the tank has followed it, a drift does not.
       peakScale scales the load amplitude of every member and of the history,
       so the slider on the tab moves the evening peak and nothing else.
       opts.loadMean and opts.loadAmp are passed through to the driver for
       callers that would rather state the daily profile outright than scale
       the default one; both default to the demo day, 0.75 pu and 0.25 pu.
       Whatever profile is asked for, it is eased in over the first
       FCST_BLEND_MIN of the horizon (see loadAt): the plant does not learn
       tomorrow's peak at midnight and jump to it, and without the blend every
       slider position but the nominal one starts the forecast with a step in
       load and a hot-spot overshoot that is pure artefact. */
    var FCST_BLEND_MIN = 360;      // 6 h, about two oil time constants

    function forecast(peakScale, opts) {
      opts = opts || {};
      peakScale = peakScale == null ? 1 : peakScale;
      var N = opts.n == null ? DEMO.ensembleN : opts.n;
      var dt = opts.dtMin == null ? 5 : opts.dtMin;
      var nH = Math.round(DEMO.histHours * 60 / dt) + 1;
      var nF = Math.round(DEMO.fcstHours * 60 / dt) + 1;
      /* opts.blendMin exists for the self test, which has to be able to look at
         the same forecast without the ramp to show what the ramp removes. The
         page never passes it. */
      var blendMin = opts.blendMin == null ? FCST_BLEND_MIN : opts.blendMin;
      var base = { peakScale: peakScale, loadBlendMin: blendMin };
      if (opts.loadMean != null) base.loadMean = opts.loadMean;
      if (opts.loadAmp != null) base.loadAmp = opts.loadAmp;
      var Pnom = params();
      var gauss = gaussFactory(mulberry32(opts.seed == null ? DEMO.seed : opts.seed));

      /* History: 24 h ending at t = 0, on the plain demo day and on top of the
         usual warm-up. Deliberately not on `base`: the past is the past, and a
         slider that says "tomorrow's peak load" must not redraw it. At the
         default peakScale of 1 and without a stated profile the two are the
         same drivers anyway, so nothing about the default run changes. */
      var hb = {};
      var st = warmUp(Pnom, hb, dt, DEMO.warmMin + DEMO.histHours * 60);
      var tH = new Float64Array(nH), hist = new Float64Array(nH), histO = new Float64Array(nH);
      var i, j, tm, tn;
      for (i = 0; i < nH; i++) {
        tm = -DEMO.histHours * 60 + i * dt;
        if (i > 0) {
          stepThermal(st, loadAt(tm - dt, hb), ambientAt(tm - dt, hb), dt, Pnom,
            loadAt(tm, hb), ambientAt(tm, hb));
        } else {
          st.thetaO = st.thetaAeff + st.dThO;
          st.thetaH = st.thetaO + st.dThH1 - st.dThH2;
        }
        tH[i] = tm; hist[i] = st.thetaH; histO[i] = st.thetaO;
      }
      var st0 = copyState(st);

      /* Nominal forecast from the same state, no draws. */
      var t = new Float64Array(nF), nom = new Float64Array(nF);
      var sn = copyState(st0);
      for (i = 0; i < nF; i++) {
        tm = i * dt;
        if (i > 0) {
          stepThermal(sn, loadAt(tm - dt, base), ambientAt(tm - dt, base), dt, Pnom,
            loadAt(tm, base), ambientAt(tm, base));
        }
        t[i] = tm;
        nom[i] = (sn.thetaAeff + sn.dThO) + sn.dThH1 - sn.dThH2;
      }

      /* Ensemble. Column-major would be nicer for the quantiles but the walk
         over time has to be sequential anyway, so the members go in rows and
         the quantile pass transposes with a stride. */
      var M = new Float64Array(N * nF);
      var peaks = new Float64Array(N);
      var over = 0, o;
      for (j = 0; j < N; j++) {
        var mo = {
          peakScale: peakScale * (1 + 0.06 * gauss()),
          loadMean: base.loadMean, loadAmp: base.loadAmp,
          /* The blend is part of the day, not part of the draw: a member that
             disagrees about tomorrow's peak still starts from the load the
             plant is on right now. */
          loadBlendMin: base.loadBlendMin,
          ambOffset: 1.5 * gauss(),
          ambTrendPerDay: 1.5 * gauss()
        };
        var Pm = params({ dThOr: IEC.dThOr * (1 + 0.05 * gauss()) });
        var sm = copyState(st0);
        var pk = -1e9;
        for (i = 0; i < nF; i++) {
          tm = i * dt;
          if (i > 0) {
            stepThermal(sm, loadAt(tm - dt, mo), ambientAt(tm - dt, mo), dt, Pm,
              loadAt(tm, mo), ambientAt(tm, mo));
          }
          o = (sm.thetaAeff + sm.dThO) + sm.dThH1 - sm.dThH2;
          M[j * nF + i] = o;
          if (o > pk) pk = o;
        }
        peaks[j] = pk;
        if (pk > DEMO.overTemp) over++;
      }

      function quantOf(sorted, q) {
        var u = q * (sorted.length - 1), lo = Math.floor(u), hi = Math.ceil(u);
        return sorted[lo] + (u - lo) * (sorted[hi] - sorted[lo]);
      }
      var med = new Float64Array(nF), q25 = new Float64Array(nF), q75 = new Float64Array(nF);
      var q05 = new Float64Array(nF), q95 = new Float64Array(nF);
      var col = new Float64Array(N);
      for (i = 0; i < nF; i++) {
        for (j = 0; j < N; j++) col[j] = M[j * nF + i];
        var s = Array.prototype.slice.call(col).sort(function (a, b) { return a - b; });
        med[i] = quantOf(s, 0.50);
        q25[i] = quantOf(s, 0.25); q75[i] = quantOf(s, 0.75);
        q05[i] = quantOf(s, 0.05); q95[i] = quantOf(s, 0.95);
      }
      var pk2 = Array.prototype.slice.call(peaks).sort(function (a, b) { return a - b; });

      return {
        t: t, dtMin: dt, tHist: tH, hist: hist, histO: histO, nom: nom,
        med: med, q25: q25, q75: q75, q05: q05, q95: q95,
        pOver98: over / N, medPeak: quantOf(pk2, 0.5), peaks: peaks, n: N
      };
    }

    /* ── Level 4: prescriptive ────────────────────────────────────────────
       The premise: the neighbouring transformer is lost, and 1.30 pu has to be
       carried for 4 h some time in the next 24 h. WHAT is carried is fixed and
       so is how long: only the START of the four hours is open. All three
       options therefore serve exactly the same energy, 1.30 pu times 4 h, and
       every difference between them comes from the state of the tank and of
       the air at the moment the load arrives:
         early      04:00 to 08:00
         afternoon  15:00 to 19:00
         night      22:00 to 02:00
       Each option is integrated over 36 h from midnight, which covers the
       night window and leaves the tank time to come back down, and is scored
       on peak hot spot, feasibility against the IEC 60076-7 Table 5 normal
       cyclic limit of 120 C, and ageing consumed, the latter as equivalent
       normal-ageing days, the integral of 2^((thetaH - 98)/6) over 24 h. The
       recommendation is the feasible option with the least ageing.
       Same kilowatt hours, different paper: that is the point of the tab.

       The base case, the same day with no transfer at all, is computed
       alongside and returned with the options. It is what the unit would have
       done anyway, and it is the only way to see on the chart how much of the
       curve is the contingency and how much is Tuesday.

       Two results are worth knowing before reading the numbers. Both are
       measured on this model, over a sweep of all 24 start hours at daily
       means of 20, 21, 22, 23 and 24 C (numbers below at 20 C, the mean this
       tab runs on).

       First, what decides is the tank, not the thermometer. The oil low-passes
       the ambient with tauO = 210 min, which attenuates a 24 h swing to about
       0.74 of its amplitude and delays it by roughly 42 degrees, so the air
       temperature at the window is a poor predictor of the peak. The hot spot
       AT THE START of the window is a good one: 63 C at 04:00 against 88 C at
       22:00, and the mean hot spot during the four hours follows it, 107.6 C
       against 115.3 C. Six kelvin is one doubling of the ageing rate, which is
       where the whole margin between the two feasible options comes from.
       Second, the room is narrow. At 1.30 pu the ONAN steady state is about
       ambient + 103 K, so at a 22 C daily mean, the ordinary demo day of tabs
       1 to 3, every window from 06:00 onwards is already over the 120 C line

    /* ── Level 5: autonomous ──────────────────────────────────────────────

       every DEMO.ctrlMin the controller integrates the same IEC 60076-7 model
       forward over DEMO.horizonMin on the known load schedule and an imperfect
       ambient forecast, and then acts on the hot spot it PREDICTS rather than
       on the one it measures. That is the whole difference between this tab
       and a thermostat, which is a machine that also switches at a threshold
       and needs no model at all to do it.
       The order of escalation is unchanged:
         1  cooling stage, hysteresis 95 C on / 85 C off. Cheap and reversible,
            so it goes first. Both thresholds are read off ONE predicted
            trajectory, the one the unit would follow with the fans OFF: it
            would cross 95 C, so start them; it would stay under 85 C for the

         2  load cap, armed at 110 C, released at 100 C, both on the predicted

         the chart draws at the cursor. doLog is off during the warm-up. */

              'trip, load to zero, latched');

            fans ? 'predicted to cross the ' + DEMO.fanOnC + ' C fan threshold within ' +
              hzn + ' min'

            fans ? 'cooling stage ONAN to ONAF' : 'cooling stage ONAF to ONAN');

        } else {

          /* The handover line. The warm-up ran the same loop over the previous
             evening, so t = 0 can legitimately start with the fans already
             turning, and a tab that shows ONAF next to "0 decisions" reads like
             a contradiction. Switching the fans off at t = 0 to make the count
             tidy would be the dishonest fix, because it would be a state the
             plant was never in; saying out loud what was inherited is the other
             one. It is a real tick with a real forecast, it simply decided that
             nothing had to change. */

        Kdem: Kdem, Kserved: Kserved, stage: stage, events: events,

      params: params, paramsFan: paramsFan,
      steadyState: steadyState, initState: initState, stepThermal: stepThermal,
      copyState: copyState, warmUp: warmUp, kForHotspot: kForHotspot,
      agingRate: agingRate, agingDaysOf: agingDaysOf,

      valueNoise: valueNoise, plShapeZ: plShapeZ, residBand: residBand,
      ambientAt: ambientAt, loadAt: loadAt,

        const rect = cv.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const w = Math.max(1, Math.round(rect.width)), h = height;
        cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
        const ctx = cv.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);
        draw(ctx, w, h);
      });
      return cvRef;
    }

    function niceStep(span, target) {
      const raw = Math.abs(span) / Math.max(1, target);
      if (!(raw > 0)) return 1;
      const p = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
      const m = raw / p;
      return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p;
    }
    function fmtAx(v) {
      const a = Math.abs(v);
      if (a >= 1000) return (v / 1000).toFixed(a >= 9500 ? 0 : 1) + 'k';
      if (a >= 10 || a < 1e-9) return v.toFixed(0);
      return v.toFixed(1);
    }

    /* A nice-stepped range that contains [lo, hi] and any values the caller
       insists on seeing, such as a reference line above the data. */
    function niceRange(lo, hi, target) {
      if (!(hi > lo)) hi = lo + 1;
      const step = niceStep(hi - lo, target);
      return {
        lo: Math.floor(lo / step) * step,
        hi: Math.ceil(hi / step) * step,
        step: step
      };
    }

    function xAxis(ctx, x0, x1, yB, lo, hi, step, fmt) {
      ctx.save();
      ctx.strokeStyle = COL.border;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.85;
      ctx.beginPath(); ctx.moveTo(x0, yB + 0.5); ctx.lineTo(x1, yB + 0.5); ctx.stroke();
      ctx.font = '13px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      const first = Math.ceil(lo / step - 1e-9) * step;
      for (let v = first; v <= hi + 1e-9; v += step) {
        const x = x0 + (v - lo) / (hi - lo) * (x1 - x0);
        ctx.globalAlpha = 0.7;
        ctx.beginPath(); ctx.moveTo(x, yB); ctx.lineTo(x, yB + 4); ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.fillStyle = COL.note;
        ctx.fillText(fmt(v), x, yB + 6);
      }
      ctx.restore();
    }

    /* Horizontal grid plus its labels on the left. The grid is the axis: no
       box around the plot, the same as on the other two pages. */
    function yAxis(ctx, x0, x1, yOf, lo, hi, step, unit) {
      ctx.save();
      ctx.font = '13px system-ui, sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 1;
      const first = Math.ceil(lo / step - 1e-9) * step;
      for (let v = first; v <= hi + 1e-9; v += step) {
        const y = yOf(v);
        ctx.strokeStyle = COL.grid;
        ctx.globalAlpha = 0.22;
        ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.fillStyle = COL.note;
        ctx.fillText(fmtAx(v) + unit, x0 - 10, y);
      }
      ctx.restore();
    }

    /* A dashed limit line with its label sitting on it. Annotation, not data,
       hence the alpha. */
    function refLine(ctx, x0, x1, y, label, col) {
      ctx.save();
      ctx.strokeStyle = col;
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = 0.85;
      ctx.setLineDash([7, 5]);
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
      ctx.font = '600 13px system-ui, sans-serif';
      ctx.fillStyle = col;
      ctx.textAlign = 'right';
      ctx.textBaseline = 'bottom';

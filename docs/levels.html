      ctx.globalAlpha = 1;
      ctx.font = '600 13px system-ui, sans-serif';
      ctx.fillStyle = col;
      ctx.textAlign = 'right';
      ctx.textBaseline = 'bottom';
      ctx.fillText(label, x1 - 3, y - 4);
      ctx.restore();
    }

    /* ── Small presentational pieces ──────────────────────────────────────
       One readout tile, the row it lives in, and the colour key. */
    /* `color` overrides the value colour for the one tile that carries a
       state rather than a number, such as OK against FLAGGED. */
    function Tile({ label, value, unit, emph, color }) {
      return html`
        <div className=${'lv-tile' + (emph ? ' lv-emph' : '')}>
          <span className="lv-k">${label}</span>
          <span className="lv-v" style=${color ? { color: color } : null}>${value}<span className="lv-u">${unit}</span></span>
        </div>
      `;
    }

    function Legend({ items }) {
      return html`
        <div className="lv-legend">
          ${items.map((it) => html`
            <span key=${it.label} style=${{ color: it.color }}>
              <i className=${it.band ? 'lv-sw' : ''}></i>
              <span style=${{ color: 'var(--tool-note)' }}>${it.label}</span>
            </span>
          `)}
        </div>
      `;
    }

    function Ctl({ id, label, min, max, step, value, format, onChange }) {
      return html`
        <div className="lv-ctl">
          <label htmlFor=${id}>${label}</label>
          <input id=${id} type="range" min=${min} max=${max} step=${step} value=${value}
            onChange=${(e) => onChange(parseFloat(e.target.value))} />
          <span className="lv-ctlval">${format(value)}</span>
        </div>
      `;
    }

    function Tabs({ items, value, onChange }) {
      return html`
        <div className="tabstrip" role="tablist">
          ${items.map((it) => html`
            <button key=${it.id} type="button" role="tab"
              aria-selected=${it.id === value ? 'true' : 'false'}
              className=${it.id === value ? 'active' : ''}
              onClick=${() => onChange(it.id)}>${it.label}</button>
          `)}
        </div>
      `;
    }

    /* The five tabs. Levels 1, 2, 3 and 5 are drawn; level 4 still says what
       it will show and lands in the next stage. */
    const TABS = [
      {
        id: 'descriptive', label: 'Descriptive',
        title: 'Level 1, what is happening',
        body: 'Measured top-oil against the twin, on the same load and the same ambient. No claim beyond the two traces.'
      },
      {
        id: 'diagnostic', label: 'Diagnostic',
        title: 'Level 2, why it is happening',
        body: 'The difference between the two traces, smoothed over 30 min, against a band at three sigma of the sensor noise. Cooling degrades and the residual walks out of the band.'
      },
      {
        id: 'predictive', label: 'Predictive',
        title: 'Level 3, what happens next',
        body: 'Forty-eight hours ahead as an ensemble of 100 members, quantile band, and the probability of passing 98 C.'
      },
      {
        id: 'prescriptive', label: 'Prescriptive',
        title: 'Level 4, what to do about it',
        body: 'Three contingency dispatches, each scored on peak hot spot, feasibility against the 120 C cyclic limit, and days of insulation life consumed.'
      },
      {
        id: 'autonomous', label: 'Autonomous',
        title: 'Level 5, doing it',
        body: 'A heat wave with the loop closed: fans, then a load cap, then a trip. Sense, decide, act, logged with a timestamp.'
      }
    ];

    /* ── The live strip ───────────────────────────────────────────────────
       Levels 1 and 2 are trends, not pictures of a finished run: the newest
       sample sits on the right edge and the past scrolls off to the left,
       which is what a control-room screen does and what makes "now" mean
       something on a tab whose only other control is a button.
       Both tabs run their own C.makeLive instance. The constructor prefills
       48 h, so the chart is full from the first frame, and leaving the tab
       unmounts the instance rather than leaving a frame request running
       behind a hidden canvas. */
    const LIVE_RATE = 10;          // simulated minutes per second of wall clock, 600x
    const LIVE_MAX_STEPS = 240;    // per frame, 8 h of simulated time, a backgrounded tab
    const LIVE_TILE_MS = 100;      // how often the readouts are allowed to change
    const LIVE_TICK_MIN = 6 * 60;  // x axis tick and grid spacing

    function nowMs() {
      return typeof performance !== 'undefined' && performance.now
        ? performance.now() : Date.now();
    }

    /* Wall-clock time of day of a simulated minute, for the wandering axis.
       The stream starts at t = 0 and runs forward, and its window reaches two
       days back into negative time, hence the two-sided modulo. */
    function clockOf(tMin) {
      const m = ((Math.round(tMin) % C.DAY_MIN) + C.DAY_MIN) % C.DAY_MIN;
      const h = Math.floor(m / 60), mm = m % 60;
      return (h < 10 ? '0' : '') + h + ':' + (mm < 10 ? '0' : '') + mm;
    }

    /* One stream per mounted tab, kept in a ref so that a re-render does not
       restart the plant. The pump turns elapsed wall clock into whole dt
       steps and carries the remainder, so the average speed is exactly
       `rate` whatever the frame times do, and a frame that arrives after a
       long stall advances at most LIVE_MAX_STEPS. */
    function useStream(rate, opts) {
      const ref = useRef(0);
      if (!ref.current) {
        const live = C.makeLive(opts || {});
        let carry = 0;
        ref.current = {
          live: live,
          pump: (dReal) => {
            carry += dReal * rate / 1000;
            const n = Math.floor(carry / C.DEMO.dtMin);
            if (n <= 0) return;
            carry -= n * C.DEMO.dtMin;
            live.step(Math.min(n, LIVE_MAX_STEPS));
          }
        };
      }
      return ref.current;
    }

    /* A canvas that redraws once per animation frame and advances the stream
       while it is at it. Deliberately not useCanvas plus a state bump:
       useCanvas resizes the backing store on every render, and reallocating
       a 4K canvas sixty times a second is the one thing that would make the
       strip stutter on a projector. The size is set when the layout or the
       theme changes, and nothing else happens per frame except drawing.
       drawRef.current is read fresh every frame, so the parent may rebuild
       its draw closure on every render without restarting the loop. */
    function StripCanvas({ height, drawRef, running, onFrame }) {
      const cvRef = useRef(null);
      const [bumpN, bump] = useState(0);
      useEffect(() => {
        const on = () => bump((n) => n + 1);
        window.addEventListener('resize', on);
        window.addEventListener('themechange', on);
        return () => { window.removeEventListener('resize', on); window.removeEventListener('themechange', on); };
      }, []);
      useEffect(() => {
        const cv = cvRef.current;
        if (!cv) return undefined;
        readPalette();
        const rect = cv.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const w = Math.max(1, Math.round(rect.width)), h = height;
        cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
        const ctx = cv.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const paint = () => {
          ctx.clearRect(0, 0, w, h);
          if (typeof drawRef.current === 'function') drawRef.current(ctx, w, h);
        };
        paint();                     // a paused strip is still a strip
        if (!running) return undefined;
        let raf = 0, alive = true, prev = null;
        const frame = (ts) => {
          if (!alive) return;
          if (prev === null) prev = ts;
          /* A tab that was in the background for a minute would otherwise
             ask for a minute of simulated time in one frame. */
          const dReal = Math.min(250, ts - prev);
          prev = ts;
          if (onFrame) onFrame(dReal);
          paint();
          raf = window.requestAnimationFrame(frame);
        };
        raf = window.requestAnimationFrame(frame);
        return () => { alive = false; window.cancelAnimationFrame(raf); };
      }, [height, running, bumpN]);
      return html`<canvas ref=${cvRef} className="lv-canvas" style=${{ height: height + 'px' }}></canvas>`;
    }

    /* The wandering grid and the time axis of a trailing window. Day
       boundaries are drawn a shade stronger than the six-hour marks, which is
       the only thing that tells one demo day from the next. */
    function liveGrid(ctx, xOfT, t0, t1, yT, yB) {
      ctx.save();
      ctx.strokeStyle = COL.grid;
      ctx.lineWidth = 1;
      const first = Math.ceil(t0 / LIVE_TICK_MIN) * LIVE_TICK_MIN;
      for (let tm = first; tm <= t1; tm += LIVE_TICK_MIN) {
        ctx.globalAlpha = (((tm % C.DAY_MIN) + C.DAY_MIN) % C.DAY_MIN) === 0 ? 0.34 : 0.16;
        const x = xOfT(tm);
        ctx.beginPath(); ctx.moveTo(x, yT); ctx.lineTo(x, yB); ctx.stroke();
      }
      ctx.restore();
    }

    /* The right-hand edge: the line the samples arrive on. */
    function liveEdge(ctx, x, yT, yB, label) {
      ctx.save();
      ctx.strokeStyle = COL.emph;
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x, yT); ctx.lineTo(x, yB); ctx.stroke();
      ctx.globalAlpha = 1;
      if (label) {
        ctx.font = '600 13px system-ui, sans-serif';
        ctx.fillStyle = COL.emph;
        ctx.textAlign = 'right';
        ctx.textBaseline = 'top';
        ctx.fillText(label, x - 5, yT + 2);
      }
      ctx.restore();
    }

    /* ── Level 1: descriptive ─────────────────────────────────────────────
       The trailing forty-eight hours of the demo plant on one canvas, in two
       lanes: the temperatures on top, the load factor underneath, sharing the
       x axis. The window walks, the readouts follow the right-hand edge, and
       the only control is Pause, for the moment on stage when the sentence
       matters more than the animation.
       Three of the four traces are things a substation actually has. The
       fourth, the hot spot, is the one the tab is about, and it exists only
       because a model computed it.
       The lane bounds are absolute canvas coordinates and have to keep adding
       up to D1_H, the same convention as the strip chart on the thermal
       page. */
    const D1_H = 470;
    const D1 = {
      /* padR leaves room for the half of the last clock label that sits past
         the end of the axis. */
      padL: 74, padR: 44,
      tT: 16, tB: 330,      // temperature lane
      sep: 342,
      kT: 356, kB: 440,     // load lane
      xLab: 446
    };
    const D1_HOURS = 48;
    const D1_KFULL = 1.2;          // top of the load lane, pu

    function Descriptive() {
      const st = useStream(LIVE_RATE, {});
      const live = st.live;
      const [running, setRunning] = useState(true);
      const [, bump] = useState(0);
      const tileRef = useRef(0);
      const drawRef = useRef(0);

      /* A fixed y range, taken once from the same plant computed offline: a
         strip whose axis rescales while it scrolls cannot be read. The 98 C
         reference has to fit inside it. */
      const sc = useMemo(() => {
        const r = C.simPlant(D1_HOURS, {});
        let lo = Infinity, hi = C.DEMO.overTemp + 2;
        for (let k = 0; k < r.t.length; k++) {
          if (r.amb[k] < lo) lo = r.amb[k];
          if (r.thHtwin[k] > hi) hi = r.thHtwin[k];
        }
        return niceRange(lo, hi, 5);
      }, []);

      /* The chart follows every frame, the numbers ten times a second: a
         readout that changes sixty times a second is a blur, and the tile row
         is what the presenter reads out loud. */
      const onFrame = (dReal) => {
        st.pump(dReal);
        const t = nowMs();
        if (t - tileRef.current > LIVE_TILE_MS) { tileRef.current = t; bump((n) => n + 1); }
      };

      drawRef.current = (ctx, w) => {
        const x0 = D1.padL, x1 = w - D1.padR, wPlot = x1 - x0;
        const t1 = live.now(), t0 = t1 - D1_HOURS * 60;
        const A = live.arr, N = live.count(), ph = live.phys;
        const xOfT = (tm) => x0 + (tm - t0) / (t1 - t0) * wPlot;
        const xOfI = (k) => xOfT(A.tMin[ph(k)]);
        const yOfT = (v) => D1.tB - (v - sc.lo) / (sc.hi - sc.lo) * (D1.tB - D1.tT);
        const yOfK = (k) => D1.kB - Math.max(0, Math.min(D1_KFULL, k)) / D1_KFULL * (D1.kB - D1.kT);

        yAxis(ctx, x0, x1, yOfT, sc.lo, sc.hi, sc.step, ' °C');
        liveGrid(ctx, xOfT, t0, t1, D1.tT, D1.kB);
        refLine(ctx, x0, x1, yOfT(C.DEMO.overTemp), C.DEMO.overTemp + ' °C reference', COL.faint);

        // Temperatures, clipped to their lane.
        ctx.save();
        ctx.beginPath(); ctx.rect(x0, D1.tT, wPlot, D1.tB - D1.tT); ctx.clip();
        ctx.lineJoin = 'bevel';
        ctx.strokeStyle = COL.note; ctx.lineWidth = 1.6;
        pathSeries(ctx, (k) => A.thA[ph(k)], 0, N - 1, xOfI, yOfT, wPlot, false); ctx.stroke();
        /* Measured, so drawn thin: the 0.5 K sensor noise is on it and at one
           sample per 2 min the line has to stay light enough to read through. */
        ctx.strokeStyle = COL.text; ctx.lineWidth = 1.1; ctx.globalAlpha = 0.9;
        pathSeries(ctx, (k) => A.thOmeas[ph(k)], 0, N - 1, xOfI, yOfT, wPlot, false); ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.strokeStyle = COL.accent; ctx.lineWidth = 3;
        pathSeries(ctx, (k) => A.thHtwin[ph(k)], 0, N - 1, xOfI, yOfT, wPlot, false); ctx.stroke();
        ctx.restore();

        // Lane separator: two panels on one canvas, not one crowded plot.
        ctx.save();
        ctx.strokeStyle = COL.border;
        ctx.globalAlpha = 0.55;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x0 - D1.padL + 2, D1.sep + 0.5); ctx.lineTo(x1, D1.sep + 0.5); ctx.stroke();
        ctx.restore();

        // Load lane, its own tiny axis on the same x.
        ctx.save();
        ctx.beginPath(); ctx.rect(x0, D1.kT - 2, wPlot, D1.kB - D1.kT + 4); ctx.clip();
        ctx.strokeStyle = COL.faint;
        ctx.globalAlpha = 0.5;
        ctx.setLineDash([3, 4]);
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x0, yOfK(1)); ctx.lineTo(x1, yOfK(1)); ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = COL.label; ctx.lineWidth = 1.8;
        pathSeries(ctx, (k) => A.K[ph(k)], 0, N - 1, xOfI, yOfK, wPlot, false); ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.font = '13px system-ui, sans-serif';
        ctx.fillStyle = COL.note;
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText('0.5 pu', x0 - 10, yOfK(0.5));
        ctx.fillStyle = COL.faint;
        ctx.fillText('1.0 pu', x0 - 10, yOfK(1));
        ctx.font = '600 12px system-ui, sans-serif';
        ctx.fillStyle = COL.note;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText('LOAD', x0 + 5, D1.sep + 5);
        ctx.restore();

        xAxis(ctx, x0, x1, D1.kB, t0, t1, LIVE_TICK_MIN, clockOf);

        // The arrival edge, with the newest hot spot sitting on it.
        liveEdge(ctx, x1, D1.tT, D1.kB, 'now');
        if (N > 0) {
          ctx.save();
          ctx.fillStyle = COL.accent;
          ctx.beginPath(); ctx.arc(x1, yOfT(A.thHtwin[ph(N - 1)]), 4.5, 0, 2 * Math.PI); ctx.fill();
          ctx.restore();
        }
      };

      const thH = live.last('thHtwin');
      const rate = C.agingRate(thH);
      return html`
        <${React.Fragment}>
          <div className="lv-tiles">
            <${Tile} label="load" value=${live.last('K').toFixed(2)} unit="pu" />
            <${Tile} label="ambient" value=${live.last('thA').toFixed(1)} unit="°C" />
            <${Tile} label="top oil, measured" value=${live.last('thOmeas').toFixed(1)} unit="°C" />
            <${Tile} label="hot spot, computed" value=${thH.toFixed(1)} unit="°C" emph=${true} />
            <${Tile} label="ageing rate" value=${rate < 10 ? rate.toFixed(2) : rate.toFixed(1)} unit="x normal" />
          </div>
          <${StripCanvas} height=${D1_H} drawRef=${drawRef} running=${running} onFrame=${onFrame} />
          <${Legend} items=${[
            { label: 'hot spot, computed', color: COL.accent },
            { label: 'top oil, measured', color: COL.text },
            { label: 'ambient', color: COL.note },
            { label: 'load', color: COL.label }
          ]} />
          <div className="lv-act">
            <button type="button" className=${running ? 'secondary' : ''}
              onClick=${() => setRunning(!running)}>
              ${running ? 'Pause' : 'Resume'}
            </button>
            <span className="lv-actnote">
              ${'trailing 48 h, ' + clockOf(live.now()) + ', 600x' + (running ? '' : ', paused')}
            </span>
          </div>
        <//>
      `;
    }

    /* ── Playback ─────────────────────────────────────────────────────────
       A cursor walking over data that is already computed. Nothing is
       integrated while a frame is being drawn: the whole run exists before the
       first frame, and this only moves an index through it.
       `total` is the length of the run in simulated minutes, `rate` how many
       simulated minutes pass per second of wall clock, `startAt` where the
       cursor is parked whenever `runKey` changes, and `running` whether it
       moves at all. The loop stops itself at the end of the run and is
       cancelled on unmount, so leaving the tab stops it rather than leaving a
       frame request running behind a hidden chart.
       The frame delta is clamped: a tab that was in the background for a
       minute would otherwise jump the whole run in a single step. */
    function usePlayback(total, rate, runKey, startAt, running) {
      const tRef = useRef(0);
      const [tMin, setTMin] = useState(startAt || 0);
      useEffect(() => {
        tRef.current = startAt || 0;
        setTMin(tRef.current);
        if (!running) return undefined;
        let raf = 0, prev = null, live = true;
        const tick = (ts) => {
          if (!live) return;
          if (prev === null) prev = ts;
          const dReal = Math.min(250, ts - prev);
          prev = ts;
          let v = tRef.current + dReal * rate / 1000;
          if (v >= total) v = total;
          tRef.current = v;
          setTMin(v);
          if (v < total) raf = window.requestAnimationFrame(tick);
        };
        raf = window.requestAnimationFrame(tick);
        return () => { live = false; window.cancelAnimationFrame(raf); };
      }, [runKey, running]);
      return tMin;
    }

    /* Minutes from midnight of demo day one as a clock time, for the event
       log. The run is two days long, so the day has to be in there too. */
    function hhmm(tMin) {
      const day = Math.floor(tMin / C.DAY_MIN) + 1;
      const m = Math.round(tMin - (day - 1) * C.DAY_MIN);
      const h = Math.floor(m / 60), mm = m % 60;
      return 'd' + day + ' ' + (h < 10 ? '0' : '') + h + ':' + (mm < 10 ? '0' : '') + mm;
    }

    /* ── Level 2: diagnostic ──────────────────────────────────────────────
       Two panels on one canvas. On top the top oil as the sensor reports it
       against the top oil the twin computes, which is level 1 read as a pair.
       Underneath their difference, which is the level 2 statement: a residual
       inside the band is a model that still fits, a residual outside it is a
       plant that has changed.
       The band is analytic, not fitted to the data it judges. Sigma of a
       15-sample mean of 0.5 K white sensor noise is 0.5 / sqrt(15) = 0.129 K,
       and the band is three of those.
       One plant, running. The button does exactly one thing: it starts, or
       stops, a cooling degradation AT THE PRESENT MOMENT of the stream. It
       never moves the clock, never clears the chart and never picks a
       prepared dataset. Injecting bends the rated top-oil rise up by 25 % over
       2 h from now, clearing bends it back from wherever the blend had got
       to, and the residual walks out of the band and later back into it on the
       plant's own time constants. The onset and the flag are marked where
       they happened and scroll off the left edge with everything else. */
    const D2_H = 462;
    const D2 = { padL: 74, padR: 44, tT: 18, tB: 252, sep: 264, rT: 292, rB: 436 };
    const D2_HOURS = 48;
    /* The residual axis has to hold a band four tenths of a kelvin wide and a
       fault worth eleven, and the stream walks from one to the other without
       being restarted, so the axis glides instead of switching. One second of
       wall clock per e-fold: slow enough to read as a zoom, fast enough to
       have finished by the time the residual has left the band. */
    const D2_GLIDE_S = 1.0;

    function Diagnostic() {
      const st = useStream(LIVE_RATE, {});
      const live = st.live;
      const [faulted, setFaulted] = useState(false);
      const [, bump] = useState(0);
      const tileRef = useRef(0);
      const drawRef = useRef(0);
      const rsRef = useRef(0);

      /* The button owns the state, the plant follows it. Applied here rather
         than in the click handler so that the two can never disagree, and
         because setFault is idempotent: it returns at once if the plant is
         already in the state asked for. */
      if (live.faultOn() !== faulted) live.setFault(faulted);

      /* One temperature scale for the healthy and the degraded plant, taken
         once from the same physics computed offline, so that the fault moves
         the trace and not the axis. */
      const sc = useMemo(() => {
        let lo = Infinity, hi = -Infinity;
        [C.simPlant(D2_HOURS, {}), C.simPlant(D2_HOURS, { faultAtMin: 0 })].forEach((r) => {
          for (let k = 0; k < r.t.length; k++) {
            if (r.thOmeas[k] < lo) lo = r.thOmeas[k];
            if (r.thOmeas[k] > hi) hi = r.thOmeas[k];
            if (r.thOtwin[k] < lo) lo = r.thOtwin[k];
            if (r.thOtwin[k] > hi) hi = r.thOtwin[k];
          }
        });
        return niceRange(lo - 1, hi + 1, 5);
      }, []);

      const onFrame = (dReal) => {
        st.pump(dReal);
        const t = nowMs();
        if (t - tileRef.current > LIVE_TILE_MS) { tileRef.current = t; bump((n) => n + 1); }
      };

      const status = live.status();
      const flagged = status === 'FLAGGED';
      const onsetMin = live.onsetMin(), flagMin = live.flagMin();
      const lagMin = flagMin != null && onsetMin != null && flagMin >= onsetMin
        ? flagMin - onsetMin : null;
      /* The window is prefilled, so the trailing mean is always a full 30 min
         mean. The fallback stays for the first samples after a reset. */
      const smFull = live.count() >= live.smoothW;

      drawRef.current = (ctx, w) => {
        const x0 = D2.padL, x1 = w - D2.padR, wPlot = x1 - x0;
        const t1 = live.now(), t0 = t1 - D2_HOURS * 60;
        const A = live.arr, N = live.count(), ph = live.phys;
        const xOfT = (tm) => x0 + (tm - t0) / (t1 - t0) * wPlot;
        const xOfI = (k) => xOfT(A.tMin[ph(k)]);
        const yOfT = (v) => D2.tB - (v - sc.lo) / (sc.hi - sc.lo) * (D2.tB - D2.tT);

        /* The residual axis, glided towards what is in the window. Nothing on
           this tab is allowed to jump, the axis least of all. */
        let m = 4 * live.band;
        for (let k = 0; k < N; k++) {
          const v = Math.abs(A.residRaw[ph(k)]);
          if (v > m) m = v;
        }
        const want = niceRange(-1.08 * m, 1.08 * m, 5);
        const tNowMs = nowMs();
        let rs = rsRef.current;
        if (!rs || rs.at == null) {
          rs = { lo: want.lo, hi: want.hi, at: tNowMs };
          rsRef.current = rs;
        } else {
          const dS = Math.max(0, Math.min(0.25, (tNowMs - rs.at) / 1000));
          const a = 1 - Math.exp(-dS / D2_GLIDE_S);
          rs.lo += (want.lo - rs.lo) * a;
          rs.hi += (want.hi - rs.hi) * a;
          rs.at = tNowMs;
        }
        const rStep = niceStep(rs.hi - rs.lo, 5);
        const yOfR = (v) => D2.rB - (v - rs.lo) / (rs.hi - rs.lo) * (D2.rB - D2.rT);

        yAxis(ctx, x0, x1, yOfT, sc.lo, sc.hi, sc.step, ' °C');
        yAxis(ctx, x0, x1, yOfR, rs.lo, rs.hi, rStep, ' K');

        liveGrid(ctx, xOfT, t0, t1, D2.tT, D2.tB);
        liveGrid(ctx, xOfT, t0, t1, D2.rT, D2.rB);

        // Top panel: what the sensor says against what the model says.
        ctx.save();
        ctx.beginPath(); ctx.rect(x0, D2.tT, wPlot, D2.tB - D2.tT); ctx.clip();
        ctx.lineJoin = 'bevel';
        ctx.strokeStyle = COL.text; ctx.lineWidth = 1.1; ctx.globalAlpha = 0.85;
        pathSeries(ctx, (k) => A.thOmeas[ph(k)], 0, N - 1, xOfI, yOfT, wPlot, false); ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.strokeStyle = COL.accent; ctx.lineWidth = 2.8;
        pathSeries(ctx, (k) => A.thOtwin[ph(k)], 0, N - 1, xOfI, yOfT, wPlot, false); ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.strokeStyle = COL.border;
        ctx.globalAlpha = 0.55;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x0 - D2.padL + 2, D2.sep + 0.5); ctx.lineTo(x1, D2.sep + 0.5); ctx.stroke();
        ctx.restore();

        // Bottom panel: the residual, its band, and the zero it should sit on.
        ctx.save();
        ctx.beginPath(); ctx.rect(x0, D2.rT, wPlot, D2.rB - D2.rT); ctx.clip();
        ctx.fillStyle = COL.accent;
        ctx.globalAlpha = 0.16;
        ctx.fillRect(x0, yOfR(live.band), wPlot, yOfR(-live.band) - yOfR(live.band));
        ctx.globalAlpha = 1;
        ctx.strokeStyle = COL.border;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x0, yOfR(0)); ctx.lineTo(x1, yOfR(0)); ctx.stroke();
        /* The raw residual as dots, one per sample and at most one per pixel
           column: it is the noise the band is made of, and drawing it as a
           line would claim more continuity than 2 min samples have. */
        ctx.fillStyle = COL.text;
        ctx.globalAlpha = 0.30;
        const stride = Math.max(1, Math.round(N / Math.max(1, wPlot)));
        /* One path for all of them and one fill: fourteen hundred separate
           fillRect calls sixty times a second is the kind of thing that shows
           up as a stutter on a projector. */
        ctx.beginPath();
        for (let k = 0; k < N; k += stride) {
          ctx.rect(xOfI(k) - 0.9, yOfR(A.residRaw[ph(k)]) - 0.9, 1.8, 1.8);
        }
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.lineJoin = 'bevel';
        ctx.strokeStyle = COL.accent; ctx.lineWidth = 2.6;
        pathSeries(ctx, (k) => A.residSm[ph(k)], 0, N - 1, xOfI, yOfR, wPlot, false);
        ctx.stroke();
        ctx.restore();

        /* The onset, quietly, and the flag, not quietly. Both stand where they
           happened and leave the chart on the left edge like everything else:
           what is on the screen is the last 48 h, no more and no less. */
        const mark = (tm, col, label, dash, atY) => {
          if (tm == null || tm < t0 || tm > t1) return;
          const x = xOfT(tm), right = x > x1 - 250;
          ctx.save();
          ctx.strokeStyle = col;
          ctx.lineWidth = 1.5;
          ctx.globalAlpha = 0.85;
          if (dash) ctx.setLineDash(dash);
          ctx.beginPath(); ctx.moveTo(x, D2.tT); ctx.lineTo(x, D2.tB); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x, D2.rT); ctx.lineTo(x, D2.rB); ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = 1;
          ctx.font = '600 13px system-ui, sans-serif';
          ctx.fillStyle = col;
          ctx.textAlign = right ? 'right' : 'left';
          ctx.textBaseline = 'top';
          ctx.fillText(label, x + (right ? -6 : 6), atY);
          ctx.restore();
        };
        mark(onsetMin, COL.note, 'cooling fault starts', [4, 4], D2.tT + 2);
        if (flagged && lagMin != null) {
          mark(flagMin, COL.bad,
            'flagged, ' + lagMin.toFixed(0) + ' min after onset', null, D2.rT + 2);
        }

        xAxis(ctx, x0, x1, D2.rB, t0, t1, LIVE_TICK_MIN, clockOf);

        // The arrival edge, carrying the two numbers in the tiles.
        liveEdge(ctx, x1, D2.tT, D2.tB, 'now');
        liveEdge(ctx, x1, D2.rT, D2.rB, null);
        if (N > 0) {
          ctx.save();
          ctx.fillStyle = COL.accent;
          ctx.beginPath(); ctx.arc(x1, yOfT(A.thOtwin[ph(N - 1)]), 4, 0, 2 * Math.PI); ctx.fill();
          ctx.beginPath(); ctx.arc(x1, yOfR(A.residSm[ph(N - 1)]), 4, 0, 2 * Math.PI); ctx.fill();
          ctx.restore();
        }

        ctx.save();
        ctx.font = '600 12px system-ui, sans-serif';
        ctx.fillStyle = COL.note;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText('TOP OIL', x0 + 5, D2.tT + 2);
        ctx.fillText('RESIDUAL, MEASURED MINUS MODELLED', x0 + 5, D2.sep + 5);
        ctx.restore();
      };

      const pct = ((C.DEMO.faultScale - 1) * 100).toFixed(0);
      const clearMin = live.clearMin();
      const recovering = !faulted && clearMin != null &&
        (flagged || live.now() - clearMin < C.DEMO.faultBlendMin);
      const state = faulted
        ? 'rated top-oil rise degrading by ' + pct + ' % since ' + clockOf(onsetMin)
        : recovering
          ? 'recovering, cooling restored at ' + clockOf(clearMin)
          : 'healthy plant';

      return html`
        <${React.Fragment}>
          <div className="lv-tiles">
            <${Tile} label="residual, 30 min mean"
              value=${smFull ? live.last('residSm').toFixed(2) : '--'}
              unit=${smFull ? 'K' : ''} emph=${true} />
            <${Tile} label="band, three sigma" value=${'±' + live.band.toFixed(2)} unit="K" />
            <${Tile} label="status" value=${flagged ? 'FLAGGED' : 'OK'} unit=""
              color=${flagged ? COL.bad : COL.good} />
            <${Tile} label="detection lag" value=${flagged && lagMin != null ? lagMin.toFixed(0) : '--'}
              unit=${flagged && lagMin != null ? 'min' : ''} />
          </div>
          <${StripCanvas} height=${D2_H} drawRef=${drawRef} running=${true} onFrame=${onFrame} />
          <${Legend} items=${[
            { label: 'top oil, modelled', color: COL.accent },
            { label: 'top oil, measured', color: COL.text },
            { label: 'band, three sigma of the smoothed sensor noise', color: COL.accent, band: true },
            { label: 'flag', color: COL.bad }
          ]} />
          <div className="lv-act">
            <button type="button" className=${faulted ? 'secondary' : ''}
              onClick=${() => setFaulted(!faulted)}>
              ${faulted ? 'Clear fault' : 'Inject cooling fault'}
            </button>
            <span className="lv-actnote">
              ${state + ', ' + clockOf(live.now()) + ', 600x'}
            </span>
          </div>
        <//>
      `;
    }

    /* ── Level 3: predictive ──────────────────────────────────────────────
       Twenty-four hours of history, then the 48 h ensemble. The median is
       drawn thinner than the bands are wide, on purpose: at 48 h the 5 to
       95 % band is the answer and the median is a line through the middle
       of it.
       The slider is the peak load of the coming days in ONAN per unit, and it
       is the peak that moves: the night trough is held at the 0.50 pu of the
       demo day and the mean follows the peak, which is what a hotter or
       cooler week looks like on a distribution transformer. Scaling the
       amplitude around a fixed mean instead would push the trough down to
       0.2 pu at the top of the slider, which is not a day anyone has. */
    const P3_H = 470;
    const P3 = { padL: 74, padR: 26, tT: 20, tB: 424, xLab: 430 };
    const P3_TROUGH = 0.50;        // pu, the night load of the demo day

    function Predictive() {
      const [peakPu, setPeakPu] = useState(1.0);
      const fc = useMemo(() => C.forecast(1, {
        loadMean: 0.5 * (peakPu + P3_TROUGH),
        loadAmp: 0.5 * (peakPu - P3_TROUGH)
      }), [peakPu]);
      const nF = fc.t.length - 1, nH = fc.tHist.length - 1;

      /* Both reference lines are always in view. Without the 120 C line the
         axis would rescale under the slider and the two bands would look the
         same width at every load. */
      const sc = useMemo(() => {
        let lo = Infinity, hi = C.DEMO.limitCyclic + 3;
        for (let k = 0; k <= nH; k++) if (fc.hist[k] < lo) lo = fc.hist[k];
        for (let k = 0; k <= nF; k++) {
          if (fc.q05[k] < lo) lo = fc.q05[k];
          if (fc.q95[k] > hi) hi = fc.q95[k];
        }
        return niceRange(lo, hi, 6);
      }, [fc]);

      const cvRef = useCanvas(P3_H, (ctx, w) => {
        const x0 = P3.padL, x1 = w - P3.padR, wPlot = x1 - x0;
        const h0 = -C.DEMO.histHours, h1 = C.DEMO.fcstHours;
        const xOfH = (hh) => x0 + (hh - h0) / (h1 - h0) * wPlot;
        const yOf = (v) => P3.tB - (v - sc.lo) / (sc.hi - sc.lo) * (P3.tB - P3.tT);
        const xF = (k) => xOfH(fc.t[k] / 60);
        const xH = (k) => xOfH(fc.tHist[k] / 60);

        yAxis(ctx, x0, x1, yOf, sc.lo, sc.hi, sc.step, ' °C');

        ctx.save();
        ctx.strokeStyle = COL.grid;
        ctx.globalAlpha = 0.18;
        ctx.lineWidth = 1;
        for (let hh = h0 + 12; hh < h1; hh += 12) {
          if (hh === 0) continue;
          const x = xOfH(hh);
          ctx.beginPath(); ctx.moveTo(x, P3.tT); ctx.lineTo(x, P3.tB); ctx.stroke();
        }
        ctx.restore();

        // Bands first, everything else on top of them.
        ctx.save();
        ctx.beginPath(); ctx.rect(x0, P3.tT, wPlot, P3.tB - P3.tT); ctx.clip();
        ctx.fillStyle = COL.accent;
        ctx.globalAlpha = 0.13;
        fillBand(ctx, (k) => fc.q95[k], (k) => fc.q05[k], 0, nF, xF, yOf, wPlot); ctx.fill();
        ctx.globalAlpha = 0.24;
        fillBand(ctx, (k) => fc.q75[k], (k) => fc.q25[k], 0, nF, xF, yOf, wPlot); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.lineJoin = 'bevel';
        ctx.strokeStyle = COL.text; ctx.lineWidth = 2.2;
        pathSeries(ctx, (k) => fc.hist[k], 0, nH, xH, yOf, wPlot, false); ctx.stroke();
        ctx.strokeStyle = COL.accent; ctx.lineWidth = 2.8;
        pathSeries(ctx, (k) => fc.med[k], 0, nF, xF, yOf, wPlot, false); ctx.stroke();
        ctx.restore();

        refLine(ctx, x0, x1, yOf(C.DEMO.overTemp),
          C.DEMO.overTemp + ' °C, ageing reference', COL.faint);
        refLine(ctx, x0, x1, yOf(C.DEMO.limitCyclic),
          C.DEMO.limitCyclic + ' °C, IEC 60076-7 normal cyclic limit', COL.faint);

        // Where the record stops and the model starts.
        const xn = xOfH(0);
        ctx.save();
        ctx.strokeStyle = COL.emph;
        ctx.globalAlpha = 0.7;
        ctx.lineWidth = 1.5;
        ctx.setLineDash([5, 4]);
        ctx.beginPath(); ctx.moveTo(xn, P3.tT - 4); ctx.lineTo(xn, P3.tB); ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
        ctx.font = '600 13px system-ui, sans-serif';
        ctx.fillStyle = COL.emph;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText('now', xn + 6, P3.tT - 6);
        ctx.textAlign = 'right';
        ctx.font = '13px system-ui, sans-serif';
        ctx.fillStyle = COL.note;
        ctx.fillText('measured', xn - 6, P3.tT - 6);
        ctx.restore();

        xAxis(ctx, x0, x1, P3.tB, h0, h1, 12, (v) => (v > 0 ? '+' : '') + v + ' h');
      });

      return html`
        <${React.Fragment}>
          <div className="lv-tiles">
            <${Tile} label="median peak hot spot" value=${fc.medPeak.toFixed(1)} unit="°C" />
            <${Tile} label=${'P(hot spot > ' + C.DEMO.overTemp + ' °C within 48 h)'}
              value=${(100 * fc.pOver98).toFixed(0)} unit="%" emph=${true} />
            <${Tile} label="ensemble members" value=${fc.n} unit="runs" />
          </div>
          <canvas ref=${cvRef} className="lv-canvas" style=${{ height: P3_H + 'px' }}></canvas>
          <${Legend} items=${[
            { label: 'measured history', color: COL.text },
            { label: 'forecast median', color: COL.accent },
            { label: '25 to 75 %', color: COL.accent, band: true },
            { label: '5 to 95 %', color: COL.accent, band: true }
          ]} />
          <${Ctl} id="lv-p3-peak" label="tomorrow's peak load" min=${0.8} max=${1.3} step=${0.05}
            value=${peakPu} onChange=${setPeakPu} format=${(v) => v.toFixed(2) + ' pu'} />
        <//>
      `;
    }

    /* ── Level 5: autonomous ──────────────────────────────────────────────
       The same model, the same day, and nobody in the loop. Three lanes on one
       canvas: the hot spot with the three thresholds the controller acts on,
       the demanded load against the served one with the gap between them
       shaded, and the cooling stage as a band along the floor.
       The chart shows only what has already happened, and the log beside it
       shows only the decisions already taken, because that is the whole claim
       of the level: not that the loop is clever, but that every step of it is
       written down. Sense, decide, act, with a timestamp.
       autoRun() computes all of it once. The playback moves an index. */
    const A5_H = 500;
    const A5 = {
      padL: 74, padR: 26,
      tT: 18, tB: 300,        // hot-spot lane
      sep: 312,
      kT: 326, kB: 414,       // load lane
      sgT: 426, sgB: 448      // cooling stage band, x axis sits on its floor
    };
    const A5_HOURS = 48;
    /* The load lane does not start at zero. Demand runs between 0.65 and
       1.35 pu and the curtailed gap is about 0.11 pu wide, which on a lane
       from zero would be six pixels and invisible from the back of a room.
       Both bounds are labelled on the axis. */
    const A5_KLO = 0.5, A5_KHI = 1.5;
    /* Two demo days in twenty-four seconds. The number that matters is the
       wall clock: the whole page has three to four minutes on stage. */
    const A5_RATE = 120;      // simulated minutes per second

    function Autonomous() {
      const run = useMemo(() => C.autoRun(), []);
      const nMax = run.t.length - 1;
      const total = A5_HOURS * 60;
      const [playing, setPlaying] = useState(false);
      const [runKey, setRunKey] = useState(0);
      const tMin = usePlayback(total, A5_RATE, runKey, 0, playing);
      const iNow = Math.max(0, Math.min(nMax, Math.round(tMin / run.dtMin)));
      const started = playing || tMin > 0;

      const logRef = useRef(null);
      const shown = run.events.filter((e) => e.tMin <= tMin);
      /* Newest line into view. The log reads top to bottom like a log, which
         means the interesting end of it is the bottom one. */
      useEffect(() => {
        const el = logRef.current;
        if (el && el.scrollHeight) el.scrollTop = el.scrollHeight;
      }, [shown.length]);

      const sc = useMemo(() => {
        let lo = Infinity;
        for (let k = 0; k <= nMax; k++) if (run.thH[k] < lo) lo = run.thH[k];
        return niceRange(lo - 3, C.DEMO.tripC + 2, 8);
      }, [run]);

      const cvRef = useCanvas(A5_H, (ctx, w) => {
        const x0 = A5.padL, x1 = w - A5.padR, wPlot = x1 - x0;
        const xOfT = (tm) => x0 + tm / total * wPlot;
        const xOfI = (k) => xOfT(k * run.dtMin);
        const yOfT = (v) => A5.tB - (v - sc.lo) / (sc.hi - sc.lo) * (A5.tB - A5.tT);
        const yOfK = (k) => A5.kB - (Math.max(A5_KLO, Math.min(A5_KHI, k)) - A5_KLO) /
          (A5_KHI - A5_KLO) * (A5.kB - A5.kT);
        const xc = xOfT(tMin);
        const wSeen = Math.max(1, xc - x0);

        yAxis(ctx, x0, x1, yOfT, sc.lo, sc.hi, sc.step, ' °C');

        ctx.save();
        ctx.strokeStyle = COL.grid;
        ctx.globalAlpha = 0.18;
        ctx.lineWidth = 1;
        for (let hh = 6; hh < A5_HOURS; hh += 6) {
          const x = xOfT(hh * 60);
          ctx.beginPath(); ctx.moveTo(x, A5.tT); ctx.lineTo(x, A5.kB); ctx.stroke();
        }
        ctx.restore();

        refLine(ctx, x0, x1, yOfT(C.DEMO.fanOnC), C.DEMO.fanOnC + ' °C, fans on', COL.info);
        refLine(ctx, x0, x1, yOfT(C.DEMO.limitOnC), C.DEMO.limitOnC + ' °C, load cap', COL.warn);
        refLine(ctx, x0, x1, yOfT(C.DEMO.tripC), C.DEMO.tripC + ' °C, trip', COL.bad);

        ctx.save();
        ctx.beginPath(); ctx.rect(x0, A5.tT, wPlot, A5.tB - A5.tT); ctx.clip();
        ctx.lineJoin = 'bevel';
        if (iNow > 0) {
          ctx.strokeStyle = COL.accent; ctx.lineWidth = 3;
          pathSeries(ctx, (k) => run.thH[k], 0, iNow, xOfI, yOfT, wSeen, false); ctx.stroke();
        }
        ctx.restore();

        ctx.save();
        ctx.strokeStyle = COL.border;
        ctx.globalAlpha = 0.55;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x0 - A5.padL + 2, A5.sep + 0.5); ctx.lineTo(x1, A5.sep + 0.5); ctx.stroke();
        ctx.restore();

        // Load lane: what was asked, what was given, and the difference.
        ctx.save();
        ctx.beginPath(); ctx.rect(x0, A5.kT - 2, wPlot, A5.kB - A5.kT + 4); ctx.clip();
        ctx.strokeStyle = COL.faint;
        ctx.globalAlpha = 0.5;
        ctx.setLineDash([3, 4]);
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x0, yOfK(1)); ctx.lineTo(x1, yOfK(1)); ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
        if (iNow > 0) {
          ctx.fillStyle = COL.warn;
          ctx.globalAlpha = 0.3;
          fillBand(ctx, (k) => run.Kdem[k], (k) => run.Kserved[k], 0, iNow, xOfI, yOfK, wSeen);
          ctx.fill();
          ctx.globalAlpha = 1;
          ctx.strokeStyle = COL.label; ctx.lineWidth = 1.5;
          ctx.setLineDash([5, 4]);
          pathSeries(ctx, (k) => run.Kdem[k], 0, iNow, xOfI, yOfK, wSeen, false); ctx.stroke();
          ctx.setLineDash([]);
          ctx.strokeStyle = COL.accent; ctx.lineWidth = 2.4;
          pathSeries(ctx, (k) => run.Kserved[k], 0, iNow, xOfI, yOfK, wSeen, false); ctx.stroke();
        }
        ctx.restore();

        /* Cooling stage as a floor band, drawn as runs rather than per sample:
           two colours and a word in each stretch wide enough to hold one. */
        ctx.save();
        ctx.strokeStyle = COL.border;
        ctx.globalAlpha = 0.5;
        ctx.lineWidth = 1;
        ctx.strokeRect(x0 + 0.5, A5.sgT + 0.5, wPlot - 1, A5.sgB - A5.sgT - 1);
        ctx.globalAlpha = 1;
        let s0 = 0;
        for (let k = 1; k <= iNow + 1; k++) {
          if (k > iNow || run.stage[k] !== run.stage[s0]) {
            const xa = xOfI(s0), xb = xOfT(Math.min(tMin, k * run.dtMin));
            const fan = run.stage[s0] === 'ONAF';
            ctx.fillStyle = fan ? COL.info : COL.subtle;
            ctx.globalAlpha = fan ? 0.38 : 1;
            ctx.fillRect(xa, A5.sgT + 1, Math.max(0.5, xb - xa), A5.sgB - A5.sgT - 2);
            ctx.globalAlpha = 1;
            if (xb - xa > 54) {
              ctx.font = '600 12px system-ui, sans-serif';
              ctx.fillStyle = fan ? COL.emph : COL.note;
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(run.stage[s0], 0.5 * (xa + xb), 0.5 * (A5.sgT + A5.sgB));
            }
            s0 = k;
          }
        }
        ctx.restore();

        ctx.save();
        ctx.font = '13px system-ui, sans-serif';
        ctx.fillStyle = COL.note;
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText('1.0 pu', x0 - 10, yOfK(1));
        ctx.fillStyle = COL.faint;
        ctx.fillText('0.5 pu', x0 - 10, yOfK(A5_KLO));
        ctx.fillStyle = COL.note;
        ctx.fillText('cooling', x0 - 10, 0.5 * (A5.sgT + A5.sgB));
        ctx.font = '600 12px system-ui, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText('LOAD, DEMANDED AND SERVED', x0 + 5, A5.sep + 5);
        ctx.fillText('HOT SPOT', x0 + 5, A5.tT + 2);
        ctx.restore();

        xAxis(ctx, x0, x1, A5.sgB, 0, A5_HOURS, 6, (v) => v + ' h');

        // Every event that has already happened, as a tick on the time axis.
        ctx.save();
        ctx.strokeStyle = COL.emph;
        ctx.globalAlpha = 0.45;
        ctx.lineWidth = 1;
        run.events.forEach((e) => {
          if (e.tMin > tMin) return;
          const x = xOfT(e.tMin);
          ctx.beginPath(); ctx.moveTo(x, A5.tT); ctx.lineTo(x, A5.tB); ctx.stroke();
        });
        ctx.restore();

        ctx.save();
        ctx.strokeStyle = COL.emph;
        ctx.globalAlpha = 0.6;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(xc, A5.tT); ctx.lineTo(xc, A5.kB); ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.fillStyle = COL.accent;
        ctx.beginPath(); ctx.arc(xc, yOfT(run.thH[iNow]), 4.5, 0, 2 * Math.PI); ctx.fill();
        ctx.restore();
      });

      const curtail = run.Kdem[iNow] - run.Kserved[iNow];
      return html`
        <div className="lv-split">
          <div className="lv-main">
            <div className="lv-tiles">
              <${Tile} label="hot spot" value=${run.thH[iNow].toFixed(1)} unit="°C" emph=${true} />
              <${Tile} label="load served" value=${run.Kserved[iNow].toFixed(2)} unit="pu" />
              <${Tile} label="curtailed" value=${curtail.toFixed(2)} unit="pu"
                color=${curtail > 0.005 ? COL.warn : null} />
              <${Tile} label="cooling stage" value=${run.stage[iNow]} unit=""
                color=${run.stage[iNow] === 'ONAF' ? COL.info : null} />
              <${Tile} label="decisions taken" value=${shown.length} unit="" />
            </div>
            <canvas ref=${cvRef} className="lv-canvas" style=${{ height: A5_H + 'px' }}></canvas>
            <${Legend} items=${[
              { label: 'hot spot, computed', color: COL.accent },
              { label: 'load served', color: COL.accent },
              { label: 'load demanded', color: COL.label },
              { label: 'curtailed', color: COL.warn, band: true },
              { label: 'fans running', color: COL.info, band: true }
            ]} />
            <p className="lv-rules">
              <b>Cooling</b> ONAN to ONAF at ${C.DEMO.fanOnC} °C, back at ${C.DEMO.fanOffC} °C.<br/>
              <b>Load cap</b> armed at ${C.DEMO.limitOnC} °C, served load held at the value whose
              steady-state hot spot is ${C.DEMO.limitTargetC} °C, released at ${C.DEMO.limitOffC} °C.<br/>
              <b>Trip</b> latched at ${C.DEMO.tripC} °C, the IEC 60076-7 long-time emergency limit.
              It does not fire on this day, and it is in the loop anyway.
            </p>
            <div className="lv-act">
              <button type="button" className=${started ? 'secondary' : ''}
                onClick=${() => {
                  if (started) { setPlaying(false); setRunKey((n) => n + 1); }
                  else setPlaying(true);
                }}>
                ${started ? 'Reset' : 'Play'}
              </button>
              <span className="lv-actnote">
                ${'t = ' + (tMin / 60).toFixed(1) + ' h of ' + A5_HOURS + ' h, heat wave, 30 °C daily mean'}
              </span>
            </div>
          </div>
          <div className="lv-log" ref=${logRef}>
            <div className="lv-logh">event log</div>
            ${shown.length === 0
              ? html`<div className="lv-logempty">no decisions yet</div>`
              : shown.map((e, k) => html`
                <div key=${k} className="lv-logline">
                  <span className="lv-logt">${hhmm(e.tMin)}</span>
                  <span className="lv-logb">
                    <b>SENSE</b> ${e.sense}<br/>
                    <b>DECIDE</b> ${e.decide}<br/>
                    <b>ACT</b> ${e.act}
                  </span>
                </div>
              `)}
          </div>
        </div>
      `;
    }

    /* ── Level 4: prescriptive ────────────────────────────────────────────
       Three fixed dispatches of the same 1.30 pu, 4 h contingency, already
       scored by C.scenarios(): peak hot spot, feasibility against the 120 C
       cyclic limit, and ageing consumed. The only interaction is which card
       is selected, the simulations never run again, all three trajectories
       exist before the first click.
       Each option gets a fixed colour, independent of selection, so a card
       and its curve stay the same colour whichever one is chosen: A shares
       the "bad" hue with its own badge (it is the one over the limit), C
       shares the "good" hue with its badge (it is the recommendation), B
       sits in between on the info hue used for cooling elsewhere on the
       page. */
    const D4_H = 380;
    const D4 = { padL: 74, padR: 26, tT: 20, tB: 320 };
    const D4_HOURS = 36;
    /* The y axis deliberately does not start at 0: the three peaks sit
       within 4 C of each other and of the 120 C line, and on a scale that
       also shows the ambient-driven night trough that gap is a few pixels,
       invisible from the back of a room (see _plan_levels.md, amendment
       after stage 1). Margins below the lowest peak and above the highest
       one keep just enough of the approach and the limit line in view. */
    const D4_LO_MARGIN = 15, D4_HI_MARGIN = 3, D4_TICKS = 5;

    function scenColor(id) {
      return id === 'A' ? COL.bad : id === 'B' ? COL.info : COL.good;
    }

    function Prescriptive() {
      const data = useMemo(() => C.scenarios(), []);
      const defaultId = (data.filter((s) => s.recommended)[0] || data[0]).id;
      const [selId, setSelId] = useState(defaultId);
      const sel = data.filter((s) => s.id === selId)[0] || data[0];
      const T = D4_HOURS * 60;

      const sc = useMemo(() => {
        const peaks = data.map((s) => s.peak);
        const lo = Math.min.apply(null, peaks) - D4_LO_MARGIN;
        const hi = Math.max(Math.max.apply(null, peaks), C.DEMO.limitCyclic) + D4_HI_MARGIN;
        return niceRange(lo, hi, D4_TICKS);
      }, [data]);

      const cvRef = useCanvas(D4_H, (ctx, w) => {
        const x0 = D4.padL, x1 = w - D4.padR, wPlot = x1 - x0;
        const xOfT = (tm) => x0 + tm / T * wPlot;
        const yOf = (v) => D4.tB - (v - sc.lo) / (sc.hi - sc.lo) * (D4.tB - D4.tT);

        yAxis(ctx, x0, x1, yOf, sc.lo, sc.hi, sc.step, ' °C');

        ctx.save();
        ctx.strokeStyle = COL.grid;
        ctx.globalAlpha = 0.18;
        ctx.lineWidth = 1;
        for (let hh = 6; hh < D4_HOURS; hh += 6) {
          const x = xOfT(hh * 60);
          ctx.beginPath(); ctx.moveTo(x, D4.tT); ctx.lineTo(x, D4.tB); ctx.stroke();
        }
        ctx.restore();

        // The transfer window of the selected option, a quiet backdrop in
        // that option's own colour, behind the curves and the limit line.
        ctx.save();
        ctx.fillStyle = scenColor(sel.id);
        ctx.globalAlpha = 0.10;
        sel.windows.forEach((win) => {
          const xa = xOfT(win[0]), xb = xOfT(win[1]);
          ctx.fillRect(xa, D4.tT, xb - xa, D4.tB - D4.tT);
        });
        ctx.restore();

        // The three trajectories, selected one on top and at full strength.
        ctx.save();
        ctx.beginPath(); ctx.rect(x0, D4.tT, wPlot, D4.tB - D4.tT); ctx.clip();
        ctx.lineJoin = 'bevel';
        const ordered = data.filter((s) => s.id !== sel.id).concat([sel]);
        ordered.forEach((s) => {
          const isSel = s.id === sel.id;
          const xOfI = (k) => xOfT(k * s.dtMin);
          ctx.globalAlpha = isSel ? 1 : 0.35;
          ctx.strokeStyle = scenColor(s.id);
          ctx.lineWidth = isSel ? 3 : 1.5;
          pathSeries(ctx, (k) => s.thH[k], 0, s.t.length - 1, xOfI, yOf, wPlot, false);
          ctx.stroke();
        });
        ctx.globalAlpha = 1;
        ctx.restore();

        refLine(ctx, x0, x1, yOf(C.DEMO.limitCyclic),
          C.DEMO.limitCyclic + ' °C, IEC 60076-7 normal cyclic limit', COL.faint);

        xAxis(ctx, x0, x1, D4.tB, 0, D4_HOURS, 6, (v) => v + ' h');
      });

      return html`
        <${React.Fragment}>
          <p className="lv-note">Neighbouring transformer lost. 1.30 pu must be carried for 4 h
            within the next 24 h. Same energy in every option, only the timing differs.</p>
          <div className="lv-cards">
            ${data.map((s) => html`
              <button key=${s.id} type="button"
                className=${'lv-card' + (s.id === sel.id ? ' active' : '')}
                onClick=${() => setSelId(s.id)}>
                <span className="lv-cardlabel">${s.name}</span>
                <span className="lv-cardwin">${s.label}</span>
                <div className="lv-cardnums">
                  <span>
                    <span className="lv-k">peak hot spot</span>
                    <span className="lv-v">${s.peak.toFixed(1)}<span className="lv-u">°C</span></span>
                  </span>
                  <span>
                    <span className="lv-k">ageing</span>
                    <span className="lv-v">${s.agingDays.toFixed(2)}<span className="lv-u">d</span></span>
                  </span>
                </div>
                <span className=${'lv-badge ' +
                  (!s.feasible ? 'lv-badge-bad' : s.recommended ? 'lv-badge-rec' : 'lv-badge-ok')}>
                  ${!s.feasible ? 'over 120 °C limit' : s.recommended ? 'recommended' : 'feasible'}
                </span>
              </button>
            `)}
          </div>
          <canvas ref=${cvRef} className="lv-canvas" style=${{ height: D4_H + 'px' }}></canvas>
          <${Legend} items=${[
            { label: 'A, run now', color: scenColor('A') },
            { label: 'B, shift to night', color: scenColor('B') },
            { label: 'C, split', color: scenColor('C') },
            { label: 'transfer window, selected option', color: scenColor(sel.id), band: true },
            { label: C.DEMO.limitCyclic + ' °C, cyclic limit', color: COL.faint }
          ]} />
        <//>
      `;
    }

    /* The tab that is still to come. Same shell, no chart. */
    function Placeholder({ info }) {
      return html`
        <${React.Fragment}>
          <p className="lv-note">${info.body}</p>
        <//>
      `;
    }

    function App() {
      /* ?tab=diagnostic etc. deep-links a tab, for rehearsal and testing. */
      const [tab, setTab] = useState(() => {
        const q = typeof location === 'undefined' ? null
          : new URLSearchParams(location.search).get('tab');
        return TABS.some((x) => x.id === q) ? q : 'descriptive';
      });
      const [, themeBump] = useState(0);
      /* Whoever changes the skin, the canvases below re-read the palette and
         redraw. The individual charts listen too; this one exists so that
         anything drawn from plain markup follows as well. */
      useEffect(() => {
        const on = () => { readPalette(); themeBump((n) => n + 1); };
        window.addEventListener('themechange', on);
        return () => window.removeEventListener('themechange', on);
      }, []);
      const cur = TABS.filter((x) => x.id === tab)[0];
      return html`
        <div className="lv-wrap">
          <${Tabs} items=${TABS} value=${tab} onChange=${setTab} />
          <section className="lv-group">
            <h2 className="lv-h2">${cur.title}</h2>
            ${tab === 'descriptive' ? html`<${Descriptive} />`
              : tab === 'diagnostic' ? html`<${Diagnostic} />`
              : tab === 'predictive' ? html`<${Predictive} />`
              : tab === 'prescriptive' ? html`<${Prescriptive} />`
              : tab === 'autonomous' ? html`<${Autonomous} />`
              : html`<${Placeholder} info=${cur} />`}
          </section>
        </div>
      `;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>

  <!-- ──────────────────────────────────────────────────────────────────────
       Self test. In the browser it is behind #selftest and reports to the
       console; extracted to Node together with the core block above it runs
       unconditionally, which is the way this file gets checked. Nothing here
       touches the DOM.
       ────────────────────────────────────────────────────────────────────── -->
  <script id="selftest">
  (function () {
    'use strict';
    if (typeof location !== 'undefined' && location.hash !== '#selftest') return;
    var C = LevelsCore;
    var fails = 0, total = 0, t0 = Date.now();
    function pass(name, ok, detail) {
      total++;
      if (!ok) fails++;
      console.log((ok ? 'pass  ' : 'FAIL  ') + name + (detail == null ? '' : '   ' + detail));
    }
    function maxOf(a) { var m = -Infinity, i; for (i = 0; i < a.length; i++) if (a[i] > m) m = a[i]; return m; }

    /* ── 1 The difference equations converge to the closed-form steady state,
           on both cooling stages. 24 h at K = 1.0 and a constant ambient is
           about 14 oil time constants on ONAN and 19 on ONAF. */
    function converge(P, K, A) {
      var dt = C.DEMO.dtMin, st = C.initState(0.4, A, P), t;
      for (t = 0; t < 1440; t += dt) C.stepThermal(st, K, A, dt, P);
      var ss = C.steadyState(K, A, P);
      return { dO: Math.abs(st.thetaO - ss.thetaO), dH: Math.abs(st.thetaH - ss.thetaH) };
    }
    var cvN = converge(C.params(), 1.0, 20);
    pass('ONAN converges to steadyState', cvN.dO < 0.1 && cvN.dH < 0.1,
      'dTopOil ' + cvN.dO.toExponential(2) + ' K, dHotSpot ' + cvN.dH.toExponential(2) + ' K');
    var cvF = converge(C.paramsFan(), 1.0, 20);
    pass('ONAF converges to steadyState', cvF.dO < 0.1 && cvF.dH < 0.1,
      'dTopOil ' + cvF.dO.toExponential(2) + ' K, dHotSpot ' + cvF.dH.toExponential(2) + ' K');

    /* ── 2 Fans always help: at the same load factor and ambient the ONAF hot
           spot is below the ONAN one, over the whole useful load range. */
    var worst = -Infinity, kk, sN, sF;
    for (kk = 0.2; kk <= 1.45; kk += 0.05) {
      sN = C.steadyState(kk, 25, C.IEC); sF = C.steadyState(kk, 25, C.ONAF);
      worst = Math.max(worst, sF.thetaH - sN.thetaH);
    }
    pass('ONAF hot spot below ONAN at every K', worst < 0,
      'worst margin ' + worst.toFixed(2) + ' K');

    /* ── 3 Sanity anchors: K = 1.0 pu at 20 C ambient. ONAN is the classic
           45 + 26 over ambient; ONAF is the dual-rating set. */
    var aN = C.steadyState(1, 20, C.IEC).thetaH;
    var aF = C.steadyState(1, 20, C.ONAF).thetaH;
    pass('ONAN anchor near 91 C', Math.abs(aN - 91) <= 2, aN.toFixed(2) + ' C');
    pass('ONAF anchor near 72 C', Math.abs(aF - 72) <= 2, aF.toFixed(2) + ' C');

    /* ── 4 The cooling stage change does not reinitialise anything: the four
           states are carried across the parameter swap untouched. Checked by
           stepping the same state with both parameter sets and comparing the
           slow states; the fast winding state is allowed to move, that is the
           fans doing their job. */
    var stA = C.initState(1.1, 25, C.IEC);
    C.stepThermal(stA, 1.1, 25, C.DEMO.dtMin, C.IEC);
    var stB = C.copyState(stA);
    C.stepThermal(stA, 1.1, 25, C.DEMO.dtMin, C.IEC);
    C.stepThermal(stB, 1.1, 25, C.DEMO.dtMin, C.ONAF);
    var dSlow = Math.max(Math.abs(stA.dThO - stB.dThO),
      Math.abs(stA.dThH2 - stB.dThH2), Math.abs(stA.thetaAeff - stB.thetaAeff));
    pass('slow states continuous across a stage change', dSlow < 1,
      'worst ' + dSlow.toFixed(3) + ' K per ' + C.DEMO.dtMin + ' min step');

    /* ── 5 Level 2, healthy: 48 h with no fault never leaves the band. */
    var ok48 = C.simPlant(48, {});
    var worstSm = 0;
    for (i = ok48.smoothW - 1; i < ok48.residSm.length; i++) {
      worstSm = Math.max(worstSm, Math.abs(ok48.residSm[i]));
    }
    pass('healthy run stays inside the band 48 h', ok48.flagIdx < 0,
      'band +-' + ok48.band.toFixed(3) + ' K, worst |smoothed resid| ' + worstSm.toFixed(3) + ' K');

    /* ── 6 Level 2, faulted: the residual leaves the band within 2 h of the
           onset. The fault itself takes 2 h to fade in, so this asks the
           detector to be quicker than the fault is. */
    var bad = C.simPlant(48, { faultAtMin: 24 * 60 });
    var lag = bad.flagIdx < 0 ? Infinity : bad.flagMin - bad.faultAtMin;
    pass('cooling fault flagged within 2 h of onset', lag > 0 && lag < 120,
      'flagged after ' + (isFinite(lag) ? lag.toFixed(0) + ' min' : 'never'));

    /* ── 6b The same plant as a live stream. simPlant decides everything in
           one pass afterwards; makeLive has to decide it sample by sample
           while the stream runs, and the two have to agree. */
    var lv = C.makeLive({});
    var capWant = Math.round(48 * 60 / C.DEMO.dtMin);
    pass('live window is prefilled to its full 48 h',
      lv.count() === capWant && lv.capacity === capWant,
      lv.count() + ' of ' + capWant + ' samples, ' + (lv.windowMin / 60).toFixed(0) + ' h');
    pass('the prefilled window ends on the t = 0 reference',
      Math.abs(lv.arr.tMin[lv.phys(lv.count() - 1)]) < 1e-9 && Math.abs(lv.now()) < 1e-9,
      'newest sample at t = ' + lv.now().toFixed(3) + ' min');

    /* Healthy, streamed for another 48 h: never flagged, and the smoothed
       residual is a band-sized quantity rather than a drifting one. */
    var lvBad = false, lvRms = 0, lvWorst = 0, lvSm;
    for (i = 0; i < capWant; i++) {
      lv.step(1);
      if (lv.status() !== 'OK') lvBad = true;
      lvSm = lv.last('residSm');
      lvRms += lvSm * lvSm;
      if (Math.abs(lvSm) > lvWorst) lvWorst = Math.abs(lvSm);
    }
    lvRms = Math.sqrt(lvRms / capWant);
    pass('healthy stream is never flagged over 48 h', !lvBad,
      'band +-' + lv.band.toFixed(3) + ' K, rms smoothed residual ' + lvRms.toFixed(3) +
      ' K, worst ' + lvWorst.toFixed(3) + ' K');
    pass('healthy smoothed residual stays inside the band in the mean square',
      lvRms < lv.band, lvRms.toFixed(3) + ' K against ' + lv.band.toFixed(3) + ' K');

    /* Inject in the middle of the stream: the clock keeps running and the
       flag arrives within the 2 h the tab claims. */
    var lv2 = C.makeLive({});
    lv2.step(Math.round(6 * 60 / C.DEMO.dtMin));
    var tBefore = lv2.now();
    lv2.setFault(true);
    pass('inject does not move the clock', lv2.now() === tBefore &&
      lv2.onsetMin() === tBefore, 'onset at t = ' + lv2.onsetMin() + ' min');
    var lvLag = null;
    for (i = 0; i < Math.round(120 / C.DEMO.dtMin); i++) {
      lv2.step(1);
      if (lv2.status() === 'FLAGGED') { lvLag = lv2.flagMin() - lv2.onsetMin(); break; }
    }
    pass('injected fault is flagged within 2 h, stream running',
      lvLag !== null && lvLag > 0 && lvLag < 120,
      lvLag === null ? 'never flagged' : 'flagged after ' + lvLag.toFixed(0) + ' min');

    /* Clear it, again without touching the clock: the plant recovers and the
       status follows it back to OK on its own. */
    var tClear = lv2.now();
    lv2.setFault(false);
    pass('clear does not move the clock', lv2.now() === tClear,
      'cleared at t = ' + tClear + ' min');
    var lvBack = null;
    for (i = 0; i < Math.round(12 * 60 / C.DEMO.dtMin); i++) {
      lv2.step(1);
      if (lv2.status() === 'OK') { lvBack = lv2.now() - tClear; break; }
    }
    pass('status returns to OK within 12 h of clearing',
      lvBack !== null && lvBack > 0, lvBack === null ? 'still flagged' :
      'OK again ' + (lvBack / 60).toFixed(1) + ' h after the repair started');
    pass('smoothed residual is back inside the band after the repair',
      Math.abs(lv2.last('residSm')) <= lv2.band,
      Math.abs(lv2.last('residSm')).toFixed(3) + ' K against ' + lv2.band.toFixed(3) + ' K');

    /* Continuity: injecting and clearing are changes of a PARAMETER, blended
       over 2 h, so the plant temperature has no step in it anywhere. */
    var lv3 = C.makeLive({});
    var prevO = lv3.last('thOtrue'), jump = 0, cur;
    function walkLive(n) {
      var s;
      for (s = 0; s < n; s++) {
        lv3.step(1);
        cur = lv3.last('thOtrue');
        if (Math.abs(cur - prevO) > jump) jump = Math.abs(cur - prevO);
        prevO = cur;
      }
    }
    walkLive(30);
    lv3.setFault(true);
    walkLive(30);
    lv3.setFault(false);          // toggled back in the middle of the blend
    walkLive(30);
    lv3.setFault(true);
    walkLive(Math.round(6 * 60 / C.DEMO.dtMin));
    lv3.setFault(false);
    walkLive(Math.round(6 * 60 / C.DEMO.dtMin));
    pass('plant top oil is continuous across every fault toggle', jump < 1,
      'worst step ' + jump.toFixed(3) + ' K per ' + C.DEMO.dtMin + ' min');

    /* ── 7 Level 3: the band widens with the horizon, the median forecast sits
           on the nominal run, and the exceedance probability is a real
           probability and not a rounded 0 or 1. */
    var fc = C.forecast(1.0);
    var i6 = Math.round(6 * 60 / fc.dtMin), iEnd = fc.t.length - 1;
    var w6 = fc.q95[i6] - fc.q05[i6], w48 = fc.q95[iEnd] - fc.q05[iEnd];
    pass('forecast band widens with the horizon', w48 > w6,
      '6 h ' + w6.toFixed(2) + ' K, 48 h ' + w48.toFixed(2) + ' K');
    var dMed = 0, i;
    for (i = 0; i < fc.med.length; i++) dMed = Math.max(dMed, Math.abs(fc.med[i] - fc.nom[i]));
    pass('ensemble median tracks the nominal run', dMed < 1.5, 'worst ' + dMed.toFixed(2) + ' K');
    pass('P(hot spot > 98 C) is strictly between 0 and 1',
      fc.pOver98 > 0 && fc.pOver98 < 1, (100 * fc.pOver98).toFixed(0) + ' %');

    /* ── 8 Level 4: the three options are the same job at three different
           hours, so the served energy has to match to the last decimal; only
           then is the comparison a comparison of timing. A is over the 120 C
           cyclic limit, B and C are under it, the winner is the feasible
           option with the least ageing, and it wins by a margin a presenter
           can point at rather than by rounding. */
    var sc = C.scenarios();
    var A = sc[0], B = sc[1], Cc = sc[2];
    var eSpread = (Math.max(A.servedPuH, B.servedPuH, Cc.servedPuH) /
      Math.min(A.servedPuH, B.servedPuH, Cc.servedPuH)) - 1;
    pass('all three options serve the same energy', eSpread < 0.01,
      A.servedPuH.toFixed(3) + ' / ' + B.servedPuH.toFixed(3) + ' / ' +
      Cc.servedPuH.toFixed(3) + ' pu h, spread ' + (100 * eSpread).toFixed(2) + ' %');
    pass('scenario A exceeds the 120 C cyclic limit', !A.feasible,
      'peak ' + A.peak.toFixed(1) + ' C at ' + (A.peakAtMin / 60).toFixed(1) + ' h');
    pass('scenario B is feasible', B.feasible, 'peak ' + B.peak.toFixed(1) + ' C');
    pass('scenario C is feasible', Cc.feasible, 'peak ' + Cc.peak.toFixed(1) + ' C');
    var rec = sc.filter(function (s) { return s.recommended; });
    pass('exactly one option is recommended', rec.length === 1,
      rec.map(function (s) { return s.id; }).join(''));
    var feas = sc.filter(function (s) { return s.feasible; })
      .sort(function (a, b) { return a.agingDays - b.agingDays; });
    pass('the recommendation is the feasible option with the least ageing',
      rec.length === 1 && feas.length > 0 && rec[0].id === feas[0].id,
      feas.map(function (s) { return s.id + ' ' + s.agingDays.toFixed(2) + ' d'; }).join(', '));
    pass('running now ages the paper faster than the recommendation',
      feas.length > 0 && A.agingDays > feas[0].agingDays,
      'A ' + A.agingDays.toFixed(2) + ' d against ' + feas[0].id + ' ' +
      feas[0].agingDays.toFixed(2) + ' d');
    var gap = feas.length > 1 ? feas[1].agingDays / feas[0].agingDays - 1 : 0;
    pass('the winner beats the runner-up by more than 30 % ageing', gap > 0.30,
      (100 * gap).toFixed(0) + ' %');

    /* ── 9 Level 5: the loop escalates in the right order, never serves more
           than is asked, never passes the emergency limit, and does not hunt
           between cooling stages. */
    var ar = C.autoRun();
    var firstFan = null, firstLimit = null;
    for (i = 0; i < ar.events.length; i++) {
      if (firstFan === null && ar.events[i].act.indexOf('ONAN to ONAF') >= 0) firstFan = ar.events[i].tMin;
      if (firstLimit === null && ar.events[i].act.indexOf('load capped') >= 0) firstLimit = ar.events[i].tMin;
    }
    pass('fans are used before the load is capped',
      firstFan !== null && firstLimit !== null && firstFan < firstLimit,
      'fans at ' + firstFan + ' min, cap at ' + firstLimit + ' min');
    var okServe = true, okTemp = true;
    for (i = 0; i < ar.t.length; i++) {
      if (ar.Kserved[i] > ar.Kdem[i] + 1e-9) okServe = false;
      if (ar.thH[i] >= C.DEMO.tripC) okTemp = false;
    }
    pass('served load never exceeds demand', okServe);
    pass('hot spot stays below the 140 C emergency limit', okTemp,
      'peak ' + maxOf(ar.thH).toFixed(1) + ' C');
    var nSw = 0;
    for (i = 1; i < ar.stage.length; i++) if (ar.stage[i] !== ar.stage[i - 1]) nSw++;
    pass('at most four cooling stage changes in 48 h', nSw <= 4, nSw + ' changes');

    console.log((fails === 0 ? 'ALL PASS' : fails + ' FAILURES') +
      '   ' + (total - fails) + '/' + total + '   ' + (Date.now() - t0) + ' ms');
  })();
  </script>

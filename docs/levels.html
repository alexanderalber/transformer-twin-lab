      }
      if (lvC.status() !== 'FLAGGED') chNever++;
      if (chFlips > chWorst) { chWorst = chFlips; chAt = s; }
    }
    pass('a running fault flags exactly once and never clears itself',
      chWorst === 1 && chNever === 0,
      chWorst + ' status changes at worst over ' + chSeeds + ' seeds times 60 h, ' +
      chNever + ' runs ended unflagged (worst seed index ' + chAt + ')');

    /* The presenter does not get to choose the hour. The fault is hardest to
       see in the small hours, when the load is at its 0.50 pu trough and a
       degraded cooling path has almost nothing to carry, so the claim is
       checked at every onset hour of the day and reported at its worst.
       The bound is a consequence, not a target: correlated sensor noise widens
       the band by a factor of seven over the white-noise case, and a 25 %
       cooling loss needs that much longer to clear it. At 1200x the worst case
       is thirteen seconds of wall clock, which is why the fault was left at the
       plausible 25 % of fouled radiators rather than inflated to keep an
       arbitrary two-hour figure. */
    var wLag = 0, wAt = null, sLag = 0, hh, lagH;
    for (hh = 0; hh < 24; hh++) {
      var lvH = C.makeLive({});
      lvH.step(Math.round(hh * 60 / C.DEMO.dtMin) + 1);
      lvH.setFault(true);
      lagH = Infinity;
      for (i = 0; i < Math.round(2 * FLAG_BOUND / C.DEMO.dtMin); i++) {
        lvH.step(1);
        if (lvH.status() === 'FLAGGED') { lagH = lvH.flagMin() - lvH.onsetMin(); break; }
      }
      sLag += lagH;
      if (lagH > wLag) { wLag = lagH; wAt = hh; }
    }
    pass('the fault is flagged inside ' + (FLAG_BOUND / 60) + ' h whatever hour it starts',
      wLag < FLAG_BOUND,
      'worst ' + wLag.toFixed(0) + ' min at onset ' + wAt + ':00, mean ' +
      (sLag / 24).toFixed(0) + ' min over the 24 onset hours');

    /* Continuity and bookkeeping under a presenter who plays with the button.
       Injecting and clearing are changes of a PARAMETER, blended over an hour
       from wherever the blend stands, so the plant temperature has no step in
       it however erratically the two are pressed. Eight presses at irregular
       intervals, several of them inside a running blend, and after each one the
       episode has to be in order: the onset is now, the previous flag is gone,
       and the verdict is the verdict about the present residual. */
    var lv3 = C.makeLive({});
    var prevO = lv3.last('thOtrue'), jump = 0, cur;
    function walkLive(n) {
      var q;
      for (q = 0; q < n; q++) {
        lv3.step(1);
        cur = lv3.last('thOtrue');
        if (Math.abs(cur - prevO) > jump) jump = Math.abs(cur - prevO);
        prevO = cur;
      }
    }
    var mins = function (m) { return Math.round(m / C.DEMO.dtMin); };
    var toggles = [[true, 26], [false, 12], [true, 8], [false, 96], [true, 240],
      [false, 34], [true, 150], [false, 720]];
    var bookOk = true, bookWhy = '';
    for (s = 0; s < toggles.length; s++) {
      var wantOn = toggles[s][0];
      lv3.setFault(wantOn);
      if (wantOn && (lv3.onsetMin() !== lv3.now() || lv3.flagMin() !== null ||
          lv3.status() !== 'OK' || lv3.clearMin() !== null)) {
        bookOk = false; bookWhy = 'inject ' + (s + 1) + ' left a stale episode';
      }
      if (!wantOn && lv3.clearMin() !== lv3.now()) {
        bookOk = false; bookWhy = 'clear ' + (s + 1) + ' did not stamp the repair';
      }
      if (lv3.faultOn() !== wantOn) { bookOk = false; bookWhy = 'toggle ' + (s + 1) + ' did not take'; }
      walkLive(mins(toggles[s][1]));
    }
    pass('plant top oil is continuous across all eight fault toggles', jump < 1,
      'worst step ' + jump.toFixed(3) + ' K per ' + C.DEMO.dtMin + ' min');
    pass('every toggle leaves the episode bookkeeping consistent', bookOk,
      bookOk ? '8 presses, 4 of them inside a running blend' : bookWhy);
    /* The last press was a repair 12 h ago, so the plant is healthy again and
       the status has to say so by itself, without anything being reset. */
    pass('the status follows the residual back to OK after the last repair',
      lv3.status() === 'OK' && !lv3.faultOn() &&
      Math.abs(lv3.last('residSm')) <= lv3.band,
      'status ' + lv3.status() + ', smoothed residual ' +
      lv3.last('residSm').toFixed(3) + ' K against a band of ' + lv3.band.toFixed(3) + ' K');
    /* And it does the opposite too: run the fault long enough and the verdict
       stands rather than flickering. */
    lv3.setFault(true);
    walkLive(mins(300));
    pass('a fault left running keeps the plant flagged', lv3.status() === 'FLAGGED' &&
      lv3.flagMin() > lv3.onsetMin(),
      'flagged ' + (lv3.flagMin() - lv3.onsetMin()).toFixed(0) + ' min after the last onset, ' +
      'smoothed residual ' + lv3.last('residSm').toFixed(2) + ' K');

    /* ── 7 Level 3: the band widens with the horizon, the median forecast sits
           on the nominal run, and the exceedance probability is a real
           probability and not a rounded 0 or 1. */
    var fc = C.forecast(1.0);
    var i6 = Math.round(6 * 60 / fc.dtMin), iEnd = fc.t.length - 1;
    var w6 = fc.q95[i6] - fc.q05[i6], w48 = fc.q95[iEnd] - fc.q05[iEnd];
    pass('forecast band widens with the horizon', w48 > w6,
      '6 h ' + w6.toFixed(2) + ' K, 48 h ' + w48.toFixed(2) + ' K');
    var dMed = 0, i;
    for (i = 0; i < fc.med.length; i++) dMed = Math.max(dMed, Math.abs(fc.med[i] - fc.nom[i]));
    pass('ensemble median tracks the nominal run', dMed < 1.5, 'worst ' + dMed.toFixed(2) + ' K');
    pass('P(hot spot > 98 C) is strictly between 0 and 1',
      fc.pOver98 > 0 && fc.pOver98 < 1, (100 * fc.pOver98).toFixed(0) + ' %');

    /* ── 7b The slider on level 3 states tomorrow's peak, and the plant does
           not learn it at midnight: the profile is eased in over the first 6 h
           (FCST_BLEND_MIN). Two things follow and both are checked at three
           slider positions, the two ends and the nominal middle.
           First, the median has to start exactly where the history stops.
           That is nearly free, since every member starts from the one state
           the twin knows, but it is the claim the join is made of.
           Second, and this is what the ramp is for, the first two hours must
           not be steeper than the rest of the day: a step in load at t = 0
           drives the winding gradient through a 10 min time constant and puts
           an overshoot at the left edge of the chart that belongs to the
           slider and not to the day. The same forecast computed without the
           ramp is run alongside to show the size of what is being removed. */
    var p3rows = [], p3ok = true, p3free = 0;
    [0.80, 1.00, 1.30].forEach(function (pk) {
      var o = { loadMean: 0.5 * (pk + 0.5), loadAmp: 0.5 * (pk - 0.5) };
      var slope = function (f, a, b) {
        var s = 0, k, ia = Math.round(a * 60 / f.dtMin), ib = Math.round(b * 60 / f.dtMin);
        for (k = Math.max(1, ia); k <= Math.min(f.med.length - 1, ib); k++) {
          s = Math.max(s, Math.abs(f.med[k] - f.med[k - 1]) / f.dtMin * 60);
        }
        return s;
      };
      var f1 = C.forecast(1, o);
      var f0 = C.forecast(1, { loadMean: o.loadMean, loadAmp: o.loadAmp, blendMin: 0 });
      var join = Math.abs(f1.med[0] - f1.hist[f1.hist.length - 1]);
      var r1 = slope(f1, 0, 2) / slope(f1, 2, 24);
      var r0 = slope(f0, 0, 2) / slope(f0, 2, 24);
      if (!(join < 0.3 && r1 < 1.10)) p3ok = false;
      if (r0 > 2) p3free++;
      p3rows.push(pk.toFixed(2) + ' pu: join ' + join.toFixed(2) + ' K, first 2 h ' +
        r1.toFixed(2) + ' of the day (' + r0.toFixed(1) + ' without the ramp)');
    });
    pass('the forecast joins the history without a step or an overshoot', p3ok,
      p3rows.join('; '));
    pass('without the ramp the off-nominal settings do overshoot', p3free === 2,
      p3free + ' of 2 slider ends overshoot by more than a factor of two');

    /* ── 8 Level 4: the three options are the same job at three different
           hours, so the served energy has to match to the last decimal; only
           then is the comparison a comparison of timing. Exactly one of the
           three is over the 120 C cyclic limit, the winner is the feasible
           option with the least ageing, and it wins by a margin a presenter
           can point at rather than by rounding. Every one of them is worse
           than doing nothing, which is the honest shape of a contingency and
           is checked as well. */
    var sc = C.scenarios();
    var opt = sc.options;
    var served = opt.map(function (s) { return s.servedPuH; });
    var eSpread = Math.max.apply(null, served) / Math.min.apply(null, served) - 1;
    pass('all three options serve the same energy', eSpread < 0.01,
      served.map(function (v) { return v.toFixed(3); }).join(' / ') +
      ' pu h, spread ' + (100 * eSpread).toFixed(2) + ' %');
    var infeas = opt.filter(function (s) { return !s.feasible; });
    pass('exactly one window is over the 120 C cyclic limit', infeas.length === 1,
      opt.map(function (s) {
        return s.label + ' ' + s.peak.toFixed(1) + ' C at ' +
          (s.peakAtMin / 60).toFixed(1) + ' h';
      }).join(', '));
    var rec = opt.filter(function (s) { return s.recommended; });
    pass('exactly one option is recommended', rec.length === 1,
      rec.map(function (s) { return s.label; }).join(''));
    var feas = opt.filter(function (s) { return s.feasible; })
      .sort(function (a, b) { return a.agingDays - b.agingDays; });
    pass('the recommendation is the feasible option with the least ageing',
      rec.length === 1 && feas.length > 0 && rec[0].id === feas[0].id,
      feas.map(function (s) { return s.label + ' ' + s.agingDays.toFixed(2) + ' d'; }).join(', '));
    pass('the option over the limit ages the paper faster than the recommendation',
      feas.length > 0 && infeas.length > 0 && infeas[0].agingDays > feas[0].agingDays,
      infeas[0].label + ' ' + infeas[0].agingDays.toFixed(2) + ' d against ' +
      feas[0].label + ' ' + feas[0].agingDays.toFixed(2) + ' d');
    var gap = feas.length > 1 ? 1 - feas[0].agingDays / feas[1].agingDays : 0;
    pass('the winner consumes more than 30 % less ageing than the runner-up', gap > 0.30,
      (100 * gap).toFixed(0) + ' % less');
    /* The base case is the day with no transfer at all. It has to be under
       the limit, cooler than every option, and it has to move: the chart
       shows it as the wave the unit would have ridden anyway, and a flat
       line there would mean the y axis is lying. */
    var bmin = 1e9, bmax = -1e9, bi;
    for (bi = 0; bi < sc.base.thH.length; bi++) {
      if (sc.base.thH[bi] < bmin) bmin = sc.base.thH[bi];
      if (sc.base.thH[bi] > bmax) bmax = sc.base.thH[bi];
    }
    var colder = opt.every(function (s) {
      return sc.base.peak < s.peak && sc.base.agingDays < s.agingDays;
    });
    pass('the base case is cooler and cheaper than every option', colder,
      'no transfer: peak ' + sc.base.peak.toFixed(1) + ' C, ' +
      sc.base.agingDays.toFixed(2) + ' d');
    pass('the base case swings over the day', bmax - bmin > 20,
      bmin.toFixed(1) + ' to ' + bmax.toFixed(1) + ' C over ' + sc.hours + ' h');

    /* ── 9 Level 5: the loop escalates in the right order, never serves more
           than is asked, never passes the emergency limit, and does not hunt
           between cooling stages. */
    var ar = C.autoRun();
    var reac = C.autoRun({ predictive: false });
    function firstAct(r, needle) {
      for (var q = 0; q < r.events.length; q++) {
        if (r.events[q].act.indexOf(needle) >= 0) return r.events[q].tMin;
      }
      return null;
    }
    function firstCross(r, thr) {
      for (var q = 0; q < r.thH.length; q++) if (r.thH[q] >= thr) return r.t[q];
      return null;
    }
    var firstFan = firstAct(ar, 'ONAN to ONAF'), firstLimit = firstAct(ar, 'load capped');
    pass('fans are used before the load is capped',
      firstFan !== null && firstLimit !== null && firstFan < firstLimit,
      'fans at ' + firstFan + ' min, cap at ' + firstLimit + ' min');
    var okServe = true, okTemp = true;
    for (i = 0; i < ar.t.length; i++) {
      if (ar.Kserved[i] > ar.Kdem[i] + 1e-9) okServe = false;
      if (ar.thH[i] >= C.DEMO.tripC) okTemp = false;
    }
    pass('served load never exceeds demand', okServe);
    pass('hot spot stays below the 140 C emergency limit', okTemp,
      'peak ' + maxOf(ar.thH).toFixed(1) + ' C');
    var nSw = 0;
    for (i = 1; i < ar.stage.length; i++) if (ar.stage[i] !== ar.stage[i - 1]) nSw++;
    pass('at most four cooling stage changes in 48 h', nSw <= 4, nSw + ' changes');

    /* ── 9b The point of the level: the loop acts on what the model says is
           coming, not on what the sensor says has happened. Three claims, all
           against the same plant run with the old threshold controller. */
    pass('the predictive loop runs a cooler peak than the reactive one',
      maxOf(ar.thH) < maxOf(reac.thH) - 3,
      'predictive ' + maxOf(ar.thH).toFixed(1) + ' C against reactive ' +
      maxOf(reac.thH).toFixed(1) + ' C, both aiming at ' + C.DEMO.limitTargetC + ' C');
    /* The fans start BEFORE the hot spot of that same run reaches the fan
       threshold, which is the one sentence the tab exists for. A reactive loop
       cannot do this by construction: its switching instant IS the crossing. */
    var crossPred = firstCross(ar, C.DEMO.fanOnC), crossReac = firstCross(reac, C.DEMO.fanOnC);
    pass('the fans start before the hot spot reaches the fan threshold',
      firstFan !== null && crossPred !== null && firstFan < crossPred - 30,
      'fans at ' + firstFan + ' min, 95 C reached at ' + crossPred + ' min, ' +
      (crossPred - firstFan) + ' min of lead');
    pass('the reactive loop switches at the crossing and not before',
      crossReac !== null && Math.abs(firstAct(reac, 'ONAN to ONAF') - crossReac) <= C.DEMO.ctrlMin,
      'fans at ' + firstAct(reac, 'ONAN to ONAF') + ' min, 95 C reached at ' + crossReac + ' min');
    /* Energy. At the SAME thresholds the predictive loop curtails MORE, and
       that is not a defeat, it is the price of actually delivering the 105 C
       it was told to hold while the reactive loop overshoots it by six kelvin.
       The comparison that means something is at equal delivered peak: the same
       reactive controller, retuned by -6 K so that it lands where the
       predictive one lands, has to curtail far more to get there, because
       everything it does it does too late. Both numbers are reported. */
    var reacFair = C.autoRun({ predictive: false, thrShiftC: -6 });
    pass('at the same thresholds the predictive loop pays for the cooler peak in energy',
      ar.curtailedPuH > reac.curtailedPuH,
      'predictive ' + ar.curtailedPuH.toFixed(2) + ' pu h at ' + maxOf(ar.thH).toFixed(1) +
      ' C, reactive ' + reac.curtailedPuH.toFixed(2) + ' pu h at ' + maxOf(reac.thH).toFixed(1) + ' C');
    pass('at the same delivered peak the predictive loop curtails less',
      maxOf(reacFair.thH) <= maxOf(ar.thH) + 1 &&
      ar.curtailedPuH < 0.8 * reacFair.curtailedPuH,
      'predictive ' + ar.curtailedPuH.toFixed(2) + ' pu h at ' + maxOf(ar.thH).toFixed(1) +
      ' C, reactive retuned to -6 K ' + reacFair.curtailedPuH.toFixed(2) + ' pu h at ' +
      maxOf(reacFair.thH).toFixed(1) + ' C, ' +
      (100 * (1 - ar.curtailedPuH / reacFair.curtailedPuH)).toFixed(0) + ' % less');
    /* The forecast the loop works on is wrong on purpose: a 1.4 K cold bias
       and half an hour of lag on the ambient. It has to be wrong by something
       measurable and the loop still has to win, otherwise the level is a
       demonstration of clairvoyance. */
    var fErr = 0, fMax = 0, fN = 0, iEnd, eAbs;
    for (i = 0; i < ar.preds.length; i++) {
      iEnd = Math.round((ar.preds[i].tMin + ar.horizonMin) / ar.dtMin);
      if (iEnd >= ar.thH.length) break;
      eAbs = Math.abs(ar.preds[i].h[ar.preds[i].h.length - 1] - ar.thH[iEnd]);
      fErr += eAbs; if (eAbs > fMax) fMax = eAbs;
      fN++;
    }
    pass('the ambient forecast the loop is given is cold and late',
      Math.abs(C.ambientForecast(600, { heatwave: true }) -
        C.ambientAt(600, { heatwave: true })) > 0.5,
      'at 10:00 the forecast reads ' +
      C.ambientForecast(600, { heatwave: true }).toFixed(1) + ' C against ' +
      C.ambientAt(600, { heatwave: true }).toFixed(1) + ' C of real air');
    pass('the look-ahead is imperfect and still useful', fN > 200 && fErr / fN > 0.5 && fErr / fN < 4,
      'mean ' + (fErr / fN).toFixed(2) + ' K at the ' + ar.horizonMin +
      ' min horizon, worst ' + fMax.toFixed(1) + ' K over ' + fN + ' ticks');
    /* Every controller tick stored the trajectory it decided on, and the tab
       draws it at the cursor, so it has to exist for every sample. */
    var predsOk = ar.preds.length > 0 && ar.predIdx.length === ar.t.length;
    for (i = 0; i < ar.predIdx.length; i++) {
      if (!(ar.predIdx[i] >= 0 && ar.predIdx[i] < ar.preds.length)) predsOk = false;
    }
    pass('every sample can name the look-ahead the loop was on', predsOk,
      ar.preds.length + ' stored trajectories of ' +
      (ar.preds[0] ? ar.preds[0].h.length : 0) + ' samples');
    pass('the run opens with the state it inherited from the night',
      ar.events.length > 0 && ar.events[0].tMin === 0 &&
      ar.events[0].act.indexOf('carried over from the night') >= 0,
      ar.events[0].act);

    console.log((fails === 0 ? 'ALL PASS' : fails + ' FAILURES') +
      '   ' + (total - fails) + '/' + total + '   ' + (Date.now() - t0) + ' ms');
  })();
  </script>
</body>
